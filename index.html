1","t":"9","c":1,"q":"A fall of potential test gives a percentage deviation of 2.5 %. According to GN3, what is the typical accuracy of the measurement?","o":["2.5 %","2.1 %","3 %","5 %"],"a":2,"x":"GN3 2.6.13: accuracy is typically 1.2 times the percentage deviation.<br>1.2 × 2.5 % = 3 %","r":"GN3 2.6.13","n":"","k":3402,"f":"GN3 Chapter 2, section 2.6.13 Earth electrode resistance testing; index word 'earth electrode'. See the paragraph after the percentage deviation method, before Test method E2.","w":{"0":"That's the deviation itself; accuracy is 1.2 times the deviation.","1":"You divided by 1.2 instead of multiplying.","3":"You doubled the deviation instead of multiplying by 1.2."}},{"id":"g4.n7.22","t":"9","c":1,"q":"A two-coil stakeless tester is used on an electrode with an actual resistance of 120 Ω. There are four other 'earth electrodes' in parallel, each 60 Ω. What will the instrument read?","o":["135 Ω","120 Ω","180 Ω","360 Ω"],"a":0,"x":"GN3 2.6.13, method E2 (two coils): reading = RE + parallel resistance of the others.<br>Four × 60 Ω in parallel = 60 ÷ 4 = 15 Ω<br>Reading = 120 + 15 = 135 Ω","r":"GN3 2.6.13","n":"","k":3501,"f":"GN3 Chapter 2, section 2.6.13 Earth electrode resistance testing; index word 'earth electrode'. See test method E2, 'Instrument using two test coils', and the worked example.","w":{"1":"The reading is always higher than RE because the return path is in series.","2":"You added only one 60 Ω electrode instead of the four in parallel.","3":"You added the four 60 Ω electrodes in series (240 Ω) instead of in parallel."}},{"id":"g4.n7.23","t":"9","c":0,"q":"GN3 refers to Note 2 of Table 41.5 of BS 7671 about earth electrode resistance values. Above what value may they not be stable?","o":["500 Ω","200 Ω","1667 Ω","100 Ω"],"a":1,"x":"GN3 2.6.13 (after Table 2.15): Note 2 of Table 41.5 advises electrode resistances above 200 Ω may not be stable as soil dries or freezes.","r":"GN3 2.6.13","n":"","k":3580,"f":"GN3 Chapter 2, section 2.6.13 Earth electrode resistance testing; index word 'earth electrode'. See the Note under Table 2.15. Index word 'earth electrode, stability'.","w":{"0":"500 Ω is the 50 V limit for a 100 mA RCD, not the stability figure.","2":"1667 Ω is the 50 V limit for a 30 mA RCD.","3":"100 Ω is not the figure GN3 gives for stability."}},{"id":"g4.n7.24","t":"10","c":0,"q":"Which technique do instrument makers use so EFLI testers are less likely to trip an RCD protecting the circuit?","o":["Limiting the test current to less than 15 mA","Limiting the test current to less than 50 mA","Testing at 500 V DC","Applying the test current for 5 s"],"a":0,"x":"GN3 2.6.15: testers less likely to trip RCDs limit the test current to less than 15 mA or use DC biasing to saturate the RCD core.","r":"GN3 2.6.15","n":"","k":3676,"f":"GN3 section 2.6.15, under 'Circuit-breakers and residual current devices (RCDs)'. Index word 'RCD, tripping during loop test'.","w":{"1":"50 mA would trip a 30 mA RCD; GN3 gives less than 15 mA.","2":"500 V DC is an insulation resistance test voltage, not a loop test technique.","3":"A longer test makes tripping more likely, not less."}},{"id":"g4.n7.25","t":"10","c":0,"q":"When measuring Ze at the origin with an EFLI tester, what does GN3 require?","o":["Main switch closed and all bonding left connected","Main switch open, with the means of earthing left connected to the MET","Main switch open or circuits isolated, and the means of earthing disconnected from the MET","Main switch closed, with the main bonding conductors disconnected"],"a":2,"x":"GN3 2.6.15: Ze is measured between the supply line conductor and the means of earthing with the main switch open, and the means of earthing disconnected from the MET to remove parallel paths. Reconnect before re-energizing.","r":"GN3 2.6.15","n":"","k":3683,"f":"GN3 section 2.6.15, 'Measurement of external EFLI (Ze)' and Figure 2.31. Index word 'external earth fault loop impedance'.","w":{"0":"That's the live Zs method; for Ze, parallel paths must be removed.","1":"Leaving the earthing conductor connected lets parallel paths through bonding lower the reading.","3":"Disconnecting bonding with the installation live is dangerous; GN3 opens the main switch."}},{"id":"g4.n7.26","t":"10","c":0,"q":"A distribution circuit is protected by a 63 A BS 88-2 fuse (5 s disconnection) and has a 4.0 mm² copper cpc. From GN3 Table A2, what is the maximum measured Zs?","o":["0.3 Ω","0.49 Ω","0.62 Ω","0.32 Ω"],"a":1,"x":"GN3 Table A2(ii), 5 s, BS 88-2: 63 A column, 4.0 mm² cpc row = 0.49 Ω.","r":"GN3 A1","n":"","k":7851,"f":"GN3 Appendix A, Table A2 BS 88-2 fuses, part (ii) 5 s disconnection. Index word 'fuses, maximum earth fault loop impedance'.","w":{"0":"0.3 Ω is the 2.5 mm² cpc row; you read the wrong row.","2":"0.62 Ω is the 6.0 mm² cpc row.","3":"0.32 Ω is the BS 88-3 63 A value from Table A3, not BS 88-2."}},{"id":"g4.n7.27","t":"10","c":1,"q":"A circuit has a BS 7671 tabulated maximum Zs of 1.37 Ω. Using the GN3 A3 method with factor F = 1.20 from Table B3, what is the maximum acceptable measured Zs (ambient below 20 °C)?","o":["1.64 Ω","1.37 Ω","1.10 Ω","1.14 Ω"],"a":3,"x":"GN3 Appendix A3: Ztest(max) = Zs ÷ F.<br>1.37 ÷ 1.20 = 1.14 Ω","r":"GN3 A3","n":"","k":8021,"f":"GN3 Appendix A, section A3 Methods of adjusting tabulated values of Zs, first worked solution. Index word 'earth fault loop impedance, adjusting'.","w":{"0":"You multiplied by F instead of dividing.","1":"That's the uncorrected design value; it must be reduced for test temperature.","2":"You divided by 1.25 (the Appendix A divisor) instead of F = 1.20."}},{"id":"g5.n7.28","t":"9","c":0,"q":"In a fall of potential test the three readings differ by more than 5 %. What does GN3 say should be done?","o":["Accept the average of the three readings","Repeat the test with a larger separation between the electrode under test and the current spike","Repeat the test with the current spike closer to the electrode under test","Water the electrode under test and repeat the test"],"a":1,"x":"GN3 2.6.13: it is inadvisable to accept readings differing by more than 5 %; repeat with a larger separation between the electrode under test and the current spike.","r":"GN3 2.6.13","n":"","k":3404,"f":"GN3 Chapter 2, section 2.6.13 Earth electrode resistance testing; index word 'earth electrode'. See the paragraph on accuracy and the 5 % limit, after the percentage deviation method.","w":{"0":"GN3 says don't accept readings differing by more than 5 %.","2":"Closer spikes make the resistance areas overlap; GN3 asks for a larger separation.","3":"GN3 forbids treating the electrode under test to lower its resistance."}},{"id":"g5.n7.29","t":"9","c":0,"q":"When testing an earth electrode by test method E3 (EFLI tester), how is the tester connected?","o":["Installation live, between line and the MET with the earthing conductor connected","Between two temporary test spikes placed 15–25 m apart","Installation isolated, then between the line conductor at the origin and the earth electrode via the disconnected earthing conductor","Installation isolated, between the neutral conductor and the earth electrode"],"a":2,"x":"GN3 2.6.13, method E3: isolate the installation before disconnecting the earthing conductor, connect the EFLI tester between the line conductor at the origin and the electrode via the earthing conductor; the impedance reading is treated as the electrode resistance.","r":"GN3 2.6.13","n":"","k":3533,"f":"GN3 Chapter 2, section 2.6.13 Earth electrode resistance testing; index word 'earth electrode'. See 'Test method E3: Measurement using an earth fault loop impedance (EFLI) tester'.","w":{"0":"Leaving the earthing conductor connected gives parallel paths through the installation.","1":"Temporary spikes are used in methods E1 and E2, not with an EFLI tester.","3":"The test is line to electrode, not neutral to electrode."}},{"id":"g5.n7.30","t":"10","c":0,"q":"Ze has been obtained by enquiry with the electricity distributor. What does GN3 say must also be done?","o":["A test must verify the DNO earthing is effective, e.g. with a test lamp or an EFLI tester","Nothing; the distributor's figure can be recorded as it stands","The earth electrode must be tested with a fall of potential tester","The figure must be multiplied by 1.20 before recording"],"a":0,"x":"GN3 2.6.15: if Ze by enquiry is relied on, a test must verify the DNO earthing is effective; a test lamp line to means of earthing, or an EFLI tester to check Ze is consistent with the quoted value.","r":"GN3 2.6.15","n":"","k":3721,"f":"GN3 section 2.6.15, 'Determining external EFLI (Ze) by enquiry'. Index word 'external earth fault loop impedance'.","w":{"1":"GN3 says a test must still be made to show the DNO earthing is effective.","2":"Fall of potential is for an installation earth electrode, not for checking the DNO earth.","3":"1.20 is factor F for adjusting tabulated values, not for Ze by enquiry."}},{"id":"g5.n7.31","t":"10","c":0,"q":"An inspector sends EFLI results back to the office without comparing them with the design criteria. According to GN3, who is responsible for the results being checked?","o":["The person who signed the certificate","The office staff who receive the results","The designer of the installation","The distribution network operator"],"a":0,"x":"GN3 2.6.15, 'Verification of EFLI test results': BS 7671 requires the inspector to compare results with criteria, and the person who signed the certificate is responsible.","r":"GN3 2.6.15","n":"","k":3731,"f":"GN3 section 2.6.15, 'Verification of EFLI test results'. Index word 'earth fault loop impedance, verification of results'.","w":{"1":"GN3 warns the office may assume the inspector checked; responsibility stays with the signatory.","2":"The designer sets criteria, but the signatory must compare the results with them.","3":"The DNO only supplies Ze information; it has no role in checking test results."}},{"id":"g5.n7.32","t":"10","c":1,"q":"A circuit has a BS 7671 tabulated maximum Zs of 2.73 Ω and Ze = 0.35 Ω. Using GN3's more accurate A3 formula Ztest(max) = Ze + (Zs − Ze) ÷ F, with F = 1.20, what is the maximum acceptable measured Zs?","o":["2.28 Ω","1.98 Ω","2.33 Ω","3.21 Ω"],"a":2,"x":"GN3 Appendix A3:<br>Zs − Ze = 2.73 − 0.35 = 2.38 Ω<br>2.38 ÷ 1.20 = 1.98 Ω<br>Ztest(max) = 0.35 + 1.98 = 2.33 Ω","r":"GN3 A3","n":"","k":8026,"f":"GN3 Appendix A, section A3, the 'more accurate value' where Ze is known. Index word 'earth fault loop impedance, adjusting'.","w":{"0":"That's the simple method (2.73 ÷ 1.20) without using Ze.","1":"You forgot to add Ze back on at the end.","3":"You multiplied (Zs − Ze) by F instead of dividing."}},{"id":"g5.n7.33","t":"10","c":1,"q":"Tabulated Zs = 1.37 Ω, Ze = 0.27 Ω, F = 1.20 and the expected test ambient is 5 °C (α = 0.94 from Table B2). Using Ztest(max) = Ze + α(Zs − Ze) ÷ F, what is the maximum acceptable measured Zs?","o":["1.19 Ω","1.13 Ω","0.86 Ω","1.37 Ω"],"a":1,"x":"GN3 Appendix A3:<br>Zs − Ze = 1.37 − 0.27 = 1.10 Ω<br>0.94 × 1.10 = 1.034<br>1.034 ÷ 1.20 = 0.86 Ω<br>Ztest(max) = 0.27 + 0.86 = 1.13 Ω","r":"GN3 A3","n":"","k":8034,"f":"GN3 Appendix A, section A3, the formula with α for test ambient other than 20 °C. Index word 'earth fault loop impedance, adjusting'.","w":{"0":"You left out α (0.94), so there's no correction for the 5 °C ambient.","2":"You forgot to add Ze back on at the end.","3":"That's the unadjusted design value; it must be corrected."}},{"id":"g5.n7.34","t":"10","c":1,"q":"Ze = 0.27 Ω and a circuit's (R1 + R2) measured at 20 °C is 0.45 Ω. Using GN3's A3 method with F = 1.20, what is Zs for the circuit at 70 °C?","o":["0.72 Ω","0.86 Ω","0.81 Ω","0.65 Ω"],"a":2,"x":"GN3 Appendix A3: Zs (70 °C) = Ze + F(R1 + R2)test.<br>1.20 × 0.45 = 0.54 Ω<br>Zs = 0.27 + 0.54 = 0.81 Ω","r":"GN3 A3","n":"","k":8072,"f":"GN3 Appendix A, section A3, the example converting measurements at 20 °C to 70 °C values. Index word 'earth fault loop impedance, adjusting'.","w":{"0":"You didn't apply F, so that's the 20 °C value, not 70 °C.","1":"You multiplied Ze by F as well; only (R1 + R2) is corrected.","3":"You divided (R1 + R2) by F instead of multiplying."}},{"id":"g1.n8.00","t":"11","c":1,"q":"A 400 V three-phase installation is tested with an instrument that cannot measure between line conductors. The single-phase prospective short-circuit current measured line to neutral at the origin is 1.9 kA. Using the GN3 rule of thumb, what is the approximate maximum balanced three-phase prospective short-circuit current?","o":["3.8 kA","1.9 kA","2.18 kA","3.29 kA"],"a":0,"x":"GN3 2.6.16: where line-to-line cannot be measured, the balanced three-phase PSCC is approximately twice the single-phase value.<br>1.9 kA × 2 = 3.8 kA","r":"GN3 2.6.16","n":"","k":3790,"f":"Chapter 2, section 2.6.16 Prospective fault current; index 'Rule of thumb, 3-phase prospective fault current'.","w":{"1":"That is the single-phase reading unconverted; the three-phase value is always larger.","2":"You divided by 0.87, which applies only to a measured line-to-line value.","3":"You multiplied by √3; GN3's rule of thumb is ×2, which errs on the side of safety."}},{"id":"g1.n8.01","t":"11","c":0,"q":"An addition is made in a dwelling with a BS EN 61439-3 consumer unit whose MCBs are marked 6 kA. Which supply condition is needed for those devices to be taken as having a 16 kA short-circuit capacity?","o":["The service cut-out is a fuse rated 125 A or less to BS 88-2","The supply nominal voltage is up to 400 V AC","The service cut-out is a fuse rated 100 A or less to BS 1361 (Type II) or BS 88-3","The measured PSCC at the origin is below 6 kA"],"a":2,"x":"GN3 2.6.16 (Reg 536.4.201): OCPDs rated below 16 kA in a consumer unit may be taken as 16 kA where the supply is ESQCR up to 250 V AC, the cut-out fuse is 100 A or less to BS 1361 Type II or BS 88-3, and the CU complies with BS EN 61439-3.","r":"GN3 2.6.16","n":"","k":3937,"f":"Section 2.6.16, sub-heading 'Fault currents up to 16 kA', list (a) to (c); index 'Prospective fault current'.","w":{"0":"GN3 limits this to a cut-out fuse of 100 A or less to BS 1361 Type II or BS 88-3.","1":"The condition is a nominal voltage up to 250 V AC.","3":"The 16 kA conditional rating relies on the listed conditions, not a measured PFC below 6 kA."}},{"id":"g1.n8.02","t":"12","c":1,"q":"A 30 mA RCBO is tested at IΔn on Type AC. The readings are 18.6 ms at 0° and 27.3 ms at 180°. What is recorded on the Schedule of Test Results?","o":["18.6 ms","27.3 ms","23.0 ms","45.9 ms"],"a":1,"x":"GN3 2.6.18: test on both positive (0°) and negative (180°) half-cycles and record the longer operating time for the IΔn Type AC test.<br>Longer of 18.6 and 27.3 = 27.3 ms","r":"GN3 2.6.18","n":"","k":4055,"f":"Section 2.6.18, 'Operation of RCDs' paragraph on BS EN 61557-6 zero crossing; Table 2.17 note 4; index 'Residual current devices (RCDs), test method'.","w":{"0":"That is the shorter time; GN3 says record the longer of the two.","2":"You averaged the readings; record the longer one.","3":"You added the two readings; they are separate trips."}},{"id":"g1.n8.03","t":"12","c":1,"q":"Following GN3 Table 2.17b, an optional smooth DC test is carried out on a 30 mA Type B RCD after the Type AC and Type A tests. What current is applied and what is the maximum time for a non-delay device?","o":["30 mA smooth DC, 300 ms","60 mA smooth DC, 40 ms","150 mA smooth DC, 40 ms","60 mA smooth DC, 300 ms"],"a":3,"x":"GN3 Table 2.17b: Type B, 2 × IΔn smooth DC, non-delay 300 ms (S-delay 500 ms).<br>2 × 30 mA = 60 mA","r":"GN3 2.6.18","n":"","k":4105,"f":"Section 2.6.18, Table 2.17b, row 'Type B RCDs to a harmonized standard'; index 'Residual current devices (RCDs), test method'.","w":{"0":"The Type B smooth DC test uses 2 × IΔn, not 1 × IΔn.","1":"40 ms is the limit for 5 × IΔn tests, not the 2 × IΔn smooth DC test.","2":"That is a 5 × IΔn value; Type B smooth DC uses 2 × IΔn."}},{"id":"g1.n8.04","t":"12","c":0,"q":"What does GN3 say about how often users should press the RCD test button, and under what condition will it work?","o":["At least every 3 months, and it works whether or not the RCD is energized","At least every 12 months, and it only works with the load disconnected","At least every 6 months, and it only operates the RCD if the RCD is energized","Only at each periodic inspection, and it works whether or not the RCD is energized"],"a":2,"x":"GN3 2.6.18 (Reg 514.12.2): the RCD test button will only operate the RCD if it is energized; BS 7671 recommends pressing it at least every 6 months.","r":"GN3 2.6.18","n":"","k":4405,"f":"Section 2.6.18, last paragraph of 'Integral test device'; index 'Residual current devices (RCDs), test method'.","w":{"0":"The interval is 6 months and the button needs the RCD energized.","1":"GN3 gives 6 months; the requirement is that the RCD is energized.","3":"BS 7671 recommends every 6 months, and the RCD must be energized."}},{"id":"g1.n8.05","t":"13","c":0,"q":"SPDs have been fitted to a distribution board. During inspection, how does GN3 say the inspector verifies they have not expired or become defective?","o":["Check indicator lights or coloured flags show them serviceable, and test any remote status alarm","Carry out a 500 V insulation resistance test across each SPD","Measure the earth fault loop impedance at each SPD","Replace them, as SPDs must be renewed at every inspection"],"a":0,"x":"GN3 2.6.22: the inspector should check indicator lights are correctly lit or coloured flags show serviceable, and check any remote status facility, such as an audible alarm, works.","r":"GN3 2.6.22","n":"","k":4519,"f":"Section 2.6.22 Verification of protection against overvoltages of atmospheric origin or due to switching; via the contents page (the index entry 'Surge protection devices (SPDs)' points only to 2.5.2).","w":{"1":"GN3 verifies SPD status by indicators; insulation tests with SPDs connected can give false readings.","2":"EFLI does not show SPD condition; GN3 relies on indicator status.","3":"GN3 asks for a status check, not routine replacement."}},{"id":"g2.n8.06","t":"11","c":1,"q":"Using an instrument rated for 400 V, the line-to-line prospective fault current measured at a three-phase distribution board is 6.5 kA. Following GN3, what is the more accurate three-phase prospective fault current?","o":["5.66 kA","13.0 kA","11.26 kA","7.47 kA"],"a":3,"x":"GN3 2.6.16: measure line-to-line fault current and divide by 0.87.<br>6.5 ÷ 0.87 = 7.471<br>≈ 7.47 kA","r":"GN3 2.6.16","n":"","k":3794,"f":"Section 2.6.16 Prospective fault current, the paragraph after the 'twice the single-phase value' rule of thumb; index 'Prospective fault current'.","w":{"0":"You multiplied by 0.87 instead of dividing by it.","1":"You applied the ×2 rule of thumb meant for single-phase readings to a line-to-line reading.","2":"You multiplied by √3; GN3 says divide the line-to-line result by 0.87."}},{"id":"g2.n8.07","t":"11","c":1,"q":"At the origin of a single-phase installation the prospective short-circuit current is measured as 1.4 kA and the prospective earth fault current as 1.1 kA. What value is recorded under 'Nature of Supply Parameters' on the EIC?","o":["1.1 kA","1.4 kA","2.5 kA","2.8 kA"],"a":1,"x":"GN3 2.6.16 'Recording the prospective fault current': record the greater of the short-circuit current (between live conductors) and the earth fault current (line to MET).<br>Greater of 1.4 kA and 1.1 kA = 1.4 kA","r":"GN3 2.6.16","n":"","k":3956,"f":"Section 2.6.16, sub-heading 'Recording the prospective fault current'; index 'Prospective fault current'.","w":{"0":"That is the lower value; GN3 says record the greater of PSCC and PEFC.","2":"You added the two currents; only the greater one is recorded.","3":"You doubled the PSCC as if it were a three-phase supply; this is single-phase."}},{"id":"g2.n8.08","t":"12","c":0,"q":"For safety, which test must be carried out on the circuit before any RCD tests?","o":["Earth fault loop impedance","Phase sequence","Functional test of the AFDD","Voltage drop verification"],"a":0,"x":"GN3 2.6.18: prior to RCD tests it is essential, for safety, that the EFLI is tested to check the requirements are met. A high loop impedance could leave dangerous voltages on exposed parts during the test.","r":"GN3 2.6.18","n":"","k":4060,"f":"Section 2.6.18, warning note under 'Operation of RCDs'; index 'Residual current devices (RCDs), test method'.","w":{"1":"Phase sequence applies to multiphase circuits and has no bearing on RCD test safety.","2":"AFDD functional testing is under 2.6.19 and is not a prerequisite.","3":"Voltage drop is not normally verified and is unrelated to RCD test safety."}},{"id":"g2.n8.09","t":"12","c":0,"q":"An inspector's RCD tester has no 'RCD Type' setting. According to GN3 Table 2.17 notes, which tests can it carry out?","o":["Type AC and Type A tests","All types, as long as the test current is doubled","Type AC tests only","Type B tests only"],"a":2,"x":"GN3 Table 2.17, note 1: instruments without an 'RCD Type' setting can only be used to carry out Type AC tests.","r":"GN3 2.6.18","n":"","k":4112,"f":"Section 2.6.18, notes to Table 2.17, note 1; index 'Residual current devices (RCDs), test method'.","w":{"0":"Type A tests need a Type A (pulsed DC) setting; GN3 says such instruments can only do Type AC.","1":"Doubling current does not create a DC waveform; only Type AC tests are possible.","3":"Type B smooth DC tests need a Type B setting."}},{"id":"g2.n8.10","t":"12","c":0,"q":"An AFDD with an automatic test facility and no test button is installed. According to GN3, how can it be functionally tested?","o":["By applying 5 × its rated current with an RCD tester","It cannot; functional testing is only possible by pressing a test button","By an insulation resistance test at 500 V across its terminals","By operating the circuit-breaker section manually"],"a":1,"x":"GN3 2.6.19: AFDDs come with a test button or an automatic test facility. Functional testing can only be done by pressing the test button; the type without one cannot be functionally tested.","r":"GN3 2.6.19","n":"","k":4414,"f":"Section 2.6.19 Other functional testing, paragraph on AFDDs (532.6); via the contents page.","w":{"0":"An RCD tester applies residual current, not an arc fault; GN3 says there is no way to test this type.","2":"An insulation test does not functionally test arc detection and may damage electronics.","3":"Operating it manually does not test arc detection; GN3 says the button is the only way."}},{"id":"g2.n8.11","t":"13","c":0,"q":"How does GN3 say compliance with EMC requirements is normally demonstrated for most installations?","o":["By electric and magnetic field strength measurements on site","By a 1,000 V insulation resistance test on all data cabling","By the distributor issuing an EMC certificate for the supply","By design approach, product conformity and good installation practice, kept in a design file by the installer"],"a":3,"x":"GN3 2.6.23: EMC is not usually verified by site measurements; it is shown by design approach, product conformity and good installation practice, with a design file kept by the responsible person (the installer).","r":"GN3 2.6.23","n":"","k":4533,"f":"Section 2.6.23 Verification of measures against electromagnetic disturbances; index 'Electromagnetic disturbances'.","w":{"0":"GN3 says EMC is not usually verified by site measurements, and BS 7671 does not require field measurements.","1":"EMC is not demonstrated by insulation testing.","2":"Under the 2016 Regulations the installer is the responsible person, not the distributor."}},{"id":"g3.n8.12","t":"11","c":0,"q":"Where a live measurement of prospective fault current is necessary, what does GN3 say about protection of the test connection?","o":["Fused test leads to GS38 provide sufficient protection on their own","It should be made upstream of the main switch so the reading includes the full supply","It should be made downstream of a protective device rated for the anticipated fault current; fused test leads alone are not suitable","No protection is needed because the instrument draws only a few milliamps"],"a":2,"x":"GN3 2.6.16: the measurement should always be made downstream of a protective device rated for the anticipated PFC; fused leads alone are not suitable, and a temporary device should be fitted if none exists.","r":"GN3 2.6.16","n":"","k":3805,"f":"Section 2.6.16 Prospective fault current, paragraph after 'alternative means are used'; index 'Prospective fault current'.","w":{"0":"GN3 states fused test leads alone are not considered suitable for this purpose.","1":"GN3 requires the measurement downstream of a suitably rated protective device.","3":"PFC readings are taken across live parts at the origin; GN3 requires a rated protective device, fitting a temporary one if needed."}},{"id":"g3.n8.13","t":"12","c":0,"q":"GN3 distinguishes phase sequence from phase rotation. If the waveforms are such that L1 precedes L2, which precedes L3, how will a correctly wired three-phase induction motor run?","o":["Clockwise","Anticlockwise","It will not start until a phase is reversed","Either way, as direction depends only on the motor's load"],"a":0,"x":"GN3 2.6.17: if L1 precedes L2, which precedes L3, the motor runs clockwise; swapping any two wires makes it run anticlockwise.","r":"GN3 2.6.17","n":"","k":3973,"f":"Section 2.6.17 Phase sequence testing, first paragraph; index 'Phase sequence'.","w":{"1":"Anticlockwise results when any two wires are swapped, changing the sequence.","2":"Correct L1-L2-L3 sequence runs the motor; nothing needs reversing.","3":"Direction is set by the supply sequence, not by the load."}},{"id":"g3.n8.14","t":"12","c":0,"q":"An S-type (time-delayed) RCD to BS EN 61008 is tested at its rated residual current IΔn. What is the maximum expected tripping time from GN3 Table 2.17?","o":["300 ms","150 ms","200 ms","500 ms"],"a":3,"x":"GN3 2.6.18, Table 2.17a: at IΔn, harmonized-standard RCDs: non-delay 300 ms, S-delay 500 ms.","r":"GN3 2.6.18","n":"","k":4081,"f":"Section 2.6.18, Table 2.17 Tests for RCDs, part a 'Recommended tests'; index 'Residual current devices (RCDs), test method'.","w":{"0":"300 ms is the limit for a non-delay RCD at IΔn.","1":"150 ms is the S-type limit for the optional 5 × IΔn test.","2":"200 ms is the non-delay limit for older BS 4293 RCDs."}},{"id":"g3.n8.15","t":"12","c":0,"q":"A 30 mA RCD in a caravan is supplied from a 30 mA RCD-protected pitch socket-outlet. Why may RCD test method 1 (line to cpc) not give a conclusive result?","o":["Method 1 cannot be used on any RCD rated 30 mA","With no selectivity between the two RCDs, either may trip, so the time may not be that of the RCD under test","The caravan cpc cannot carry the test current","Caravans are always IT systems with no cpc return path"],"a":1,"x":"GN3 2.6.18, RCD test method 1, example (a): where an upstream RCD has no selectivity (caravan on a pitch socket), either RCD may trip first, so the measured time may not be that of the RCD under test.","r":"GN3 2.6.18","n":"","k":4194,"f":"Section 2.6.18, 'RCD test method 1: residual current test applied between line and protective conductor', list (a)-(c); index 'Residual current devices (RCDs), test method'.","w":{"0":"Method 1 is the preferred method and works on 30 mA RCDs.","2":"The problem is the upstream RCD with no selectivity, not cpc capacity.","3":"An IT system is a separate example in GN3; caravans are not always IT systems."}},{"id":"g3.n8.16","t":"13","c":1,"q":"A 32 A radial circuit is wired in 6 mm² twin and cpc, 30 m long. Using GN3 Table B1 (6 mm² = 3.08 mΩ/m per conductor at 20 °C) and the Table B3 factor of 1.20, what is the voltage drop at full load?","o":["7.10 V","5.91 V","3.55 V","14.19 V"],"a":0,"x":"GN3 2.6.20: combined live conductor resistance × full load current, corrected for temperature.<br>(R1+Rn)/m = 3.08 + 3.08 = 6.16 mΩ/m<br>6.16 × 30 ÷ 1000 = 0.1848 Ω<br>0.1848 × 1.20 = 0.2218 Ω<br>0.2218 × 32 = 7.10 V","r":"GN3 2.6.20","n":"","k":4440,"f":"Section 2.6.20 Verification of voltage drop, paragraph on 'combined live conductor resistance'; Appendix B Tables B1 and B3; index 'Voltage drop, verification'.","w":{"1":"You left out the 1.20 factor for conductor operating temperature.","2":"You used one conductor only; the drop is across both line and neutral.","3":"You counted the line-plus-neutral loop twice."}},{"id":"g3.n8.17","t":"13","c":0,"q":"A PEI is operating in island mode. A PFC/EFLI measurement is taken using a 'no trip' (low current) setting. What does GN3 warn about the result?","o":["The PFC reading will be accurate because inverters act as a stiff source","The PFC reading may be much lower than actual, and the EFLI higher","The PFC reading may be much higher than the actual value, and the EFLI lower","The reading is accurate only if the RCD trips during the test"],"a":2,"x":"GN3 2.6.24: in island mode inverters can act as a constant current source up to their limit, so a low-current measurement may give a PFC much higher than actual and an EFLI lower.","r":"GN3 2.6.24","n":"","k":4646,"f":"Section 2.6.24, 'EFLI and prospective fault current measurement in PEIs'; index 'Prosumers electrical installations'.","w":{"0":"In island mode inverters behave as constant-current sources, so readings are unreliable.","1":"GN3 says the reverse: PFC reads high and EFLI low.","3":"Tripping does not make the reading valid; the inverter's current limit is the problem."}},{"id":"g4.n8.18","t":"11","c":0,"q":"An EFLI tester shows a loop impedance of 0.06 Ω close to a transformer. According to GN3's note on instrument accuracy, how should this reading be treated?","o":["As exact, because the instrument resolves to 0.01 Ω","With caution: readings below about 0.1 Ω can carry significant errors, which affect the PFC calculation","As invalid, because EFLI testers cannot read below 1.0 Ω","As acceptable only if it is doubled before calculating PFC"],"a":1,"x":"GN3 2.6.16 note on accuracy: EFLI testers become less accurate at low impedances; a result below about 0.1 Ω (or about 1.0 Ω on a low-current range) may have significant errors that affect the PFC.","r":"GN3 2.6.16","n":"","k":3837,"f":"Section 2.6.16, 'Note on the accuracy of EFLI and prospective fault current testers'; also Section 4.5; index 'Prospective fault current'.","w":{"0":"GN3 warns that resolution of 0.01 Ω must not be confused with accuracy.","2":"About 1.0 Ω is the concern only on the low-current (15 mA) range, not a general lower limit.","3":"Doubling is the three-phase rule of thumb, nothing to do with low-impedance accuracy."}},{"id":"g4.n8.19","t":"12","c":1,"q":"A motor supply is originally connected 1-2-3. An electrician swaps wires 1 and 3 at the terminals. Using GN3 Figure 2.32, what is the new phase rotation and motor direction?","o":["3-2-1, clockwise","1-3-2, anticlockwise","2-1-3, anticlockwise","3-2-1, anticlockwise"],"a":3,"x":"GN3 2.6.17, Figure 2.32: original 1-2-3; swap 1 and 3<br>position 1 now carries 3, position 3 carries 1<br>rotation = 3-2-1, and any two-wire swap makes the motor run anticlockwise.","r":"GN3 2.6.17","n":"","k":3975,"f":"Section 2.6.17, Figure 2.32 'All possibilities of swapping any two wires'; index 'Phase sequence'.","w":{"0":"Swapping any two wires reverses the direction, so it cannot still be clockwise.","1":"1-3-2 results from swapping wires 2 and 3, not 1 and 3.","2":"2-1-3 results from swapping wires 1 and 2, not 1 and 3."}},{"id":"g4.n8.20","t":"12","c":1,"q":"An existing time-delay RCD to BS 4293 has a set time delay of 200 ms. Using the GN3 Table 2.17 formula, what is the longest acceptable tripping time at IΔn?","o":["300 ms","500 ms","400 ms","200 ms"],"a":2,"x":"GN3 Table 2.17a, BS 4293 time-delay: (0.5 to 1.0) × time delay + 200 ms.<br>Maximum = 1.0 × 200 + 200<br>= 400 ms","r":"GN3 2.6.18","n":"","k":4082,"f":"Section 2.6.18, Table 2.17a, column 'RCDs to BS 4293 or BS 7288:1990, Time-delay'; index 'Residual current devices (RCDs), test method'.","w":{"0":"You used 0.5 × 200 + 200; the maximum uses the 1.0 factor.","1":"500 ms is the S-type limit for harmonized RCDs, not BS 4293 time-delay.","3":"200 ms is the non-delay BS 4293 limit; it ignores the time delay."}},{"id":"g4.n8.21","t":"12","c":0,"q":"Using RCD test method 2 (upstream/downstream) on a single-phase RCBO, between which conductors is the test made?","o":["Neutral on the supply side and line on the load side of the RCBO","Line on the load side and cpc on the load side","Line on the supply side and neutral on the load side","Line on the supply side and line on the load side"],"a":0,"x":"GN3 2.6.18, RCD test method 2: for single-phase RCDs the test is between upstream (supply-side) neutral and downstream (load-side) line, as shown in Figures 2.35 and 2.36.","r":"GN3 2.6.18","n":"","k":4218,"f":"Section 2.6.18, 'RCD test method 2: upstream/downstream test', item (a); Figures 2.35 and 2.36; index 'Residual current devices (RCDs), test method'.","w":{"1":"That is test method 1 (line to cpc).","2":"GN3 specifies upstream neutral and downstream line, not the other way round.","3":"Both points are on the same line conductor, so there is no voltage between them and no test current flows."}},{"id":"g4.n8.22","t":"13","c":1,"q":"An EV charge point drawing 32 A on a 230 V supply must stay within the 4 % installation voltage drop GN3 gives for BS EN 61851-1. Using 6 mm² twin and cpc (line + neutral 6.16 mΩ/m at 20 °C) and a factor of 1.20, what is the maximum cable length if the whole 4 % is allowed in this circuit?","o":["46.7 m","77.8 m","48.6 m","38.9 m"],"a":3,"x":"GN3 2.6.20: 4 % of 230 V for EV charging.<br>230 × 0.04 = 9.2 V<br>R = 9.2 ÷ 32 = 0.2875 Ω<br>At 20 °C: 0.2875 ÷ 1.20 = 0.2396 Ω<br>L = 0.2396 × 1000 ÷ 6.16 = 38.9 m","r":"GN3 2.6.20","n":"","k":4449,"f":"Section 2.6.20, paragraph on BS EN 61851-1 electric vehicle charging; Appendix B formula L = R × 1000 ÷ mΩ/m; index 'Voltage drop, verification'.","w":{"0":"You left out the 1.20 operating-temperature factor.","1":"You used the single-conductor 3.08 mΩ/m instead of line plus neutral.","2":"You used a 5 % limit instead of the 4 % GN3 gives for EV charge points."}},{"id":"g4.n8.23","t":"13","c":1,"q":"A PEI in connected mode has two grid-connected inverters with current limits of 20 A and 16 A. With all PCE isolated, the PFC measured at the origin is 1.65 kA. Following the IET guidance quoted in GN3, what PFC should be used?","o":["1.65 kA","1.69 kA","1.61 kA","36 A"],"a":1,"x":"GN3 2.6.24 (i), connected mode: PFC = measured PFC + sum of inverter current limits.<br>20 + 16 = 36 A = 0.036 kA<br>1.65 + 0.036 = 1.686<br>≈ 1.69 kA","r":"GN3 2.6.24","n":"","k":4659,"f":"Section 2.6.24 Prosumer's electrical installations, 'EFLI and prospective fault current measurement in PEIs', item (b)(i); index 'Prosumers electrical installations'.","w":{"0":"You ignored the inverters; their current limits must be added.","2":"You subtracted the inverter contribution instead of adding it.","3":"That is the island-mode value (inverter limits only); this is connected mode."}},{"id":"g5.n8.24","t":"11","c":0,"q":"A circuit-breaker to BS EN 60898 has '10000' marked in a rectangle. Using GN3 Table 2.16, what is its service short-circuit capacity Ics?","o":["7.5 kA","10 kA","6.0 kA","12.5 kA"],"a":0,"x":"GN3 2.6.16, Table 2.16: the bracketed figure is Ics. For Icn 10 kA, Ics = 7.5 kA, the maximum fault current it can interrupt without loss of performance.","r":"GN3 2.6.16","n":"","k":3888,"f":"Section 2.6.16, Table 2.16 Rated short-circuit capacities of protective devices; index 'Breaking capacity of devices'.","w":{"1":"10 kA is Icn, the rated (marked) capacity, not Ics.","2":"6.0 kA is Ics for a 6 kA device, the row above.","3":"12.5 kA is Ics for a 25 kA device."}},{"id":"g5.n8.25","t":"12","c":0,"q":"What does GN3 recommend doing immediately before using an instrument to test an RCD?","o":["Carry out an insulation resistance test on the circuit","Switch the instrument to the 5 × IΔn range","Press the RCD's integral test button","Link line and neutral at the load end"],"a":2,"x":"GN3 2.6.18: before using a test instrument the RCD test button should be pressed. It gives basic information that the RCD is working and helps avoid danger if it did not respond during the test.","r":"GN3 2.6.18","n":"","k":4051,"f":"Section 2.6.18 Operation and functional testing of RCDs, 'Operation of RCDs'; index 'Residual current devices (RCDs), test method'.","w":{"0":"Insulation resistance is an earlier dead test; GN3 names the test button as the step immediately before the instrument test.","1":"5 × IΔn is an optional fault-finding test, not a preliminary step.","3":"Linking L and N is part of continuity testing, not RCD testing."}},{"id":"g5.n8.26","t":"12","c":1,"q":"For fault-finding, an inspector carries out the optional 5 × IΔn test on a 100 mA non-delay RCD. What test current is applied and what maximum time is expected?","o":["250 mA, 40 ms","500 mA, 40 ms","500 mA, 150 ms","150 mA, 40 ms"],"a":1,"x":"GN3 Table 2.17b: RCDs over 30 mA, 5 × IΔn, non-delay 40 ms.<br>5 × 100 mA = 500 mA<br>Max time 40 ms (optional test, not a BS 7671 requirement).","r":"GN3 2.6.18","n":"","k":4095,"f":"Section 2.6.18, Table 2.17 part b 'Examples of optional RCD tests'; index 'Residual current devices (RCDs), test method'.","w":{"0":"The 250 mA option applies only to RCDs rated 30 mA or less.","2":"150 ms is the limit for S-type or time-delay RCDs.","3":"150 mA is 5 × 30 mA; this RCD is rated 100 mA."}},{"id":"g5.n8.27","t":"12","c":0,"q":"Pressing the integral test button on an RCD verifies which of the following?","o":["The continuity of the earthing conductor and cpcs","The resistance of the earth electrode","The sensitivity of the device","The functioning of the RCD's mechanical parts"],"a":3,"x":"GN3 2.6.18 'Integral test device': it verifies the mechanical parts work, but not earthing conductor/cpc continuity, the earth electrode, other earthing, or the device's sensitivity.","r":"GN3 2.6.18","n":"","k":4400,"f":"Section 2.6.18, sub-heading 'Integral test device' (Reg 643.10); index 'Residual current devices (RCDs), test method'.","w":{"0":"GN3 lists earthing conductor and cpc continuity as NOT checked by the test button.","1":"The earth electrode is not checked by the test button.","2":"GN3 states the test button does not check the device's sensitivity."}},{"id":"g5.n8.28","t":"13","c":0,"q":"For a 230/400 V installation, what does GN3 say the inspector should check about protection against temporary overvoltages due to an LV system fault, such as loss of neutral?","o":["SPDs are fitted at the origin","The HV and LV earths of the public substation are separated","Equipment has appropriate insulation voltage ratings, such as 600/1,000 V cables","All cables are rated 300/500 V"],"a":2,"x":"GN3 2.6.21: there is little a designer or installer can do beyond selecting equipment with suitable insulation voltage ratings, such as 600/1,000 V cables for a 230/400 V installation, and the inspector should check this.","r":"GN3 2.6.21","n":"","k":4498,"f":"Section 2.6.21, sub-heading 'Temporary overvoltages due to an LV system fault'; Section 442 of BS 7671.","w":{"0":"SPDs relate to transient overvoltages under Section 443 (2.6.22), not temporary overvoltages.","1":"Public-supply HV arrangements are deemed to comply and are not checked by the inspector.","3":"GN3 gives 600/1,000 V cables as the example for 230/400 V installations."}},{"id":"g5.n8.29","t":"13","c":1,"q":"A PEI runs in island mode from three inverters with current limits of 25 A, 25 A and 15 A. In connected mode the PFC at the origin is 1.2 kA. Following the guidance in GN3, what PFC applies in island mode?","o":["65 A","1.2 kA","25 A","1.265 kA"],"a":0,"x":"GN3 2.6.24 (ii), island mode: PFC = sum of the current limits of the inverters.<br>25 + 25 + 15 = 65 A","r":"GN3 2.6.24","n":"","k":4666,"f":"Section 2.6.24, 'EFLI and prospective fault current measurement in PEIs', item (b)(ii); index 'Prosumers electrical installations'.","w":{"1":"That is the grid-supplied value; in island mode the public network is disconnected.","2":"You took only the largest inverter; the current limits are summed.","3":"You added the inverters to the grid PFC; that is the connected-mode method."}},{"id":"iv1.1","t":"1","c":0,"q":"Which is the correct order for safe isolation of a final circuit?\n1. Identify the circuit and its point of isolation\n2. Isolate, lock off and keep the key\n3. Fit a caution notice\n4. Prove the voltage indicator on a proving unit\n5. Test for voltage at the point of work\n6. Re-prove the voltage indicator on the proving unit","s":"","o":["1, 4, 5, 2, 3, 6","1, 2, 3, 4, 5, 6","4, 1, 2, 3, 5, 6","1, 2, 4, 5, 6, 3"],"a":1,"x":"Identify, isolate and secure (lock, key, notice) first. Then prove the indicator, test at the point of work, and re-prove. Testing before the circuit is isolated proves nothing.","r":"","n":"","k":1000000.0,"f":"GN3 1.1 (Safety) refers you to GS38, HSR25 and Electrical Safety First Best Practice Guide No.2 for safe isolation; index 'isolation'.","w":{"2":"You proved the indicator before isolating; prove, test, re-prove happens after the circuit is isolated and secured.","3":"The caution notice belongs with locking off, not after testing; the circuit is unprotected while you test.","0":"You tested for dead before isolating; a test then proves nothing and the circuit isn't yet locked off."}},{"id":"iv1.2","t":"1","c":0,"q":"How many voltage tests are needed at the point of work to confirm a single-phase circuit is dead?","s":"","o":["3","1","4","2"],"a":0,"x":"Three: L–N, L–E and N–E. The N–E test catches a neutral made live by a borrowed neutral or a fault.","r":"","n":"","k":1000001.0,"f":"GN3 1.1 (Safety) refers you to GS38, HSR25 and Electrical Safety First Best Practice Guide No.2 for safe isolation; index 'isolation'.","w":{"1":"One test only checks one pair of conductors; a fault or borrowed neutral could leave another pair live.","3":"Two tests miss one combination; you need L–N, L–E and N–E.","2":"Four is too many for single-phase; there are only three conductor pairs: L–N, L–E and N–E."}},{"id":"iv1.3","t":"1","c":0,"q":"How many voltage tests are needed to confirm a three-phase, four-wire supply is dead?","s":"","o":["3","6","7","10"],"a":3,"x":"Line to line (L1–L2, L2–L3, L3–L1) = 3, each line to neutral = 3, each line to earth = 3, and N–E = 1. Total 10.","r":"","n":"","k":1000002.0,"f":"GN3 1.1 (Safety) refers you to GS38, HSR25 and Electrical Safety First Best Practice Guide No.2 for safe isolation; index 'isolation'.","w":{"0":"Three covers only line to line; you've missed line–neutral, line–earth and N–E.","1":"Six misses the line-to-earth tests (or line-to-neutral) and N–E; every conductor pair must be tested.","2":"Seven forgets one group of three; count L–L (3), L–N (3), L–E (3) and N–E (1)."}},{"id":"iv1.4","t":"1","c":0,"q":"Which regulation of the Electricity at Work Regulations 1989 deals with precautions for work on equipment made dead?","s":"","o":["Regulation 12","Regulation 4","Regulation 16","Regulation 13"],"a":3,"x":"Reg 13: precautions for work on equipment made dead. Reg 12 covers the means of cutting off supply and isolation; Reg 16 covers competence; Reg 4 covers systems, work activities and protective equipment.","r":"","n":"","k":1000003.0,"f":"GN3 doesn't reproduce EAWR Reg 13; see HSR25 (referred to in GN3 1.1). GN3 3.3 covers Reg 4, and 4.9 quotes Regs 14 and 16.","w":{"1":"Reg 4 covers systems, work activities and protective equipment, not precautions for work on dead equipment.","0":"Reg 12 is the means for cutting off supply and isolation; Reg 13 is the precautions once it's dead.","2":"Reg 16 is about competence to prevent danger, not work on equipment made dead."}},{"id":"iv1.5","t":"1","c":0,"q":"HSE Guidance Note GS38 recommends that the exposed metal tip of a test probe should not exceed:","s":"","o":["10 mm","1 mm","4 mm","12 mm"],"a":2,"x":"GS38: exposed tips no more than 4 mm, preferably 2 mm or less, or spring-retractable. Long exposed tips can bridge terminals and cause a flashover.","r":"","n":"","k":1000004.0,"f":"GN3 1.1 and 4.1 tell you to follow HSE GS38 for leads and probes; the tip limit is in GS38 itself. Index 'GS38'.","w":{"1":"1 mm isn't the GS38 figure; GS38 allows up to 4 mm and prefers 2 mm or less.","0":"10 mm is far too long; long exposed tips can bridge terminals and cause a flashover.","3":"12 mm is far too long; GS38 limits exposed tips to 4 mm."}},{"id":"iv1.6","t":"1","c":0,"q":"Which TWO of the following are suitable for proving that a circuit is dead? (Select TWO)","s":"","o":["A multimeter left on its resistance range","A non-contact voltage detector","A two-pole approved voltage indicator to GS38","A two-pole test lamp to GS38"],"a":[2,3],"x":"Only a two-pole device made for the job (approved voltage indicator or test lamp to GS38) is suitable. Non-contact detectors can miss a live conductor, and a multimeter is easily left on the wrong range.","r":"","n":"","k":1000005.0,"f":"GN3 1.1 (Safety) refers you to GS38, HSR25 and Electrical Safety First Best Practice Guide No.2 for safe isolation; index 'isolation'.","w":{"1":"A non-contact detector can miss a live conductor, so it can't prove dead.","0":"A multimeter is easily left on the wrong range, giving a false 'dead' reading; it isn't a purpose-made indicator."}},{"id":"iv1.7","t":"1","c":0,"q":"Two electricians need to work on the same isolated circuit, but the isolator has a single padlock hole. What is the correct arrangement?","s":"","o":["One electrician locks off and holds the key for both","Fit a multi-lock hasp so each electrician fits their own lock","Tape over the isolator and fit a notice","Remove the main fuse and leave it on the consumer unit"],"a":1,"x":"Each person working must be protected by their own lock and key. A multi-lock hasp lets everyone fit a personal lock, so the circuit can't be re-energised until all have removed theirs.","r":"","n":"","k":1000006.0,"f":"GN3 1.1 (Safety) refers you to GS38, HSR25 and Electrical Safety First Best Practice Guide No.2 for safe isolation; index 'isolation'.","w":{"0":"Each person must hold their own lock and key; one person can't protect the other.","2":"Tape and a notice don't stop anyone switching back on; isolation must be secured by a lock.","3":"A fuse left on the board can be refitted by anyone; it must be kept on your person."}},{"id":"iv1.8","t":"2","c":0,"q":"BS 7671 requires initial verification of a new installation to be carried out:","s":"","o":["Within the first year of occupation","Only on completion, after the installation has been energised","Within 28 days of the installation being put into service","During erection, where practicable, and on completion before being put into service"],"a":3,"x":"Reg 641.1: every installation shall be inspected and tested during erection, as far as practicable, and on completion, before being put into service.","r":"","n":"","k":1000007.0,"f":"GN3 2.1 (Purpose of initial verification) and 2.5.1 (Reg 641.1, inspection during erection); index 'initial verification'.","w":{"2":"There's no 28-day window; verification is done before the installation is put into service.","1":"Testing only after energising misses the dead tests and work that gets covered up during erection.","0":"Initial verification is before putting into service, not within the first year of occupation."}},{"id":"iv1.9","t":"2","c":0,"q":"Which information must be made available to the person carrying out initial verification?","s":"","o":["The installer's training records","Diagrams, charts or tables showing the type and composition of each circuit","The occupier's insurance details","The electricity supplier's tariff"],"a":1,"x":"Reg 514.9 and 641.2: diagrams, charts or tables showing circuits, points served, protective devices and methods of protection must be available to the inspector.","r":"","n":"","k":1000008.0,"f":"GN3 2.3 (Required information), 'Diagrams, charts or tables' under Reg 514.9.1; index 'required information'.","w":{"3":"The tariff has nothing to do with verifying safety; it isn't required information.","0":"Training records aren't on the Reg 514.9 list; the inspector needs circuit information.","2":"Insurance details aren't required information for inspection and testing."}},{"id":"iv1.10","t":"2","c":0,"q":"When an addition is made to an existing installation, the inspector must verify that the addition complies with BS 7671 and that:","s":"","o":["The existing installation is rewired to the current edition","All existing circuits have RCD protection","It does not impair the safety of the existing installation","The existing installation has an EICR less than 5 years old"],"a":2,"x":"Reg 641.5: for an addition or alteration, verify it complies with BS 7671 and does not impair the safety of the existing installation. Existing defects affecting the new work are recorded.","r":"","n":"","k":1000009.0,"f":"GN3 1.4 (Additions and alterations), Reg 644.1; index 'additions'.","w":{"0":"BS 7671 doesn't require a rewire; the addition must comply and not impair existing safety.","3":"An EICR isn't a precondition; the requirement is that existing safety isn't impaired.","1":"Existing circuits needn't all gain RCDs; only the addition's effect on existing safety is checked."}},{"id":"iv1.11","t":"3","c":0,"q":"Inspection during initial verification is normally carried out:","s":"","o":["At the same time as the RCD tests","After live testing, with the installation energised","Before testing, with the installation disconnected from the supply","Only where testing shows a fault"],"a":2,"x":"Reg 642.1: inspection precedes testing and is normally done with the installation disconnected from the supply. It confirms the installation is complete and safe to test.","r":"","n":"","k":1000010.0,"f":"BS 7671 Reg 642.1; GN3 2.5 (Initial inspection) and the 2.6.4 sequence show inspection comes before testing. Index 'inspection'.","w":{"1":"Inspection comes first, normally with the supply disconnected, not after live tests.","0":"RCD tests are live and near the end of the sequence; inspection comes before any testing.","3":"Inspection is always required before testing, not only when a fault shows up."}},{"id":"iv1.12","t":"3","c":0,"q":"Which human sense is most appropriate for checking that terminations are tight?","s":"","o":["Hearing","Sight","Smell","Touch"],"a":3,"x":"Tightness is felt, not seen. Sight checks identification and damage; smell detects overheating; hearing picks up arcing on a live installation.","r":"","n":"","k":1000011.0,"f":"GN3 2.5.3 inspection checklist, 'General wiring accessories' item (h) 'terminals are tight' (Reg 526); index 'connection of conductors'.","w":{"1":"Sight checks identification and damage, but you can't see whether a screw is tight.","2":"Smell detects overheating, not whether a termination is tight.","0":"Hearing picks up arcing on a live installation; it can't confirm tightness on a dead one."}},{"id":"iv1.13","t":"3","c":0,"q":"What is the minimum degree of protection for the readily accessible top surface of a consumer unit?","s":"","o":["IP2X or IPXXB","IP4X or IPXXD","IPX2","IPX4"],"a":1,"x":"Reg 416.2.2: horizontal top surfaces that are readily accessible need at least IP4X / IPXXD (a 1 mm wire can't enter). The front needs at least IP2X / IPXXB.","r":"","n":"","k":1000012.0,"f":"GN3 2.5.2, basic protection by barriers or enclosures (Reg 416.2); index 'IP4X'.","w":{"0":"IP2X/IPXXB is for the front and sides; the readily accessible top surface needs IP4X/IPXXD.","3":"IPX4 is splash protection against water, not protection against wires entering the top.","2":"IPX2 is a water rating; the top needs the 1 mm wire rating IP4X/IPXXD."}},{"id":"iv1.14","t":"3","c":0,"q":"The code IPXXB indicates protection against:","s":"","o":["Access to live parts by a finger","Splashing water","Mechanical impact","Ingress of dust"],"a":0,"x":"The additional letter B means a test finger (12 mm diameter, 80 mm long) can't touch live parts. The two X's mean the solids and water digits are not specified.","r":"","n":"","k":1000013.0,"f":"GN3 2.5.2, barriers or enclosures (Reg 416.2), IPXXB or IP2X; index 'IP code'.","w":{"3":"Dust would be the first numeral (5 or 6); the X there means solids aren't specified.","1":"Water is the second numeral, and it's X here; B is the finger access letter.","2":"Impact is the IK code, not the IP additional letter."}},{"id":"iv1.15","t":"3","c":0,"q":"A cable is concealed in a wall of a dwelling at a depth of 30 mm. It has no earthed metallic covering and no mechanical protection. What else is required?","s":"","o":["Additional protection by an RCD with IΔn not exceeding 30 mA","Supplementary bonding to the cable","A cable with a larger csa","A 100 mA time-delayed RCD at the origin"],"a":0,"x":"Reg 522.6.202: cables concealed at less than 50 mm need an earthed metallic covering, earthed conduit/trunking, mechanical protection, or (in the prescribed zones) additional protection by a 30 mA RCD.","r":"","n":"","k":1000014.0,"f":"GN3 2.5.2, concealed cables and Figure 2.1 prescribed zones (Reg 522.6.202); index 'prescribed zones'.","w":{"3":"Additional protection needs 30 mA; a 100 mA time-delayed RCD doesn't meet it.","1":"Supplementary bonding doesn't protect a cable from nails or screws.","2":"A larger csa gives no protection against penetration; the cable is still at risk."}},{"id":"iv1.16","t":"3","c":0,"q":"Where must a label reading \"Safety Electrical Connection – Do Not Remove\" be fitted? (Select TWO)","s":"","o":["At the connection of a main bonding conductor to a gas pipe","At the connection of the earthing conductor to an earth electrode","Inside the consumer unit, on the main switch","On every socket-outlet faceplate"],"a":[0,1],"x":"Reg 514.13.1: at every connection of an earthing conductor to an earth electrode, and at every bonding conductor connection to an extraneous-conductive-part.","r":"","n":"","k":1000015.0,"f":"GN3 2.5.2, Figure 2.7, warning notice required by Reg 514.13.1; index 'earthing and bonding labels'.","w":{"3":"Socket-outlets don't need this label; it's for earthing and bonding connections.","2":"The main switch doesn't carry this label; it marks earth electrode and bonding connections."}},{"id":"iv1.17","t":"3","c":0,"q":"A new consumer unit is installed in a dwelling. What must its enclosure be made of, or enclosed in?","s":"","o":["Transparent material so devices can be seen","Material rated IPX4 or better","Any plastic rated IP2X","Non-combustible material"],"a":3,"x":"Reg 421.1.201: consumer units and similar switchgear assemblies in domestic premises must have enclosures of non-combustible material, or be enclosed in a cabinet of non-combustible material.","r":"","n":"","k":1000016.0,"f":"GN3 2.5.3 inspection checklist, 'Switchgear' item (c), fire-protecting enclosures (Reg 421.1.201); index 'consumer unit'.","w":{"2":"An IP2X plastic enclosure meets shock protection only; domestic consumer units must be non-combustible.","0":"Transparency isn't a requirement; the enclosure must be non-combustible.","1":"IPX4 is about water, not fire; the requirement is non-combustible material."}},{"id":"iv1.18","t":"3","c":0,"q":"During inspection you check that the installation will not have a harmful effect on other services, and they will not harm it. This is called:","s":"","o":["Selectivity","Compatibility of external influences","Prevention of mutual detrimental influence","Electrical separation"],"a":2,"x":"Section 515: prevention of mutual detrimental influence between the electrical installation and other services (gas, water, data) and between different electrical systems.","r":"","n":"","k":1000017.0,"f":"GN3 2.5.2, 'Sect 515 Prevention of mutual detrimental influence' (Regs 132.11, 515.1); index 'mutual detrimental influence'.","w":{"1":"External influences cover the environment (water, dust, impact), not interaction with other services.","0":"Selectivity is coordination between protective devices, not between services.","3":"Electrical separation is a protective measure against shock, not interaction between services."}},{"id":"iv1.19","t":"4","c":0,"q":"What is the main reason BS 7671 sets a sequence of tests for initial verification?","s":"","o":["So instruments can be calibrated between tests","To shorten the time taken","For the safety of the person testing and others","So the Schedule of Test Results is filled in order"],"a":2,"x":"The dead tests prove there are no short circuits, earth faults or polarity errors before the installation is energised for live tests. The order protects the tester and others.","r":"","n":"","k":1000018.0,"f":"GN3 2.6.4 (The sequence of tests) and Figure 2.12, safety considerations column; index 'sequence of tests'.","w":{"3":"The schedule layout follows the tests, not the other way round; the order is about safety.","1":"Speed isn't the reason; the dead tests prove it's safe to energise.","0":"Calibration isn't done between tests; the order protects the tester and others."}},{"id":"iv1.20","t":"4","c":1,"q":"BS EN 61557-4 requires a continuity (low-resistance) tester to deliver a test current of at least:","s":"","o":["200 mA","1 A","10 mA","30 mA"],"a":0,"x":"BS EN 61557-4: open-circuit voltage 4 V to 24 V, test current not less than 200 mA.","r":"","n":"","k":1000019.0,"f":"GN3 4.3 (Low-resistance ohmmeters): 4–24 V, short-circuit current not less than 200 mA (BS EN 61557-4); index 'continuity tester'.","w":{"2":"10 mA is far too low to show up a poor connection; the minimum is 200 mA.","3":"30 mA is an RCD rating, not the continuity test current.","1":"1 A is higher than required; the BS EN 61557-4 minimum is 200 mA."}},{"id":"iv1.21","t":"4","c":0,"q":"An insulation resistance tester should comply with:","s":"","o":["BS EN 60898","BS EN 61008","BS EN 61557-2","BS 7671 Appendix 3"],"a":2,"x":"BS EN 61557-2 covers insulation resistance testers. Part 3 is loop impedance, part 4 continuity, part 5 earth electrode, part 6 RCD, part 7 phase sequence.","r":"","n":"","k":1000020.0,"f":"GN3 4.4 (Insulation resistance testers): instruments to BS EN 61557-2; index 'instrument standard'.","w":{"0":"BS EN 60898 is the circuit-breaker standard, not a test instrument standard.","1":"BS EN 61008 is the RCCB standard, not an insulation tester standard.","3":"BS 7671 Appendix 3 covers protective device time/current curves, not instruments."}},{"id":"iv1.22","t":"4","c":0,"q":"What must be done to the test leads before measuring the continuity of protective conductors?","s":"","o":["They must be connected to the MET","They must be replaced with 10 A fused leads","They must be tested at 500 V","They must be nulled (zeroed)"],"a":3,"x":"Nulling removes the resistance of the leads from the reading. Leads not nulled are the classic cause of a measured value much higher than calculated.","r":"","n":"","k":1000021.0,"f":"GN3 4.3 (Low-resistance ohmmeters) and 2.6.5 test method 1, 'zero instrument across test link'; index 'nulling'.","w":{"1":"Fused leads for loop testing are a different matter; continuity leads must be nulled.","2":"500 V is the insulation test voltage; it doesn't remove lead resistance.","0":"Connecting to the MET is part of the test, not preparation; the leads must be nulled first."}},{"id":"iv1.23","t":"4","c":0,"q":"A regular accuracy check shows your multifunction tester is reading outside its tolerance. Which results are now in doubt?","s":"","o":["All results since the last satisfactory accuracy check","Only insulation resistance results","None, as the calibration certificate is still in date","Only the test you were doing when it was noticed"],"a":0,"x":"Accuracy checks between calibrations exist for this reason. Anything tested since the last check the instrument passed may be wrong and should be reviewed or retested.","r":"","n":"","k":1000022.0,"f":"GN3 4.2 (Instrument accuracy), loss of calibration and intermediate checks; index 'accuracy'.","w":{"2":"An in-date certificate only proves accuracy on that date; the failed check shows it has drifted since.","3":"The fault could have started any time after the last good check, so earlier results are also in doubt.","1":"The instrument fault could affect any function; all results since the last good check are in doubt."}},{"id":"iv1.24","t":"7","c":0,"q":"A lighting circuit has electronic dimmer switches that cannot be disconnected. How should the insulation resistance test be carried out?","s":"","o":["Skip the test and record N/A","Test line to neutral only","Connect line and neutral together and test to earth","At 1000 V DC so the reading is clear"],"a":2,"x":"Joining line and neutral means no test voltage is applied across the electronics, while the insulation to earth is still proved. Record that L–N was not tested and why.","r":"","n":"","k":1000023.0,"f":"GN3 2.6.7 (Insulation resistance), items (c) and the L&N linked to E method for vulnerable equipment; index 'dimmer'.","w":{"3":"1000 V is for circuits above 500 V and would more likely damage the dimmers.","0":"The insulation to earth can still be tested by linking L and N; skipping it isn't acceptable.","1":"L–N puts the test voltage across the electronics, the very thing you need to avoid."}},{"id":"iv1.25","t":"1","c":0,"q":"Before live testing in an occupied building, what should be done?","s":"","o":["Disconnect the main protective bonding","Inform the occupier and people affected, and use warning notices or barriers","Switch off the RCDs to prevent tripping","Nothing, as live tests are brief"],"a":1,"x":"Others may touch exposed parts or be affected by loss of supply. Warn them and control access. Bonding stays connected, and RCDs stay in service.","r":"","n":"","k":1000024.0,"f":"GN3 1.1 (Safety): agree the work with the client, plan isolation with premises management, fence off work areas; index 'safety'.","w":{"3":"Live tests can still put voltages on exposed parts and cut supplies; people must be warned.","0":"Bonding must stay connected for safety; removing it creates danger.","2":"RCDs must stay in service; switching them off removes protection and isn't a precaution."}},{"id":"iv1.26","t":"5","c":0,"q":"Which test method is used to verify the continuity of main protective bonding conductors?","s":"","o":["Ring final circuit step 2","R1 + R2 method","Earth fault loop impedance test","Long (wander) lead method"],"a":3,"x":"One lead on the MET, the long lead on the bonding clamp at the pipe (after nulling). This measures the bonding conductor alone.","r":"","n":"","k":1000025.0,"f":"GN3 2.6.5, 'Testing bonding conductors and earthing conductors': use test method 2 (wandering lead); index 'bonding'.","w":{"1":"R1 + R2 (test method 1) is for circuit conductors, not a bonding conductor between MET and pipe.","0":"Ring step 2 measures (r1 + rn)/4 on a ring final circuit, not bonding.","2":"A loop test is a live test of the fault path; bonding continuity is a dead low-resistance test."}},{"id":"iv1.27","t":"5","c":1,"q":"A radial circuit is wired in 2.5/1.5 mm² thermoplastic twin and cpc cable, 24 m long. What is the expected R1 + R2 at 20°C?","s":"","o":["0.29 Ω","0.47 Ω","0.18 Ω","0.73 Ω"],"a":1,"x":"GN3 Table B1: 2.5/1.5 = 19.51 mΩ/m.<br>19.51 × 24 = 468 mΩ<br>468 ÷ 1000 = 0.47 Ω","r":"","n":"","k":1000026.0,"f":"GN3 Appendix B, Table B1: 2.5/1.5 = 19.51 mΩ/m at 20 °C; R = mΩ/m × L ÷ 1000 (2.6.5 worked example).","w":{"2":"0.18 Ω uses only the 2.5 mm² line value (7.41 mΩ/m); R1 + R2 needs the combined 19.51.","0":"0.29 Ω uses only the 1.5 mm² cpc value (12.10 mΩ/m); add the line conductor too.","3":"0.73 Ω uses 30.20 mΩ/m, the 1.5/1.0 value; 2.5/1.5 cable is 19.51 mΩ/m."}},{"id":"iv1.28","t":"6","c":1,"q":"What value of r2 would you expect?","s":"Scenario: a ring final circuit is wired in 2.5/1.5 mm² twin and cpc cable. Step 1 gives r1 = 0.52 Ω and rn = 0.52 Ω.","o":["0.31 Ω","0.52 Ω","0.87 Ω","1.04 Ω"],"a":2,"x":"The cpc is 1.5 mm², the line 2.5 mm². 2.5 ÷ 1.5 = 1.67.<br>r2 = 0.52 × 1.67 = 0.87 Ω","r":"","n":"","k":1000027.0,"f":"GN3 2.6.6 (Continuity of ring final circuit conductors), step 1, ratio 1.67 for 2.5/1.5 cable; index 'ring final circuit'.","w":{"0":"You divided by 1.67; the smaller cpc has higher resistance, so multiply.","1":"r2 equals r1 only if the cpc is the same size; here it's 1.5 mm², not 2.5.","3":"You doubled r1; the multiplier is the csa ratio 2.5 ÷ 1.5 = 1.67."}},{"id":"iv1.29","t":"6","c":1,"q":"What should step 2 read at each socket-outlet?","s":"Scenario: a ring final circuit is wired in 2.5/1.5 mm² twin and cpc cable. Step 1 gives r1 = 0.52 Ω and rn = 0.52 Ω.","o":["0.52 Ω","0.26 Ω","1.04 Ω","0.13 Ω"],"a":1,"x":"Step 2 = (r1 + rn) ÷ 4<br>= (0.52 + 0.52) ÷ 4 = 1.04 ÷ 4 = 0.26 Ω, the same at every socket.","r":"","n":"","k":1000028.0,"f":"GN3 2.6.6, step 2: L and N cross-connected, each reading about (r1 + rn) ÷ 4; index 'ring final circuit'.","w":{"3":"You divided 0.52 by 4; add r1 and rn first, then divide by 4.","0":"0.52 Ω is r1 alone; step 2 gives (r1 + rn) ÷ 4.","2":"1.04 Ω is r1 + rn not divided by 4; the cross-connection gives a quarter."}},{"id":"iv1.30","t":"6","c":1,"q":"What should step 3 read at each socket-outlet?","s":"Scenario: a ring final circuit is wired in 2.5/1.5 mm² twin and cpc cable. Step 1 gives r1 = 0.52 Ω and rn = 0.52 Ω.","o":["1.39 Ω","0.26 Ω","0.46 Ω","0.35 Ω"],"a":3,"x":"Step 3 = (r1 + r2) ÷ 4<br>= (0.52 + 0.87) ÷ 4 = 1.39 ÷ 4 = 0.35 Ω. This is the ring's R1 + R2.","r":"","n":"","k":1000029.0,"f":"GN3 2.6.6, step 3: L and cpc cross-connected, each reading about (r1 + r2) ÷ 4; index 'ring final circuit'.","w":{"1":"0.26 Ω is the step 2 value (r1 + rn) ÷ 4; step 3 uses r2.","2":"You divided by 3 instead of 4; (0.52 + 0.87) ÷ 4 = 0.35.","0":"1.39 Ω is r1 + r2 not divided by 4."}},{"id":"iv1.31","t":"6","c":0,"q":"One socket reads about 0.1 Ω higher than all the others on both step 2 and step 3. What is the most likely cause?","s":"Scenario: a ring final circuit is wired in 2.5/1.5 mm² twin and cpc cable. Step 1 gives r1 = 0.52 Ω and rn = 0.52 Ω.","o":["Line and neutral reversed at that socket","The cpc is open circuit","That socket is a spur from the ring","The cross-connection at the consumer unit is wrong"],"a":2,"x":"A spur adds its own cable resistance to the ring value, so that outlet reads higher on both steps. A wrong cross-connection makes readings rise towards the middle of the ring instead.","r":"","n":"","k":1000030.0,"f":"GN3 2.6.6, step 2/3 notes: spurs read higher due to the spur conductors; index 'spur'.","w":{"0":"L–N reversal makes step 3 over-range at that socket, not just 0.1 Ω higher on both steps.","3":"A wrong cross-connection makes readings rise towards the middle of the ring, not at one socket.","1":"An open cpc would give over-range on step 3, not a small rise on step 2 as well."}},{"id":"iv1.32","t":"7","c":1,"q":"What are the test voltage and minimum acceptable insulation resistance for a 230 V circuit?","s":"","o":["500 V DC, 0.5 MΩ","250 V DC, 0.5 MΩ","1000 V DC, 1.0 MΩ","500 V DC, 1.0 MΩ"],"a":3,"x":"BS 7671 Table 64: circuits up to and including 500 V are tested at 500 V DC, minimum 1.0 MΩ. SELV/PELV: 250 V, 0.5 MΩ. Above 500 V: 1000 V, 1.0 MΩ.","r":"","n":"","k":1000031.0,"f":"GN3 2.6.7, Table 2.9 (Table 64 of BS 7671), minimum values of insulation resistance; index 'insulation resistance'.","w":{"1":"250 V DC, 0.5 MΩ is the SELV/PELV row, not a 230 V circuit.","0":"The test voltage is right but the minimum is 1.0 MΩ, not 0.5.","2":"1000 V DC is for circuits above 500 V; 230 V is tested at 500 V."}},{"id":"iv1.33","t":"7","c":1,"q":"Three circuits are insulation tested separately, L–E: 200 MΩ, 100 MΩ and 50 MΩ. What would the reading be with all three tested together?","s":"","o":["50 MΩ","116.7 MΩ","28.6 MΩ","350 MΩ"],"a":2,"x":"Insulation resistances combine in parallel.<br>1/R = 1/200 + 1/100 + 1/50 = 0.005 + 0.01 + 0.02 = 0.035<br>R = 1 ÷ 0.035 = 28.6 MΩ (always lower than the lowest circuit).","r":"","n":"","k":1000032.0,"f":"GN3 2.6.7 (Insulation resistance): circuits tested together are in parallel; use 1/Rt = 1/R1 + 1/R2 + 1/R3. Index 'insulation resistance'.","w":{"0":"50 MΩ is the lowest single circuit; parallel paths always give less than the lowest.","1":"116.7 MΩ is the average; insulation resistances combine in parallel, not as an average.","3":"You added them as series resistances; parallel paths reduce the total."}},{"id":"iv1.34","t":"7","c":1,"q":"A socket circuit includes socket-outlets with built-in surge protection that cannot be removed. What test voltage is used for the insulation test between live conductors and earth?","s":"","o":["100 V DC","500 V DC","250 V DC","1000 V DC"],"a":2,"x":"Where an SPD can't be disconnected, reduce the L–E test voltage to 250 V DC. The minimum value stays 1.0 MΩ.","r":"","n":"","k":1000033.0,"f":"GN3 4.4 (Insulation resistance testers) and 2.6.7, Table 64 note on SPDs (Reg 643.3.2); index 'surge protection'.","w":{"0":"100 V isn't a Table 64 test voltage; the reduced voltage is 250 V DC.","1":"500 V DC is the normal value, but it's reduced to 250 V where an SPD can't be disconnected.","3":"1000 V DC is for circuits above 500 V and would damage the SPD."}},{"id":"iv1.35","t":"8","c":0,"q":"Which TWO are reasons for carrying out a polarity test? (Select TWO)","s":"","o":["To confirm single-pole devices are connected in the line conductor only","To confirm the RCD trips within 300 ms","To confirm the centre contact of Edison screw lampholders is connected to the line conductor","To confirm the earth fault loop impedance is low enough"],"a":[0,2],"x":"Reg 643.6: polarity confirms fuses and single-pole switches/devices are in the line conductor, and ES lampholder centre contacts are on line (except E14 and E27 to BS EN 60238).","r":"","n":"","k":1000034.0,"f":"GN3 2.6.12 (Polarity testing): fuses and single-pole devices in line; ES centre contact on line (except E14, E27); index 'polarity'.","w":{"1":"RCD trip times are tested in 2.6.18, not by the polarity test.","3":"Earth fault loop impedance is a separate live test (2.6.15), not polarity."}},{"id":"iv1.36","t":"9","c":1,"q":"An earth electrode is tested by the fall-of-potential method. The three readings are 58 Ω, 62 Ω and 60 Ω. What value of Ra is recorded?","s":"","o":["62 Ω","60 Ω","180 Ω","58 Ω"],"a":1,"x":"The three readings agree closely, so Ra is their average:<br>(58 + 62 + 60) ÷ 3 = 180 ÷ 3 = 60 Ω","r":"","n":"","k":1000035.0,"f":"GN3 2.6.13, test method E1 (fall of potential): take the average of three readings, check deviation; index 'earth electrode'.","w":{"3":"58 Ω is the lowest reading; Ra is the average of the three.","0":"62 Ω is the highest reading; Ra is the average of the three.","2":"180 Ω is the sum; you didn't divide by 3."}},{"id":"iv1.37","t":"10","c":0,"q":"When measuring external earth fault loop impedance (Ze), the installation should be:","s":"","o":["Energised with all bonding connected","Isolated, with the earthing conductor connected to the MET","Isolated, main switch open, earthing conductor disconnected from the MET","Energised with the RCDs switched off"],"a":2,"x":"Disconnecting the earthing conductor removes parallel paths through the bonding. The installation must be isolated and locked off while it is disconnected, and it is reconnected before re-energising.","r":"","n":"","k":1000036.0,"f":"GN3 2.6.15, 'Measurement of external EFLI (Ze)' and Figure 2.31; index 'Ze'.","w":{"0":"With bonding connected, parallel paths through pipework lower the reading, so it isn't true Ze.","1":"The earthing conductor must be disconnected from the MET to remove parallel paths.","3":"Ze is measured with the main switch open and the earth disconnected, not energised with RCDs off."}},{"id":"iv1.38","t":"10","c":0,"q":"What is the maximum Ze declared by the distribution network operator for a TN-C-S (PME) supply?","s":"","o":["0.8 Ω","0.2 Ω","0.35 Ω","21 Ω"],"a":2,"x":"Typical maximum declared values: TN-C-S 0.35 Ω, TN-S 0.8 Ω, TT 21 Ω (excluding the installation's own electrode).","r":"","n":"","k":1000037.0,"f":"GN3 2.3 (Required information) item (g) lists Ze as supply information from the DNO; GN3 2.6.15 covers measuring it. Index 'Ze'.","w":{"1":"0.2 Ω isn't a declared maximum; the TN-C-S figure is 0.35 Ω.","0":"0.8 Ω is the TN-S figure, not TN-C-S.","3":"21 Ω is the TT figure (excluding the electrode), not TN-C-S."}},{"id":"iv1.39","t":"10","c":1,"q":"A circuit has a Ze of 0.35 Ω and an R1 + R2 of 0.47 Ω. What is the expected Zs?","s":"","o":["0.82 Ω","0.12 Ω","0.47 Ω","1.64 Ω"],"a":0,"x":"Zs = Ze + (R1 + R2) = 0.35 + 0.47 = 0.82 Ω","r":"","n":"","k":1000038.0,"f":"GN3 2.6.15 and Appendix B: Zs = Ze + (R1 + R2); index 'earth fault loop impedance'.","w":{"1":"You subtracted Ze from R1 + R2; Zs is the sum.","2":"0.47 Ω is R1 + R2 only; Ze must be added.","3":"You doubled the answer; Zs = 0.35 + 0.47."}},{"id":"iv1.40","t":"10","c":1,"q":"A 32 A Type B RCBO to BS EN 61009 protects a socket circuit. Zs is measured at 1.28 Ω. Is the result acceptable?","s":"","o":["No, it exceeds the maximum measured value of about 1.10 Ω","Yes, it is below 1.44 Ω","Yes, it is below the tabulated 1.37 Ω","No, it exceeds 0.87 Ω"],"a":0,"x":"Tabulated max Zs (Table 41.3) = 1.37 Ω. Compare a measured value against 0.8 of that:<br>1.37 × 0.8 = 1.10 Ω<br>1.28 Ω is higher, so it fails.","r":"","n":"","k":1000039.0,"f":"GN3 2.6.15, (d) using a factor of 0.8 (Appendix A2), and Appendix A Table A5 for circuit-breakers; index 'maximum measured Zs'.","w":{"2":"1.37 Ω is the tabulated value at operating temperature; a measured value is compared with 0.8 of it.","1":"1.44 Ω isn't a limit for this device; the maximum measured value is 0.8 × 1.37 = 1.10 Ω.","3":"0.87 Ω is the 40 A Type B (or 20 A Type C) value, not 32 A Type B."}},{"id":"iv1.41","t":"10","c":1,"q":"What is the maximum disconnection time for a 32 A final circuit in a TT system at 230 V?","s":"","o":["0.4 s","0.1 s","0.2 s","1 s"],"a":2,"x":"Table 41.1: final circuits up to 32 A (63 A with sockets): TN 0.4 s, TT 0.2 s. Distribution circuits: TN 5 s, TT 1 s.","r":"","n":"","k":1000040.0,"f":"GN3 2.6.14 (ADS) refers to BS 7671 Table 41.1 for disconnection times; index 'disconnection times'.","w":{"1":"0.1 s is the Table 41.1 TN time for Uo above 400 V; at 230 V TT it's 0.2 s.","0":"0.4 s is the TN value; TT final circuits need 0.2 s.","3":"1 s is for TT distribution circuits, not a 32 A final circuit."}},{"id":"iv1.42","t":"10","c":0,"q":"A measured value of Zs is lower than the value calculated from Ze + (R1 + R2). What is the most likely reason?","s":"","o":["The circuit is overloaded","The test leads were not nulled","Parallel earth paths through bonded metalwork","The instrument is out of calibration"],"a":2,"x":"Fault current can return through other bonded metalwork as well as the cpc, lowering the measured value. Un-nulled leads would make a reading higher, not lower.","r":"","n":"","k":1000041.0,"f":"GN3 2.6.5, 'Parallel earth paths and effects on test readings'; index 'parallel paths'.","w":{"1":"Un-nulled leads add resistance and raise readings; they can't make Zs lower.","3":"Calibration error isn't the usual cause; parallel bonded paths reliably lower measured Zs.","0":"Load doesn't lower loop impedance; parallel earth paths do."}},{"id":"iv1.43","t":"11","c":0,"q":"What is the purpose of determining the prospective fault current at the origin?","s":"","o":["To check the maximum demand","To confirm the protective devices' breaking capacity is greater than the fault current","To confirm the RCD operating time","To find the value of Ze"],"a":1,"x":"Reg 434.5.1: every device that breaks a fault must be rated to break the highest fault current it could see. Check the rated breaking capacity marked on each device.","r":"","n":"","k":1000042.0,"f":"GN3 2.6.16 (Prospective fault current): breaking capacity must be greater than the highest Ipf; index 'prospective fault current'.","w":{"0":"Maximum demand is about load current, not fault current.","3":"Ze is measured separately; PFC is compared with device breaking capacity.","2":"RCD operating time is tested with an RCD tester, not by PFC."}},{"id":"iv1.44","t":"11","c":1,"q":"A single-phase measurement at the origin of a three-phase supply gives a prospective short-circuit current of 1.9 kA. Using the GN3 approximation, what three-phase value is recorded?","s":"","o":["3.3 kA","0.95 kA","3.8 kA","1.9 kA"],"a":2,"x":"GN3 rule of thumb: three-phase PSCC ≈ 2 × the single-phase L–N value.<br>1.9 × 2 = 3.8 kA","r":"","n":"","k":1000043.0,"f":"GN3 2.6.16: three-phase PSCC is approximately twice the single-phase value (rule of thumb); index 'prospective fault current'.","w":{"1":"You halved the value; GN3 says multiply by 2.","3":"1.9 kA is the single-phase value; the three-phase value is larger.","0":"You multiplied by √3 (1.73); GN3's rule of thumb is ×2."}},{"id":"iv1.45","t":"12","c":1,"q":"A 30 mA general-type RCD to BS EN 61008 is tested at 1 × IΔn. What is the maximum operating time?","s":"","o":["500 ms","40 ms","200 ms","300 ms"],"a":3,"x":"BS EN 61008/61009 general type at 1 × IΔn: 300 ms maximum (GN3 Table 2.17). Testing at 5 × IΔn (40 ms) is now optional, for fault-finding only. S-type (time-delayed) at 1 × IΔn: up to 500 ms.","r":"","n":"","k":1000044.0,"f":"GN3 2.6.18, Table 2.17 (Tests for RCDs), 1 × IΔn, non-delay; index 'RCD'.","w":{"1":"40 ms is the 5 × IΔn time, not 1 × IΔn.","2":"200 ms is the BS 4293 / BS 7288:1990 non-delay figure, not BS EN 61008.","0":"500 ms is the S-type (time-delay) maximum, not a general-type RCD."}},{"id":"iv1.46","t":"12","c":1,"q":"A 30 mA RCD is tested at 5 × IΔn. What test current is applied, and what is the maximum operating time?","s":"","o":["150 mA, 40 ms","30 mA, 200 ms","150 mA, 300 ms","60 mA, 40 ms"],"a":0,"x":"5 × 30 mA = 150 mA. A general-type RCD must operate within 40 ms at this current.","r":"","n":"","k":1000045.0,"f":"GN3 2.6.18, Table 2.17b (optional tests): 5 × IΔn, 40 ms non-delay; index 'RCD'.","w":{"2":"The current is right but 300 ms is the 1 × IΔn time; 5 × IΔn must trip in 40 ms.","3":"60 mA is 2 × IΔn; 5 × 30 mA = 150 mA.","1":"30 mA is 1 × IΔn; you didn't multiply by 5."}},{"id":"iv1.47","t":"12","c":0,"q":"When a 30 mA RCD is tested at ½ × IΔn (15 mA), what should happen?","s":"","o":["It should not trip","It should trip only on the negative half-cycle","It should trip within 40 ms","It should trip within 300 ms"],"a":0,"x":"The ½ × IΔn test proves the device is not over-sensitive, so it won't cause unwanted tripping.","r":"","n":"","k":1000046.0,"f":"GN3 2.6.18, Table 2.17a: at ½ × IΔn 'RCD should not trip'; also 4.7 (RCD testers). Index 'RCD'.","w":{"2":"40 ms is the 5 × IΔn time; at half rating it shouldn't trip at all.","3":"300 ms is the 1 × IΔn time; at half rating it shouldn't trip.","1":"Both half-cycles are tested; at ½ × IΔn it shouldn't trip on either."}},{"id":"iv1.48","t":"12","c":0,"q":"What is the purpose of a phase sequence test?","s":"","o":["To confirm three-phase motors will rotate in the intended direction","To confirm single-pole devices are in the line conductor","To measure the voltage between phases","To confirm balanced loading across the phases"],"a":0,"x":"Reg 643.9: for multiphase circuits, phase sequence is maintained. Wrong rotation makes three-phase motors run backwards.","r":"","n":"","k":1000047.0,"f":"GN3 2.6.17 (Phase sequence testing), Reg 643.9 and the phase rotation note; index 'phase sequence'.","w":{"3":"Load balance isn't checked by a phase sequence test.","1":"Single-pole devices in the line conductor is the polarity test (2.6.12).","2":"Measuring voltage between phases doesn't show sequence; the order of the phases is what matters."}},{"id":"iv1.49","t":"13","c":1,"q":"
