direction reverses."}},{"id":"iv3.49","t":"13","c":1,"q":"A 3 kW immersion heater circuit (230 V) has a measured R1 + Rn of 0.42 Ω. What is the voltage drop?","s":"","o":["5.5 V","3.3 V","7.9 V","6.6 V"],"a":3,"x":"Ib = P ÷ V = 3000 ÷ 230 = 13.04 A<br>Vd = Ib × (R1 + Rn) × 1.2<br>13.04 × 0.42 = 5.48<br>5.48 × 1.2 = 6.6 V","r":"","n":"","k":1000248.0,"f":"GN3 2.6.20 (Verification of voltage drop): measured R1 + Rn × full load current, compensated for temperature; index 'voltage drop'.","w":{"1":"You halved the answer; 13.04 × 0.42 × 1.2 = 6.6 V.","0":"5.5 V leaves out the 1.2 temperature factor.","2":"7.9 V applies the 1.2 factor twice."}},{"id":"iv3.50","t":"14","c":0,"q":"A consumer unit is replaced. Which certificate is issued?","s":"","o":["Minor Electrical Installation Works Certificate","Electrical Installation Certificate","Electrical Installation Condition Report","None, as no new circuits are added"],"a":1,"x":"A consumer unit change is new work affecting every circuit. It is certified on an EIC with full schedules.","r":"","n":"","k":1000249.0,"f":"GN3 2.2 (Certificates) and 2.6.2: an MEIWC only where work doesn't extend to a new circuit; index 'EIC'.","w":{"0":"A consumer unit change affects every circuit; it's beyond minor works.","2":"An EICR reports on existing installations; it doesn't certify new work.","3":"Replacing a consumer unit is new work and must be certified."}},{"id":"iv3.51","t":"14","c":0,"q":"Where is the recommended interval to the first periodic inspection recorded?","s":"","o":["On the Minor Works Certificate","On a label on the meter","On the Schedule of Test Results","On the Electrical Installation Certificate"],"a":3,"x":"The EIC includes the designer's recommendation for the interval to the first periodic inspection. A periodic inspection notice is also fixed at the origin.","r":"","n":"","k":1000250.0,"f":"GN3 2.4 (Frequency of subsequent inspections) and Chapter 5 EIC 'Next inspection'; index 'periodic inspection'.","w":{"2":"The Schedule of Test Results holds circuit values, not the next inspection interval.","0":"Minor Works Certificates don't record an interval for a whole installation.","1":"The periodic inspection notice goes at the origin; the interval is recorded on the EIC."}},{"id":"iv3.52","t":"14","c":0,"q":"Which of these would NOT appear on a Schedule of Inspections for initial verification?","s":"","o":["N/A","A C2 classification code","✓","A description of each inspection item"],"a":1,"x":"Classification codes (C1, C2, C3, FI) are only used on an EICR. On initial verification, defects are fixed before the certificate is issued.","r":"","n":"","k":1000251.0,"f":"GN3 Chapter 5 Schedule of Inspections; classification codes are in 3.11 (EICR). Index 'classification codes'.","w":{"2":"✓ is a normal Schedule of Inspections entry.","0":"N/A is a normal Schedule of Inspections entry.","3":"Each inspection item is described on the schedule."}},{"id":"iv3.53","t":"14","c":0,"q":"Besides the inspector, whose signatures does a multiple-signature Electrical Installation Certificate require? (Select TWO)","s":"","o":["The designer","The installer (constructor)","The client","The distribution network operator"],"a":[0,1],"x":"The EIC has three responsibilities: design, construction, and inspection and testing. The client receives it but does not sign it.","r":"","n":"","k":1000252.0,"f":"GN3 2.2 (Certificates): multiple-signature EIC for design, construction and inspection and testing; index 'EIC'.","w":{"2":"The client receives the EIC but doesn't sign it.","3":"The DNO doesn't sign the EIC."}},{"id":"iv3.54","t":"14","c":0,"q":"What is the purpose of the Electrical Installation Certificate?","s":"","o":["To confirm that new work has been designed, constructed, inspected and tested to BS 7671","To notify the electricity supplier","To report on the condition of an existing installation","To record minor works only"],"a":0,"x":"The EIC certifies new work to BS 7671. The EICR reports on the condition of an existing installation.","r":"","n":"","k":1000253.0,"f":"GN3 2.2 (Certificates) and 2.6.2 (Reg 644.1); index 'EIC'.","w":{"2":"Reporting on an existing installation is the EICR's job.","1":"The EIC doesn't notify the supplier.","3":"Minor works use the MEIWC, not the EIC."}},{"id":"iv3.55","t":"5","c":0,"q":"Which instrument and method would you use to test the continuity of a main protective bonding conductor?","s":"","o":["An earth fault loop impedance tester","An RCD tester","An insulation resistance tester at 500 V","A low-resistance ohmmeter with a long (wander) lead"],"a":3,"x":"Null the leads, then measure from the MET to the bonding clamp at the service pipe with the long lead. The result should be very low.","r":"","n":"","k":1000254.0,"f":"GN3 2.6.5, 'Testing bonding conductors and earthing conductors' (test method 2, wandering lead); 4.3. Index 'bonding'.","w":{"2":"Insulation testing at 500 V doesn't measure bonding continuity.","0":"A loop tester is a live test of the fault path, not bonding continuity.","1":"An RCD tester doesn't measure continuity."}}];

// ================= 1. Calculation generator =================
function rint(a,b){return a+Math.floor(Math.random()*(b-a+1))}
function rpick(a){return a[Math.floor(Math.random()*a.length)]}
function r2(x){return Math.round(x*100)/100}
function f2(x){return r2(x).toFixed(2)}
const STD=[1,1.5,2.5,4,6,10,16,25,35,50,70,95,120];
function nextStd(s){return STD.find(v=>v>=s-1e-9)||STD[STD.length-1]}
function prevStd(s){const l=STD.filter(v=>v<s);return l.length?l[l.length-1]:STD[0]}

const REFRE=/^(GN3\s+(?:\d+(?:\.\d+)*|Table\s+\w+(?:\.\w+)?|Appendix\s+[A-D]|App\w*\s+[A-D]))/i;
function refOf(Q){const m=(Q.r||"").trim().match(REFRE);return m?m[1].replace(/\s+/g," "):null}
function findSet(n){
  const pool=QS.filter(q=>refOf(q));if(pool.length<8)return [];const out=[];const used=new Set();
  const allRefs=[...new Set(pool.map(refOf))];let tries=0;
  while(out.length<n&&tries++<500){const q=rpick(pool);if(used.has(q.id))continue;used.add(q.id);
    const ref=refOf(q);let pool2=[...new Set(pool.filter(o=>o.t===q.t&&refOf(o)!==ref).map(refOf))];
    if(pool2.length<3)pool2=pool2.concat(allRefs.filter(r=>r!==ref&&!pool2.includes(r)).sort(()=>Math.random()-.5).slice(0,6));
    const others=[];while(others.length<3&&pool2.length){const r=pool2.splice(Math.floor(Math.random()*pool2.length),1)[0];if(r!==ref&&!others.includes(r))others.push(r)}
    if(others.length<3)continue;
    const opts=[ref,...others];for(let i=3;i>0;i--){const j=Math.floor(Math.random()*(i+1));[opts[i],opts[j]]=[opts[j],opts[i]]}
    out.push({qid:q.id,fact:q.q+" → "+q.o[q.a],o:opts,a:opts.indexOf(ref),f:q.f||""});}
  return out;
}

function today(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function dayDiff(a,b){return Math.round((new Date(b+"T12:00:00")-new Date(a+"T12:00:00"))/864e5)}
function streak(){const d=PR.daily;if(!d||!d.last)return 0;const g=dayDiff(d.last,today());return g<=1?d.streak:0}
function dailyDone(){return PR.daily&&PR.daily.last===today()}
function markDaily(){const t=today(),d=PR.daily||{};if(d.last===t)return;const g=d.last?dayDiff(d.last,t):99;PR.daily={last:t,streak:g===1?(d.streak||0)+1:1}}

  const nextBook=PAPERS.filter(p=>p.group==="book").find(p=>!PR.hist.some(h=>h.pid===p.id));
  const wt=weakTopics().slice(0,2).map(o=>o.t.short), wm=weakMethods().slice(0,1).map(o=>o.m.name.toLowerCase());

// ---------- data ----------
// QS: [{id,t,c,q,o,a,x,r,n,k}]  k = sort key within topic (book order)
// PAPERS: [{id,name,group,blurb,qids}]   TOPICS: [{id,name,where}]
const QI={};QS.forEach(q=>QI[q.id]=q);
const TOPIC_ORDER=TOPICS.map(t=>t.id);
const TP={};TOPICS.forEach((t,i)=>{TP[t.id]=t;t.ord=i});
const BYTOPIC={};QS.forEach(q=>(BYTOPIC[q.t]=BYTOPIC[q.t]||[]).push(q.id));
const SECS_PER_Q=5400/55, PASS_PCT=.6, LETTERS="ABCD", LKEY="gn3-trainer-v1";

// ---------- helpers ----------
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function fmt(s){s=Math.max(0,Math.round(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+":"+String(m).padStart(2,"0"):m)+":"+String(x).padStart(2,"0")}
function bookSort(ids){return ids.slice().sort((a,b)=>TP[QI[a].t].ord-TP[QI[b].t].ord||QI[a].k-QI[b].k)}
function pct(a,b){return b?Math.round(a/b*100):0}
function ago(ts){const d=(Date.now()-ts)/864e5;if(d<1)return "today";if(d<2)return "yesterday";return Math.floor(d)+" days ago"}

// ---------- progress store: this browser always, plus the viewer's own private db doc when available ----------
let PR=blank();
function blank(){return {v:1,updated:0,q:{},hist:[],cur:{},mode:"exam"}}
function loadLocal(){try{const s=JSON.parse(localStorage.getItem(LKEY));if(s&&s.v===1)return s}catch(e){}return null}
let dbRef=null, dbTimer=null, syncState="local";
function persist(){
  PR.updated=Date.now();
  try{localStorage.setItem(LKEY,JSON.stringify(PR))}catch(e){}
  if(dbRef){clearTimeout(dbTimer);dbTimer=setTimeout(()=>{dbRef.set(PR).then(()=>{syncState="synced"},e=>{if(e&&(e.code==="invalid_argument"||e.code==="revoked"||e.code==="not_granted"))dbRef=null;syncState="local"})},1500)}
}
PR=loadLocal()||blank();

// ---------- stats ----------
// PR.q[id] = [attempts, correct, recent "1"/"0" string (last 4), lastTs]
function record(id,ok){
  if(id.startsWith("g:")){const m=id.split(":")[1];PR.cs=PR.cs||{};PR.cs[m]=((PR.cs[m]||"")+(ok?"1":"0")).slice(-20);return}
  const s=PR.q[id]||[0,0,"",0];s[0]++;if(ok)s[1]++;s[2]=(s[2]+(ok?"1":"0")).slice(-4);s[3]=Date.now();PR.q[id]=s;
}
function topicStats(tid){
  const ids=BYTOPIC[tid]||[];let r=0,n=0,seen=0;
  ids.forEach(id=>{const s=PR.q[id];if(!s)return;seen++;for(const c of s[2]){n++;if(c==="1")r++}});
  return {r,n,seen,total:ids.length,acc:n?r/n:null};
}
function level(st){if(st.n<5)return {k:"none",label:"Not enough yet"};if(st.acc>=.8)return {k:"strong",label:"Strong"};if(st.acc>=.6)return {k:"ok",label:"Getting there"};return {k:"weak",label:"Weak"}}
function kindStats(calc){let r=0,n=0;QS.forEach(q=>{if(!!q.c!==calc)return;const s=PR.q[q.id];if(!s)return;for(const c of s[2]){n++;if(c==="1")r++}});return {r,n,acc:n?r/n:null}}
function mistakes(){return QS.filter(q=>{const s=PR.q[q.id];return s&&s[2].slice(-1)==="0"}).map(q=>q.id)}

// ---------- building exams ----------
function weightFor(id,tw){
  const s=PR.q[id];let w;
  if(!s)w=1;else{const last=s[2].slice(-1),last2=s[2].slice(-2);w=last==="0"?3:last2==="11"?.15:.4}
  return w*tw;
}
function topicWeight(tid){const st=topicStats(tid);if(st.n<5)return 1.3;return Math.max(.25,1.7-st.acc*1.5)}
function pick(pool,n,seed){
  const r=rng(seed),tw={};TOPIC_ORDER.forEach(t=>tw[t]=topicWeight(t));
  return pool.map(id=>({id,k:Math.pow(r(),1/Math.max(1e-3,weightFor(id,tw[QI[id].t])))})).sort((a,b)=>b.k-a.k).slice(0,n).map(o=>o.id);
}
function smartList(n){
  const seed=Date.now()%1e9,all=QS.map(q=>q.id);
  // one from each topic first so the exam still spans the book, then fill by weakness
  const first=TOPIC_ORDER.map((t,i)=>pick(BYTOPIC[t]||[],1,seed+i)[0]).filter(Boolean);
  const rest=pick(all.filter(id=>!first.includes(id)),n-first.length,seed+99);
  return bookSort(first.concat(rest).slice(0,n));
}
function weakTopics(){return TOPICS.map(t=>({t,st:topicStats(t.id)})).filter(o=>o.st.n>=5&&o.st.acc<.6).sort((a,b)=>a.st.acc-b.st.acc)}
function weakList(n){
  const w=weakTopics().slice(0,4).map(o=>o.t.id);if(!w.length)return smartList(n);
  const pool=[].concat(...w.map(t=>BYTOPIC[t]));return bookSort(pick(pool,Math.min(n,pool.length),Date.now()%1e9));
}
function topicList(tid,n){return bookSort(pick(BYTOPIC[tid],Math.min(n,BYTOPIC[tid].length),Date.now()%1e9))}

    S={gen,pid:def.id,name:def.name,mode:PR.mode,qids,ans:qids.map(()=>null),flag:qids.map(()=>false),checked:qids.map(()=>false),rec:qids.map(()=>false),cur:0,left:qids.length*SECS_PER_Q,done:false};
    PR.cur[def.id]=S;persist();

const N=()=>S.qids.length, PASSN=()=>Math.ceil(N()*PASS_PCT);
function q(i){return (S.gen&&S.gen[i])||QI[S.qids[i]]}
function corr(Q){return Array.isArray(Q.a)?Q.a:[Q.a]}
function multi(Q){return Array.isArray(Q.a)&&Q.a.length>1}
function sel(i,d){const v=S.ans[i];return Array.isArray(v)?v.includes(d):v===d}
function isRight(i){const Q=q(i),c=corr(Q),v=S.ans[i];if(v==null)return false;const a=Array.isArray(v)?v:[v];return a.length===c.length&&a.every(x=>c.includes(x))}
function answered(i){const v=S.ans[i];if(v==null)return false;return Array.isArray(v)?v.length===corr(q(i)).length:true}

    const w=why(Q);
    return `<div class="card"><div class="row" style="justify-content:space-between"><b>Question ${k+1}</b><span class="tag ${sk?"s":r?"r":"w"}">${sk?"Not answered":r?"Correct":"Wrong"}</span></div><div class="lo">${TP[Q.t].name}${Q.m?` <span class="amd">${Q.m}</span>`:""}</div>
      ${Q.s?`<div class="scenario">${esc(Q.s)}</div>`:""}<div class="stem" style="font-size:16px">${esc(Q.q)}</div><div class="opts">${opts}</div>${w?`<div class="explain ${r?"ok":"no"}">${w}</div>`:""}${r?"":coach(Q,wrongPick(k))}</div>`}).join("")||`<p class="muted">Nothing to show for this filter.</p>`;
  const lost=marksWent(by);
  const nWrong=S.qids.filter((_,k)=>!isRight(k)).length,nFlag=S.flag.filter(Boolean).length;
  app.innerHTML=`<div class="wrap">
    <div class="eyebrow">${esc(S.name)} · ${S.mode==="exam"?"exam mode":"practice mode"}${S.timeUp?" · time ran out":""}</div>
    <h1>Your result</h1>
    <div class="score"><div class="big">${score}<span class="muted" style="font-size:.5em">/${n}</span></div>
      <div><div class="verdict ${pass?"pass":"fail"}">${pass?"PASS":"NOT YET"} · ${p}%</div>
      <div class="muted" style="font-size:14px;margin-top:6px">${pass?`${score-PASSN()} above`:`${PASSN()-score} short of`} the 60% line.${S.mode==="exam"?` Time used ${fmt(n*SECS_PER_Q-S.left)}.`:""}</div></div></div>
    ${lost}
    <div class="panel" style="margin-top:12px"><h3 style="font-size:17px">By topic</h3><p class="note" style="margin:4px 0 6px">The mark on each bar is 60%. Every answer has gone into your progress.</p>${rows}</div>
    <div class="row" style="margin-top:14px"><button class="btn primary" id="prog">See my progress</button>${weakTopics().length?`<button class="btn" data-go="weak">Practise weak areas</button>`:""}</div>
    <div class="row" style="justify-content:space-between;margin-top:22px"><h2>Review</h2>
      <div class="filters"><button class="chip" data-f="wrong" aria-pressed="${reviewFilter==="wrong"}">Wrong (${nWrong})</button><button class="chip" data-f="flag" aria-pressed="${reviewFilter==="flag"}">Flagged (${nFlag})</button><button class="chip" data-f="all" aria-pressed="${reviewFilter==="all"}">All ${n}</button></div></div>
    <div class="review">${items}</div>
    <div class="row" style="margin-top:22px"><button class="btn" id="home">All exams</button></div></div>`;
  app.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{reviewFilter=b.dataset.f;render()});
  app.querySelector("#home").onclick=()=>{view="home";tab="exams";render();window.scrollTo(0,0)};
  app.querySelector("#prog").onclick=()=>{view="home";tab="progress";render();window.scrollTo(0,0)};
  app.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{delete PR.cur[b.dataset.go];start(defFor(b.dataset.go),false)});
}
document.addEventListener("keydown",e=>{
  if(view!=="exam"||confirmOpen)return;const k=e.key.toUpperCase();
  if(k.length===1&&"ABCD".includes(k)){const b=app.querySelector(`[data-o="${"ABCD".indexOf(k)}"]`);if(b&&!b.disabled)b.click()}
  else if(e.key==="ArrowRight"){const n=app.querySelector("#next");n&&n.click()}
  else if(e.key==="ArrowLeft")go(S.cur-1);
});
document.addEventListener("visibilitychange",()=>{if(document.hidden&&S&&!S.done&&view==="exam")save()});
render();

</script>

</body>
</html>
