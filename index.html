be measured before the installation is energised.","r":"GN3 2.6.4","n":"","k":2350,"f":"Section 2.6.4, Figure 2.12, footnote marked * against earth electrode resistance. Index: earth electrode, sequence of tests.","w":{"0":"RCD trip time does not measure Re. Figure 2.12 says the electrode must be measured before energising.","1":"Initial verification needs the electrode measured, before energising, not deferred to periodic inspection.","2":"The figure's footnote requires the electrode, where present, to be measured before energising."}},{"id":"g5.n4.29","t":"4","c":0,"q":"A new multifunction tester arrives with a 'certificate of conformity' instead of a calibration certificate. What does GN3 4.2 say this certificate shows?","o":["The instrument has not been checked and must be calibrated before first use","The instrument meets BS EN 61010 safety only, with no accuracy check","Accuracy was checked during manufacture by the same procedure as calibration, but individual calibration data is not issued","Full individual readings are traceable to UKAS, so it never needs recalibrating"],"a":2,"x":"GN3 4.2: a certificate of conformity may show that the instrument's accuracy was verified during manufacture. That check follows the same procedure as calibration, but individual calibration data is not issued. A calibration certificate may only come if you ask for one.","r":"GN3 4.2","n":"","k":6106,"f":"Chapter 4, Section 4.2 Instrument accuracy, first paragraph. Index: calibration, certificate of conformity.","w":{"0":"GN3 says a certificate of conformity does show accuracy was verified during manufacture.","1":"The certificate of conformity covers accuracy checked in manufacture, not just safety.","3":"No individual data is issued, and every instrument needs recalibrating at intervals."}},{"id":"g5.n4.30","t":"4","c":0,"q":"What test source does GN3 4.3 recommend for a low-resistance ohmmeter used for continuity testing?","o":["No-load voltage between 4 V and 24 V, short-circuit current not less than 200 mA","No-load voltage of 500 V DC, short-circuit current not less than 1 mA","No-load voltage between 4 V and 24 V, short-circuit current not more than 15 mA","No-load voltage between 50 V and 120 V, short-circuit current not less than 10 A"],"a":0,"x":"GN3 4.3: the continuity test current may be AC or DC, ideally from a source with a no-load voltage between 4 V and 24 V and a short-circuit current of at least 200 mA. The range should cover 0.2 Ω to 2 Ω, with a digital resolution of at least 0.01 Ω.","r":"GN3 4.3","n":"","k":6174,"f":"Chapter 4, Section 4.3 Low-resistance ohmmeters. Index: continuity testing, instruments.","w":{"1":"That describes an insulation resistance test at 500 V, not a continuity tester.","2":"About 15 mA is the non-trip loop test current. Continuity needs at least 200 mA.","3":"50 V AC and 120 V DC are the Section 1.1 test-voltage safety thresholds, and 10 A is a loop-test current. Continuity needs 4 V to 24 V and at least 200 mA."}},{"id":"g5.n4.31","t":"4","c":0,"q":"A circuit is protected by an MCB only, with no RCD or RCBO. Which EFLI test method does GN3 4.5 say should be used?","o":["Three-wire non-trip test","Two-wire high-current test","Two-wire non-trip test","Continuity test, then add (R1 + R2) to an assumed Ze of 0.8 Ω"],"a":1,"x":"GN3 4.5: the order of preference is the two-wire high-current test, then the three-wire non-trip test, then the two-wire non-trip test. The high-current test should always be used unless there is an RCD or RCBO in the circuit.","r":"GN3 4.5","n":"","k":6243,"f":"Chapter 4, Section 4.5 EFLI testers, 'Two-wire high current test'. Index: earth fault loop impedance testers.","w":{"0":"Non-trip tests are for circuits with RCDs. Without one, the more accurate high-current test should be used.","2":"GN3 says the two-wire non-trip test is the least accurate and should only be a last resort.","3":"That's an estimate, not an EFLI measurement method from 4.5."}},{"id":"g5.n4.32","t":"4","c":1,"q":"A loop tester derives prospective fault current by dividing the loop impedance into the nominal mains voltage of 230 V. It measures 0.16 Ω. What PFC will it display?","o":["1.44 kA","2.88 kA","1.50 kA","0.04 kA"],"a":0,"x":"GN3 4.5, final paragraph: PFC is calculated by dividing the loop impedance into the nominal mains voltage.<br>I = U ÷ Z = 230 ÷ 0.16 = 1437.5 A ≈ 1.44 kA","r":"GN3 4.5","n":"","k":6330,"f":"Chapter 4, Section 4.5 EFLI testers, final paragraph on prospective fault current. Index: prospective fault current, instruments.","w":{"1":"You doubled it, as for a three-phase estimate. This is a single 230 V measurement.","2":"You used 240 V. The instrument divides the loop impedance into the nominal 230 V.","3":"You multiplied 230 by 0.16. Current = voltage ÷ impedance."}},{"id":"g5.n4.33","t":"4","c":1,"q":"BS EN 61557-7 requires a phase rotation indicator to give an unambiguous indication between 85 % and 110 % of the nominal system voltage. For a 400 V system, what voltage range is that?","o":["380 V to 420 V","360 V to 440 V","340 V to 440 V","340 V to 480 V"],"a":2,"x":"GN3 4.8(a): indication must be unambiguous between 85 % and 110 % of nominal voltage.<br>0.85 × 400 = 340 V<br>1.10 × 400 = 440 V","r":"GN3 4.8","n":"","k":6380,"f":"Chapter 4, Section 4.8 Phase rotation instruments, item (a). Index: phase rotation, BS EN 61557-7.","w":{"0":"You used 95 % to 105 %, which is the frequency band, not the voltage band.","1":"The lower limit is 85 %, so 0.85 × 400 = 340 V, not 90 %.","3":"480 V is 120 %, the no-damage limit, not the indication range."}},{"id":"g5.n4.34","t":"4","c":0,"q":"A thermal imaging survey, done live under a risk assessment, finds a loose termination in a contactor. What does HSR25, as quoted in GN3 4.9, say about repairing it?","o":["Because the survey was justified live, the repair may be done live too","Live testing may be justifiable, but that does not mean the repair can also be done live","Any competent person may repair it live if fused test leads are used","The repair must wait for the next periodic inspection"],"a":1,"x":"GN3 4.9: HSR25 accepts that conductors may sometimes need to be live during testing or diagnosis, but justified live testing does not mean later repair work can also be done live. EAWR Regulations 14 and 16 still apply.","r":"GN3 4.9","n":"","k":6531,"f":"Chapter 4, Section 4.9 Thermographic equipment, paragraph on HSR25. Index: thermography, HSR25, live working.","w":{"0":"HSR25 states the opposite: justified live testing does not justify live repair.","2":"Fused leads are irrelevant to repair work. The repair must be justified separately, normally dead.","3":"GN3 does not say to defer it. The repair should be done safely, normally dead."}},{"id":"g1.n5.00","t":"5","c":0,"q":"When carrying out continuity test method 1 on a radial circuit, a temporary shorting link is fitted between the line conductor and the protective conductor at the distribution board. What does the reading taken between line and earth at each outlet measure?","o":["R2 only, the cpc resistance","(R1 + R2), the line conductor plus the cpc","(R1 + Rn), the line plus the neutral","(r1 + r2)/4, as for a ring"],"a":1,"x":"Test method 1 links line to cpc at the board, so the instrument reads round the loop of line conductor plus cpc: (R1 + R2). Added to Ze this gives the circuit's EFLI. GN3 2.6.5, test method 1.","r":"GN3 2.6.5","n":"","k":2411,"f":"Chapter 2, Section 2.6.5 'Continuity of protective conductors', test method 1 and Figure 2.13. Index: 'continuity of protective conductors, test method 1'.","w":{"0":"R2 alone is what the wandering lead (test method 2) measures, not the shorted-link method.","2":"Line plus neutral would need a line-neutral link; method 1 links line to cpc.","3":"Dividing by four applies to cross-connected ring final circuits (step 3), not a radial with a single link."}},{"id":"g1.n5.01","t":"5","c":1,"q":"A new radial circuit is wired in 2.5 mm²/1.5 mm² copper flat twin and cpc cable, with a route length of 32 m. Using GN3 Table B1, what is the expected (R1 + R2) at 20 °C?","o":["0.24 Ω","0.39 Ω","0.47 Ω","0.62 Ω"],"a":3,"x":"Table B1: 2.5/1.5 copper (R1 + R2) = 19.51 mΩ/m<br>R1 + R2 = 32 × 19.51 / 1000<br>= 624.3 / 1000 = 0.62 Ω. GN3 2.6.5, expected results for test method 1.","r":"GN3 2.6.5","n":"","k":2493,"f":"Appendix B, Table B1 'Values of resistance/metre ... (R1 + R2) per metre', row 2.5 line / 1.5 protective. The worked 55 m example is under Section 2.6.5 test method 1. Index: 'resistance of copper conductors'.","w":{"0":"You used 7.41 mΩ/m for the 2.5 mm² line only, leaving out the cpc.","1":"You used 12.10 mΩ/m for the 1.5 mm² cpc only, leaving out the line conductor.","2":"You used 14.82 mΩ/m, the 2.5/2.5 combination, but the cpc is 1.5 mm²."}},{"id":"g1.n5.02","t":"5","c":1,"q":"Using test method 2, an electrician forgets to null the instrument. The reading from the MET to the cpc at a luminaire is 1.38 Ω. The wandering lead and test leads together measure 0.86 Ω. What is the cpc resistance R2?","o":["0.52 Ω","1.38 Ω","2.24 Ω","0.26 Ω"],"a":0,"x":"The wandering lead and test leads are in series with the cpc, so their resistance must be deducted (or auto-nulled).<br>R2 = 1.38 − 0.86<br>= 0.52 Ω. GN3 2.6.5, test method 2.","r":"GN3 2.6.5","n":"","k":2506,"f":"Section 2.6.5, 'Test method 2 (for circuits)', Figure 2.15 — note on measuring and deducting the lead resistance. Index: 'wandering lead' or 'test method 2'.","w":{"1":"That is the raw reading; the lead resistance has not been deducted.","2":"You added the lead resistance instead of subtracting it.","3":"You halved the result as if the cpc were measured twice; method 2 reads it once."}},{"id":"g1.n5.03","t":"6","c":1,"q":"Step 1 of a ring final circuit test in 2.5 mm²/1.5 mm² cable gives end-to-end line resistance r1 = 0.48 Ω. What end-to-end cpc resistance r2 should be expected?","o":["0.29 Ω","0.48 Ω","0.80 Ω","0.96 Ω"],"a":2,"x":"r2 = (csa line ÷ csa cpc) × r1<br>= (2.5 ÷ 1.5) × 0.48<br>= 1.67 × 0.48 = 0.80 Ω. GN3 2.6.6, step 1.","r":"GN3 2.6.6","n":"","k":2639,"f":"Section 2.6.6 'Continuity of ring final circuit conductors', step 1, the r2 = (csa line/csa cpc) × r1 formula with the 2.5/1.5 example (×1.67). Index: 'ring final circuit conductors'.","w":{"0":"You multiplied by 1.5/2.5 — the ratio upside down. A smaller cpc has higher resistance.","1":"Equal to r1 only applies when the cpc is the same csa as the line.","3":"You doubled r1; the multiplier is csa line ÷ csa cpc = 1.67, not 2."}},{"id":"g1.n5.04","t":"6","c":1,"q":"Step 1 on a ring with 2.5 mm² line and neutral gives r1 = 0.62 Ω and rn = 0.62 Ω. After cross-connecting line and neutral for step 2, what reading should be expected at each socket-outlet on the ring?","o":["0.31 Ω","0.62 Ω","1.24 Ω","0.41 Ω"],"a":0,"x":"Step 2 reading = (r1 + rn) / 4<br>= (0.62 + 0.62) / 4<br>= 1.24 / 4 = 0.31 Ω. GN3 2.6.6, step 2 and Figure 2.19.","r":"GN3 2.6.6","n":"","k":2662,"f":"Section 2.6.6, step 2, Figure 2.18 connections and Figure 2.19 'Mathematical explanation for step 2'. Index: 'ring final circuit conductors'.","w":{"1":"That's r1 alone; the cross-connected ring reads a quarter of (r1 + rn).","2":"That's (r1 + rn) undivided — you forgot to divide by 4.","3":"You divided by 3; the parallel paths give one quarter of (r1 + rn)."}},{"id":"g1.n5.05","t":"6","c":0,"q":"During step 3 of a ring final circuit test, line–cpc readings are taken at every socket-outlet. Which value is recorded as the circuit's (R1 + R2) on the Schedule of Test Results?","o":["The lowest value, at the origin","The average of all the readings","The end-to-end r2 value from step 1","The highest value recorded"],"a":3,"x":"The highest value recorded in step 3 represents the maximum (R1 + R2) of the circuit and is recorded; it is then used to find Zs. GN3 2.6.6, step 3.","r":"GN3 2.6.6","n":"","k":2746,"f":"Section 2.6.6, step 3, the paragraph after items (a) and (b) on Figure 2.20. Index: 'ring final circuit conductors'.","w":{"0":"The lowest reading is near the origin; recording it would understate R1 + R2 and Zs.","1":"GN3 asks for the highest value, as that gives the worst-case Zs, not an average.","2":"r2 is the cpc loop alone, not the line-cpc reading at an outlet."}},{"id":"g2.n5.06","t":"5","c":0,"q":"An installation is wired in steel conduit and trunking with accessory boxes fixed to metal stud walls. What effect do these parallel earth paths have on the measured protective conductor continuity?","o":["The reading increases because the extra metalwork adds resistance","There is no effect once the test leads are nulled","The measured value tends towards zero","It only affects insulation resistance readings, not continuity"],"a":2,"x":"Parallel return paths through conduit, trunking, metal-sheathed cable, metal studs and similar put resistance in parallel with the cpc, so the measured R2 tends towards zero. GN3 2.6.5, 'Parallel earth paths'.","r":"GN3 2.6.5","n":"","k":2405,"f":"Section 2.6.5, sub-heading 'Parallel earth paths and effects on test readings'. Index: 'parallel paths'.","w":{"0":"Parallel paths add routes in parallel, which lowers resistance; they do not add in series.","1":"Nulling removes lead resistance only; it cannot remove parallel paths through the building.","3":"GN3 warns specifically that parallel paths affect continuity readings."}},{"id":"g2.n5.07","t":"5","c":1,"q":"Using the wandering lead method (nulled), an electrician tests a 2.5 mm² single-core copper cpc in PVC conduit (no parallel earth paths). The run to the furthest point is 38 m. Using Table B1, what reading should be expected at 20 °C?","o":["0.46 Ω","0.28 Ω","0.56 Ω","0.74 Ω"],"a":1,"x":"Method 2 measures R2 only.<br>Table B1: 2.5 mm² copper = 7.41 mΩ/m<br>R2 = 38 × 7.41 / 1000<br>= 281.6 / 1000 = 0.28 Ω. GN3 2.6.5, expected results for test method 2.","r":"GN3 2.6.5","n":"","k":2536,"f":"Section 2.6.5, 'Expected results for test method 2' (55 m example), with Appendix B Table B1, single 2.5 mm² row. Index: 'test method 2'.","w":{"0":"You used 12.10 mΩ/m, the value for a 1.5 mm² conductor.","2":"You used 14.82 mΩ/m, the 2.5/2.5 (R1 + R2) pair; method 2 measures R2 only.","3":"You used 19.51 mΩ/m, the 2.5/1.5 (R1 + R2) value; method 2 reads only the cpc."}},{"id":"g2.n5.08","t":"5","c":0,"q":"When testing main protective bonding where the expected resistance is less than 0.1 Ω (including contact resistances), what does GN3 give as a guideline acceptable reading?","o":["A value not exceeding 0.05 Ω","A value not exceeding 0.5 Ω","A value not exceeding 1 Ω","A value not exceeding 0.1 Ω"],"a":3,"x":"Because instrument resolution may not give an accurate reading at such low values, where the expected resistance is under 0.1 Ω a value not exceeding 0.1 Ω is used as a guideline acceptable reading. GN3 2.6.5, testing bonding conductors.","r":"GN3 2.6.5","n":"","k":2562,"f":"Section 2.6.5, 'Testing bonding conductors and earthing conductors'. Index: 'bonding' or 'main protective bonding conductors'.","w":{"0":"0.05 Ω is the figure readings across clamp joints should approach, not the guideline maximum.","1":"0.5 Ω is far too high for a short bonding conductor; that's nearer a circuit R2 value.","2":"1 Ω is not a GN3 bonding guideline; it would hide a poor bond."}},{"id":"g2.n5.09","t":"6","c":1,"q":"A ring final circuit is wired in 4.0 mm²/1.5 mm² cable. Step 1 gives r1 = 0.30 Ω. Using the GN3 csa ratio, what r2 should be expected?","o":["0.80 Ω","0.50 Ω","0.11 Ω","0.30 Ω"],"a":0,"x":"r2 = (csa line ÷ csa cpc) × r1<br>= (4.0 ÷ 1.5) × 0.30<br>= 2.67 × 0.30 = 0.80 Ω. GN3 2.6.6, step 1.","r":"GN3 2.6.6","n":"","k":2632,"f":"Section 2.6.6, step 1, the formula r2 = (csa line/csa cpc) × r1 following Figure 2.17. Index: 'ring final circuit conductors'.","w":{"1":"You used the 2.5/1.5 multiplier of 1.67; for 4.0/1.5 it is 4.0 ÷ 1.5 = 2.67.","2":"You multiplied by 1.5/4.0, the ratio upside down.","3":"r2 equals r1 only when the cpc is the same csa as the line."}},{"id":"g2.n5.10","t":"6","c":1,"q":"Step 1 on a 2.5 mm²/1.5 mm² ring gives r1 = 0.54 Ω and r2 = 0.90 Ω. After step 3 cross-connection, what is the approximate maximum reading expected at the mid-point of the ring?","o":["0.72 Ω","0.36 Ω","0.27 Ω","1.44 Ω"],"a":1,"x":"Step 3 maximum ≈ (r1 + r2) / 4<br>= (0.54 + 0.90) / 4<br>= 1.44 / 4 = 0.36 Ω. GN3 2.6.6, step 3 (b).","r":"GN3 2.6.6","n":"","k":2734,"f":"Section 2.6.6, step 3, items (a) and (b) following Figure 2.20. Index: 'ring final circuit conductors'.","w":{"0":"You divided (r1 + r2) by 2 instead of 4.","2":"You used r1 twice, (0.54 + 0.54)/4; step 3 uses the line plus cpc loops.","3":"That's (r1 + r2) undivided — you forgot to divide by 4."}},{"id":"g2.n5.11","t":"6","c":0,"q":"Using GN3 Table 2.8(b), what maximum step 3 reading is expected on a 32 A ring final circuit wired in 4.0 mm² live conductors with a 1.5 mm² cpc, total ring length 100 m?","o":["0.33 Ω","0.49 Ω","0.42 Ω","0.46 Ω"],"a":2,"x":"Table 2.8(b), 4.0 mm² live/1.5 mm² cpc, 100 m row: minimum 0.33 Ω, maximum 0.42 Ω. The maximum occurs at the mid-point of the ring. GN3 2.6.6, Table 2.8.","r":"GN3 2.6.6","n":"","k":2801,"f":"Section 2.6.6, Table 2.8 'Variation in reading during tests around the ring in Step 3', part b 'By length'. Index: 'ring final circuit conductors' / Table 2.8.","w":{"0":"That's the minimum reading for 4.0/1.5 at 100 m, not the maximum.","1":"That's the maximum for 2.5/1.5 cable at 100 m — wrong column.","3":"That's the minimum for 2.5/1.5 cable at 100 m — wrong column."}},{"id":"g3.n5.12","t":"5","c":0,"q":"A lighting circuit has a dimmer that goes open-circuit when the AC supply is removed, so (R1 + R2) cannot be measured through it. What does GN3's alternative test method 1 approach measure instead?","o":["(Rn + R2), with the temporary link between neutral and cpc","(R1 + R2) through the dimmer's internal circuit","(R1 + Rn), with line linked to neutral","(r1 + rn)/4, as for ring step 2"],"a":0,"x":"Figure 2.14 shows an alternative to test method 1 for circuits downstream of electronic control devices: the link goes between neutral and cpc, so the test measures (Rn + R2) instead of (R1 + R2). GN3 2.6.5.","r":"GN3 2.6.5","n":"","k":2453,"f":"Section 2.6.5, Figure 2.14 'Alternative approach for testing continuity of protective conductors: test method 1 ... downstream of electronic control devices'. Index: 'electronic equipment' or 'test method 1'.","w":{"1":"The point is that the dimmer is open-circuit with power removed, so line cannot be read through it.","2":"Line–neutral misses the cpc entirely; the test is to prove the protective conductor.","3":"Divide-by-four applies to cross-connected rings, not a radial lighting circuit."}},{"id":"g3.n5.13","t":"5","c":1,"q":"A single-core 10 mm² copper main protective bonding conductor runs 20 m from the MET to the gas pipe. Using Table B1, what is its approximate resistance at 20 °C?","o":["0.37 Ω","0.07 Ω","0.06 Ω","0.04 Ω"],"a":3,"x":"Table B1: 10 mm² copper = 1.83 mΩ/m<br>R = 20 × 1.83 / 1000<br>= 36.6 / 1000 = 0.04 Ω. GN3 2.6.5 (testing bonding conductors) notes 25 m of 10 mm² is about 0.05 Ω.","r":"GN3 2.6.5","n":"","k":2559,"f":"Section 2.6.5, 'Testing bonding conductors and earthing conductors', and Appendix B Table B1, single 10 mm² row. Index: 'bonding' / 'resistance of copper conductors'.","w":{"0":"You divided 36.6 by 100 instead of 1000 when converting mΩ to Ω.","1":"You used 3.66 mΩ/m, the 10/10 (R1 + R2) pair; a single bonding conductor is 1.83 mΩ/m.","2":"You used 3.08 mΩ/m, the value for 6 mm², not 10 mm²."}},{"id":"g3.n5.14","t":"6","c":0,"q":"Step 1 on a 2.5 mm² ring final circuit gives r1 and rn readings well below the value expected from the cable length. What does GN3 say this would suggest?","o":["A high-resistance termination somewhere in the ring","A socket-outlet has been wired as a spur","The ring is incorrectly configured, possibly a figure of eight","The test leads were not nulled"],"a":2,"x":"Readings lower than the expected resistance suggest the ring is incorrectly configured, possibly as a 'figure of eight'; step 2 can confirm it. Higher readings suggest a termination problem. GN3 2.6.6, step 1 (a).","r":"GN3 2.6.6","n":"","k":2642,"f":"Section 2.6.6, step 1, 'If the resistance readings are not as expected' items (a) and (b). Index: 'ring final circuit conductors'.","w":{"0":"A poor termination gives readings higher than expected, not lower.","1":"Spurs show up as higher readings at those outlets in steps 2 and 3, not low end-to-end readings.","3":"Un-nulled leads add resistance, making readings higher, not lower."}},{"id":"g3.n5.15","t":"6","c":1,"q":"In step 2 of a ring test, the line–neutral readings at every socket-outlet are 0.24 Ω. The line and neutral are the same csa. What end-to-end resistance r1 would you expect to have measured in step 1?","o":["0.24 Ω","0.48 Ω","0.96 Ω","0.12 Ω"],"a":1,"x":"Step 2 = (r1 + rn)/4, so r1 + rn = 4 × 0.24 = 0.96 Ω<br>r1 = rn (same csa)<br>r1 = 0.96 / 2 = 0.48 Ω. GN3 2.6.6, Figure 2.19.","r":"GN3 2.6.6","n":"","k":2719,"f":"Section 2.6.6, Figure 2.19 'Mathematical explanation for step 2', summary (r1 + rn)/4. Index: 'ring final circuit conductors'.","w":{"0":"You took the step 2 reading as r1; it's a quarter of (r1 + rn).","2":"That's (r1 + rn) combined; with equal conductors r1 is half of it.","3":"You halved the step 2 reading instead of multiplying by four."}},{"id":"g3.n5.16","t":"6","c":1,"q":"On a ring in 2.5 mm²/1.5 mm² twin and cpc cable, the highest step 3 reading at the mid-point is 0.40 Ω. Using GN3 Table 2.8(a), what is the approximate lowest reading expected near the origin?","o":["0.20 Ω","0.24 Ω","0.32 Ω","0.38 Ω"],"a":3,"x":"Table 2.8(a), 2.5 mm² live/1.5 mm² cpc: lowest ≈ 0.94 × highest (6 % difference)<br>0.94 × 0.40 = 0.376<br>≈ 0.38 Ω. GN3 2.6.6, Table 2.8.","r":"GN3 2.6.6","n":"","k":2764,"f":"Section 2.6.6, Table 2.8 part a 'General case', row 2.5 mm² live, 1.5 mm² cpc. Index: 'ring final circuit conductors' / Table 2.8.","w":{"0":"You halved the highest reading; Table 2.8 gives only about 6 % difference for 2.5/1.5.","1":"You multiplied by 1.5/2.5 (the csa ratio); Table 2.8 gives 0.94 × highest.","2":"You used 0.80 ×, the 4.0/1.5 factor (20 % difference), not 0.94 ×."}},{"id":"g3.n5.17","t":"10","c":1,"q":"A radial circuit in 2.5 mm²/1.5 mm² copper cable gives a nulled (R1 + R2) reading of 0.68 Ω at about 20 °C, with no parallel paths. Using Table B1, approximately how long is the circuit?","o":["35 m","92 m","46 m","13 m"],"a":0,"x":"L = (R × 1000) / (mΩ/m)<br>= (0.68 × 1000) / 19.51<br>= 680 / 19.51 = 34.9 ≈ 35 m. GN3 Appendix B formula below Table B2.","r":"GN3 App B","n":"","k":8207,"f":"Appendix B, the two formulae under Table B2 ('To assist anyone using Table B1'), L = R × 1000 ÷ mΩ/m. Index: 'resistance of copper conductors'.","w":{"1":"You divided by 7.41 mΩ/m, the line conductor only; (R1 + R2) needs the pair value 19.51.","2":"You divided by 14.82 mΩ/m, the 2.5/2.5 pair; the cpc is 1.5 mm².","3":"You multiplied 0.68 by 19.51 instead of dividing."}},{"id":"g4.n5.18","t":"5","c":0,"q":"Test method 1 is used on an all-insulated radial circuit with several outlets. Which (R1 + R2) reading does GN3 say it is important to record?","o":["The lowest reading obtained at any outlet","The value at the circuit's extremity, furthest from the distribution board","The average of all outlet readings","The reading at the first outlet on the circuit"],"a":1,"x":"It is important to record the (R1 + R2) value obtained at the circuit's extremity, the furthest circuit distance from the distribution board. GN3 2.6.5, test method 1.","r":"GN3 2.6.5","n":"","k":2422,"f":"Section 2.6.5, 'Test method 1 (for circuits)', paragraph before Figure 2.13. Index: 'continuity of protective conductors, test method 1'.","w":{"0":"The lowest reading is near the board and would understate Zs.","2":"GN3 wants the extremity value, the worst case, not an average.","3":"The first outlet is nearest the board, so it gives the smallest (R1 + R2)."}},{"id":"g4.n5.19","t":"5","c":0,"q":"Test method 2 has one instrument lead connected to the distribution board earth terminal via a wandering lead. What value does this test measure and record on the Schedule of Test Results?","o":["(R1 + R2)","R1, the resistance of the line conductor","R2, the resistance of the cpc","Ze, the external earth fault loop impedance"],"a":2,"x":"With the wandering lead from the board earth terminal and the probe on the cpc at each point, the test measures R2, which is recorded. GN3 2.6.5, test method 2.","r":"GN3 2.6.5","n":"","k":2509,"f":"Section 2.6.5, 'Test method 2 (for circuits)' and Figure 2.15. Index: 'wandering lead' or 'test method 2'.","w":{"0":"(R1 + R2) is measured with test method 1 using a line–cpc link.","1":"The wandering lead is clipped to earth and the probe touches the cpc; line conductor is not in the loop.","3":"Ze is a live loop impedance test at the origin, not a dead continuity test."}},{"id":"g4.n5.20","t":"6","c":1,"q":"A new ring final circuit in 2.5 mm²/1.5 mm² cable has a total ring length of 52 m. Using Table B1, what end-to-end line resistance r1 would you expect at 20 °C?","o":["0.39 Ω","0.63 Ω","0.10 Ω","1.01 Ω"],"a":0,"x":"Table B1: 2.5 mm² copper = 7.41 mΩ/m<br>r1 = 52 × 7.41 / 1000<br>= 385.3 / 1000 = 0.39 Ω. GN3 2.6.6, step 1 'expected resistance'.","r":"GN3 2.6.6","n":"","k":2648,"f":"Section 2.6.6, step 1, the paragraph on 'expected resistance', which points to Table B1 in Appendix B. Index: 'ring final circuit conductors'.","w":{"1":"You used 12.10 mΩ/m, the 1.5 mm² value — that's the expected r2, not r1.","2":"You divided by 4; that's for step 2/3 readings, not the step 1 end-to-end value.","3":"You used 19.51 mΩ/m, the (R1 + R2) pair; r1 is the line conductor only."}},{"id":"g4.n5.21","t":"6","c":0,"q":"How are the open ends of the ring connected for step 2 of the ring final circuit test?","o":["Line to neutral of the same end of the ring","Line and cpc of both ends cross-connected","Both lines together, and both neutrals together","Outgoing line to returning neutral, and returning line to outgoing neutral"],"a":3,"x":"In step 2 the outgoing line is connected to the returning neutral, and vice versa, so a quarter of (r1 + rn) is read at each outlet. GN3 2.6.6, step 2, Figure 2.18.","r":"GN3 2.6.6","n":"","k":2651,"f":"Section 2.6.6, step 2 and Figure 2.18 'Connections for ring final circuit continuity testing: step 2'. Index: 'ring final circuit conductors'.","w":{"0":"Joining the same end gives readings that rise to the mid-point — the fault GN3 warns about.","1":"Line–cpc cross-connection is step 3, not step 2.","2":"That just re-makes the ring at the board; it doesn't cross-connect line and neutral."}},{"id":"g4.n5.22","t":"6","c":1,"q":"On a ring final circuit, the step 3 reading at a ring socket-outlet is 0.30 Ω. A further socket-outlet is fed from it by a 7 m spur of 2.5 mm²/1.5 mm² cable. Using Table B1, what (R1 + R2) should be expected at the spur socket-outlet?","o":["0.35 Ω","0.33 Ω","0.44 Ω","0.57 Ω"],"a":2,"x":"Spur (R1 + R2) = 7 × 19.51 / 1000 = 0.137 Ω<br>At spur outlet = 0.30 + 0.137<br>= 0.437 ≈ 0.44 Ω. GN3 2.6.6, step 3: spurs read higher.","r":"GN3 2.6.6","n":"","k":2745,"f":"Section 2.6.6, step 3, the sentence on accessories wired as spurs, with Appendix B Table B1 2.5/1.5 row. Index: 'ring final circuit conductors' / 'spurs'.","w":{"0":"You added 7 × 7.41 mΩ/m, the line conductor only; the spur adds line and cpc.","1":"You divided the spur resistance by 4; the spur is a single radial leg, not part of the ring.","3":"You doubled the spur resistance; 19.51 mΩ/m already includes both line and cpc."}},{"id":"g4.n5.23","t":"10","c":1,"q":"A 45 m radial in 2.5 mm²/1.5 mm² copper cable is tested at an ambient temperature of 30 °C. Using Table B1 and the Table B2 correction formula 1 + 0.004 (ambient − 20 °C), what (R1 + R2) is expected?","o":["0.88 Ω","0.91 Ω","1.05 Ω","0.84 Ω"],"a":1,"x":"R at 20 °C = 45 × 19.51 / 1000 = 0.878 Ω<br>Factor = 1 + 0.004 × (30 − 20) = 1.04<br>0.878 × 1.04 = 0.913 ≈ 0.91 Ω. GN3 Appendix B, Table B2.","r":"GN3 App B","n":"","k":8200,"f":"Appendix B, Table B2 'Ambient temperature multipliers (a) to Table B1' and its note giving the formula. Index: 'temperature correction' / 'resistance of copper conductors'.","w":{"0":"That's the 20 °C value; you didn't apply the ambient correction.","2":"You used the Table B3 factor 1.20 (operating temperature), not the test ambient factor.","3":"You divided by 1.04 instead of multiplying; resistance rises with temperature."}},{"id":"g5.n5.24","t":"5","c":0,"q":"Bonding clamps on a water pipe have been built in and the connection cannot be seen. How does GN3 suggest checking that the clamp makes a good connection to the pipe?","o":["Measure from the MET to the clamp and accept anything up to 0.05 Ω","Insulation-test between clamp and pipe at 500 V","Disconnect the bonding conductor and test between clamp and pipe with a socket tester","Compare the reading at the clamp terminal with a reading on the pipe 0.5 m to 1 m away; they should be roughly the same"],"a":3,"x":"Test at the bonding conductor termination, then on the extraneous-conductive-part about 0.5 m to 1 m from the clamp; roughly equal readings show a good clamp-to-pipe connection. GN3 2.6.5, Figure 2.16.","r":"GN3 2.6.5","n":"","k":2590,"f":"Section 2.6.5, Figure 2.16 'Example of testing the effectiveness of a bonding clamp'. Index: 'bonding' or 'bonding clamp'.","w":{"0":"Reading only to the clamp terminal doesn't prove the clamp makes contact with the pipe.","1":"An insulation test proves separation, not a low-resistance connection.","2":"A socket tester can't measure low resistance; GN3 uses a low-resistance ohmmeter."}},{"id":"g5.n5.25","t":"6","c":0,"q":"A ring in single-core cables is tested at step 2. The line–neutral readings rise steadily towards the mid-point of the ring and then fall again towards the other end. What does GN3 say this indicates?","o":["The line and neutral of the same end were connected, not opposite ends","A socket-outlet wired as a spur at the mid-point","A figure-of-eight interconnection","Normal behaviour for a reduced-csa cpc"],"a":0,"x":"With single-core cables, if line and neutral of the same end are joined, readings increase towards the mid-point and decrease again. GN3 2.6.6, step 2 note.","r":"GN3 2.6.6","n":"","k":2667,"f":"Section 2.6.6, step 2, the 'Note: Where single-core cables are used...'. Index: 'ring final circuit conductors'.","w":{"1":"A spur gives one higher reading at that outlet only, not a steady rise and fall.","2":"A figure of eight shows up as low end-to-end readings in step 1.","3":"That rise-and-fall is normal in step 3 with a reduced cpc, not in step 2 line–neutral."}},{"id":"g5.n5.26","t":"6","c":1,"q":"A ring final circuit's highest step 3 reading is 0.36 Ω. Ze at the origin is 0.35 Ω. What is the circuit's earth fault loop impedance Zs, calculated from these values?","o":["0.44 Ω","0.71 Ω","1.79 Ω","0.78 Ω"],"a":1,"x":"The highest step 3 value is the circuit's (R1 + R2)<br>Zs = Ze + (R1 + R2)<br>= 0.35 + 0.36 = 0.71 Ω. GN3 2.6.6, step 3.","r":"GN3 2.6.6","n":"","k":2748,"f":"Section 2.6.6, step 3, paragraph after items (a) and (b), and Appendix B Zs = Ze + R1 + R2. Index: 'earth fault loop impedance'.","w":{"0":"You divided the step 3 reading by 4 again; it is already (R1 + R2).","2":"You multiplied the step 3 reading by 4; it is already (R1 + R2).","3":"You applied the Table B3 factor 1.20 to a measured value; Zs = Ze + measured (R1 + R2)."}},{"id":"g5.n5.27","t":"6","c":0,"q":"GN3 warns that supplementary protective equipotential bonding may affect step 3 continuity readings. Which circuit is given as an example of one that may be affected?","o":["A final circuit supplying an electric shower","A bedroom lighting circuit","A doorbell transformer circuit","A smoke alarm circuit"],"a":0,"x":"Supplementary bonding may affect step 3 readings; examples are distribution circuits and final circuits supplying central heating systems, electric showers or water heaters. GN3 2.6.6, step 3.","r":"GN3 2.6.6","n":"","k":2753,"f":"Section 2.6.6, step 3, paragraph next to Regulations 411.3.2.5/419.3 on parallel paths. Index: 'supplementary bonding'.","w":{"1":"A lighting circuit is not one GN3 lists; showers, water heaters and central heating are.","2":"Not a GN3 example; it doesn't usually connect to bonded pipework.","3":"Not a GN3 example; it doesn't usually connect to bonded pipework."}},{"id":"g5.n5.28","t":"10","c":1,"q":"Test method 1 gives (R1 + R2) = 0.78 Ω on a radial circuit in 2.5 mm²/1.5 mm² copper cable. Using the Table B1 values, approximately how much of this is the cpc resistance R2?","o":["0.30 Ω","0.39 Ω","0.48 Ω","0.78 Ω"],"a":2,"x":"Table B1: 2.5 = 7.41, 1.5 = 12.10, pair = 19.51 mΩ/m<br>R2 = 0.78 × 12.10 / 19.51<br>= 0.78 × 0.620 = 0.48 Ω. GN3 Appendix B, Table B1.","r":"GN3 App B","n":"","k":8162,"f":"Appendix B, Table B1, single-conductor rows for 2.5 mm² and 1.5 mm² and the 2.5/1.5 pair row. Index: 'resistance of copper conductors'.","w":{"0":"That's the line conductor share (7.41/19.51); the smaller cpc has the larger share.","1":"You split it equally; the 1.5 mm² cpc has higher resistance than the 2.5 mm² line.","3":"That's the total (R1 + R2), not the cpc part."}},{"id":"g5.n5.29","t":"10","c":1,"q":"A ring has a measured (R1 + R2) of 0.55 Ω at 20 °C. It is wired in 70 °C thermoplastic twin and cpc cable. Using Table B3, what is (R1 + R2) at maximum operating temperature?","o":["0.57 Ω","0.69 Ω","0.46 Ω","0.66 Ω"],"a":3,"x":"Table B3: incorporated in a cable, 70 °C thermoplastic, F = 1.20<br>0.55 × 1.20<br>= 0.66 Ω. GN3 Appendix B, Table B3.","r":"GN3 App B","n":"","k":8234,"f":"Appendix B, Table B3 'Conductor temperature factor F for standard devices', row 'Incorporated in a cable or bunched'. Index: 'temperature correction' / 'resistance of copper conductors'.","w":{"0":"You used 1.04, the factor for a conductor not in a cable or bunched.","1":"You used 1.26, the 85 °C thermosetting factor, but this cable is 70 °C thermoplastic.","2":"You divided by 1.20 instead of multiplying; resistance rises with temperature."}},{"id":"g1.n6.00","t":"7","c":0,"q":"A new 230 V single-phase final circuit (not SELV, PELV or FELV) is insulation resistance tested before any equipment is connected. What DC test voltage and minimum insulation resistance apply?","o":["500 V DC, 1.0 MΩ","250 V DC, 0.5 MΩ","1000 V DC, 1.0 MΩ","500 V DC, 0.5 MΩ"],"a":0,"x":"Table 2.9 (BS 7671 Table 64): circuits up to and including 500 V (except SELV/PELV, but including FELV) are tested at 500 V DC with a minimum of 1.0 MΩ. GN3 2.6.7.","r":"GN3 2.6.7","n":"","k":2885,"f":"GN3 Chapter 2, Section 2.6.7, Table 2.9 (reproduces BS 7671 Table 64). Index: 'Insulation resistance'.","w":{"1":"That's the SELV and PELV row of Table 2.9, not a 230 V circuit.","2":"1000 V is only for circuits above 500 V; 230 V is in the 'up to 500 V' band.","3":"Right voltage but 0.5 MΩ is the old/SELV minimum; Table 2.9 now requires 1.0 MΩ."}},{"id":"g1.n6.01","t":"7","c":1,"q":"A consumer unit is tested as a whole (L+N to E, 500 V). Tested individually, the three circuits gave 200 MΩ, 100 MΩ and 50 MΩ. What would the whole-board reading be, to one decimal place?","o":["350 MΩ","116.7 MΩ","28.6 MΩ","50.0 MΩ"],"a":2,"x":"Circuits tested together are in parallel, so 1/Rt = 1/R1 + 1/R2 + 1/R3 (GN3 2.6.7, whole installation test).<br>1/Rt = 1/200 + 1/100 + 1/50<br>= 0.005 + 0.01 + 0.02 = 0.035<br>Rt = 1 ÷ 0.035 = 28.6 MΩ","r":"GN3 2.6.7","n":"","k":2899,"f":"GN3 Section 2.6.7, 'Simple installations ... tested as a whole' and Figure 2.21; index 'Insulation resistance'.","w":{"0":"You added the values; insulation resistances of circuits in parallel combine as reciprocals.","1":"That's the average of the three readings, not the parallel combination.","3":"Parallel resistance is always lower than the lowest branch, so it can't equal 50 MΩ."}},{"id":"g1.n6.02","t":"7","c":0,"q":"A SELV circuit is being verified by insulation resistance testing between its live conductors and the conductors of other circuits. Its conductors are run separately from all LV cables. What test voltage and minimum value apply?","o":["500 V DC, 1.0 MΩ","250 V DC, 0.5 MΩ","250 V DC, 1.0 MΩ","100 V DC, 0.25 MΩ"],"a":1,"x":"GN3 Table 2.12: basic insulation between SELV live conductors and all other circuits is tested at 250 V DC with a minimum of 0.5 MΩ. GN3 2.6.8.","r":"GN3 2.6.8","n":"","k":3101,"f":"GN3 Section 2.6.8, Table 2.12 'SELV insulation resistance tests'; index 'SELV'.","w":{"0":"That's for LV circuits, or SELV sharing a multicore cable with LV conductors.","2":"1.0 MΩ at 250 V is the 643.3.3 test after sensitive equipment is connected, not SELV.","3":"No such row exists in GN3 Table 2.12; the lowest test voltage given is 250 V."}},{"id":"g1.n6.03","t":"7","c":0,"q":"Protection by electrical separation is being verified. If there is doubt about the supply, what maximum voltage must the separated source be shown not to exceed, and what test is then applied between the separated live conductors and the transformer secondary live conductors?","o":["50 V maximum; 250 V DC test, minimum 0.5 MΩ","230 V maximum; 500 V DC test, minimum 0.5 MΩ","1000 V maximum; 1000 V DC test, minimum 1.0 MΩ","500 V maximum; 500 V DC test, minimum 1.0 MΩ"],"a":3,"x":"GN3 2.6.9: where in doubt, measure the voltage to verify it does not exceed 500 V. Table 2.14: basic separation tests are at 500 V DC with a minimum of 1.0 MΩ.","r":"GN3 2.6.9","n":"","k":3133,"f":"GN3 Section 2.6.9 'Testing of electrically separated circuits', Table 2.14; index 'Electrical separation'.","w":{"0":"That confuses electrical separation with SELV; separated circuits can be up to 500 V.","1":"The limit is 500 V, and Table 2.14 requires at least 1.0 MΩ.","2":"The separated circuit must not exceed 500 V, so 1000 V testing doesn't apply."}},{"id":"g1.n6.04","t":"7","c":0,"q":"Floors and walls of a non-conducting location are tested on a 230 V installation. What is the minimum measured resistance for them to be considered non-conducting?","o":["1.0 MΩ","50 kΩ","0.5 MΩ","5 kΩ"],"a":1,"x":"GN3 2.6.11, Expected results: floors and walls are non-conducting where measured resistances are at least 50 kΩ (system voltage to Earth not exceeding 500 V).","r":"GN3 2.6.11","n":"","k":3291,"f":"GN3 Section 2.6.11 'Proving and testing of non-conducting location', 'Expected results'; index 'Non-conducting location'.","w":{"0":"That's the Table 2.9 minimum for LV circuit insulation, not floors and walls.","2":"That's the SELV/PELV circuit minimum, not the floor and wall value.","3":"5,000 Ω is the maximum resistance of test electrode 1's pads, not the pass value."}},{"id":"g1.n6.05","t":"8","c":0,"q":"During a polarity test on a lighting circuit, the centre contact of screw-type lampholders must be connected to the line conductor, with an exception. Which lampholders are excepted?","o":["E14 and E27 lampholders to BS EN 60238","B22 bayonet lampholders","All lampholders on two-way switched circuits","Any lampholder fed from an RCD-protected circuit"],"a":0,"x":"GN3 2.6.12: the centre contact of screw-type lampholders must be connected to the line conductor, except E14 and E27 lampholders to BS EN 60238.","r":"GN3 2.6.12","n":"","k":3310,"f":"GN3 Section 2.6.12 'Polarity testing' and Figure 2.27; index 'Polarity'.","w":{"1":"Bayonet caps aren't screw-type, so they aren't the stated exception.","2":"Switching arrangement doesn't remove the polarity requirement.","3":"RCD protection has nothing to do with lampholder polarity."}},{"id":"g2.n6.06","t":"7","c":0,"q":"Before an insulation resistance test, GN3 says pilot or indicator lamps and capacitors should be disconnected. Why?","o":["Because they would be damaged by 250 V DC","So that the protective conductor is connected to the MET","To avoid an inaccurate test value being obtained","Because BS 7671 bans testing with any accessory connected"],"a":2,"x":"GN3 2.6.7, pre-test check (b): pilot or indicator lamps and capacitors are disconnected to avoid an inaccurate test value.","r":"GN3 2.6.7","n":"","k":2852,"f":"GN3 Section 2.6.7, list of checks (a) to (d) before the test; index 'Insulation resistance'.","w":{"0":"GN3 lists damage as the reason for electronic equipment, not for lamps and capacitors.","1":"That's a separate pre-test check, item (a).","3":"Accessories may be connected; only specific items are removed."}},{"id":"g2.n6.07","t":"7","c":0,"q":"A 690 V three-phase circuit is insulation resistance tested. Which test voltage and minimum value from Table 2.9 apply?","o":["500 V DC, 1.0 MΩ","1000 V DC, 1.0 MΩ","1000 V DC, 2.0 MΩ","2500 V DC, 1.0 MΩ"],"a":1,"x":"GN3 Table 2.9: circuits above 500 V are tested at 1000 V DC with a minimum insulation resistance of 1.0 MΩ. GN3 2.6.7.","r":"GN3 2.6.7","n":"","k":2887,"f":"GN3 Chapter 2, Section 2.6.7, Table 2.9 (reproduces BS 7671 Table 64). Index: 'Insulation resistance'.","w":{"0":"500 V is for circuits up to and including 500 V; 690 V is above that.","2":"Table 2.9 gives 1.0 MΩ for above 500 V, not 2.0 MΩ.","3":"No 2500 V test appears in Table 2.9; above 500 V uses 1000 V."}},{"id":"g2.n6.08","t":"7","c":1,"q":"Two final circuits tested together give 10 MΩ. Circuit A alone reads 50 MΩ. What is the insulation resistance of circuit B?","o":["40 MΩ","12.5 MΩ","8.33 MΩ","60 MΩ"],"a":1,"x":"1/Rt = 1/RA + 1/RB, so 1/RB = 1/Rt − 1/RA (GN3 2.6.7).<br>1/RB = 1/10 − 1/50<br>= 0.1 − 0.02 = 0.08<br>RB = 1 ÷ 0.08 = 12.5 MΩ","r":"GN3 2.6.7","n":"","k":2899,"f":"GN3 Section 2.6.7, testing a whole installation or subdividing it where the overall value is low; index 'Insulation resistance'.","w":{"0":"You subtracted 10 from 50; parallel values must be worked as reciprocals.","2":"You added 1/50 to 1/10 instead of subtracting it.","3":"You added the readings; parallel combination can't be found by adding."}},{"id":"g2.n6.09","t":"7","c":0,"q":"SELV conductors share a multicore cable with 230 V LV circuit conductors, separated only by their insulation. What insulation resistance test applies between them?","o":["250 V DC, minimum 0.5 MΩ","250 V DC, minimum 1.0 MΩ","1000 V DC, minimum 1.0 MΩ","500 V DC, minimum 1.0 MΩ"],"a":3,"x":"GN3 Table 2.12 note: where SELV conductors are separated only by insulation from conductors of both voltage bands, e.g. in a multicore with LV, test at 500 V DC with a minimum of 1 MΩ. GN3 2.6.8.","r":"GN3 2.6.8","n":"","k":3105,"f":"GN3 Section 2.6.8, note under Table 2.12; index 'SELV'.","w":{"0":"That's the normal SELV test, but the multicore note raises it to 500 V and 1 MΩ.","1":"Wrong voltage; shared multicore needs the 500 V test.","2":"1000 V is for circuits above 500 V; the note specifies 500 V."}},{"id":"g2.n6.10","t":"7","c":0,"q":"A 24 V FELV circuit is being inspected and tested. What insulation resistance test does GN3 require for it?","o":["500 V DC, minimum 1 MΩ, as for LV circuits","250 V DC, minimum 0.5 MΩ, as for SELV","No insulation test, because it is extra-low voltage","250 V DC, minimum 1 MΩ, as for sensitive equipment"],"a":0,"x":"GN3 2.6.10: FELV circuits must meet the test requirements for LV circuits, with insulation resistance at 500 V DC and a minimum of 1 MΩ.","r":"GN3 2.6.10","n":"","k":3182,"f":"GN3 Section 2.6.10 'Testing of functional extra-low voltage (FELV) circuits'; index 'FELV'.","w":{"1":"FELV doesn't meet the SELV/PELV requirements, so it's tested like an LV circuit.","2":"Regulation 643.3.2 requires FELV to meet the LV test requirements, including insulation resistance.","3":"That's the 643.3.3 test after connecting vulnerable equipment, not the FELV rule."}},{"id":"g2.n6.11","t":"8","c":0,"q":"Testing polarity at a lighting point, why must all the other lamps on the circuit be removed?","o":["They would be damaged by the ohmmeter's test current","So that the cpc is disconnected from the MET for the test","Because polarity must then be tested at 500 V DC","They could link line and neutral, so a wrong lampholder shows continuity"],"a":3,"x":"GN3 2.6.12: remove all other lamps, because they may give a conductive path between line and neutral, letting an incorrectly connected lampholder indicate continuity.","r":"GN3 2.6.12","n":"","k":3312,"f":"GN3 Section 2.6.12 'Polarity testing'; index 'Polarity'.","w":{"0":"The concern is a false reading, not damage from a low-resistance ohmmeter.","1":"Lamps have nothing to do with the cpc connection to the MET.","2":"Polarity is checked with a low-resistance ohmmeter, not an insulation test."}},{"id":"g3.n6.12","t":"7","c":1,"q":"A new installation has six final circuits, each reading 90 MΩ when tested separately at 500 V. What would a whole-installation test read, and what should the inspector do?","o":["540 MΩ: satisfactory, no further action","15 MΩ: satisfactory, no further action","15 MΩ: complies, but below 20 MΩ so should be investigated","90 MΩ: satisfactory because every circuit reads the same"],"a":2,"x":"Six equal resistances in parallel: Rt = R ÷ n (GN3 2.6.7).<br>Rt = 90 ÷ 6 = 15 MΩ<br>15 MΩ ≥ 1 MΩ, so it complies<br>15 MΩ < 20 MΩ, so on a new installation GN3 says investigate","r":"GN3 2.6.7","n":"","k":2904,"f":"GN3 Section 2.6.7, the paragraph after Table 2.9 about values below 20 MΩ; index 'Insulation resistance'.","w":{"0":"You added the readings; parallel circuits give a lower total, not a higher one.","1":"15 MΩ complies, but GN3 says investigate any reading under 20 MΩ on a new installation.","3":"Identical circuits in parallel give 90 ÷ 6, not 90 MΩ."}},{"id":"g3.n6.13","t":"7","c":0,"q":"A lighting circuit has two-way and intermediate switching. How should it be insulation resistance tested?","o":["Operate the switches one at a time and carry out additional tests in each configuration","Test once with all switches off","Remove the intermediate switch and test only the two-way switch lines","Test once at 250 V DC to protect the switches"],"a":0,"x":"GN3 2.6.7: for circuits with two-way or two-way and intermediate switches, operate the switches one at a time and do additional insulation resistance tests in these configurations.","r":"GN3 2.6.7","n":"","k":2924,"f":"GN3 Section 2.6.7, Examples (i) and (ii), Figures 2.21 and 2.22; index 'Insulation resistance'.","w":{"1":"Switches off leaves strappers and switch wires out of the test.","2":"GN3 doesn't say to remove switches; it says test every switch position.","3":"Mechanical switches aren't voltage-sensitive; the issue is reaching every conductor."}},{"id":"g3.n6.14","t":"7","c":1,"q":"A distribution board's four circuits read 400 MΩ, 200 MΩ, 100 MΩ and 80 MΩ when tested separately. What is the combined insulation resistance, to one decimal place?","o":["780 MΩ","195.0 MΩ","3.3 MΩ","33.3 MΩ"],"a":3,"x":"1/Rt = 1/400 + 1/200 + 1/100 + 1/80 (GN3 2.6.7).<br>= 0.0025 + 0.005 + 0.01 + 0.0125 = 0.03<br>Rt = 1 ÷ 0.03 = 33.3 MΩ","r":"GN3 2.6.7","n":"","k":2899,"f":"GN3 Section 2.6.7, 'main switchboard and each distribution circuit tested separately' paragraph; index 'Insulation resistance'.","w":{"0":"You added the four values; parallel circuits combine as reciprocals.","1":"That's the average of the four readings.","2":"You worked out 1/Rt = 0.03 but then divided 1 by 0.3 instead of 0.03."}},{"id":"g3.n6.15","t":"7","c":0,"q":"Comparing GN3 Table 2.12 (SELV) with Table 2.13 (PELV), which test appears for SELV but NOT for PELV?","o":["Basic insulation between live conductors and LV circuits at 250 V DC","Live to Earth at 250 V DC, minimum 0.5 MΩ","Continuity of protective conductors at 500 V DC","Basic insulation at 500 V DC where run in a multicore with LV"],"a":1,"x":"GN3 Table 2.12 includes a live-to-Earth test for SELV (250 V, 0.5 MΩ); Table 2.13 for PELV has only the basic insulation test, as PELV may be earthed. GN3 2.6.8.","r":"GN3 2.6.8","n":"","k":3115,"f":"GN3 Section 2.6.8, Tables 2.12 and 2.13; index 'PELV' or 'SELV'.","w":{"0":"Both tables include this basic insulation test.","2":"Continuity isn't tested at 500 V, and isn't in either table.","3":"That note appears under both Table 2.12 and Table 2.13."}},{"id":"g3.n6.16","t":"7","c":0,"q":"Testing a floor in a non-conducting location with test electrode 1 or 2, what approximate force is applied to the electrode?","o":["750 N (about 75 kg)","250 N","900 N","50 N"],"a":0,"x":"GN3 2.6.11: during measurement a force of approximately 750 N (75 kg) is applied for floors, or 250 N for walls.","r":"GN3 2.6.11","n":"","k":3253,"f":"GN3 Section 2.6.11, 'Test electrode 1' and 'Test electrode 2', Figures 2.25 and 2.26; index 'Non-conducting location'.","w":{"1":"250 N is the force for walls, not floors.","2":"900 is the pad contact area in mm², not the force.","3":"That's far too light; GN3 gives 750 N for floors."}},{"id":"g3.n6.17","t":"8","c":0,"q":"Which is a purpose of the polarity test given in GN3?","o":["To make sure single-pole switches are connected in the neutral conductor","To confirm the insulation between line and neutral is at least 1 MΩ","To make sure all fuses and single-pole control and protective devices are connected in the line conductor","To measure the phase rotation of the supply"],"a":2,"x":"GN3 2.6.12: a polarity test is needed to ensure all fuses and single-pole control and protective devices are connected in the line conductor.","r":"GN3 2.6.12","n":"","k":3308,"f":"GN3 Section 2.6.12 'Polarity testing'; index 'Polarity'.","w":{"0":"Single-pole devices must be in the line, not the neutral.","1":"That's insulation resistance (2.6.7), not polarity.","3":"Phase sequence is a separate test, not polarity."}},{"id":"g4.n6.18","t":"7","c":0,"q":"Before insulation resistance testing a board fitted with RCBOs, GN3 says to disconnect their functional earthing leads. Why?","o":["So that the RCBO trips during the test","Because RCBOs need to be tested at 1000 V DC","To isolate the incoming neutral from Earth","To prevent a low insulation resistance reading or damage to the RCBO"],"a":3,"x":"GN3 2.6.7, check (c): functional earthing leads of RCBOs should be disconnected to prevent a low insulation resistance reading or damage to the RCBO.","r":"GN3 2.6.7","n":"","k":2857,"f":"GN3 Section 2.6.7, pre-test checks list item (c); index 'Insulation resistance'.","w":{"0":"The RCBO must stay closed; tripping isn't the aim.","1":"RCBOs are vulnerable equipment; they aren't tested at a higher voltage.","2":"Disconnecting the incoming neutral is check (d), a separate step."}},{"id":"g4.n6.19","t":"7","c":0,"q":"A circuit's cables were tested at 500 V DC when installed. An SPD and RCBO are now connected. To Regulation 643.3.3, what final insulation resistance test is applied?","o":["250 V DC between live conductors (connected together) and the protective conductor, minimum 1 MΩ","500 V DC between line and neutral, minimum 1 MΩ","250 V DC between live conductors and cpc, minimum 0.5 MΩ","No further test; the 500 V cable test is enough"],"a":0,"x":"GN3 2.6.7 (643.3.3): after connecting equipment that might be damaged by or influence the test, apply 250 V DC between live conductors and the earthed protective conductor; it must be at least 1 MΩ. Record the test voltage on the schedule.","r":"GN3 2.6.7","n":"","k":2991,"f":"GN3 Section 2.6.7, 'Circuits with equipment that might influence the result of, or be damaged during, an insulation resistance test' and Figure 2.24; index 'Insulation resistance'.","w":{"1":"A 500 V L–N test would damage or be affected by the connected equipment.","2":"0.5 MΩ is the SELV/PELV minimum; 643.3.3 requires at least 1 MΩ.","3":"GN3 requires the second stage 250 V test after connection."}},{"id":"g4.n6.20","t":"7","c":1,"q":"Three circuits read 3 MΩ, 6 MΩ and 2 MΩ when tested separately. What will they read when tested together?","o":["11 MΩ","1.0 MΩ","3.67 MΩ","2.0 MΩ"],"a":1,"x":"1/Rt = 1/3 + 1/6 + 1/2 (GN3 2.6.7).<br>Common denominator 6: 2/6 + 1/6 + 3/6 = 6/6 = 1<br>Rt = 1 ÷ 1 = 1.0 MΩ","r":"GN3 2.6.7","n":"","k":2899,"f":"GN3 Section 2.6.7, whole-installation testing and subdividing where the overall value is low; index 'Insulation resistance'.","w":{"0":"You added the values; parallel insulation resistance combines as reciprocals.","2":"That's the average, not the parallel combination.","3":"Parallel resistance must be below the lowest branch (2 MΩ)."}},{"id":"g4.n6.21","t":"7","c":0,"q":"In a dry area (not a special location), up to what voltage does BS 7671 generally not require insulation for basic protection of SELV or PELV circuits?","o":["12 V AC or 30 V DC","50 V AC or 120 V DC","230 V AC or 400 V DC","25 V AC or 60 V DC"],"a":3,"x":"GN3 2.6.8 (414.4.5): insulation for basic protection of SELV/PELV is generally not required up to 12 V AC or 30 V DC in wet areas, and up to 25 V AC or 60 V DC in dry areas.","r":"GN3 2.6.8","n":"","k":3082,"f":"GN3 Section 2.6.8 'Confirming SELV or PELV circuits by insulation resistance testing'; index 'SELV'.","w":{"0":"Those limits apply in wet areas, not dry ones.","1":"Those are the upper limits of ELV, not the no-insulation limits.","2":"Those are LV supply voltages, nowhere near SELV limits."}},{"id":"g4.n6.22","t":"7","c":0,"q":"An electrically separated circuit supplies several items of current-using equipment. Besides continuity of the bonding, what insulation test does GN3 require for the non-earthed protective bonding conductor?","o":["250 V DC between the bonding conductor and Earth only, minimum 0.5 MΩ","500 V DC between line and neutral of the separated circuit, minimum 2.0 MΩ","500 V DC to other circuits' protective conductors/exposed parts and to extraneous parts, minimum 1.0 MΩ","No insulation test is needed, because the bonding conductor is connected to the MET"],"a":2,"x":"GN3 2.6.9 (418.3.4): test at 500 V DC between the non-earthed protective bonding conductor and other circuits' protective conductors/exposed-conductive-parts and extraneous-conductive-parts; not less than 1.0 MΩ.","r":"GN3 2.6.9","n":"","k":3149,"f":"GN3 Section 2.6.9, 'Additional inspections and tests for separated circuit supplying more than one item'; index 'Electrical separation'.","w":{"0":"That's a SELV-type test; GN3 specifies 500 V and 1.0 MΩ here.","1":"The test is on the bonding conductor, and the minimum is 1.0 MΩ.","3":"The bonding conductor must NOT be earthed in a separated circuit."}},{"id":"g4.n6.23","t":"7","c":0,"q":"When measuring the insulation resistance of floors and walls in a non-conducting location, how many measurements are required, and where must one be taken?","o":["At least three, one approximately 1 m from any accessible extraneous-conductive-part","At least two, both at the centre of the room","One only, at the furthest point from any metalwork","At least three, all taken touching the metal pipework"],"a":0,"x":"GN3 2.6.11: at least three measurements are made; one approximately 1 m from any accessible extraneous-conductive-part (e.g. a metal pipe), the others further away.","r":"GN3 2.6.11","n":"","k":3222,"f":"GN3 Section 2.6.11 'Proving and testing of non-conducting location'; index 'Non-conducting location'.","w":{"1":"GN3 asks for at least three, with one about 1 m from extraneous parts.","2":"One reading isn't enough; and one must be near metalwork, not far from it.","3":"One is 1 m from extraneous parts; the others further away, not touching them."}},{"id":"g5.n6.24","t":"7","c":0,"q":"Removing the neutral conductors before an insulation resistance test, GN3 warns that a neutral may become live the moment it is removed. What causes this?","o":["Capacitive charge left by the insulation tester","A 'borrowed neutral' on the installation","A high-resistance cpc joint","An SPD connected between line and neutral"],"a":1,"x":"GN3 2.6.7, Note 1: the moment a neutral is removed it may become live if there is a 'borrowed neutral'; use insulated tools.","r":"GN3 2.6.7","n":"","k":2863,"f":"GN3 Section 2.6.7, Note 1 under the pre-test checks; index 'Insulation resistance'.","w":{"0":"The note is about removing neutrals before testing, not discharge after testing.","2":"A poor cpc doesn't make the neutral live when removed.","3":"SPDs are disconnected for other reasons; the stated hazard is a borrowed neutral."}},{"id":"g5.n6.25","t":"7","c":1,"q":"A board has several identical final circuits, each reading 120 MΩ on its own. Tested together, they read 30 MΩ. How many circuits are there?","o":["3","5","4","0.25"],"a":2,"x":"n identical resistances in parallel: Rt = R ÷ n, so n = R ÷ Rt (GN3 2.6.7).<br>n = 120 ÷ 30<br>n = 4 circuits","r":"GN3 2.6.7","n":"","k":2899,"f":"GN3 Section 2.6.7, testing a whole installation; index 'Insulation resistance'.","w":{"0":"You worked out (120 − 30) ÷ 30; identical parallel values give n = R ÷ Rt.","1":"You added the total to one branch: (120 + 30) ÷ 30.","3":"You divided 30 by 120; n = 120 ÷ 30, not the other way round."}},{"id":"g5.n6.26","t":"7","c":0,"q":"Using GN3's four-step insulation resistance test on a 4-core cable (Table 2.11), what is test 2?","o":["L1 to L2","L1 + L2 + L3 linked together to N","L1 + L2 + L3 + N linked together to E","L1 and L2 linked together to L3"],"a":3,"x":"GN3 Table 2.11: test 1 L1–L2; test 2 L1+L2 to L3; test 3 L1+L2+L3 to N; test 4 L1+L2+L3+N to E. If any reading is low, use the Table 2.10 sequence to find the faulty conductors. GN3 2.6.7.","r":"GN3 2.6.7","n":"","k":3022,"f":"GN3 Section 2.6.7, Table 2.11 'Four-step insulation resistance test on 4-core power cable'; index 'Insulation resistance'.","w":{"0":"That's test 1.","1":"That's test 3.","2":"That's test 4, all live conductors to Earth."}},{"id":"g5.n6.27","t":"7","c":0,"q":"Inspecting a FELV system, what does GN3 require of its plugs, socket-outlets and cable couplers?","o":["They must not have a protective conductor contact, to keep FELV isolated from Earth","They need a protective conductor contact and must not fit other systems' accessories","They may be standard BS 1363 accessories, provided they are labelled FELV","They must be supplied only from a safety isolating transformer, like SELV"],"a":1,"x":"GN3 2.6.10, inspection item (c): FELV plugs, socket-outlets, LSCs, DCLs and cable couplers need a protective conductor contact and must not be dimensionally compatible with those of any other system on the premises.","r":"GN3 2.6.10","n":"","k":3192,"f":"GN3 Section 2.6.10 'Testing of functional extra-low voltage (FELV) circuits'; index 'FELV'.","w":{"0":"Unearthed socket contacts are the rule for non-conducting locations; FELV accessories need a protective conductor contact.","2":"They must not be dimensionally compatible with other systems' accessories.","3":"That's about the source, not the accessories, and FELV doesn't need a safety isolating transformer; its source just has to meet Regulation 411.7.4."}},{"id":"g5.n6.28","t":"7","c":0,"q":"Extraneous-conductive-parts in a non-conducting location have been insulated during construction. After the standard 500 V insulation test, what 'flash' test does GN3 describe, and what is the leakage limit?","o":["2 kV AC rms, leakage current not exceeding 1 mA","1000 V DC, insulation resistance not less than 1 MΩ","2 kV AC rms, leakage current not exceeding 30 mA","4 kV DC, leakage current not exceeding 5 mA"],"a":0,"x":"GN3 2.6.11: a 'flash' tester applies 2 kV AC rms after the 500 V test and measures leakage current, which should not exceed 1 mA.","r":"GN3 2.6.11","n":"","k":3296,"f":"GN3 Section 2.6.11, last paragraph before 2.6.12; index 'Non-conducting location'.","w":{"1":"That's the Table 2.9 test for circuits above 500 V.","2":"30 mA is a common RCD rating, not the flash test limit.","3":"GN3 gives 2 kV AC rms and 1 mA."}},{"id":"g5.n6.29","t":"8","c":0,"q":"An installer checks polarity only at the consumer unit end of each circuit. Why does this fall short of GN3's guidance?","o":["Polarity must be checked live, using an earth fault loop impedance tester","Polarity may only be checked visually, never with an instrument","It must be checked at all points, so crossed conductors at junction boxes are found","Polarity checks are only required on socket-outlet circuits anyway"],"a":2,"x":"GN3 2.6.12: whatever method is used, polarity checks are required at all points on a circuit to ensure conductors haven't been crossed at intermediate points like junction boxes.","r":"GN3 2.6.12","n":"","k":3300,"f":"GN3 Section 2.6.12 'Polarity testing'; index 'Polarity'.","w":{"0":"GN3 says verify polarity before connection to the supply, with an ohmmeter.","1":"Instrument or visual checks are both allowed; the fault is checking one point only.","3":"All circuits must have polarity verified, including lighting."}},{"id":"g1.n7.00","t":"9","c":0,"q":"When testing an earth electrode by test method E1 (fall of potential), why must the earthing conductor be disconnected from the electrode/MET?","o":["So the test current passes only through the earth electrode and not through parallel paths","To stop the test current tripping the RCDs in the installation","To protect the earth tester from the supply's prospective fault current","So the electrode can be watered with brine without affecting the installation"],"a":0,"x":"Disconnecting the earthing conductor (with the installation securely isolated) ensures the test current flows only through the electrode under test, with no parallel paths through bonding or the supply earth (GN3 2.6.13, test method E1).","r":"GN3 2.6.13","n":"","k":3346,"f":"GN3 Chapter 2, section 2.6.13 Earth electrode resistance testing; index word 'earth electrode'. Read the opening paragraph of test method E1.","w":{"1":"The installation is isolated anyway, so RCD tripping is not the reason given.","2":"The installation is isolated from the supply for the test; disconnection is about parallel paths, not fault current.","3":"GN3 says brine must never be used to lower the resistance of the electrode under test."}},{"id":"g1.n7.01","t":"9","c":1,"q":"A single earth rod 2.5 m long is to be tested by the fall of potential method. Following GN3, what is the minimum distance from the electrode under test to the current spike for reliable results?","o":["15 m","25 m","7.5 m","30 m"],"a":1,"x":"Distance to the current spike should be at least ten times the maximum dimension of the electrode system (GN3 2.6.13).<br>10 × 2.5 m = 25 m","r":"GN3 2.6.13","n":"","k":3384,"f":"GN3 Chapter 2, section 2.6.13 Earth electrode resistance testing; index word 'earth electrode'. See the paragraph after Figure 2.28 on spacing of the test spikes.","w":{"0":"15 m is just the lower end of the spacing shown on Figure 2.28, not ten times the rod length.","2":"You multiplied by 3 instead of 10.","3":"30 m is GN3's example for a 3 m rod, not a 2.5 m rod."}},{"id":"g1.n7.02","t":"9","c":1,"q":"A TT installation is protected by a 100 mA non-delayed RCD. Using RA × IΔn ≤ 50 V, what is the maximum value of RA?","o":["1667 Ω","200 Ω","167 Ω","500 Ω"],"a":3,"x":"Regulation 411.5.3(b), quoted in GN3 2.6.13: RA × IΔn ≤ 50 V.<br>RA ≤ 50 ÷ IΔn<br>RA ≤ 50 ÷ 0.1 = 500 Ω","r":"GN3 2.6.13","n":"","k":3553,"f":"GN3 Chapter 2, section 2.6.13 Earth electrode resistance testing; index word 'earth electrode'. Look under 'Results of earth electrode testing' for Regulation 411.5.3 and Table 2.15.","w":{"0":"1667 Ω is the result for a 30 mA RCD, not 100 mA.","1":"200 Ω is the stability guidance figure from Note 2 of Table 41.5, not the 50 V calculation.","2":"167 Ω is the result for a 300 mA RCD."}},{"id":"g1.n7.03","t":"10","c":0,"q":"Which of the following is NOT one of the elements of the earth fault current loop listed in GN3?","o":["The neutral conductor of the circuit under test","The circuit protective conductor (cpc)","The MET and earthing conductor","The transformer winding"],"a":0,"x":"The loop listed in GN3 2.6.15 is: cpc, MET and earthing conductor, metallic or earth return path, transformer neutral point, transformer winding and the line conductor. The circuit neutral is not part of the L–E loop.","r":"GN3 2.6.15","n":"","k":3614,"f":"GN3 section 2.6.15 Earth fault loop impedance (EFLI) verification; the list (a) to (f) of loop elements. Index word 'earth fault loop impedance'.","w":{"1":"The cpc is item (a), the start of the loop from the point of fault.","2":"The MET and earthing conductor are item (b) of the loop.","3":"The transformer winding is item (e) of the loop."}},{"id":"g1.n7.04","t":"10","c":1,"q":"At the consumer unit at the origin of an installation, Ze is measured as 0.35 Ω. A radial circuit has (R1 + R2) of 0.62 Ω. What is Zs for the circuit?","o":["0.27 Ω","0.62 Ω","0.97 Ω","0.22 Ω"],"a":2,"x":"GN3 2.6.15: Zs = Ze + (R1 + R2).<br>Zs = 0.35 + 0.62<br>Zs = 0.97 Ω","r":"GN3 2.6.15","n":"","k":3649,"f":"GN3 section 2.6.15, under 'Measurement of (R1 + R2) during continuity testing ... and addition to the EFLI external to that circuit'. Index word 'external earth fault loop impedance'.","w":{"0":"You subtracted Ze from (R1 + R2) instead of adding.","1":"That's (R1 + R2) alone; Ze must be added.","3":"You multiplied Ze by (R1 + R2) instead of adding them."}},{"id":"g1.n7.05","t":"10","c":0,"q":"The maximum measured Zs values in GN3 Appendix A are lower than those in BS 7671 Tables 41.2 to 41.4. What correction factor (divisor) has been used?","o":["1.20","1.25","1.06","0.95"],"a":1,"x":"Appendix A values are measured values at an assumed 10 °C, while BS 7671 values are design figures at 70 °C operating temperature; the divisor used is 1.25 (GN3 Appendix A, note under A1).","r":"GN3 A1","n":"","k":7799,"f":"GN3 Appendix A, section A1, the Note before Table A1 explaining why the tables are lower than BS 7671. Index word 'Appendix A'.","w":{"0":"1.20 is factor F from Table B3 used in the A3 method, not the Appendix A divisor.","2":"1.06 is the Table A7 ambient correction factor for 25 °C.","3":"0.95 is Cmin, the minimum voltage factor used in A2."}},{"id":"g1.n7.06","t":"10","c":1,"q":"A radial circuit is protected by a 16 A Type C circuit-breaker to BS EN 60898. Ze = 0.38 Ω and (R1 + R2) = 0.79 Ω, tested at 10 °C. Compared with GN3 Table A5, is Zs acceptable?","o":["Yes: Zs is 1.17 Ω, which is below the 2.15 Ω maximum","No: Zs is 1.17 Ω, which exceeds the 1.10 Ω maximum","Yes: Zs is 0.41 Ω, which is below the 1.10 Ω maximum","Yes: Zs is 1.17 Ω, which is below the 2.76 Ω maximum"],"a":1,"x":"Zs = Ze + (R1 + R2) = 0.38 + 0.79 = 1.17 Ω.<br>Table A5, Type C 16 A: maximum measured Zs = 1.10 Ω.<br>1.17 Ω > 1.10 Ω, so not acceptable (GN3 Appendix A, Table A5).","r":"GN3 A1","n":"","k":7932,"f":"GN3 Appendix A, Table A5 Circuit-breakers (maximum measured EFLI); row '3 & C', column 16 A. Index word 'earth fault loop impedance, maximum'.","w":{"0":"2.15 Ω is the Type B 16 A value; you read the wrong row.","2":"You subtracted Ze from (R1 + R2) instead of adding.","3":"2.76 Ω is the Type 1 16 A value; you read the wrong row."}},{"id":"g2.n7.07","t":"9","c":0,"q":"According to GN3, when should an earth electrode resistance test ideally be carried out?","o":["After a period of heavy rain, so the soil is fully saturated","In mild, damp conditions, so the reading is typical of most of the year","At any time, as soil conditions do not affect the reading","When ground conditions are least favourable, such as frozen or very dry soil"],"a":3,"x":"GN3 2.6.13 says the test should ideally be done when ground conditions are least favourable, such as frozen or very dry soil, so the reading represents the worst case.","r":"GN3 2.6.13","n":"","k":3354,"f":"GN3 Chapter 2, section 2.6.13 Earth electrode resistance testing; index word 'earth electrode'. Read the paragraph beginning 'Ideally' under test method E1.","w":{"0":"Wet soil gives the lowest, most flattering reading, the opposite of the worst case.","1":"A typical reading hides the worst case; GN3 wants least favourable conditions.","2":"GN3 notes resistance changes with soil drying and freezing, so conditions matter."}},{"id":"g2.n7.08","t":"9","c":1,"q":"In a fall of potential test the current spike is 40 m from the electrode under test. The first reading is taken with the potential spike midway. At what distances from the electrode are the second and third readings taken?","o":["18 m and 22 m","16 m and 24 m","12 m and 28 m","4 m and 36 m"],"a":1,"x":"GN3 2.6.13: move the potential spike 10 % of the overall electrode-to-current-spike distance each way from the midway position.<br>Midway = 40 ÷ 2 = 20 m<br>10 % of 40 m = 4 m<br>20 − 4 = 16 m; 20 + 4 = 24 m","r":"GN3 2.6.13","n":"","k":3388,"f":"GN3 Chapter 2, section 2.6.13 Earth electrode resistance testing; index word 'earth electrode'. See the three readings (a), (b) and (c) after Figure 2.28.","w":{"0":"You took 10 % of the midway distance (2 m) instead of the overall distance.","2":"You moved 20 % of the overall distance instead of 10 %.","3":"You measured 10 % from each end instead of moving from the midway position."}},{"id":"g2.n7.09","t":"9","c":0,"q":"In Regulation 411.5.3, RA × IΔn ≤ 50 V, quoted in GN3, what does RA represent?","o":["The resistance of the earth electrode alone, with the earthing conductor disconnected","The external earth fault loop impedance, Ze","The earth fault loop impedance at the furthest point of the circuit","The sum of the earth electrode resistance and the protective conductor(s) connecting it to the exposed-conductive-parts"],"a":3,"x":"RA is the sum of the resistances of the earth electrode and the protective conductor(s) connecting it to the exposed-conductive-parts (GN3 2.6.13, Regulation 411.5.3).","r":"GN3 2.6.13","n":"","k":3556,"f":"GN3 Chapter 2, section 2.6.13 Earth electrode resistance testing; index word 'earth electrode'. Look under 'Results of earth electrode testing' for the definitions after Regulation 411.5.3.","w":{"0":"The electrode alone omits the protective conductors that RA includes.","1":"Ze includes the supply path; RA is only the electrode plus protective conductors.","2":"That's Zs; GN3 says Zs may be substituted for RA, but they are not the same definition."}},{"id":"g2.n7.10","t":"10","c":0,"q":"For an installation forming part of a TT system, which of the following does GN3 list as a way of verifying the effectiveness of protection by ADS?","o":["Measurement of prospective fault current at the origin","Insulation resistance testing of the circuit at 1000 V","Measurement of the resistance of the earthing arrangement of the exposed-conductive-parts for the circuit","Measuring Ze with the earthing conductor left connected to the MET"],"a":2,"x":"For TT systems GN3 2.6.14 lists: (a) measuring the resistance of the earthing arrangement of the exposed-conductive-parts, (b) visual inspection of overcurrent devices, and (c) where RCDs are used, verifying EFLI and testing RCD operation.","r":"GN3 2.6.14","n":"","k":3595,"f":"GN3 section 2.6.14 Protection by automatic disconnection of supply (ADS), the second list (for TT systems). Index word 'automatic disconnection'.","w":{"0":"PFC is checked against breaking capacity (2.6.16), not as a means of verifying ADS.","1":"Insulation resistance is a separate test and 1000 V is not the usual LV circuit test voltage.","3":"For Ze, GN3 says the earthing conductor must be disconnected to remove parallel paths."}},{"id":"g2.n7.11","t":"10","c":0,"q":"Zs is being measured with an EFLI tester on a live installation. What does GN3 say about the connection with Earth and the bonding conductors?","o":["The main bonding conductors should be disconnected to remove parallel paths","The earthing conductor should be disconnected from the MET","Both should be disconnected and reconnected after the test","Neither should be disconnected, for safety and practical reasons"],"a":3,"x":"GN3 2.6.15: Zs is measured on a live installation and, for safety and practical reasons, neither the connection with Earth nor the bonding conductors are disconnected.","r":"GN3 2.6.15","n":"","k":3633,"f":"GN3 section 2.6.15, 'Measurement of total EFLI (Zs) using an EFLI tester'. Index word 'earth fault loop impedance'.","w":{"0":"Removing parallel paths applies to the Ze test with the main switch open, not live Zs.","1":"Disconnecting the earthing conductor on a live installation is dangerous; that's only for Ze with supply isolated.","2":"GN3 says neither is disconnected during a live Zs measurement."}},{"id":"g2.n7.12","t":"10","c":0,"q":"A radial circuit in 6 mm² twin and cpc (2.5 mm² cpc) is protected by a 32 A BS 88-2 fuse and needs 0.4 s disconnection. From GN3 Table A2, what is the maximum measured Zs?","o":["0.8 Ω","0.6 Ω","1.36 Ω","1.0 Ω"],"a":0,"x":"GN3 Table A2(i), 0.4 s, BS 88-2: 32 A column, 2.5 mm² (and above) cpc row = 0.8 Ω.","r":"GN3 A1","n":"","k":7839,"f":"GN3 Appendix A, Table A2 BS 88-2 fuses, part (i) 0.4 s disconnection. Index word 'fuses, maximum earth fault loop impedance'.","w":{"1":"0.6 Ω is the 1.0 mm² cpc row; this circuit has a 2.5 mm² cpc.","2":"1.36 Ω is from part (ii), the 5 s table, not 0.4 s.","3":"1.0 Ω is the 25 A column; you read the wrong fuse rating."}},{"id":"g2.n7.13","t":"10","c":1,"q":"A circuit protected by a 16 A Type C circuit-breaker (Table A5 maximum 1.10 Ω at 10 °C) is tested at an ambient temperature of 20 °C. Using the Table A7 formula (ambient + 230) ÷ (10 + 230), what is the corrected maximum measured Zs?","o":["1.06 Ω","1.10 Ω","1.15 Ω","1.17 Ω"],"a":2,"x":"Table A7 Note 1: factor = (ambient + 230) ÷ 240.<br>(20 + 230) ÷ 240 = 1.042<br>1.10 × 1.042 = 1.146 ≈ 1.15 Ω (GN3 Appendix A, Table A7).","r":"GN3 A1","n":"","k":7971,"f":"GN3 Appendix A, Table A7 Ambient temperature correction factors and its Note 1 formula. Index word 'temperature correction'.","w":{"0":"You divided by the factor instead of multiplying.","1":"That's the uncorrected 10 °C value; it must be adjusted for 20 °C.","3":"You used the 25 °C factor (1.06) instead of the 20 °C factor."}},{"id":"g3.n7.14","t":"9","c":1,"q":"Three fall of potential readings are 118 Ω, 120 Ω and 125 Ω. Using GN3's method, what is the percentage deviation?","o":["3.3 %","5.8 %","4.0 %","4.2 %"],"a":0,"x":"GN3 2.6.13: average the readings, find the maximum deviation from the average in ohms, express as a % of the average.<br>Average = (118 + 120 + 125) ÷ 3 = 121 Ω<br>Deviations: 3, 1, 4 Ω; maximum = 4 Ω<br>4 ÷ 121 × 100 = 3.3 %","r":"GN3 2.6.13","n":"","k":3395,"f":"GN3 Chapter 2, section 2.6.13 Earth electrode resistance testing; index word 'earth electrode'. See the paragraph after the three readings (a) to (c) on percentage deviation.","w":{"1":"You used the full spread (125 − 118 = 7 Ω) instead of the deviation from the average.","2":"4.0 is the deviation in ohms; you didn't convert it to a percentage of the average.","3":"You compared with the midway reading (120 Ω) instead of the average."}},{"id":"g3.n7.15","t":"9","c":0,"q":"During a fall of potential test the instrument shows the temporary test spikes' resistance is too high. Which action does GN3 permit?","o":["Water the electrode under test with brine","Move the test spikes closer to the electrode under test","Link the C1 and P1 terminals with a single lead","Drive the test spikes deeper or water them with brine"],"a":3,"x":"GN3 2.6.13 allows driving the spikes deeper or watering them with brine to improve contact resistance, but says this must never be used on the electrode under test.","r":"GN3 2.6.13","n":"","k":3415,"f":"GN3 Chapter 2, section 2.6.13 Earth electrode resistance testing; index word 'earth electrode'. See the paragraph on spike resistance being too high, before Test method E2.","w":{"0":"GN3 says under no circumstances should brine be used on the electrode under test.","1":"Moving spikes closer makes the resistance areas overlap and the reading unreliable.","2":"Linking C1 and P1 relates to test lead resistance, not spike contact resistance."}},{"id":"g3.n7.16","t":"9","c":0,"q":"Where a time-delayed RCD provides fault protection in a TT installation, what does GN3 say about the maximum EFLI compared with Table 2.15?","o":["A lower figure than Table 2.15 is likely to be required","A higher figure than Table 2.15 is allowed because of the time delay","The Table 2.15 figures apply unchanged","The Appendix A circuit-breaker values must be used instead"],"a":0,"x":"GN3 2.6.13: with a time-delayed RCD, the EFLI including the electrode resistance must meet 411.3 and 411.5, which is likely to require a lower figure than Table 2.15.","r":"GN3 2.6.13","n":"","k":3574,"f":"GN3 Chapter 2, section 2.6.13 Earth electrode resistance testing; index word 'earth electrode'. Read the paragraph directly under Table 2.15 (non-delayed RCDs).","w":{"1":"The delay lengthens disconnection, so the limit gets tighter, not looser.","2":"Table 2.15 is for non-delayed RCDs only.","3":"Appendix A is for overcurrent devices; GN3 refers to 411.3 and 411.5 instead."}},{"id":"g3.n7.17","t":"10","c":0,"q":"GN3 gives two methods of verifying total EFLI for a circuit. Which is preferred when determining Zs for final circuits and distribution circuits?","o":["Measuring Zs with an EFLI tester at every point","Obtaining Zs by enquiry with the distributor","Calculating Zs from cable lengths and Table 41.3","Measuring (R1 + R2) during continuity testing and adding it to Ze"],"a":3,"x":"GN3 2.6.15: the two methods are a live Zs test or (R1 + R2) plus Ze; the latter is preferred for final circuits and distribution circuits.","r":"GN3 2.6.15","n":"","k":3629,"f":"GN3 section 2.6.15, the two numbered methods for verifying total EFLI. Index word 'earth fault loop impedance'.","w":{"0":"A live Zs test is allowed where safe, but it's not the preferred method.","1":"Only Ze can be found by enquiry, and even then it must be verified.","2":"That's design calculation, not one of the two verification methods."}},{"id":"g3.n7.18","t":"10","c":1,"q":"At an origin Ze = 0.35 Ω. At a sub-distribution board the loop impedance Zdb is measured as 0.48 Ω. A final circuit from the sub-board has (R1 + R2) = 0.79 Ω. What is Zs for that circuit?","o":["1.14 Ω","1.62 Ω","1.27 Ω","0.31 Ω"],"a":2,"x":"GN3 2.6.15: for a board not at the origin, Zs = Zdb + (R1 + R2).<br>Zs = 0.48 + 0.79<br>Zs = 1.27 Ω","r":"GN3 2.6.15","n":"","k":3664,"f":"GN3 section 2.6.15, the paragraph on consumer units or distribution boards not at the origin (Zdb). Index word 'earth fault loop impedance'.","w":{"0":"You added Ze at the origin, ignoring the sub-main between origin and sub-board.","1":"You added Ze, Zdb and (R1 + R2); Zdb already includes Ze.","3":"You subtracted Zdb from (R1 + R2) instead of adding."}},{"id":"g3.n7.19","t":"10","c":0,"q":"The maximum measured Zs values in GN3 Tables A1 to A5 must not be exceeded when the tests are carried out at what ambient temperature?","o":["20 °C","10 °C","30 °C","70 °C"],"a":1,"x":"GN3 Appendix A, A1: the tables give maximum measured EFLI not to be exceeded when tested at an ambient temperature of 10 °C; Table A7 corrects for other temperatures.","r":"GN3 A1","n":"","k":7761,"f":"GN3 Appendix A, section A1, opening paragraph. Index word 'Appendix A'.","w":{"0":"20 °C is the base for Table B2/B3 resistances in Appendix B, not Appendix A.","2":"30 °C is the usual cable rating ambient, not the Appendix A test basis.","3":"70 °C is the conductor operating temperature behind the BS 7671 design values."}},{"id":"g3.n7.20","t":"10","c":1,"q":"Using the Appendix A2 equation Zs(m) ≤ 0.8 × U0 × Cmin ÷ Ia, with U0 = 230 V, Cmin = 0.95 and Ia = 100 A, what is the maximum measured Zs?","o":["2.30 Ω","1.84 Ω","2.19 Ω","1.75 Ω"],"a":3,"x":"GN3 Appendix A2:<br>Zs(m) ≤ 0.8 × 230 × 0.95 ÷ 100<br>= 0.8 × 218.5 ÷ 100<br>= 174.8 ÷ 100 = 1.75 Ω","r":"GN3 A2","n":"","k":7989,"f":"GN3 Appendix A, section A2 Appendix 3 of BS 7671, the equation for Zs(m). Index word 'Appendix 3'.","w":{"0":"You used U0 ÷ Ia only, leaving out both 0.8 and Cmin.","1":"You left out Cmin (0.95).","2":"You left out the 0.8 temperature adjustment factor."}},{"id":"g4.n7.2
