A circuit has a design current of 32 A and a measured R1 + Rn of 0.18 Ω. Using the measured method, what is the voltage drop?","s":"","o":["5.8 V","6.9 V","8.3 V","11.5 V"],"a":1,"x":"Vd = Ib × (R1 + Rn) × 1.2 (to allow for operating temperature)<br>32 × 0.18 = 5.76<br>5.76 × 1.2 = 6.9 V. Within the 11.5 V (5%) limit for a power circuit.","r":"","n":"","k":1000048.0,"f":"GN3 2.6.20 (Verification of voltage drop): measured live conductor resistance × full load current, compensated for temperature; index 'voltage drop'.","w":{"0":"5.8 V leaves out the 1.2 factor for conductor operating temperature.","2":"8.3 V applies the 1.2 temperature factor twice; 32 × 0.18 × 1.2 = 6.9 V.","3":"11.5 V is the 5 % limit for a power circuit, not the calculated drop."}},{"id":"iv1.50","t":"14","c":0,"q":"Two socket-outlets are added to an existing ring final circuit. Which document should be issued?","s":"","o":["Schedule of Test Results only","Electrical Installation Condition Report","Minor Electrical Installation Works Certificate","Electrical Installation Certificate"],"a":2,"x":"An addition that does not extend to a new circuit is certified on a Minor Electrical Installation Works Certificate. A new circuit needs an EIC.","r":"","n":"","k":1000049.0,"f":"GN3 2.2 (Certificates) and 2.6.2: an MEIWC may be used where work doesn't extend to a new circuit; also 5.2. Index 'minor works'.","w":{"3":"An EIC is needed for a new circuit; adding sockets to an existing ring isn't one.","1":"An EICR reports on an existing installation's condition; it doesn't certify new work.","0":"A Schedule of Test Results on its own isn't a certificate."}},{"id":"iv1.51","t":"14","c":0,"q":"An Electrical Installation Certificate is signed by the persons responsible for:","s":"","o":["Installation and the client","Inspection and testing only","Design, construction, and inspection and testing","Design and installation only"],"a":2,"x":"The EIC has sections for design, construction, and inspection and testing. One competent person may sign all three on the single-signature form.","r":"","n":"","k":1000050.0,"f":"GN3 2.2 (Certificates), multiple-signature EIC, and 2.6.2 item 644.3(c); index 'Electrical Installation Certificate'.","w":{"3":"Inspection and testing must also be signed for; there are three responsibilities.","1":"Design and construction must also be signed for, not just inspection and testing.","0":"The client doesn't sign the EIC; it's design, construction and inspection and testing."}},{"id":"iv1.52","t":"14","c":0,"q":"Which TWO documents must accompany an Electrical Installation Certificate? (Select TWO)","s":"","o":["Minor Works Certificate","Electrical Installation Condition Report","Schedule of Test Results","Schedule of Inspections"],"a":[2,3],"x":"BS 7671 Chapter 64: an EIC is issued with a Schedule of Inspections and a Schedule of Test Results.","r":"","n":"","k":1000051.0,"f":"GN3 2.6.2, Reg 644.3(a): the EIC is accompanied by a Schedule of Inspections and Schedule of Test Results; index 'EIC'.","w":{"1":"An EICR is a periodic report on an existing installation, not part of an EIC.","0":"A Minor Works Certificate is an alternative for small work, not an attachment to an EIC."}},{"id":"iv1.53","t":"14","c":0,"q":"During initial verification a circuit's Zs is found to exceed the maximum permitted. What action is taken?","s":"","o":["Issue an EICR with a C2 code","Record it on the EIC as a departure and issue it","Have the fault corrected, re-inspect and re-test, then issue the EIC","Record it on the Schedule of Test Results and issue the EIC"],"a":2,"x":"BS 7671 Chapter 64: defects or omissions found during initial verification must be made good and re-inspected/re-tested before the certificate is issued.","r":"","n":"","k":1000052.0,"f":"GN3 2.6.2, Reg 644.1(d): defects must be made good and re-tested before the EIC is issued; index 'defects'.","w":{"1":"A departure is a designer's deliberate decision, not a way of passing a failed test.","3":"You can't issue an EIC with a known failure; it must be fixed first.","0":"EICR codes are for periodic inspection; new work must be corrected before an EIC."}},{"id":"iv1.54","t":"14","c":0,"q":"To whom is the Electrical Installation Certificate given?","s":"","o":["The distribution network operator","The person ordering the work","The local building control body","The installer's certification scheme"],"a":1,"x":"BS 7671 Chapter 64: the certificate, with its schedules, is given to the person ordering the work. Building control notification (Part P) is a separate step.","r":"","n":"","k":1000053.0,"f":"GN3 1.3.1 (Certificates and reports) and 2.6.2, Reg 644.1: given to the person ordering the work; index 'certificates'.","w":{"2":"Building control notification is a separate step; the EIC goes to the person ordering the work.","0":"The DNO doesn't receive the EIC.","3":"Scheme notification is separate; the certificate itself goes to the person ordering the work."}},{"id":"iv1.55","t":"4","c":0,"q":"Which instrument is used to measure the operating time of an RCD?","s":"","o":["A low-resistance ohmmeter","An RCD tester to BS EN 61557-6","An insulation resistance tester","An earth electrode tester"],"a":1,"x":"BS EN 61557-6 covers RCD testers, which apply a set residual current and time the disconnection. Most multifunction testers include this function.","r":"","n":"","k":1000054.0,"f":"GN3 4.7 (RCD testers): instruments to BS EN 61557-6; index 'RCD testers'.","w":{"2":"An insulation tester applies DC test voltage; it can't time an RCD trip.","0":"A low-resistance ohmmeter measures continuity, not trip times.","3":"An earth electrode tester measures electrode resistance, not RCD operation."}},{"id":"iv2.1","t":"1","c":0,"q":"Why is the voltage indicator proved again on the proving unit after testing for dead?","s":"","o":["To record the result on the Schedule of Test Results","To discharge any stored energy","To confirm the indicator did not fail during the test, so the dead reading can be trusted","To check the circuit voltage is correct"],"a":2,"x":"If the indicator failed between proving and testing, a 'dead' reading would be false. Re-proving confirms it was working throughout.","r":"","n":"","k":1000100.0,"f":"GN3 1.1 (Safety) refers you to GS38, HSR25 and Electrical Safety First Best Practice Guide No.2 for safe isolation; index 'isolation'.","w":{"1":"Proving units don't discharge anything; re-proving checks the indicator still works.","0":"Safe isolation isn't recorded on the Schedule of Test Results; it's a safety check.","3":"The indicator isn't checking supply voltage; it confirms the 'dead' reading is trustworthy."}},{"id":"iv2.2","t":"1","c":0,"q":"A circuit is protected by a fuse in a distribution board that has no facility for a lock. How is isolation secured?","s":"","o":["Tape over the fuse carrier","Remove the fuse carrier, keep it with you and fit a caution notice","Isolation cannot be secured, so work live","Switch off the main switch and tell the occupier"],"a":1,"x":"Removing the fuse carrier and keeping it on your person prevents re-energisation. Add a caution notice at the board.","r":"","n":"","k":1000101.0,"f":"GN3 1.1 (Safety) refers you to GS38, HSR25 and Electrical Safety First Best Practice Guide No.2 for safe isolation; index 'isolation'.","w":{"3":"Telling someone isn't securing isolation; anyone could switch the main switch back on.","0":"Tape doesn't stop someone refitting or closing the fuse; keep the carrier with you.","2":"Lack of a lock doesn't justify live work; removing and keeping the fuse secures isolation."}},{"id":"iv2.3","t":"1","c":0,"q":"Which regulation of the Electricity at Work Regulations 1989 sets the conditions under which live working may be allowed?","s":"","o":["Regulation 13","Regulation 14","Regulation 16","Regulation 12"],"a":1,"x":"Reg 14: live work only where it is unreasonable for the equipment to be dead, reasonable to work live, and suitable precautions are taken.","r":"","n":"","k":1000102.0,"f":"GN3 4.9 (Thermographic equipment) quotes EAWR Regulation 14, 'Work on or near live conductors'; index 'Electricity at Work Regulations'.","w":{"3":"Reg 12 covers means of cutting off supply and isolation, not when live work is allowed.","0":"Reg 13 covers precautions for work on equipment made dead, the opposite situation.","2":"Reg 16 is about competence, not the conditions for live working."}},{"id":"iv2.4","t":"1","c":0,"q":"Which of the following is a statutory document?","s":"","o":["IET Guidance Note 3","HSE Guidance Note GS38","The Electricity at Work Regulations 1989","BS 7671 Requirements for Electrical Installations"],"a":2,"x":"The Electricity at Work Regulations are law. BS 7671 is a British Standard, GN3 is IET guidance, and GS38 is HSE guidance: all non-statutory.","r":"","n":"","k":1000103.0,"f":"GN3 Preface: BS 7671 compliance is likely to satisfy statutory regulations such as the EAWR; also 3.3. Index 'statutory'.","w":{"3":"BS 7671 is a non-statutory British Standard, though it's used to show compliance with the law.","0":"GN3 is IET guidance, not law.","1":"GS38 is HSE guidance, not a statutory regulation."}},{"id":"iv2.5","t":"3","c":0,"q":"Which device is NOT suitable for use as a means of isolation?","s":"","o":["A plug and socket-outlet","A fuse carrier that can be removed","A double-pole switch-disconnector","A semiconductor device such as a triac"],"a":3,"x":"BS 7671 Section 537: semiconductor devices must not be used as isolators because they don't give a reliable physical break.","r":"","n":"","k":1000104.0,"f":"GN3 2.5.2, 'Sect 537 Isolating and switching devices', refers to BS 7671 Table 537.4 for device suitability; index 'isolation'.","w":{"2":"A double-pole switch-disconnector is a standard isolating device.","1":"A removable fuse carrier is a recognised means of isolation.","0":"A plug and socket-outlet can be used as a means of isolation."}},{"id":"iv2.6","t":"1","c":0,"q":"Which HSE publication gives guidance on safe working practices, including safe isolation?","s":"","o":["BS 7909","HSG85 Electricity at work: safe working practices","HSG107 Maintaining portable electrical equipment","IET Guidance Note 1"],"a":1,"x":"HSG85 is the HSE guide to safe working practices on electrical systems, including isolation. HSG107 covers portable equipment.","r":"","n":"","k":1000105.0,"f":"GN3 1.1 (Safety) cites HSE 'Electricity at work: Safe working practices' (HSG85); index 'safety'.","w":{"2":"HSG107 is about maintaining portable equipment, not safe working on installations.","3":"IET Guidance Note 1 covers selection and erection, and isn't an HSE publication.","0":"BS 7909 is a British Standard for temporary power systems, not HSE safe-working guidance."}},{"id":"iv2.7","t":"1","c":0,"q":"What is a proving unit used for?","s":"","o":["To measure insulation resistance","To provide a known voltage to prove a voltage indicator works","To lock off an isolator","To test RCDs"],"a":1,"x":"A proving unit is a known voltage source used to prove the voltage indicator before and after testing for dead, without needing a live circuit.","r":"","n":"","k":1000106.0,"f":"GN3 1.1 (Safety) refers you to GS38, HSR25 and Electrical Safety First Best Practice Guide No.2 for safe isolation; index 'isolation'.","w":{"3":"RCDs are tested with an RCD tester, not a proving unit.","0":"Insulation resistance needs an insulation tester; a proving unit only supplies a known voltage.","2":"Locking off uses a lock and hasp; a proving unit is a voltage source."}},{"id":"iv2.8","t":"2","c":0,"q":"Initial verification is intended to confirm, as far as reasonably practicable, that:","s":"","o":["The installation meets the client's budget","The requirements of BS 7671 have been met","The installation has passed a Part P inspection","The installation will need no maintenance"],"a":1,"x":"Reg 641.1: initial verification confirms, as far as reasonably practicable, that BS 7671 has been met and the installation is safe to put into service.","r":"","n":"","k":1000107.0,"f":"GN3 2.1 (Purpose of initial verification); index 'initial verification'.","w":{"3":"No installation is maintenance-free; verification confirms compliance, not future upkeep.","0":"Cost isn't part of verification; it checks compliance with BS 7671.","2":"Part P is Building Regulations notification; initial verification confirms BS 7671 compliance."}},{"id":"iv2.9","t":"2","c":0,"q":"Before inspecting and testing, the inspector needs to know which of the following?","s":"","o":["The maximum demand","The number and type of live conductors","The external earth fault loop impedance, Ze","All of the above"],"a":3,"x":"BS 7671 Part 3 (assessment of general characteristics) sets these out: maximum demand, arrangement of live conductors, type of earthing, and supply characteristics including Ze and PFC.","r":"","n":"","k":1000108.0,"f":"GN3 2.3 (Required information), 'Assessment of general characteristics' items (a), (b) and (g); index 'required information'.","w":{"0":"Maximum demand is needed, but so are the other two; all are required information.","1":"Live conductor arrangement is needed, but so are the other two.","2":"Ze is needed, but so are maximum demand and the live conductor arrangement."}},{"id":"iv2.10","t":"2","c":0,"q":"Which chapter of BS 7671 Part 6 covers initial verification?","s":"","o":["Chapter 52","Chapter 65","Chapter 41","Chapter 64"],"a":3,"x":"Part 6: Chapter 64 is initial verification (641 general, 642 inspection, 643 testing, 644 certification). Chapter 65 is periodic inspection and testing.","r":"","n":"","k":1000109.0,"f":"GN3 Chapter 2 margin references cite BS 7671 Regs 641–644 (Chapter 64, Initial verification); index 'Chapter 64'.","w":{"2":"Chapter 41 is protection against electric shock (Part 4), not verification.","0":"Chapter 52 is selection and erection of wiring systems (Part 5).","1":"Chapter 65 is periodic inspection and testing, not initial verification."}},{"id":"iv2.11","t":"3","c":0,"q":"Which human sense is most likely to detect overheating during an inspection?","s":"","o":["Sight","Smell","Hearing","Touch"],"a":1,"x":"Overheated insulation gives off a distinctive smell, often before any damage is visible.","r":"","n":"","k":1000110.0,"f":"GN3 2.5.2 and 2.5.3 list the items to inspect; the use of the senses isn't set out in GN3. Index 'inspection'.","w":{"0":"Sight may see discolouration later, but overheating usually smells first.","3":"Touching for heat is unreliable and risky; smell detects overheating.","2":"Hearing picks up arcing or buzzing, not overheating insulation."}},{"id":"iv2.12","t":"3","c":0,"q":"During a walk-round of an energised installation, which sense is best for detecting arcing at a contactor?","s":"","o":["Taste","Hearing","Touch","Sight of the label"],"a":1,"x":"Arcing makes a crackle or buzz you can hear. Never touch to check. Smell (ozone, burning) also helps.","r":"","n":"","k":1000111.0,"f":"GN3 2.5.2 and 2.5.3 list the items to inspect; the use of the senses isn't set out in GN3. Index 'inspection'.","w":{"2":"Never touch to check for arcing on live equipment; listen instead.","0":"Taste is never used in inspection.","3":"A label tells you nothing about arcing; you hear it."}},{"id":"iv2.13","t":"3","c":0,"q":"What is the minimum IP rating for electrical equipment installed in Zone 1 of a room containing a bath?","s":"","o":["IPX5","IPX4","IPX7","IPX2"],"a":1,"x":"Section 701: Zones 1 and 2 need at least IPX4 (IPX5 where water jets are used for cleaning). Zone 0 needs IPX7.","r":"","n":"","k":1000112.0,"f":"BS 7671 Reg 701.512.2 (Section 701); GN3 2.5.3 checklist refers to Section 701 for locations containing a bath or shower. Index 'bath'.","w":{"3":"IPX2 is below the minimum; Zones 1 and 2 need IPX4.","0":"IPX5 is required only where water jets are used for cleaning.","2":"IPX7 is the Zone 0 requirement, not Zone 1."}},{"id":"iv2.14","t":"3","c":0,"q":"What is the minimum IP rating for equipment in Zone 0 of a bath or shower location?","s":"","o":["IPX4","IPX7","IPX5","IPX6"],"a":1,"x":"Zone 0 is inside the bath or shower tray, so equipment must withstand temporary immersion: IPX7.","r":"","n":"","k":1000113.0,"f":"BS 7671 Reg 701.512.2 (Section 701); GN3 2.5.3 checklist refers to Section 701 for locations containing a bath or shower. Index 'bath'.","w":{"0":"IPX4 is for Zones 1 and 2; Zone 0 needs immersion protection.","2":"IPX5 is for water jets in Zones 1 and 2, not immersion in Zone 0.","3":"IPX6 is powerful jets, not immersion; Zone 0 needs IPX7."}},{"id":"iv2.15","t":"3","c":0,"q":"A cable passes through a fire-resistant wall. What must be checked during inspection?","s":"","o":["That the cable is bonded to the wall","That the hole is left open for ventilation","That the hole is sealed to the fire resistance of the wall","That the cable is red"],"a":2,"x":"Reg 527.2: openings where wiring passes through fire-segregating elements must be sealed to the degree of fire resistance of the element.","r":"","n":"","k":1000114.0,"f":"GN3 2.5.2, fire sealing under Reg 527.2.1 (Section 527); index 'fire barriers'.","w":{"3":"Cable colour has no bearing on fire sealing.","0":"Cables aren't bonded to walls; the opening must be sealed.","1":"An open hole breaks the fire compartment; it must be sealed to the wall's fire resistance."}},{"id":"iv2.16","t":"14","c":0,"q":"Which TWO entries may appear on a Schedule of Inspections for an initial verification? (Select TWO)","s":"","o":["FI","✓ (acceptable)","N/A (not applicable)","C2"],"a":[1,2],"x":"On initial verification every item is either acceptable (✓) or not applicable (N/A). Defects are fixed before issue, so there are no codes. C1, C2, C3 and FI belong on an EICR.","r":"","n":"","k":1000115.0,"f":"GN3 Chapter 5 (Forms), Schedule of Inspections; classification codes are in 3.11 (EICR). Index 'Schedule of Inspections'.","w":{"3":"C2 is an EICR classification code; defects are put right before an EIC is issued.","0":"FI (further investigation) is an EICR code, not used on initial verification."}},{"id":"iv2.17","t":"3","c":1,"q":"A TN-C-S (PME) supply has a 25 mm² copper supply neutral. What is the minimum size of the main protective bonding conductors?","s":"","o":["6 mm²","16 mm²","25 mm²","10 mm²"],"a":3,"x":"Table 54.8: supply neutral up to 35 mm² → main bonding at least 10 mm² copper.","r":"","n":"","k":1000116.0,"f":"BS 7671 Table 54.8 (Reg 544.1.1); GN3 2.5.3 checklist item 'main protective bonding conductor sizes (544.1)'. Index 'main bonding'.","w":{"0":"6 mm² is the TN-S minimum (half the earthing conductor), not the PME Table 54.8 value.","1":"16 mm² is for a supply neutral over 35 mm² up to 50 mm².","2":"25 mm² is for a supply neutral over 50 mm² up to 95 mm²; you matched the neutral size."}},{"id":"iv2.18","t":"3","c":0,"q":"What is the minimum csa of a copper supplementary bonding conductor that is NOT mechanically protected?","s":"","o":["4 mm²","6 mm²","1.5 mm²","2.5 mm²"],"a":0,"x":"Reg 544.2.3: 2.5 mm² if mechanically protected, 4 mm² if not.","r":"","n":"","k":1000117.0,"f":"BS 7671 Reg 544.2.3; GN3 2.5.3 has the matching 4 mm² rule for separate cpcs without mechanical protection. Index 'supplementary bonding'.","w":{"2":"1.5 mm² is below either minimum for a supplementary bonding conductor.","3":"2.5 mm² is allowed only if mechanically protected.","1":"6 mm² is more than the minimum; 4 mm² is enough unprotected."}},{"id":"iv2.19","t":"4","c":0,"q":"An earth fault loop impedance test keeps tripping the 30 mA RCD protecting the circuit. What should the tester do?","s":"","o":["Test at the origin instead","Disconnect the cpc","Use the instrument's low-current (no-trip) loop test","Bypass the RCD with a link"],"a":2,"x":"Most loop testers have a low-current mode that keeps the test current below the RCD's tripping threshold. Never bypass an RCD.","r":"","n":"","k":1000118.0,"f":"GN3 4.5 (EFLI testers), 'Three-wire non-trip test'; also 2.6.15. Index 'non-trip'.","w":{"3":"Bypassing an RCD removes protection and is never acceptable.","0":"A reading at the origin is Ze or Zdb, not this circuit's Zs.","1":"Disconnecting the cpc removes the fault path you're trying to measure, and is dangerous."}},{"id":"iv2.20","t":"4","c":0,"q":"After an insulation resistance test on a long cable run, what hazard may remain?","s":"","o":["Induced voltage from the RCD","A stored capacitive charge on the conductors","A high earth fault loop impedance","A reversed polarity"],"a":1,"x":"A long cable acts as a capacitor at 500 V DC. Let the instrument discharge the circuit before disconnecting the leads or touching conductors.","r":"","n":"","k":1000119.0,"f":"GN3 4.4 (Insulation resistance testers): instrument discharge facility, leave connected until discharged; index 'capacitance'.","w":{"0":"An RCD doesn't induce voltage; the charge comes from the cable's capacitance.","2":"Loop impedance isn't a hazard created by an insulation test.","3":"An insulation test can't reverse polarity; the risk is stored charge."}},{"id":"iv2.21","t":"4","c":0,"q":"Instruments used for inspection and testing should be designed to the safety requirements of:","s":"","o":["BS 88","BS 7671 Part 7","BS EN 60898","BS EN 61010"],"a":3,"x":"BS EN 61010 covers the safety of electrical test and measurement equipment. BS EN 61557 covers their performance for each test.","r":"","n":"","k":1000120.0,"f":"GN3 4.1 (Instrument standard): BS EN 61010 is the basic safety standard; BS EN 61557 covers performance. Index 'instrument standard'.","w":{"2":"BS EN 60898 is the circuit-breaker standard.","1":"BS 7671 Part 7 covers special installations or locations, not instruments.","0":"BS 88 is the fuse standard."}},{"id":"iv2.22","t":"4","c":0,"q":"Put these tests in the correct order for initial verification:\n1. Polarity\n2. Insulation resistance\n3. Continuity of protective conductors\n4. RCD operation\n5. Earth fault loop impedance","s":"","o":["3, 1, 2, 5, 4","2, 3, 1, 4, 5","3, 2, 1, 5, 4","1, 3, 2, 4, 5"],"a":2,"x":"Dead tests first: continuity, insulation resistance, polarity. Then energise: earth fault loop impedance, then RCD operation.","r":"","n":"","k":1000121.0,"f":"GN3 2.6.4 (The sequence of tests) and Figure 2.12; index 'sequence of tests'.","w":{"1":"Insulation can't come before continuity, and RCD tests follow loop impedance.","0":"Polarity is done after insulation resistance in the GN3 sequence.","3":"Polarity isn't first, and loop impedance comes before RCD tests."}},{"id":"iv2.23","t":"4","c":0,"q":"Which of the following tests is carried out with the installation energised?","s":"","o":["Prospective fault current","Continuity of ring final circuit conductors","Continuity of main bonding","Insulation resistance"],"a":0,"x":"Prospective fault current, like Zs and RCD tests, needs the supply present. Continuity and insulation resistance are dead tests.","r":"","n":"","k":1000122.0,"f":"GN3 2.6.4 and Figure 2.12: tests 643.2–643.6 are done before energising; PFC (2.6.16) needs power on. Index 'sequence of tests'.","w":{"1":"Ring continuity is a dead test.","3":"Insulation resistance is a dead test.","2":"Bonding continuity is a dead test."}},{"id":"iv2.24","t":"1","c":0,"q":"Which TWO features does GS38 recommend for test leads used for voltage detection? (Select TWO)","s":"","o":["Finger barriers or guards","Exposed probe tips of at least 10 mm","Fused or current-limited leads","Crocodile clips on both ends"],"a":[0,2],"x":"GS38: finger guards, well-insulated leads, short exposed tips (4 mm max) and fuses or current limiting to reduce arc-flash risk.","r":"","n":"","k":1000123.0,"f":"GN3 1.1 (Safety), item (d): GS38 leads, HBC fuses or current limiting; also 4.1. Index 'GS38'.","w":{"1":"GS38 wants short exposed tips (4 mm max), not 10 mm or more.","3":"Crocodile clips on both ends aren't a GS38 recommendation for voltage detection."}},{"id":"iv2.25","t":"4","c":0,"q":"Why are dead tests carried out before the installation is energised?","s":"","o":["To discharge the supply","To confirm there are no faults that would make energising unsafe","Because live tests need warm conductors","Because dead tests are quicker"],"a":1,"x":"Continuity, insulation resistance and polarity prove the installation is free of short circuits, earth faults and wiring errors before the supply is connected.","r":"","n":"","k":1000124.0,"f":"GN3 2.6.4, Figure 2.12, safety considerations: tests 643.2–643.6 before the installation is energised. Index 'sequence of tests'.","w":{"2":"Conductor temperature isn't why; the dead tests prove it's safe to energise.","3":"Speed isn't the reason; safety is.","0":"Dead tests don't discharge the supply; they find faults before energising."}},{"id":"iv2.26","t":"5","c":0,"q":"Where should continuity of protective conductors be tested on a lighting circuit?","s":"","o":["At metal switch plates only","At every light and every switch point","At the furthest point only","At the distribution board only"],"a":1,"x":"Every point with a cpc terminal must be proved, including switches, so each accessory is earthed.","r":"","n":"","k":1000125.0,"f":"GN3 2.6.5 (Reg 411.3.1.1, cpc to each point and accessory), test method 1 at each outlet; index 'continuity of protective conductors'.","w":{"3":"Testing only at the board doesn't prove the cpc reaches each point.","2":"The far end gives R1 + R2, but every point must be proved continuous.","0":"Every point with a cpc needs testing, not just metal plates."}},{"id":"iv2.27","t":"5","c":1,"q":"A 10 mm² copper main bonding conductor is 20 m long. What is its expected resistance at 20°C?","s":"","o":["0.02 Ω","0.37 Ω","0.04 Ω","0.15 Ω"],"a":2,"x":"GN3 Table B1: 10 mm² = 1.83 mΩ/m.<br>1.83 × 20 = 36.6 mΩ<br>36.6 ÷ 1000 = 0.04 Ω","r":"","n":"","k":1000126.0,"f":"GN3 Appendix B, Table B1: 10 mm² = 1.83 mΩ/m; R = mΩ/m × L ÷ 1000. Index 'resistance of conductors'.","w":{"0":"0.02 Ω uses the 16 mm² value (1.15 mΩ/m), not 10 mm².","3":"0.15 Ω uses the 2.5 mm² value (7.41 mΩ/m).","1":"You divided by 100 instead of 1000; 36.6 mΩ = 0.04 Ω."}},{"id":"iv2.28","t":"5","c":1,"q":"Supplementary bonding is installed for a circuit protected by a 20 A Type B circuit-breaker (Ia = 100 A). What is the maximum resistance allowed between simultaneously accessible parts?","s":"","o":["0.05 Ω","2.19 Ω","0.5 Ω","1.75 Ω"],"a":2,"x":"Reg 415.2.2: R ≤ 50 V ÷ Ia.<br>Ia for Type B = 5 × In = 5 × 20 = 100 A<br>R ≤ 50 ÷ 100 = 0.5 Ω","r":"","n":"","k":1000127.0,"f":"GN3 2.5.2, Reg 415.2.2: R ≤ 50 V / Ia; index 'supplementary bonding'.","w":{"0":"A decimal slip; 50 ÷ 100 = 0.5 Ω, not 0.05.","3":"1.75 Ω is the maximum measured Zs for a 20 A Type B, not the bonding limit.","1":"2.19 Ω is the tabulated Zs for a 20 A Type B, not 50/Ia."}},{"id":"iv2.29","t":"6","c":0,"q":"What value of rn is expected?","s":"Scenario: a ring final circuit is wired in 4.0/1.5 mm² twin and cpc cable. Step 1 gives r1 = 0.40 Ω.","o":["1.07 Ω","0.40 Ω","0.20 Ω","0.15 Ω"],"a":1,"x":"Line and neutral are the same size and length, so rn = r1 = 0.40 Ω (within 0.05 Ω).","r":"","n":"","k":1000128.0,"f":"GN3 2.6.6, step 1: r1 and rn should be the same (within 0.05 Ω) for equal-size conductors; index 'ring final circuit'.","w":{"3":"You divided by 2.67; that's for the cpc, and rn is the same size as the line.","2":"You halved r1; rn is end-to-end, the same as r1.","0":"1.07 Ω is r2 for the 1.5 mm² cpc, not the 4.0 mm² neutral."}},{"id":"iv2.30","t":"6","c":1,"q":"What value of r2 is expected?","s":"Scenario: a ring final circuit is wired in 4.0/1.5 mm² twin and cpc cable. Step 1 gives r1 = 0.40 Ω.","o":["0.40 Ω","0.60 Ω","1.07 Ω","0.15 Ω"],"a":2,"x":"4.0 ÷ 1.5 = 2.67, so the cpc has 2.67 times the resistance.<br>r2 = 0.40 × 2.67 = 1.07 Ω","r":"","n":"","k":1000129.0,"f":"GN3 2.6.6, step 1: r2 = r1 × (line csa ÷ cpc csa); index 'ring final circuit'.","w":{"3":"You divided by 2.67; the smaller cpc has the higher resistance, so multiply.","0":"0.40 Ω is r1; r2 is higher because the cpc is only 1.5 mm².","1":"You multiplied by 1.5; the ratio is 4.0 ÷ 1.5 = 2.67."}},{"id":"iv2.31","t":"6","c":1,"q":"What should step 3 read at each socket-outlet?","s":"Scenario: a ring final circuit is wired in 4.0/1.5 mm² twin and cpc cable. Step 1 gives r1 = 0.40 Ω.","o":["0.20 Ω","0.37 Ω","0.47 Ω","1.47 Ω"],"a":1,"x":"Step 3 = (r1 + r2) ÷ 4 = (0.40 + 1.07) ÷ 4 = 1.47 ÷ 4 = 0.37 Ω","r":"","n":"","k":1000130.0,"f":"GN3 2.6.6, step 3: (r1 + r2) ÷ 4 at each socket; index 'ring final circuit'.","w":{"0":"0.20 Ω is the step 2 value (r1 + rn) ÷ 4.","2":"You added rn as well; step 3 is (r1 + r2) ÷ 4 only.","3":"1.47 Ω is r1 + r2 not divided by 4."}},{"id":"iv2.32","t":"6","c":0,"q":"During step 3 of a ring final circuit test, readings rise steadily towards the middle of the ring and then fall again. Step 1 was correct. What is the cause?","s":"","o":["A reversed polarity at one socket","The ends have been cross-connected wrongly at the consumer unit","A spur at the midpoint","A faulty instrument"],"a":1,"x":"If the same end of line and cpc are linked instead of opposite ends, you measure along the ring rather than the figure-of-eight, so readings peak mid-ring.","r":"","n":"","k":1000131.0,"f":"GN3 2.6.6, 'Test cross-connections' and the figure-of-eight note; index 'ring final circuit'.","w":{"2":"A spur raises one outlet's reading, not a steady rise to mid-ring.","0":"A reversal shows at one socket, not as a rise and fall round the ring.","3":"A faulty instrument wouldn't give a consistent mid-ring peak; the ends are linked wrongly."}},{"id":"iv2.33","t":"6","c":0,"q":"In step 3, one socket gives an over-range reading while step 2 at that socket was normal. What is the likely cause?","s":"","o":["Line and neutral are reversed at that socket","The cpc is a smaller csa","The ring is interconnected","The socket is a spur"],"a":0,"x":"Step 3 measures L to cpc. With L and N swapped at the socket you are really measuring N to cpc, which are not linked: over-range. Step 2 (L to N) still reads normally.","r":"","n":"","k":1000132.0,"f":"GN3 2.6.6, step 3 (line and cpc cross-connected); also 2.6.12 polarity. Index 'ring final circuit'.","w":{"3":"A spur reads slightly higher, not over-range, and would also show on step 2.","1":"A smaller cpc changes the value, not give over-range at one socket.","2":"An interconnection lowers readings; it doesn't cause over-range."}},{"id":"iv2.34","t":"7","c":1,"q":"What are the test voltage and minimum insulation resistance for a SELV circuit?","s":"","o":["500 V DC, 1.0 MΩ","250 V DC, 0.5 MΩ","100 V DC, 0.5 MΩ","250 V DC, 1.0 MΩ"],"a":1,"x":"BS 7671 Table 64: SELV and PELV are tested at 250 V DC with a minimum of 0.5 MΩ.","r":"","n":"","k":1000133.0,"f":"GN3 2.6.7, Table 2.9 (Table 64 of BS 7671), SELV and PELV row; also 2.6.8. Index 'insulation resistance'.","w":{"0":"500 V DC, 1.0 MΩ is for LV circuits up to 500 V, not SELV.","3":"The voltage is right but the SELV minimum is 0.5 MΩ, not 1.0.","2":"100 V isn't a Table 64 test voltage."}},{"id":"iv2.35","t":"7","c":0,"q":"When insulation testing a three-phase, four-wire circuit, which tests are required?","s":"","o":["Between the three lines only","Between all live conductors, and between each live conductor and earth","Each line to neutral only","Each line to earth only"],"a":1,"x":"Test L1–L2, L2–L3, L3–L1, each line to N, and each live conductor (lines and neutral) to earth. Live conductors can be linked together for the test to earth.","r":"","n":"","k":1000134.0,"f":"GN3 2.6.7 (Insulation resistance), three-phase test table (tests 1–4, all live conductors to earth); index 'three-phase'.","w":{"3":"Line-to-earth alone misses faults between conductors.","2":"Line-to-neutral alone misses line–line and earth faults.","0":"Line–line alone misses neutral and earth faults."}},{"id":"iv2.36","t":"7","c":0,"q":"How is insulation resistance proved on a lighting circuit with two-way and intermediate switching?","s":"","o":["Leave all switches off","Operate the switches so every strapper is tested in each position","Test at the consumer unit only","Leave all switches on"],"a":1,"x":"Some strappers are only connected in certain switch positions, so the test is repeated with the switches operated to include every conductor.","r":"","n":"","k":1000135.0,"f":"GN3 2.6.7 and Figure 2.22: two-way and intermediate switches operated one at a time; index 'two-way switching'.","w":{"0":"With switches off, parts of the circuit aren't connected to the test.","3":"One switch position leaves some strappers out of the test.","2":"The board alone won't reach strappers left out by the switch positions."}},{"id":"iv2.37","t":"10","c":0,"q":"Where should earth fault loop impedance be measured on a radial final circuit?","s":"","o":["At the midpoint","At the furthest point of the circuit","At any socket","At the distribution board"],"a":1,"x":"The furthest point has the highest impedance, so it is the worst case for disconnection time.","r":"","n":"","k":1000136.0,"f":"GN3 2.6.5, record R1 + R2 at the circuit's extremity; 2.6.15 for Zs. Index 'extremity'.","w":{"3":"The board gives the lowest value, not the worst case.","0":"The midpoint is the worst case on a ring, not a radial.","2":"Any socket isn't enough; the furthest point has the highest impedance."}},{"id":"iv2.38","t":"10","c":0,"q":"What is the maximum Ze declared by the distribution network operator for a TN-S supply?","s":"","o":["21 Ω","0.35 Ω","1.0 Ω","0.8 Ω"],"a":3,"x":"TN-S 0.8 Ω, TN-C-S 0.35 Ω, TT 21 Ω.","r":"","n":"","k":1000137.0,"f":"GN3 2.3 (Required information) item (g) lists Ze as supply information from the DNO; GN3 2.6.15 covers measuring it. Index 'Ze'.","w":{"1":"0.35 Ω is the TN-C-S figure, not TN-S.","2":"1.0 Ω isn't a standard declared value.","0":"21 Ω is the TT figure."}},{"id":"iv2.39","t":"10","c":1,"q":"What is the maximum measured Zs for a circuit protected by a 20 A Type C circuit-breaker (tabulated maximum 1.09 Ω)?","s":"","o":["0.87 Ω","1.09 Ω","1.37 Ω","1.75 Ω"],"a":0,"x":"Measured values are compared against 0.8 of the tabulated figure:<br>1.09 × 0.8 = 0.87 Ω","r":"","n":"","k":1000138.0,"f":"GN3 2.6.15 item (d), factor of 0.8 (Appendix A2); Appendix A Table A5 lists maximum measured values. Index 'maximum measured Zs'.","w":{"1":"1.09 Ω is the tabulated value; a measured value is compared with 0.8 of it.","2":"1.37 Ω is the tabulated value for a 32 A Type B.","3":"1.75 Ω is the maximum measured value for a 20 A Type B, not Type C."}},{"id":"iv2.40","t":"10","c":1,"q":"A TN-S installation has Ze = 0.8 Ω. A new circuit is protected by a 20 A Type B circuit-breaker (maximum measured Zs 1.75 Ω). What is the maximum R1 + R2 the circuit can have?","s":"","o":["1.75 Ω","2.55 Ω","0.95 Ω","2.19 Ω"],"a":2,"x":"Zs = Ze + (R1 + R2), so R1 + R2 = Zs − Ze<br>= 1.75 − 0.8 = 0.95 Ω","r":"","n":"","k":1000139.0,"f":"GN3 2.6.15 and Appendix B: Zs = Ze + (R1 + R2), so R1 + R2 = Zs − Ze; index 'earth fault loop impedance'.","w":{"0":"1.75 Ω is the whole Zs; you didn't take away Ze.","3":"2.19 Ω is the tabulated Zs, and Ze still needs subtracting.","1":"You added Ze instead of subtracting it."}},{"id":"iv2.41","t":"10","c":1,"q":"What is the maximum disconnection time for a distribution circuit in a TN system?","s":"","o":["0.4 s","0.2 s","5 s","1 s"],"a":2,"x":"Table 41.1 / Reg 411.3.2.3: distribution circuits in TN systems 5 s; in TT systems 1 s.","r":"","n":"","k":1000140.0,"f":"GN3 2.6.14 (ADS) refers to BS 7671 Table 41.1 and Reg 411.3.2.3; index 'disconnection times'.","w":{"1":"0.2 s is for TT final circuits.","0":"0.4 s is for TN final circuits up to 63 A, not distribution circuits.","3":"1 s is the TT distribution circuit time."}},{"id":"iv2.42","t":"10","c":0,"q":"Loop impedance readings on a circuit vary from one test to the next. What should the tester do?","s":"","o":["Record the highest reading","Disconnect the bonding and retest","Record the lowest reading","Repeat the test to get consistent readings"],"a":3,"x":"Transient voltages on the supply can upset a loop reading. Repeat until the readings are consistent.","r":"","n":"","k":1000141.0,"f":"GN3 4.5 (EFLI testers), 'Sources of error': repeating a test is advised, especially on noisy supplies. Index 'loop impedance'.","w":{"0":"An inconsistent reading may be a transient; recording the highest doesn't fix that.","2":"Taking the lowest could hide a real high value.","1":"Disconnecting bonding is dangerous and doesn't cure supply noise."}},{"id":"iv2.43","t":"12","c":0,"q":"Before testing a 100 mA RCD that protects a whole TT installation, what must be agreed with the users?","s":"","o":["That the bonding can be removed","That the RCD can be bridged","That the building will be evacuated","That the whole installation can be isolated"],"a":3,"x":"Tripping a main RCD disconnects everything downstream, so agree the loss of supply with the users first.","r":"","n":"","k":1000142.0,"f":"GN3 2.6.18 (RCDs) and 1.1 (Safety: plan isolation with premises management); index 'RCD'.","w":{"0":"Bonding must never be removed to test an RCD.","2":"Evacuation isn't required; users need to agree the loss of supply.","1":"Bridging an RCD defeats the test and removes protection."}},{"id":"iv2.44","t":"9","c":1,"q":"A TT installation has an earth electrode resistance Ra of 180 Ω. What is the largest standard RCD rating that will provide fault protection?","s":"","o":["300 mA","100 mA","30 mA","500 mA"],"a":1,"x":"Ra × IΔn ≤ 50 V, so IΔn ≤ 50 ÷ Ra.<br>50 ÷ 180 = 0.278 A = 278 mA<br>300 mA is too big, so the largest standard size is 100 mA.","r":"","n":"","k":1000143.0,"f":"GN3 2.6.13, 'Results of earth electrode testing', Reg 411.5.3: Ra × IΔn ≤ 50 V; index 'earth electrode'.","w":{"2":"30 mA works, but it isn't the largest rating that satisfies 50 ÷ 180.","0":"300 mA × 180 Ω = 54 V, over the 50 V limit.","3":"500 mA × 180 Ω = 90 V, well over 50 V."}},{"id":"iv2.45","t":"12","c":1,"q":"A time-delayed (S type) RCD is tested at 1 × IΔn. What range of operating time is acceptable?","s":"","o":["0–300 ms","130–500 ms","0–40 ms","200–1000 ms"],"a":1,"x":"S type devices are delayed on purpose for selectivity: 130–500 ms at 1 × IΔn, 50–150 ms at 5 × IΔn.","r":"","n":"","k":1000144.0,"f":"GN3 2.6.18, Table 2.17 (Tests for RCDs), S-delay column; index 'RCD'.","w":{"2":"0–40 ms is the non-delay 5 × IΔn time.","0":"0–300 ms is the non-delay 1 × IΔn time; S types are deliberately slower.","3":"200–1000 ms isn't the S-type range; the maximum is 500 ms."}},{"id":"iv2.46","t":"12","c":0,"q":"Pressing the test button on an RCD confirms:","s":"","o":["The RCD trips within 300 ms","The continuity of the cpc","The earth fault loop impedance","The mechanical operation of the RCD"],"a":3,"x":"The test button proves only that the tripping mechanism works. Operating times need an RCD tester.","r":"","n":"","k":1000145.0,"f":"GN3 2.6.18 (test button gives basic information that the RCD is functioning) and 2.6.19; index 'RCD test button'.","w":{"0":"The test button can't measure trip time; you need an RCD tester.","2":"Loop impedance is measured with a loop tester.","1":"Continuity is a dead low-resistance test."}},{"id":"iv2.47","t":"8","c":0,"q":"Why is polarity checked at the origin with the supply connected?","s":"","o":["To measure Ze","To confirm the supply polarity from the distribution network operator is correct","To confirm the main bonding","To confirm the RCD will trip"],"a":1,"x":"Dead tests prove the installation's own wiring. Only a live check proves the incoming supply is connected with the correct polarity.","r":"","n":"","k":1000146.0,"f":"GN3 2.6.12 (Polarity) and the EIC 'Confirmation of supply polarity' box (Chapter 5); index 'polarity'.","w":{"3":"RCD operation is a separate test.","0":"Ze is measured with a loop tester, not by checking polarity.","2":"Main bonding continuity is a dead test."}},{"id":"iv2.48","t":"12","c":0,"q":"How is it confirmed during functional testing that an isolator breaks all poles?","s":"","o":["Measure the insulation resistance of the isolator","Use a non-contact voltage detector on the supply cable","Use a two-pole voltage indicator between each line and neutral on the load side with the isolator open","Watch the motor stop"],"a":2,"x":"With the isolator open, test on the load side between every combination. Any voltage shows a pole has not opened. A stopped motor proves only that one pole opened.","r":"","n":"","k":1000147.0,"f":"GN3 2.6.19 (Other functional testing, Reg 643.10); switchgear operated to confirm it works. Index 'functional testing'.","w":{"3":"A stopped motor only shows one pole opened.","1":"A non-contact detector is unreliable and doesn't check each pole.","0":"Insulation resistance doesn't show whether each pole opens."}},{"id":"iv2.49","t":"13","c":1,"q":"A radial socket circuit in 2.5 mm² cable (18 mV/A/m) is 25 m long with a design current of 20 A. What is the voltage drop?","s":"","o":["18.0 V","11.5 V","9.0 V","4.5 V"],"a":2,"x":"Vd = mV/A/m × Ib × L ÷ 1000<br>18 × 20 × 25 = 9000<br>9000 ÷ 1000 = 9.0 V (within the 11.5 V, 5% limit)","r":"","n":"","k":1000148.0,"f":"GN3 2.6.20 (Verification of voltage drop) and BS 7671 Appendix 4 (mV/A/m); index 'voltage drop'.","w":{"3":"You halved the result; 18 × 20 × 25 ÷ 1000 = 9.0 V.","1":"11.5 V is the 5 % limit, not the calculated drop.","0":"You doubled it; the mV/A/m value already covers both line and neutral."}},{"id":"iv2.50","t":"14","c":0,"q":"A new cooker circuit is added to an existing installation. Which certificate is issued?","s":"","o":["No certificate is needed","Minor Electrical Installation Works Certificate","Electrical Installation Condition Report","Electrical Installation Certificate"],"a":3,"x":"A new circuit, even one added to an existing installation, needs an EIC with a Schedule of Inspections and Schedule of Test Results.","r":"","n":"","k":1000149.0,"f":"GN3 2.2 (Certificates) and 2.6.2: an MEIWC only where work doesn't extend to a new circuit; index 'EIC'.","w":{"1":"A minor works certificate can't be used for a new circuit.","2":"An EICR reports on an existing installation; it doesn't certify new work.","0":"All new work must be certified."}},{"id":"iv2.51","t":"14","c":0,"q":"On initial verification, where is the current rating of the main switch recorded?","s":"","o":["Minor Works Certificate","Schedule of Inspections","Electrical Installation Certificate","Schedule of Test Results"],"a":2,"x":"The EIC records the particulars of the installation at the origin, including the main switch type and rating.","r":"","n":"","k":1000150.0,"f":"GN3 Chapter 5 (Forms), EIC particulars of installation at the origin (main switch); index 'EIC'.","w":{"1":"The Schedule of Inspections records inspection items, not main switch details.","3":"The Schedule of Test Results records circuit test values.","0":"A Minor Works Certificate isn't used for initial verification of a whole installation."}},{"id":"iv2.52","t":"14","c":0,"q":"Which TWO are recorded on the Schedule of Test Results? (Select TWO)","s":"","o":["The date of the next periodic inspection","The client's signature","R1 + R2 for each circuit","Insulation resistance for each circuit"],"a":[2,3],"x":"The Schedule of Test Results records circuit details and test values (continuity, R1 + R2, insulation resistance, polarity, Zs, RCD times) and the instruments used.","r":"","n":"","k":1000151.0,"f":"GN3 2.6.1 (Test results) and Chapter 5 model Schedule of Test Results; index 'Schedule of Test Results'.","w":{"1":"The client doesn't sign the Schedule of Test Results.","0":"The next inspection date goes on the EIC, not the test schedule."}},{"id":"iv2.53","t":"14","c":0,"q":"A designer decides to depart from a requirement of BS 7671. What must happen?","s":"","o":["An EICR is issued instead","Nothing, departures are allowed","The building control body must approve it","The departure is recorded on the EIC and must give a degree of safety not less than compliance"],"a":3,"x":"Reg 120.3: departures are recorded on the EIC, and the resulting safety must be no less than if BS 7671 were followed.","r":"","n":"","k":1000152.0,"f":"GN3 1.5 (Departures and non-compliance), Reg 120.3; index 'departure'.","w":{"1":"Departures are allowed only if recorded and safety isn't reduced.","2":"Building control approval isn't the BS 7671 requirement.","0":"An EICR is for existing installations, not for recording a design departure."}},{"id":"iv2.54","t":"14","c":0,"q":"Who may sign the inspection and testing section of an Electrical Installation Certificate?","s":"","o":["Any member of the installing company","A competent person who carried out the inspection and testing","The client","The electricity supplier"],"a":1,"x":"The inspection and testing section is signed by the competent person responsible for it. The same person can sign design and construction on the single-signature EIC.","r":"","n":"","k":1000153.0,"f":"GN3 2.2 (Certificates) and 2.6.2, Reg 644.3(c): signed by a skilled person responsible for each facet; index 'EIC'.","w":{"2":"The client receives the EIC but doesn't sign it.","3":"The supplier has no role in signing the EIC.","0":"The signatory must be competent and responsible for the inspection and testing, not just anyone in the company."}},{"id":"iv2.55","t":"9","c":0,"q":"On a TT installation where test spikes can't be driven, the resistance of the installation earth electrode can be measured with:","s":"","o":["An insulation resistance tester","A clamp meter on the meter tails","An RCD tester","An earth fault loop impedance tester"],"a":3,"x":"GN3: with the earthing conductor disconnected from the MET, a loop impedance tester between line and the electrode gives a value close to Ra (the supply part is small by comparison).","r":"","n":"","k":1000154.0,"f":"GN3 2.6.13, test method E3 (measurement using an EFLI tester); also 4.6. Index 'earth electrode'.","w":{"0":"An insulation tester applies high DC voltage and can't measure electrode resistance.","2":"An RCD tester times trips; it doesn't give electrode resistance.","1":"A clamp on the tails measures load current, not electrode resistance."}},{"id":"iv3.1","t":"1","c":0,"q":"Select the correct safe isolation sequence:\n1. Seek permission from the person in control of the premises\n2. Identify the circuit and its point of isolation\n3. Isolate, lock off and keep the key\n4. Fit a caution notice\n5. Prove the voltage indicator\n6. Test for dead at the point of work\n7. Re-prove the voltage indicator","s":"","o":["1, 2, 3, 5, 6, 7, 4","2, 1, 3, 5, 4, 6, 7","1, 2, 3, 4, 5, 6, 7","5, 1, 2, 3, 4, 6, 7"],"a":2,"x":"Permission first, then identify, isolate and secure, notice, then prove – test – re-prove.","r":"","n":"","k":1000200.0,"f":"GN3 1.1 (Safety) refers you to GS38, HSR25 and Electrical Safety First Best Practice Guide No.2 for safe isolation; index 'isolation'.","w":{"1":"You identified before getting permission and proved the indicator before fitting the notice.","0":"The caution notice goes on when you lock off, not after testing.","3":"Proving the indicator comes after isolating and securing, not before permission."}},{"id":"iv3.2","t":"1","c":0,"q":"Where must the absence of voltage be confirmed before work starts?","s":"","o":["At the consumer unit only","At the supply cut-out","At the meter","At the point of work"],"a":3,"x":"You may have isolated the wrong circuit, or there may be a second supply. Only a test at the point of work proves that what you will touch is dead.","r":"","n":"","k":1000201.0,"f":"GN3 1.1 (Safety) refers you to GS38, HSR25 and Electrical Safety First Best Practice Guide No.2 for safe isolation; index 'isolation'.","w":{"0":"The board shows the device is off, not that the conductors you'll touch are dead.","2":"The meter is upstream of the installation; it says nothing about the point of work.","1":"The cut-out isn't where you'll work; test at the point of work."}},{"id":"iv3.3","t":"1","c":0,"q":"Why is the voltage indicator proved before testing for dead?","s":"","o":["To check the battery of the multifunction tester","To calibrate it","To confirm it is working, so a zero reading means the circuit is really dead","To warm it up"],"a":2,"x":"A faulty indicator reads zero on a live circuit. Proving it on a known source first means a zero reading can be trusted.","r":"","n":"","k":1000202.0,"f":"GN3 1.1 (Safety) refers you to GS38, HSR25 and Electrical Safety First Best Practice Guide No.2 for safe isolation; index 'isolation'.","w":{"3":"Voltage indicators don't need warming up; proving checks they work.","0":"The indicator is a separate device; this isn't about the tester's battery.","1":"Proving isn't calibration; it only confirms the indicator responds to voltage."}},{"id":"iv3.4","t":"1","c":0,"q":"Why is a test between neutral and earth included when proving a single-phase circuit dead?","s":"","o":["To check the RCD","To measure Ze","The neutral could be live because of a borrowed or shared neutral, or a fault","It is only needed on TT systems"],"a":2,"x":"A neutral shared with another circuit carries current when that circuit is on, and can give a shock when separated. N–E is always included.","r":"","n":"","k":1000203.0,"f":"GN3 1.1 (Safety) refers you to GS38, HSR25 and Electrical Safety First Best Practice Guide No.2 for safe isolation; index 'isolation'.","w":{"3":"A borrowed neutral can occur on any system, not just TT.","1":"Ze is measured with a loop tester, not by a dead test.","0":"RCDs aren't checked during proving dead."}},{"id":"iv3.5","t":"1","c":0,"q":"What is the main reason safe isolation is carried out?","s":"","o":["To make Zs readings easier","To allow uninsulated tools to be used","To prevent death or injury from electric shock and burns","To prevent damage to test instruments"],"a":2,"x":"Safe isolation exists to protect people. It is the practical way of meeting the Electricity at Work Regulations when working on equipment made dead.","r":"","n":"","k":1000204.0,"f":"GN3 1.1 (Safety) refers you to GS38, HSR25 and Electrical Safety First Best Practice Guide No.2 for safe isolation; index 'isolation'.","w":{"3":"Protecting instruments isn't the purpose; protecting people is.","1":"Isolation isn't about allowing uninsulated tools; it prevents shock and burns.","0":"Zs is a live test; isolation is about people's safety."}},{"id":"iv3.6","t":"1","c":0,"q":"Which regulation of the Electricity at Work Regulations 1989 requires people to be competent to prevent danger?","s":"","o":["Regulation 4","Regulation 16","Regulation 12","Regulation 14"],"a":1,"x":"Reg 16: persons must have the technical knowledge or experience to prevent danger, or be under appropriate supervision.","r":"","n":"","k":1000205.0,"f":"GN3 1.2 (Required competence) and 4.9, which quotes EAWR Regulation 16 (persons to be competent); index 'competence'.","w":{"0":"Reg 4 covers systems, work activities and protective equipment.","2":"Reg 12 covers means of cutting off supply and isolation.","3":"Reg 14 covers work on or near live conductors."}},{"id":"iv3.7","t":"1","c":0,"q":"A caution notice at a point of isolation should:","s":"","o":["State the installation's Ze","Be removed once the circuit is proved dead","Be fitted only on three-phase isolators","Warn that work is in progress and the circuit must not be switched on"],"a":3,"x":"The notice tells others why the circuit is off and not to re-energise it. It stays until the work is finished.","r":"","n":"","k":1000206.0,"f":"GN3 1.1 (Safety) refers you to GS38, HSR25 and Electrical Safety First Best Practice Guide No.2 for safe isolation; index 'isolation'.","w":{"1":"The notice stays until the work is finished, not just until proved dead.","0":"Ze has no place on a caution notice.","2":"Notices are needed at every point of isolation, single- or three-phase."}},{"id":"iv3.8","t":"2","c":0,"q":"Who should carry out the inspection and testing of an electrical installation?","s":"","o":["Any person employed by the installer","A skilled person competent in verification","The distribution network operator","The client"],"a":1,"x":"Reg 641.6: verification shall be made by a skilled person, or persons, competent in such work.","r":"","n":"","k":1000207.0,"f":"GN3 1.2 (Required competence), Reg 641.6; index 'competence'.","w":{"0":"Being employed by the installer doesn't make someone competent in verification.","3":"The client isn't normally a skilled person competent in verification.","2":"The DNO doesn't verify the consumer's installation."}},{"id":"iv3.9","t":"2","c":0,"q":"What precaution must be taken during initial verification?","s":"","o":["Test only outside working hours","Ensure no danger to persons or livestock and no damage to property or equipment","Use only an insulation resistance tester","Disconnect all main bonding before testing"],"a":1,"x":"BS 7671 Chapter 64: precautions shall be taken to avoid danger to persons and livestock, and to avoid damage to property and installed equipment, during inspection and testing.","r":"","n":"","k":1000208.0,"f":"GN3 1.2, Reg 641.4(a): prevent danger to persons or livestock and prevent property damage; index 'precautions'.","w":{"0":"Timing may help, but the requirement is to avoid danger and damage.","3":"Bonding must stay connected; removing it creates danger.","2":"Several instruments are used in verification; this isn't a precaution against danger."}},{"id":"iv3.10","t":"2","c":0,"q":"A new circuit is added to an existing installation. Besides testing the new circuit, what must be checked on the existing installation?","s":"","o":["That the existing installation has a current EIC","Nothing","That every existing circuit has been re-tested","That the earthing and bonding arrangements are adequate for the new work"],"a":3,"x":"The new circuit relies on the existing earthing and bonding. If they are inadequate, the addition can't be certified as safe, and defects are recorded on the certificate.","r":"","n":"","k":1000209.0,"f":"GN3 1.4 (Additions and alterations) and the EIC 'Comments on existing installation'; index 'additions'.","w":{"1":"An addition relies on the existing earthing and bonding, so they must be checked.","2":"Every existing circuit needn't be re-tested; only arrangements the new work relies on.","0":"An existing EIC isn't required; the earthing and bonding are what must be adequate."}},{"id":"iv3.11","t":"3","c":0,"q":"In what order are inspection and testing carried out during initial verification?","s":"","o":["Inspection, then testing","Either order","At the same time","Testing, then inspection"],"a":0,"x":"Reg 642.1: inspection shall precede testing, and is normally done with that part of the installation disconnected from the supply.","r":"","n":"","k":1000210.0,"f":"BS 7671 Reg 642.1; GN3 2.5 (Initial inspection) and 2.6.4 sequence; index 'inspection'.","w":{"3":"Testing first could energise an installation with visible faults.","2":"They aren't simultaneous; inspection is completed first.","1":"The order is fixed: inspection precedes testing."}},{"id":"iv3.12","t":"3","c":0,"q":"Where practicable, where should the main protective bonding connection to a gas installation pipe be made?","s":"","o":["Within 600 mm of the meter outlet, on the consumer's side","Within 3 m of the meter","Anywhere on the pipework","On the supply side of the meter"],"a":0,"x":"Reg 544.1.2: on the consumer's side, before any branch, within 600 mm of the meter outlet where practicable.","r":"","n":"","k":1000211.0,"f":"BS 7671 Reg 544.1.2; GN3 2.5.3 checklist lists main bonding connections (543.3.2; 544.1.2). Index 'main bonding'.","w":{"3":"Bonding is on the consumer's side of the meter, not the supply side.","2":"It must be before any branch and close to the meter, not anywhere.","1":"The limit is 600 mm, not 3 m."}},{"id":"iv3.13","t":"3","c":1,"q":"A TN-S installation has a 16 mm² copper earthing conductor. What is the minimum size of main protective bonding conductor?","s":"","o":["25 mm²","10 mm²","16 mm²","6 mm²"],"a":1,"x":"Reg 544.1.1: not less than half the csa of the earthing conductor, minimum 6 mm².<br>16 ÷ 2 = 8 mm², so the next standard size up: 10 mm².","r":"","n":"","k":1000212.0,"f":"BS 7671 Reg 544.1.1; GN3 2.5.3 checklist item 'main protective bonding conductor sizes (544.1)'. Index 'main bonding'.","w":{"3":"6 mm² is the minimum, but half of 16 is 8, so 6 is too small.","2":"16 mm² matches the earthing conductor; only half is required, rounded up to 10.","0":"25 mm² is bigger than needed; half of 16 rounds up to 10."}},{"id":"iv3.14","t":"3","c":0,"q":"Which notice must be fitted at the origin of an installation that includes RCDs?","s":"","o":["A 'Safety Electrical Connection' label","A notice asking users to test the RCD regularly with its test button","A dual-supply warning notice","A voltage warning notice"],"a":1,"x":"Reg 514.12.2: a notice advising the user to test RCDs regularly (typically six-monthly) using the test button.","r":"","n":"","k":1000213.0,"f":"GN3 2.5.2, Figure 2.6, instruction notice required by Reg 514.12.2; index 'RCD notice'.","w":{"3":"A voltage warning is for unexpected voltages (514.10.1), not RCDs.","2":"A dual-supply notice is for alternative supplies, not RCDs.","0":"The 'Safety Electrical Connection' label is for earthing and bonding connections."}},{"id":"iv3.15","t":"3","c":0,"q":"A cable is concealed in a wall at a depth of 25 mm in a dwelling. Which TWO of the following would satisfy BS 7671? (Select TWO)","s":"","o":["A cable with an earthed metallic covering","A cable with a larger cpc","Any cable run diagonally","Additional protection by a 30 mA RCD, with the cable in a prescribed zone"],"a":[0,3],"x":"Reg 522.6.202: earthed metallic covering, earthed conduit or trunking, or mechanical protection; or run in the prescribed zones with 30 mA RCD protection.","r":"","n":"","k":1000214.0,"f":"GN3 2.5.2, concealed cables and Figure 2.1 prescribed zones (Reg 522.6.202); index 'prescribed zones'.","w":{"2":"Diagonal runs are outside the prescribed zones, so they're more at risk.","1":"A larger cpc gives no protection against nails and screws."}},{"id":"iv3.16","t":"3","c":0,"q":"What is the minimum degree of protection for the front of a distribution board enclosure (not the top surface)?","s":"","o":["IPX4","IP2X or IPXXB","IP4X or IPXXD","IP65"],"a":1,"x":"Reg 416.2.1: barriers or enclosures at least IP2X / IPXXB. Readily accessible top surfaces need IP4X / IPXXD.","r":"","n":"","k":1000215.0,"f":"GN3 2.5.2, barriers or enclosures (Reg 416.2), IPXXB or IP2X; index 'IP code'.","w":{"2":"IP4X/IPXXD is for readily accessible top surfaces, not the front.","0":"IPX4 is a water rating, not the basic protection requirement.","3":"IP65 isn't required for an indoor board front."}},{"id":"iv3.17","t":"3","c":0,"q":"Equipment operates at 400 V in a place where that voltage would not normally be expected. What must be fitted?","s":"","o":["An RCD test notice","A notice stating the maximum voltage present","Nothing","A periodic inspection notice"],"a":1,"x":"Reg 514.10.1: a warning of the maximum voltage present, visible before access to live parts is gained.","r":"","n":"","k":1000216.0,"f":"GN3 2.5.2, Figure 2.4, warning notice required by Reg 514.10.1; index 'voltage warning'.","w":{"0":"An RCD notice tells users to test RCDs; it doesn't warn of voltage.","3":"A periodic inspection notice gives the retest date, not a voltage warning.","2":"BS 7671 requires a warning where unexpected voltages are present."}},{"id":"iv3.18","t":"3","c":0,"q":"Which item is checked by sight rather than by touch?","s":"","o":["Security of a cable clip","Correct identification of conductors","Tightness of a terminal screw","Firmness of a socket fixing"],"a":1,"x":"Identification (colours, markings, labels) is seen. Tightness and security are felt.","r":"","n":"","k":1000217.0,"f":"GN3 2.5.3 checklist, 'General wiring accessories' items (f) identification and (h) tight terminals; index 'identification'.","w":{"2":"Tightness is felt, not seen.","0":"Clip security is checked by touch.","3":"Firmness of fixing is checked by touch."}},{"id":"iv3.19","t":"4","c":1,"q":"BS EN 61557-4 requires a continuity tester to have an open-circuit voltage of:","s":"","o":["500 V","4 V to 24 V","250 V","50 V to 100 V"],"a":1,"x":"Continuity testers: open-circuit voltage 4–24 V (AC or DC), test current at least 200 mA.","r":"","n":"","k":1000218.0,"f":"GN3 4.3 (Low-resistance ohmmeters): no-load voltage 4–24 V, at least 200 mA (BS EN 61557-4); index 'continuity tester'.","w":{"3":"50–100 V isn't the continuity tester range.","2":"250 V is an insulation test voltage.","0":"500 V is the insulation test voltage."}},{"id":"iv3.20","t":"4","c":1,"q":"An insulation resistance tester must be able to maintain its test voltage while delivering a current of:","s":"","o":["1 µA","200 mA","1 A","1 mA"],"a":3,"x":"BS EN 61557-2: the instrument must hold its nominal test voltage with a 1 mA load.","r":"","n":"","k":1000219.0,"f":"GN3 4.4 (Insulation resistance testers): instruments to BS EN 61557-2; the 1 mA figure is in that standard. Index 'insulation resistance tester'.","w":{"0":"1 µA is far too small a load.","1":"200 mA is the continuity tester minimum, not insulation.","2":"1 A isn't the insulation tester requirement."}},{"id":"iv3.21","t":"1","c":0,"q":"Before testing begins in an occupied office, who should be told?","s":"","o":["The person responsible for the premises and people who may be affected","Only the electricity supplier","Only the fire brigade","Nobody"],"a":0,"x":"Testing causes loss of supply and can put test voltages on exposed parts. Agree times with the responsible person and warn occupants.","r":"","n":"","k":1000220.0,"f":"GN3 1.1 (Safety): agree a work programme with the client and plan isolation with premises management; index 'safety'.","w":{"3":"Testing affects supplies and people; the responsible person must be told.","1":"The supplier doesn't need telling for routine testing.","2":"The fire brigade isn't involved."}},{"id":"iv3.22","t":"4","c":0,"q":"What proves that a test instrument was accurate at a known date?","s":"","o":["Its CE mark","A calibration certificate","A GS38 label","The manufacturer's manual"],"a":1,"x":"A calibration certificate from an accredited source proves accuracy at that date. Regular accuracy checks between calibrations show it has stayed accurate.","r":"","n":"","k":1000221.0,"f":"GN3 4.2 (Instrument accuracy): calibration traceable to National Standards, UKAS laboratories; index 'calibration'.","w":{"0":"A CE mark shows conformity, not measured accuracy.","3":"A manual gives specifications, not proof of accuracy.","2":"GS38 is about lead safety, not accuracy."}},{"id":"iv3.23","t":"4","c":0,"q":"Select the correct order for these tests on initial verification:\n1. Earth fault loop impedance\n2. Insulation resistance\n3. Continuity of ring final circuit conductors\n4. Functional testing\n5. Polarity","s":"","o":["3, 5, 2, 4, 1","5, 3, 2, 1, 4","2, 3, 5, 1, 4","3, 2, 5, 1, 4"],"a":3,"x":"Dead: ring continuity, insulation resistance, polarity. Live: earth fault loop impedance. Functional testing comes last.","r":"","n":"","k":1000222.0,"f":"GN3 2.6.4 (The sequence of tests) and Figure 2.12; index 'sequence of tests'.","w":{"2":"Insulation resistance doesn't come before ring continuity.","0":"Polarity comes after insulation, and functional testing is last.","1":"Polarity doesn't come first; continuity does."}},{"id":"iv3.24","t":"7","c":0,"q":"Which TWO actions should be taken before an insulation resistance test? (Select TWO)","s":"","o":["Switch on all loads","Remove lamps and neon indicators, or isolate them","Energise the circuit","Disconnect or isolate voltage-sensitive equipment"],"a":[1,3],"x":"Electronic equipment can be damaged by 500 V DC, and connected lamps or neons give a false low reading between L and N.","r":"","n":"","k":1000223.0,"f":"GN3 2.6.7 (Insulation resistance) items (b) and (c) before testing; index 'insulation resistance'.","w":{"0":"Loads must be disconnected, or they give a false low reading or are damaged.","2":"Insulation testing is a dead test; never energise the circuit."}},{"id":"iv3.25","t":"4","c":0,"q":"Which is a live test?","s":"","o":["Continuity of protective conductors","Insulation resistance","Earth fault loop impedance","Polarity (dead check)"],"a":2,"x":"Earth fault loop impedance needs the supply present. The others are done dead.","r":"","n":"","k":1000224.0,"f":"GN3 2.6.4 and Figure 2.12: earth fault loop impedance (2.6.15) needs the supply connected; index 'sequence of tests'.","w":{"0":"Protective conductor continuity is a dead test.","3":"The polarity dead check is done before energising.","1":"Insulation resistance is a dead test."}},{"id":"iv3.26","t":"5","c":0,"q":"For the R1 + R2 continuity method on a radial circuit, what is linked at the distribution board?","s":"","o":["Line and neutral","Line and cpc","All three conductors","Neutral and cpc"],"a":1,"x":"Link line to cpc at the board, then measure L–E at each point. The highest reading, at the far end, is R1 + R2. It also proves polarity.","r":"","n":"","k":1000225.0,"f":"GN3 2.6.5, test method 1 and Figure 2.13 (temporary link line to cpc); index 'continuity of protective conductors'.","w":{"0":"Linking line and neutral is for ring step 2, not R1 + R2.","3":"Neutral and cpc gives Rn + R2, not R1 + R2.","2":"Linking all three would short everything and prove nothing."}},{"id":"iv3.27","t":"5","c":1,"q":"A lighting circuit is wired in 1.5/1.0 mm² twin and cpc cable, 30 m long. What is the expected R1 + R2 at 20°C?","s":"","o":["0.91 Ω","1.09 Ω","0.36 Ω","0.54 Ω"],"a":0,"x":"GN3 Table B1: 1.5/1.0 = 30.20 mΩ/m.<br>30.20 × 30 = 906 mΩ = 0.91 Ω","r":"","n":"","k":1000226.0,"f":"GN3 Appendix B, Table B1: 1.5/1.0 = 30.20 mΩ/m at 20 °C; R = mΩ/m × L ÷ 1000. Index 'resistance of conductors'.","w":{"2":"0.36 Ω uses only the 1.5 mm² line value (12.10 mΩ/m).","3":"0.54 Ω uses only the 1.0 mm² cpc value (18.10 mΩ/m).","1":"You applied the 1.20 temperature multiplier; the question asks for 20 °C."}},{"id":"iv3.28","t":"5","c":1,"q":"A radial circuit in 2.5/1.5 mm² twin and cpc cable has a measured R1 + R2 of 0.39 Ω. What is its approximate length?","s":"","o":["20 m","32 m","53 m","7.6 m"],"a":0,"x":"L = R × 1000 ÷ mΩ/m<br>0.39 × 1000 = 390<br>390 ÷ 19.51 = 20 m","r":"","n":"","k":1000227.0,"f":"GN3 Appendix B, Table B1 and the formula L = R × 1000 ÷ mΩ/m; index 'resistance of conductors'.","w":{"3":"You multiplied by 19.51 instead of dividing.","1":"32 m uses only the 1.5 mm² value (12.10 mΩ/m).","2":"53 m uses only the 2.5 mm² value (7.41 mΩ/m)."}},{"id":"iv3.29","t":"5","c":1,"q":"A cooker circuit is wired in 6.0/2.5 mm² twin and cpc cable, 18 m long. What is the expected R1 + R2?","s":"","o":["0.33 Ω","0.13 Ω","0.19 Ω","0.06 Ω"],"a":2,"x":"GN3 Table B1: 6.0/2.5 = 10.49 mΩ/m.<br>10.49 × 18 = 189 mΩ = 0.19 Ω","r":"","n":"","k":1000228.0,"f":"GN3 Appendix B, Table B1: 6.0/2.5 = 10.49 mΩ/m; R = mΩ/m × L ÷ 1000. Index 'resistance of conductors'.","w":{"3":"0.06 Ω uses only the 6 mm² value (3.08 mΩ/m).","1":"0.13 Ω uses only the 2.5 mm² value (7.41 mΩ/m).","0":"0.33 Ω isn't from the 6.0/2.5 row; 10.49 × 18 ÷ 1000 = 0.19 Ω."}},{"id":"iv3.30","t":"5","c":1,"q":"A shower circuit is wired in 10/4.0 mm² twin and cpc cable, 15 m long. What is the expected R1 + R2?","s":"","o":["0.28 Ω","0.07 Ω","0.03 Ω","0.10 Ω"],"a":3,"x":"GN3 Table B1: 10/4.0 = 6.44 mΩ/m.<br>6.44 × 15 = 97 mΩ = 0.10 Ω","r":"","n":"","k":1000229.0,"f":"GN3 Appendix B, Table B1: 10/4.0 = 6.44 mΩ/m; R = mΩ/m × L ÷ 1000. Index 'resistance of conductors'.","w":{"2":"0.03 Ω uses only the 10 mm² value (1.83 mΩ/m).","1":"0.07 Ω uses only the 4 mm² value (4.61 mΩ/m).","0":"0.28 Ω isn't from the 10/4.0 row; 6.44 × 15 ÷ 1000 = 0.10 Ω."}},{"id":"iv3.31","t":"6","c":0,"q":"Step 1 of a ring final circuit test gives r1 = 0.30 Ω and rn = 0.48 Ω. What is the most likely cause?","s":"","o":["A spur on the ring","A loose or high-resistance neutral connection on the ring","The cpc is smaller than the live conductors","Line and neutral reversed at a socket"],"a":1,"x":"r1 and rn should agree within 0.05 Ω because they are the same size and length. A higher rn points to a poor neutral connection.","r":"","n":"","k":1000230.0,"f":"GN3 2.6.6, step 1: end-to-end r1 and rn should agree within 0.05 Ω; index 'ring final circuit'.","w":{"2":"cpc size affects r2, not rn.","3":"A reversal at a socket doesn't change end-to-end readings.","0":"A spur isn't in the ring loop, so it doesn't affect end-to-end values."}},{"id":"iv3.32","t":"6","c":0,"q":"During step 2 of a ring final circuit test, one socket gives an over-range reading. What is a likely cause?","s":"","o":["The socket is a spur","Line and neutral reversed at that socket","The cross-connection at the board is wrong","Neutral and cpc reversed at that socket"],"a":3,"x":"Step 2 measures L to N. If N and cpc are swapped at the socket you are measuring L to cpc, which are not linked in step 2: over-range. L/N reversal would still read normally in step 2.","r":"","n":"","k":1000231.0,"f":"GN3 2.6.6, step 2 (line and neutral cross-connected); index 'ring final circuit'.","w":{"1":"L/N reversal still reads normally in step 2; it shows in step 3.","0":"A spur reads slightly higher, not over-range.","2":"A wrong cross-connection gives readings rising to mid-ring, not over-range at one socket."}},{"id":"iv3.33","t":"7","c":1,"q":"Four circuits give L–E insulation resistances of 80 MΩ, 40 MΩ, 20 MΩ and 160 MΩ. What is the combined value?","s":"","o":["75 MΩ","20 MΩ","300 MΩ","10.7 MΩ"],"a":3,"x":"1/R = 1/80 + 1/40 + 1/20 + 1/160<br>= 0.0125 + 0.025 + 0.05 + 0.00625 = 0.09375<br>R = 1 ÷ 0.09375 = 10.7 MΩ","r":"","n":"","k":1000232.0,"f":"GN3 2.6.7 (Insulation resistance): circuits tested together are in parallel; use 1/Rt = 1/R1 + 1/R2 + …. Index 'insulation resistance'.","w":{"1":"20 MΩ is the lowest circuit; the combined value is always lower than that.","0":"75 MΩ is the average; parallel resistances don't average.","2":"300 MΩ is the series sum; parallel paths reduce the total."}},{"id":"iv3.34","t":"7","c":1,"q":"What are the test voltage and minimum insulation resistance for a 400 V three-phase circuit?","s":"","o":["1000 V DC, 1.0 MΩ","500 V DC, 1.0 MΩ","500 V DC, 2.0 MΩ","250 V DC, 0.5 MΩ"],"a":1,"x":"400 V is within 'up to and including 500 V', so 500 V DC and a minimum of 1.0 MΩ (Table 64).","r":"","n":"","k":1000233.0,"f":"GN3 2.6.7, Table 2.9 (Table 64 of BS 7671), 'up to and including 500 V' row; index 'insulation resistance'.","w":{"3":"250 V, 0.5 MΩ is for SELV/PELV.","0":"1000 V is for circuits above 500 V; 400 V is below that.","2":"2.0 MΩ isn't a Table 64 minimum; it's 1.0 MΩ."}},{"id":"iv3.35","t":"8","c":0,"q":"Which TWO methods confirm polarity before a circuit is energised? (Select TWO)","s":"","o":["A visual check of conductor identification at terminations","An earth fault loop impedance tester","An RCD tester","A low-resistance ohmmeter using the R1 + R2 method"],"a":[0,3],"x":"Before energising, polarity is proved with the continuity tester (R1 + R2 at each point) backed by visual inspection of conductor colours at each termination.","r":"","n":"","k":1000234.0,"f":"GN3 2.6.12 (Polarity testing): ohmmeter or visual check of core colours at terminations; index 'polarity'.","w":{"1":"A loop tester needs the supply on, so it isn't a pre-energising check.","2":"An RCD tester needs the supply on and doesn't check polarity."}},{"id":"iv3.36","t":"9","c":1,"q":"When testing an earth electrode 3 m long by the fall-of-potential method, how far away should the current spike be placed, as a minimum?","s":"","o":["100 m","10 m","30 m","3 m"],"a":2,"x":"GN3: the current spike is placed at least 10 times the electrode length away.<br>10 × 3 m = 30 m","r":"","n":"","k":1000235.0,"f":"GN3 2.6.13, test method E1: current spike at least ten times the electrode's maximum dimension (e.g. 30 m for 3 m); index 'earth electrode'.","w":{"3":"3 m is the electrode length; the resistance areas would overlap.","1":"10 m is the multiplier, not the distance; 10 × 3 m = 30 m.","0":"100 m is more than the minimum."}},{"id":"iv3.37","t":"10","c":0,"q":"Which conditions apply when measuring Ze?","s":"","o":["RCDs bridged out","All circuits on load","Main switch closed, all bonding connected","Main switch open, earthing conductor disconnected from the MET, installation isolated and secured"],"a":3,"x":"Opening the main switch and disconnecting the earthing conductor removes parallel paths. Keep the installation isolated while the earth is disconnected, and reconnect it before re-energising.","r":"","n":"","k":1000236.0,"f":"GN3 2.6.15, 'Measurement of external EFLI (Ze)' and Figure 2.31; index 'Ze'.","w":{"2":"With bonding connected, parallel paths lower the reading.","1":"Loads have nothing to do with measuring Ze.","0":"RCDs are never bridged; Ze is measured with the main switch open."}},{"id":"iv3.38","t":"10","c":0,"q":"What maximum Ze does a distribution network operator typically declare for a TT supply?","s":"","o":["200 Ω","0.8 Ω","0.35 Ω","21 Ω"],"a":3,"x":"TT: 21 Ω for the supply part, excluding the installation's own earth electrode.","r":"","n":"","k":1000237.0,"f":"GN3 2.3 (Required information) item (g) lists Ze as supply information from the DNO; GN3 2.6.15 covers measuring it. Index 'Ze'.","w":{"2":"0.35 Ω is the TN-C-S figure.","1":"0.8 Ω is the TN-S figure.","0":"200 Ω isn't the DNO's declared value; TT is 21 Ω."}},{"id":"iv3.39","t":"10","c":1,"q":"A lighting circuit has Ze = 0.22 Ω and R1 + R2 = 0.91 Ω. What is the expected Zs?","s":"","o":["0.69 Ω","0.91 Ω","1.13 Ω","1.36 Ω"],"a":2,"x":"Zs = Ze + (R1 + R2) = 0.22 + 0.91 = 1.13 Ω","r":"","n":"","k":1000238.0,"f":"GN3 2.6.15 and Appendix B: Zs = Ze + (R1 + R2); index 'earth fault loop impedance'.","w":{"0":"You subtracted Ze; Zs is the sum.","1":"0.91 Ω is R1 + R2 only; add Ze.","3":"You multiplied by 1.2; expected Zs is simply 0.22 + 0.91 = 1.13 Ω."}},{"id":"iv3.40","t":"10","c":1,"q":"A cooker circuit is protected by a 40 A Type B circuit-breaker (tabulated maximum Zs 1.09 Ω). The measured Zs is 0.95 Ω. Is it acceptable?","s":"","o":["Yes, because it is below 1.37 Ω","No, because it exceeds the maximum measured value of 0.87 Ω","Yes, because it is below 1.09 Ω","No, because it exceeds 0.44 Ω"],"a":1,"x":"Compare the measurement against 0.8 of the tabulated value:<br>1.09 × 0.8 = 0.87 Ω<br>0.95 Ω is higher, so it fails.","r":"","n":"","k":1000239.0,"f":"GN3 2.6.15 item (d), factor of 0.8 (Appendix A2); Appendix A Table A5 for circuit-breakers. Index 'maximum measured Zs'.","w":{"2":"1.09 Ω is tabulated; measured values are compared with 0.8 of it.","0":"1.37 Ω is the tabulated value for a 32 A Type B.","3":"0.44 Ω is the maximum measured value for a 40 A Type C, not Type B."}},{"id":"iv3.41","t":"10","c":1,"q":"What is the maximum measured Zs for a 6 A Type B circuit-breaker (tabulated maximum 7.28 Ω)?","s":"","o":["2.91 Ω","3.64 Ω","5.82 Ω","7.28 Ω"],"a":2,"x":"7.28 × 0.8 = 5.82 Ω","r":"","n":"","k":1000240.0,"f":"GN3 2.6.15 item (d), factor of 0.8 (Appendix A2); Appendix A Table A5 for circuit-breakers. Index 'maximum measured Zs'.","w":{"0":"2.91 Ω is the maximum measured value for a 6 A Type C, not Type B.","1":"You halved 7.28; multiply by 0.8.","3":"7.28 Ω is the tabulated value; measured values are compared with 0.8 of it."}},{"id":"iv3.42","t":"11","c":0,"q":"Which value of prospective fault current is recorded at the origin?","s":"","o":["The lower of PSCC and PEFC","The average of PSCC and PEFC","The higher of PSCC and PEFC","PEFC only"],"a":2,"x":"Record the greater of the prospective short-circuit current (L–N) and prospective earth fault current (L–E), since devices must be able to break the worst case.","r":"","n":"","k":1000241.0,"f":"GN3 2.6.16, 'Recording the prospective fault current': record the greater of PSCC and PEFC; index 'prospective fault current'.","w":{"0":"The lower value could hide a fault current the devices can't break.","1":"An average isn't used; record the worst case.","3":"PEFC alone could miss a higher PSCC."}},{"id":"iv3.43","t":"11","c":0,"q":"The circuit-breakers in a consumer unit are rated 6 kA. The measured prospective fault current is 2.1 kA. What does this show?","s":"","o":["The devices can safely break the fault current","The devices must be replaced with 10 kA types","The RCD will not trip","Ze is too high"],"a":0,"x":"The rated breaking capacity (6 kA) is greater than the prospective fault current (2.1 kA), so the devices can interrupt a fault safely.","r":"","n":"","k":1000242.0,"f":"GN3 2.6.16: breaking capacity must be greater than the highest prospective fault current; index 'breaking capacity'.","w":{"1":"6 kA is already above 2.1 kA; no upgrade is needed.","3":"PFC doesn't show whether Ze is too high.","2":"PFC says nothing about RCD operation."}},{"id":"iv3.44","t":"12","c":0,"q":"What test current is used for the 1 × IΔn test on a 100 mA RCD?","s":"","o":["100 mA","500 mA","30 mA","50 mA"],"a":0,"x":"1 × IΔn means the RCD's own rated residual current: 100 mA.","r":"","n":"","k":1000243.0,"f":"GN3 2.6.18, Table 2.17a: 1 × IΔn test at the RCD's rated residual current; index 'RCD'.","w":{"2":"30 mA is a different rating; this RCD is 100 mA.","3":"50 mA is ½ × IΔn, the no-trip test.","1":"500 mA is 5 × IΔn."}},{"id":"iv3.45","t":"12","c":0,"q":"A 30 mA RCD trips when tested at ½ × IΔn. What does this indicate?","s":"","o":["The test button is faulty","It is working correctly","It may be over-sensitive or there is standing earth leakage, and must be investigated","The loop impedance is too high"],"a":2,"x":"An RCD should not trip at half its rating. Tripping points to excessive leakage on the circuit or a faulty device, which could cause unwanted tripping.","r":"","n":"","k":1000244.0,"f":"GN3 2.6.18, Table 2.17a: at ½ × IΔn 'RCD should not trip'; 4.7 on over-sensitive RCDs. Index 'RCD'.","w":{"1":"An RCD shouldn't trip at half rating; tripping isn't normal.","3":"Loop impedance doesn't affect the ½ × IΔn result.","0":"The test button isn't involved in an instrument test."}},{"id":"iv3.46","t":"12","c":0,"q":"What maximum IΔn must an RCD have to provide additional protection?","s":"","o":["10 mA","300 mA","100 mA","30 mA"],"a":3,"x":"Reg 415.1.1: additional protection needs an RCD with a rated residual operating current not exceeding 30 mA.","r":"","n":"","k":1000245.0,"f":"GN3 2.6.18 (Operation of RCDs, additional protection, Reg 643.8) and BS 7671 Reg 415.1.1; index 'additional protection'.","w":{"0":"10 mA is allowed but isn't the maximum; the limit is 30 mA.","2":"100 mA is too high for additional protection.","1":"300 mA is for fire protection, not additional protection."}},{"id":"iv3.47","t":"10","c":1,"q":"What is the maximum disconnection time for a 32 A final circuit in a TN system at 230 V?","s":"","o":["5 s","0.4 s","0.2 s","1 s"],"a":1,"x":"Table 41.1: TN final circuits up to 32 A (63 A with sockets) 0.4 s; TT 0.2 s.","r":"","n":"","k":1000246.0,"f":"GN3 2.6.14 (ADS) refers to BS 7671 Table 41.1; index 'disconnection times'.","w":{"2":"0.2 s is for TT final circuits.","3":"1 s is for TT distribution circuits.","0":"5 s is for TN distribution circuits."}},{"id":"iv3.48","t":"12","c":0,"q":"A three-phase motor is connected with the wrong phase sequence. What happens?","s":"","o":["It runs at half speed","It runs normally","It will not start","It runs in reverse"],"a":3,"x":"Swapping any two phases reverses the rotating field, so the motor runs backwards. That is why phase sequence is checked.","r":"","n":"","k":1000247.0,"f":"GN3 2.6.17 (Phase sequence testing), phase rotation and Figure 2.32; index 'phase rotation'.","w":{"1":"It doesn't run normally; it runs backwards.","2":"It still starts, just in the wrong direction.","0":"Speed is unchanged; only
