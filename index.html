<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Initial Verification exam trainer built on Guidance Note 3: GN3-order exams, calculation practice, progress tracking and tips.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="GN3 Trainer">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#1d6b4f">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>html,body{margin:0;padding:0}</style>
<title>GN3 Trainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#f3f5f7; --surface:#ffffff; --sunk:#e8ecf0; --line:#d3d9e0;
  --ink:#16202b; --muted:#566373; --faint:#8894a2;
  --accent:#0b5cad; --accent-ink:#ffffff; --accent-soft:#dcebfa;
  --flag:#b86a00; --flag-soft:#fbead0;
  --good:#1d7a45; --good-soft:#dcf1e3; --bad:#b3261e; --bad-soft:#f8dedb;
  --display:"IBM Plex Sans Condensed","Arial Narrow",Arial,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f141a; --surface:#172029; --sunk:#1e2833; --line:#2c3845;
  --ink:#e6ecf2; --muted:#a3b0bd; --faint:#6f7d8b;
  --accent:#5aa7f2; --accent-ink:#0b1622; --accent-soft:#1b3550;
  --flag:#f0a640; --flag-soft:#3a2a12;
  --good:#5cc98a; --good-soft:#16321f; --bad:#f07d74; --bad-soft:#3a1a18; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f141a; --surface:#172029; --sunk:#1e2833; --line:#2c3845;
  --ink:#e6ecf2; --muted:#a3b0bd; --faint:#6f7d8b;
  --accent:#5aa7f2; --accent-ink:#0b1622; --accent-soft:#1b3550;
  --flag:#f0a640; --flag-soft:#3a2a12;
  --good:#5cc98a; --good-soft:#16321f; --bad:#f07d74; --bad-soft:#3a1a18; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55}
.wrap{max-width:880px;margin:0 auto;padding-inline:16px;padding-block:20px 48px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;letter-spacing:.01em}
h1{font-size:clamp(28px,5vw,40px);line-height:1.1}
h2{font-size:22px}
.eyebrow{font:600 12px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:var(--r);padding:10px 16px;font-weight:600}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.flagged{background:var(--flag-soft);border-color:var(--flag);color:var(--flag)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* Home */
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-block:20px}
.fact{background:var(--surface);padding:12px 14px}
.fact b{display:block;font:600 22px/1.2 var(--mono);font-variant-numeric:tabular-nums}
.fact span{font-size:13px;color:var(--muted)}
.papers{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.paper{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.paper h3{font-size:20px}
.paper .stat{font-size:13px;color:var(--muted);min-height:2.6em}
.paper .row .btn{flex:1;min-width:0}
.mode{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.mode button{border:0;background:none;padding:9px 14px;color:var(--muted);font-weight:600}
.mode button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.note{font-size:14px;color:var(--muted);max-width:65ch}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}

/* Exam */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar .in{max-width:880px;margin:0 auto;padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.bar .title{font:700 16px var(--display);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timer{font:600 18px var(--mono);font-variant-numeric:tabular-nums;padding:4px 10px;border-radius:6px;background:var(--sunk)}
.timer.low{background:var(--bad-soft);color:var(--bad)}
.progress{height:4px;background:var(--sunk)}
.progress i{display:block;height:100%;background:var(--accent);transition:width .2s}
.qhead{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline;margin-block:18px 10px}
.qnum{font:700 24px var(--display)}
.lo{font-size:13px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.scenario{background:var(--sunk);border-radius:6px;padding:10px 12px;font-size:14px}
.stem{font-size:17px;font-weight:500;max-width:70ch}
.instr{font:600 13px var(--body);color:var(--accent);letter-spacing:.02em}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:var(--r);padding:12px 14px}
.opt:hover{border-color:var(--accent)}
.opt .key{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--faint);display:grid;place-items:center;font:600 13px var(--mono);color:var(--muted)}
.opt.multi .key{border-radius:5px}
.opt[aria-checked="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt[aria-checked="true"] .key{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.right .key{background:var(--good);border-color:var(--good);color:var(--surface)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .key{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.opt span:last-child{min-width:0}
.explain{border-left:3px solid var(--line);padding:4px 0 4px 12px;font-size:14px}
.explain.ok{border-color:var(--good)} .explain.no{border-color:var(--bad)}
.explain b{display:block;margin-bottom:2px}
.nav{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.nav .grow{flex:1}
.map{margin-top:22px}
.map summary{cursor:pointer;font-weight:600;color:var(--muted);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px;margin-top:10px}
.cell{height:36px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font:600 13px var(--mono);position:relative}
.cell.done{background:var(--sunk);color:var(--ink)}
.cell.cur{border:2px solid var(--accent);color:var(--accent)}
.cell.fl::after{content:"";position:absolute;top:3px;right:3px;width:7px;height:7px;border-radius:50%;background:var(--flag)}
.cell.r{background:var(--good-soft);color:var(--good);border-color:var(--good)}
.cell.w{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;border:1px solid var(--line)}

/* Modal */
.scrim{position:fixed;inset:0;background:rgba(10,16,24,.5);display:grid;place-items:center;padding:16px;z-index:20}
.dialog{background:var(--surface);border-radius:12px;padding:20px;max-width:420px;width:100%;display:flex;flex-direction:column;gap:12px;border:1px solid var(--line)}

/* Results */
.score{display:flex;gap:20px;flex-wrap:wrap;align-items:center;margin-block:18px}
.big{font:600 56px/1 var(--mono);font-variant-numeric:tabular-nums}
.verdict{font:700 18px var(--display);padding:6px 12px;border-radius:6px;letter-spacing:.04em}
.verdict.pass{background:var(--good-soft);color:var(--good)}
.verdict.fail{background:var(--bad-soft);color:var(--bad)}
.meter{position:relative;height:12px;background:var(--sunk);border-radius:6px;margin-top:6px}
.meter i{display:block;height:100%;border-radius:6px}
.meter .pl{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--ink)}
.lorow{display:grid;grid-template-columns:minmax(0,1fr) 64px;gap:4px 12px;align-items:center;padding-block:6px}
.lorow .t{font-size:14px}
.lorow .n{font:600 14px var(--mono);text-align:right;font-variant-numeric:tabular-nums}
.lorow .meter{grid-column:1/-1;margin:0;height:8px}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}
.chip[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.review{display:flex;flex-direction:column;gap:12px;margin-top:12px}
.tag{font:600 12px var(--body);padding:2px 8px;border-radius:999px}
.tag.r{background:var(--good-soft);color:var(--good)} .tag.w{background:var(--bad-soft);color:var(--bad)} .tag.s{background:var(--sunk);color:var(--muted)}
@media (max-width:520px){.stem{font-size:16px}.big{font-size:44px}.bar .title{flex-basis:100%}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<style>
.top{position:sticky;top:0;z-index:6;background:var(--surface);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top .in{max-width:880px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font:700 17px var(--display);flex:1;min-width:0}
.tabs{display:inline-flex;background:var(--sunk);border-radius:var(--r);padding:3px}
.tabs button{border:0;background:none;color:var(--muted);font-weight:600;padding:7px 16px;border-radius:6px}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.hero{margin-block:8px 6px}.hero .note{margin-top:8px}
.modebar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-block:16px 4px}
.sec{margin:28px 0 12px}
.paper.hi{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.btn.sm{padding:7px 12px;font-size:14px}
.btn.danger{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.fact b small{font-size:14px;color:var(--muted)}
.pill{font:600 12px var(--body);padding:3px 9px;border-radius:999px;white-space:nowrap;background:var(--sunk);color:var(--muted)}
.pill.strong{background:var(--good-soft);color:var(--good)}.pill.ok{background:var(--flag-soft);color:var(--flag)}.pill.weak{background:var(--bad-soft);color:var(--bad)}
.tracker{padding:4px 16px}
.trk{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center;padding-block:12px;border-bottom:1px solid var(--line)}
.trk:last-child{border-bottom:0}
.trk .tn b{display:block;font-weight:600}.trk .tn small,.trow small,.hrow small{display:block;color:var(--muted);font-size:12px}
.trk .meter{grid-column:1/2;margin:0;height:8px}
.trk .btn{grid-column:2;grid-row:2}
.sw{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.sw h3{font-size:17px;margin-bottom:4px}
.panel h3{font-size:17px}
.kind{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
.kind b{display:block;font:600 24px var(--mono)}.kind span{font-size:13px;color:var(--muted)}
.hist{position:relative;display:flex;align-items:flex-end;gap:6px;height:120px;margin:12px 0 8px;border-bottom:1px solid var(--line)}
.hb{flex:1;max-width:40px;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
.hb i{display:block;width:100%;border-radius:4px 4px 0 0}.hb span{font:600 11px var(--mono);color:var(--muted);margin-top:2px}
.pl60{position:absolute;left:0;right:0;bottom:60%;border-top:1px dashed var(--faint)}
.hrow{display:flex;justify-content:space-between;gap:12px;padding-block:8px;border-top:1px solid var(--line);font-size:14px}
.hrow b{font:600 14px var(--mono);white-space:nowrap}.hrow b.g{color:var(--good)}.hrow b.b{color:var(--bad)}
.dialog.wide{max-width:560px;max-height:88vh;overflow:auto}
.tlist{display:flex;flex-direction:column;gap:6px}
.trow{display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:var(--r);padding:10px 12px}
.trow:hover{border-color:var(--accent)}
.work{margin-top:4px;font-variant-numeric:tabular-nums}.ref{margin-top:6px;color:var(--muted);font-size:13px}
@media (max-width:520px){.papers{grid-template-columns:1fr}.bar .title{flex-basis:100%}.top .in{gap:6px}.brand{flex-basis:100%;font-size:15px}.tabs{flex:1}.tabs button{flex:1;padding:7px 8px}}
.amd{display:inline-block;font:600 11px var(--mono);padding:1px 6px;border-radius:4px;background:var(--accent-soft);color:var(--accent);margin-left:4px;vertical-align:1px}
.tip{display:block;border-radius:var(--r);padding:10px 12px;background:var(--sunk);font-size:14px;margin-top:8px}
.tip b{display:block;margin-bottom:2px}.tip.wrong{background:var(--bad-soft)}.tip.wrong b{color:var(--bad)}
.tip.find{background:var(--accent-soft)}.tip.find b{color:var(--accent)}
.tip.method summary{cursor:pointer;list-style:none}.tip.method summary::-webkit-details-marker{display:none}
.tip.method summary b::after{content:" ▸";color:var(--muted)}.tip.method[open] summary b::after{content:" ▾"}
.tip ol,.panel.method ol,.tblock ul,.tip ul,.panel ul{margin:8px 0 4px;padding-left:20px}.tip li,.panel li{margin-bottom:4px}
.ex{margin-top:8px;padding:8px 10px;border-left:3px solid var(--accent);background:var(--surface);border-radius:4px;font-variant-numeric:tabular-nums}
.panel.method{margin-top:8px}.tblock{margin-top:12px}.tl{margin:8px 0;padding-left:20px}
.daily{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--accent);border-radius:var(--r);padding:14px 16px;margin-top:14px}
.daily>div:first-child{flex:1;min-width:160px}.daily b{display:block;font:700 18px var(--display)}.daily span{font-size:13px;color:var(--muted)}
.daily.done{border-color:var(--line)}.streak{text-align:center}.streak b{font:600 26px var(--mono)}
.cd{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start;margin-top:14px}.cd input{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);color:var(--ink)}
.cdn{text-align:center;min-width:90px}.cdn b{display:block;font:600 44px/1 var(--mono);color:var(--accent)}.cdn span{font-size:13px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.fcard{display:flex;flex-direction:column;gap:14px;justify-content:center;align-items:center;text-align:center;width:100%;min-height:300px;padding:24px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink)}
.fcard.back{background:var(--accent-soft);border-color:var(--accent)}.fc-t{font:600 22px/1.35 var(--display)}
.foot{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;margin-top:36px;padding-top:20px;border-top:1px solid var(--line)}
.btn.big{padding:14px 22px;font-size:16px;width:100%;max-width:360px}
.upd{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;background:var(--accent-soft);border:1px solid var(--accent);border-radius:var(--r);padding:12px 14px;width:100%;text-align:left}
.upd b{flex-basis:100%}.upd span{flex:1;font-size:14px;color:var(--muted)}.upd.top{margin-bottom:14px}
.stem{white-space:pre-line}.scenario{white-space:pre-line}
</style>

</head>

<script>
const QS=[{"id":"g1.n1.00","t":"1","c":0,"q":"According to GN3, what should be agreed and put in place before any inspection and testing work begins?","o":["A work programme agreed with the client, and a health and safety plan including risk assessments and method statements","A completed Electrical Installation Certificate for the existing installation","Written confirmation from the DNO that the supply can be withdrawn","A Minor Electrical Installation Works Certificate for each circuit to be tested"],"a":0,"x":"GN3 1.1 starts by saying a work programme should be agreed with the client, and a health and safety plan (risk assessments and method statements) agreed and put in place, before any work begins.","r":"GN3 1.1","n":"","k":403,"f":"Chapter 1, Section 1.1 Safety, first paragraph. Index: Safety during testing.","w":{"1":"The EIC is issued after initial verification. It isn't something you need before starting.","2":"GN3 says to plan isolation with the premises management. A DNO letter isn't required.","3":"Minor Works Certificates record small additions. They aren't produced before testing begins."}},{"id":"g2.n1.01","t":"1","c":0,"q":"GN3 says the testing safety procedures in which HSE guidance note should be followed when using test equipment on low voltage systems?","o":["HSR25, guidance on the Electricity at Work Regulations 1989","GS38, Electrical test equipment for use on low voltage electrical systems","HSG85, Electricity at work: Safe working practices","BS EN 61557, Equipment for testing protective measures"],"a":1,"x":"GN3 1.1 says the testing safety procedures in HSE Guidance Note GS38 (Electrical test equipment for use on low voltage electrical systems) should be observed.","r":"GN3 1.1","n":"","k":424,"f":"Section 1.1 Safety, third paragraph; also Section 4.1. Index: Note GS38.","w":{"0":"HSR25 is the guidance on the EAWR, including live and dead working. It isn't the test equipment guidance.","2":"HSG85 is about managers setting rules and procedures for electrical work, not about test equipment.","3":"BS EN 61557 is a performance standard for instruments, not an HSE guidance note."}},{"id":"g3.n1.02","t":"1","c":0,"q":"An inspector is about to carry out continuity and insulation resistance tests on a final circuit. What does GN3 1.1 say about the state of the circuit?","o":["It may stay live as long as GS38-compliant leads and probes are used","Switching off the circuit-breaker is enough. Locking off is only needed for long jobs","Where the testing does not need it to be live, it should be made dead and safely isolated","It should stay energized so the RCD continues to provide additional protection"],"a":2,"x":"GN3 1.1: where testing does not require the equipment or part of an installation to be live, it should be made dead and safely isolated. Continuity and insulation resistance are dead tests.","r":"GN3 1.1","n":"","k":425,"f":"Section 1.1 Safety, third paragraph ('made dead and safely isolated'). Index: Safety during testing.","w":{"0":"GS38 leads make live testing safer. They don't justify keeping a circuit live for dead tests.","1":"Safe isolation means securing the point of isolation, however long the job is.","3":"An RCD isn't a reason to keep a circuit live. Dead tests are done on an isolated circuit."}},{"id":"g4.n1.03","t":"1","c":0,"q":"GN3 points to which publication for guidance on safe isolation procedures for low voltage installations?","o":["IET Guidance Note 2: Isolation & Switching","BS 7671 Appendix 14","GN3 Appendix D","Electrical Safety First Best Practice Guide No. 2"],"a":3,"x":"GN3 1.1 says guidance on safe isolation procedures can be found in Best Practice Guide No. 2, published by Electrical Safety First.","r":"GN3 1.1","n":"","k":429,"f":"Section 1.1 Safety, end of the third paragraph. Index: Safety during testing.","w":{"0":"GN3 refers to GN2 for selecting isolation devices (Table 537.4), not for safe isolation procedures.","1":"Appendix 14 of BS 7671 covers measuring earth fault loop impedance, not safe isolation.","2":"Appendix D is the safety check for diverted neutral currents, not the safe isolation guide."}},{"id":"g5.n1.04","t":"1","c":0,"q":"According to GN3 1.1, current test instruments should meet the safety specifications of which British Standard series?","o":["BS EN 61008 series","BS EN 61010 series","BS EN 60898 series","BS EN 60947 series"],"a":1,"x":"GN3 1.1(b): check that instruments conform to the BS EN 61010 series (safety requirements for electrical measurement equipment). Older instruments were made to BS 5458, which has now been withdrawn.","r":"GN3 1.1","n":"","k":439,"f":"Section 1.1, list item (b) under 'When using test instruments'; also Section 4.1 Instrument standard.","w":{"0":"BS EN 61008 covers RCCBs (residual current devices), not test instrument safety.","2":"BS EN 60898 covers circuit-breakers for household use, not test instruments.","3":"BS EN 60947 covers industrial switchgear, not the safety of measuring instruments."}},{"id":"g1.n1.05","t":"1","c":0,"q":"Following GS38 as summarised in GN3 1.1, what should be provided in test leads or test equipment to reduce the risks from arcing under fault conditions?","o":["A 30 mA RCD connected in series with the test leads","A Type B circuit-breaker in each test lead","Suitable high breaking capacity (HBC) fuses or other means of limiting current","Leads at least 2 m long to keep the operator away from the arc"],"a":2,"x":"GN3 1.1(d) says suitable HBC fuses, or other means of limiting current, should be provided in test leads or test equipment. This reduces the risks from accidental contact and from arcing under fault conditions.","r":"GN3 1.1","n":"","k":451,"f":"Section 1.1, list item (d) on test leads; look up 'GS38' in the index.","w":{"0":"An RCD detects earth leakage. It doesn't limit fault current through the leads.","1":"GS38 recommends HBC fuses or current limiting, not circuit-breakers fitted in leads.","3":"Lead length doesn't limit fault energy. Long, loose leads are a hazard in their own right."}},{"id":"g2.n1.06","t":"1","c":0,"q":"An inspector only needs to test a plug-connected appliance supplied from the building wiring. Using GN3 Table 1.1, what is the lowest overvoltage category marking suitable for this?","o":["CAT I","CAT III","CAT IV","CAT II"],"a":3,"x":"GN3 Table 1.1: CAT II covers equipment supplied from the building wiring, both plug-connected and permanently connected. CAT III and CAT IV also cover it, but CAT II is the lowest.","r":"GN3 1.1","n":"","k":461,"f":"Section 1.1, Table 1.1 (installation overvoltage category markings).","w":{"0":"CAT I isn't listed in Table 1.1 for use on any part of the building installation.","1":"CAT III would be suitable, but it isn't the lowest category that covers plug-connected equipment.","2":"CAT IV is meant for the origin. It's suitable, but it isn't the lowest category needed."}},{"id":"g3.n1.07","t":"1","c":0,"q":"An inspector is testing at socket-outlets and a distribution board in a commercial building, away from the origin. According to GN3 Table 1.1, what is the lowest overvoltage category the test equipment should have?","o":["CAT III","CAT II","CAT IV","CAT I"],"a":0,"x":"GN3 Table 1.1: CAT III is as CAT II, plus equipment forming part of the building wiring installation, such as socket-outlets and distribution boards.","r":"GN3 1.1","n":"","k":465,"f":"Section 1.1, Table 1.1, CAT III row.","w":{"1":"CAT II only covers equipment supplied from the building wiring, not the wiring installation itself.","2":"CAT IV is needed at or near the origin. It's more than the minimum for a distribution board.","3":"CAT I doesn't appear in Table 1.1 for any part of the fixed installation."}},{"id":"g4.n1.08","t":"1","c":0,"q":"Testing is to take place at the meter tails and the main overcurrent device at the origin of the supply to a building. According to GN3 Table 1.1, what category marking does the test equipment need?","o":["CAT III","CAT IV","CAT II","CAT III if the leads are fused"],"a":1,"x":"GN3 Table 1.1: CAT IV covers equipment at or near the origin, between the building entrance and the primary distribution board, such as electricity meters and primary overcurrent protective devices.","r":"GN3 1.1","n":"","k":468,"f":"Section 1.1, Table 1.1, CAT IV row.","w":{"0":"CAT III covers distribution boards and sockets, not the origin, meters and primary protective devices.","2":"CAT II is only for equipment supplied from the building wiring, nowhere near the origin.","3":"Fused leads don't raise the overvoltage category. The category marking itself must suit the origin."}},{"id":"g5.n1.09","t":"1","c":1,"q":"An inspector uses a CAT IV instrument with test leads marked CAT III and probes marked CAT II. Using the note to GN3 Table 1.1, what is the equivalent overvoltage category of the test arrangement?","o":["CAT III","CAT IV","CAT II","CAT III (the average of the three items)"],"a":2,"x":"The note to Table 1.1 says the equivalent category is the lowest of any equipment in the test arrangement.<br>Instrument CAT IV, leads CAT III, probes CAT II<br>Lowest = CAT II<br>The arrangement is CAT II (equipment supplied from the building wiring only).","r":"GN3 1.1","n":"","k":473,"f":"Section 1.1, the note below Table 1.1 ('equivalent overvoltage category').","w":{"0":"CAT III is the leads' rating. The CAT II probes bring the whole arrangement down.","1":"You used the instrument's rating. The arrangement takes the lowest item, not the highest.","3":"Categories aren't averaged. The lowest-rated item in the arrangement sets the category."}},{"id":"g1.n1.10","t":"1","c":0,"q":"GN3 1.1 says particular attention should be paid to safety when using instruments that can generate a test voltage greater than what, in dry conditions?","o":["25 V AC or 60 V DC","50 V AC or 120 V DC","110 V AC or 250 V DC","230 V AC or 500 V DC"],"a":1,"x":"GN3 1.1: particular attention is needed with instruments that can generate more than 50 V AC or 120 V DC in dry conditions (25 V AC or 60 V DC in wet or damp conditions).","r":"GN3 1.1","n":"","k":477,"f":"Section 1.1, paragraph after Table 1.1. Index: Safety during testing.","w":{"0":"25 V AC or 60 V DC is the limit for wet or damp conditions, not dry.","2":"110 V AC is the site reduced-voltage system, and 250 V DC is a SELV insulation test voltage. Neither is the GN3 limit.","3":"These are supply and insulation test voltages. The GN3 safety threshold is much lower."}},{"id":"g2.n1.11","t":"1","c":0,"q":"An inspector is testing in a damp agricultural building. Above which instrument test voltage does GN3 1.1 say particular attention to safety is needed in these conditions?","o":["25 V AC or 60 V DC","50 V AC or 120 V DC","12 V AC or 30 V DC","55 V AC to earth"],"a":0,"x":"GN3 1.1 gives 25 V AC or 60 V DC for wet or damp conditions, half the dry-condition values of 50 V AC or 120 V DC.","r":"GN3 1.1","n":"","k":478,"f":"Section 1.1, paragraph after Table 1.1 ('wet or damp conditions').","w":{"1":"50 V AC or 120 V DC is the dry-condition value. Damp conditions halve it.","2":"12 V AC or 30 V DC are SELV limits used in some special locations, not the GN3 test-voltage threshold.","3":"55 V to earth belongs to the 110 V centre-tapped site supply, not this safety threshold."}},{"id":"g3.n1.12","t":"1","c":0,"q":"Why does GN3 warn that particular care is needed when testing at height, even where touch voltages are below 50 V AC or 120 V DC?","o":["Test instruments are inaccurate when used more than 2 m above floor level","The touch voltage limits are doubled when working at height","Ladders and access towers must be bonded to the main earthing terminal","A spark, or a touch current at the limit of perception, may startle the inspector and cause a fall"],"a":3,"x":"GN3 1.1: a spark or barely perceptible touch current can make the operator jump or jolt away, leading to a fall or other serious incident. This should be addressed in the risk assessment.","r":"GN3 1.1","n":"","k":490,"f":"Section 1.1, last paragraph ('working at height').","w":{"0":"Height doesn't affect instrument accuracy. The hazard is the person's startle reaction.","1":"The limits don't change at height. The risk is the startle reaction leading to a fall.","2":"GN3 doesn't require access equipment to be bonded. It warns about startle and falls."}},{"id":"g4.n1.13","t":"1","c":0,"q":"According to GN3 1.2, how can an inspector's competence best be shown?","o":["By having at least five years' site experience installing to the current edition of BS 7671","By owning a calibrated multifunction tester to BS EN 61557","By holding a recognized inspection and testing qualification, along with a current level 3 certificate in the requirements of BS 7671","By holding a Level 3 NVQ in electrotechnical installation, without any further qualification"],"a":2,"x":"GN3 1.2: competence can best be shown by holding a recognized inspection and testing qualification, along with a current level 3 certificate in the requirements for electrical installations (BS 7671).","r":"GN3 1.2","n":"","k":505,"f":"Section 1.2 Required competence, second paragraph. Index: Competence.","w":{"0":"Experience helps, but GN3 names a recognized I&T qualification plus a current BS 7671 certificate.","1":"Suitable instruments are needed too, but owning them doesn't show competence.","3":"An installation NVQ isn't an inspection and testing qualification or a current BS 7671 certificate."}},{"id":"g5.n1.14","t":"1","c":0,"q":"During an inspection, the inspector finds a dangerous situation on a piece of equipment. What does GN3 1.2 say they should do?","o":["Recommend immediate isolation of the defective item, and inform the person ordering the work in writing without delay","Record it on the report and tell the client verbally when the job is finished","Isolate the entire installation and stay on site until it is repaired","Continue testing and leave the decision on isolation to the duty holder"],"a":0,"x":"GN3 1.2: where a dangerous situation is found, the inspector should recommend immediate isolation of the defective item. The person ordering the work should be informed of this in writing without delay.","r":"GN3 1.2","n":"","k":531,"f":"Section 1.2, final paragraph ('dangerous situation'). Index: Competence.","w":{"1":"Telling the client verbally at the end is too late. GN3 says in writing, without delay.","2":"GN3 says to isolate the defective item, not the whole installation, and doesn't require you to stay until it's repaired.","3":"The inspector must recommend immediate isolation, not leave a known danger in service."}},{"id":"g1.n1.15","t":"1","c":0,"q":"During the isolation review on an initial verification, the inspector finds shortcomings in the isolation and switching design. What does GN3 say about this?","o":["The inspector must redesign the isolation arrangements before issuing the certificate","The inspector must fit additional isolators to make the installation compliant","The inspector can ignore isolation because it is covered by the designer's signature","It is not the inspector's responsibility to resolve the shortcomings in the isolation and switching design"],"a":3,"x":"GN3 2.5.2: the inspector should carry out an isolation review to check that effective isolation can be achieved, but resolving shortcomings in the isolation and switching design is not their responsibility. The review may include locking off and testing to verify the circuit is dead.","r":"GN3 2.5.2","n":"","k":1551,"f":"Section 2.5.2, isolation and switching comments near Table 537.4 ('isolation review').","w":{"0":"Redesign falls to the designer. The inspector reviews and reports.","1":"Fitting extra isolators is remedial work, not part of the inspector's role.","2":"The inspector must still review isolation. The designer's signature doesn't remove that check."}},{"id":"g2.n1.16","t":"1","c":0,"q":"Which regulation of the Electricity at Work Regulations 1989 requires that 'as may be necessary to prevent danger, all systems shall be maintained so as to prevent, so far as is reasonably practicable, such danger'?","o":["Regulation 4(3)","Regulation 14","Regulation 4(2)","Regulation 16"],"a":2,"x":"GN3 3.3.1 quotes EAWR Regulation 4(2), the duty to maintain systems so as to prevent danger. Regulation 4(3) covers carrying out the work activity, including maintenance, safely.","r":"GN3 3.3.1","n":"","k":4735,"f":"Section 3.3.1 The need for appropriate inspection and testing. Index: Electricity at Work Regulations 1989.","w":{"0":"Regulation 4(3) covers carrying out work activities safely, not the duty to maintain the system.","1":"Regulation 14 covers work on or near live conductors.","3":"Regulation 16 requires persons to be competent to prevent danger or injury."}},{"id":"g3.n1.17","t":"1","c":0,"q":"GN3 explains 'reasonably practicable'. When can a duty holder avoid putting a risk-reduction measure in place?","o":["Whenever the cost of the measure is roughly equal to its benefit","Only when they can show its sacrifice would be grossly disproportionate to the benefit of the risk reduction","Whenever the measure would cost more than the original installation","Whenever the risk has not caused an accident at those premises before"],"a":1,"x":"GN3 3.3.1: the presumption is that the measure is implemented, unless the duty holder can show it is grossly disproportionate to the benefits. It isn't a balancing of costs against benefits.","r":"GN3 3.3.1","n":"","k":4752,"f":"Section 3.3.1, paragraph on 'reasonably practicable'.","w":{"0":"GN3 says it's not a balancing of costs and benefits. The sacrifice must be grossly disproportionate.","2":"Comparing with the installation cost isn't the test. Gross disproportion to the benefit is.","3":"No past accidents doesn't reduce the duty. The decision should favour health and safety."}},{"id":"g4.n1.18","t":"1","c":0,"q":"According to GN3 3.3.1, who is ultimately responsible under the EAWR for the safety of an electrical installation at work?","o":["The duty holder, such as a person who has, to any extent, control of the premises","The inspector who signed the last Electrical Installation Condition Report","The distribution network operator (DNO)","The original installer, for the life of the installation"],"a":0,"x":"GN3 3.3.1: under the EAWR, the duty holder is responsible. HSWA Section 4 refers to a person 'who has, to any extent, control of premises', such as a landlord, manager or supervisor.","r":"GN3 3.3.1","n":"","k":4758,"f":"Section 3.3.1, paragraph on the duty holder ('control of premises').","w":{"1":"The inspector reports on the condition but doesn't take over the duty holder's responsibility.","2":"The DNO is responsible for the supply network, not the installation at work.","3":"The installer is responsible for their own work, not the installation's ongoing safety."}},{"id":"g5.n1.19","t":"1","c":0,"q":"An inspector is planning a regular inspection under a preventative maintenance programme. What does GN3 say about testing at every inspection?","o":["A full set of tests must be done every time the installation is inspected","Insulation resistance must be tested on every circuit at every inspection","Testing is needed only once the installation is more than 25 years old","There is no specific requirement to test the installation on every inspection"],"a":3,"x":"GN3 3.3.1: regular inspection is supplemented by appropriate testing, but there is no specific requirement to test the installation on every inspection.","r":"GN3 3.3.1","n":"","k":4770,"f":"Section 3.3.1, first sentence of the paragraph following 'Regular inspection of equipment... is an essential part of any preventative maintenance programme'.","w":{"0":"GN3 says the opposite. Inspection is supplemented by testing as appropriate, not full testing every time.","1":"GN3 sets no rule to test insulation resistance on every circuit at every inspection.","2":"GN3 gives no age threshold. Testing is decided by what's appropriate."}},{"id":"g1.n1.20","t":"1","c":0,"q":"Partway through a periodic inspection, the inspector finds an unexpected hazard that wasn't in the pre-inspection survey. What does GN3 3.3.2 advise?","o":["Carry out a dynamic risk assessment as the inspection and testing progress","Carry on under the original method statement, as it has already been agreed","Stop and immediately issue an unsatisfactory report without further checks","Ask the client to sign a disclaimer before continuing"],"a":0,"x":"GN3 3.3.2: existing installations may involve unknowns, and inspectors should stay alert to unexpected issues that need dynamic risk assessments as the work progresses.","r":"GN3 3.3.2","n":"","k":4794,"f":"Section 3.3.2 Safety in inspection and testing, final paragraph.","w":{"1":"The original method statement didn't cover this hazard. GN3 calls for a dynamic risk assessment.","2":"Stopping and issuing a report skips the risk assessment. GN3 expects it to be reassessed.","3":"A disclaimer doesn't control the risk. The hazard must be risk assessed."}},{"id":"g2.n1.21","t":"1","c":0,"q":"A TT-supplied farm workshop shares a metallic water pipe with a neighbouring house that has PME conditions. What does GN3 say about diverted neutral currents?","o":["It can't carry diverted neutral currents because it has its own earth electrode","Only installations with a TN-C-S earthing arrangement need to be checked","Disconnect the main bonding first, then check for current in it","The workshop can carry diverted neutral currents and should be checked before inspection and testing starts"],"a":3,"x":"GN3 3.3.3 and Appendix D1(b): installations that share extraneous-conductive-parts (such as metal pipes) with PME installations can carry diverted neutral currents, including TT and TN-S. They should be checked before inspection and testing begins.","r":"GN3 3.3.3","n":"","k":4799,"f":"Section 3.3.3 Diverted neutral currents; Appendix D, D1. Index: Diverted neutral currents.","w":{"0":"The shared pipe gives a path whatever the earthing system, so TT is still affected.","1":"Appendix D1(b) includes TN-S and TT installations that share extraneous-conductive-parts.","2":"GN3 says to take precautions before disconnecting bonding. Measure the current first."}},{"id":"g3.n1.22","t":"1","c":0,"q":"What does GN3 4.1 say the HSE always advises about carrying out live tests?","o":["Any live test is acceptable as long as fused test leads are used","Always carry out live tests before dead tests to confirm the supply","Only carry out live tests that are actually useful and informative, to minimize danger","Live tests are banned on installations used at work"],"a":2,"x":"GN3 4.1: the HSE always advises carrying out only live tests that are actually useful and informative, and the inspector should always consider whether a live test is necessary first.","r":"GN3 4.1","n":"","k":6081,"f":"Section 4.1 Instrument standard, paragraph on GS38. Index: Note GS38.","w":{"0":"Fused leads reduce risk, but they don't make an unnecessary live test acceptable.","1":"Dead tests generally come first. Live tests are done only when useful.","3":"Live tests aren't banned. They should be limited to those that are useful."}},{"id":"g4.n1.23","t":"1","c":0,"q":"An inspector wants to measure earth fault loop impedance at a point with no overcurrent protection between it and the supply transformer. What does GN3 4.1, quoting BS 7671 Appendix 14, say?","o":["Measure there, since fused test leads give the protection required","Don't measure there. Measure on the output terminals of a suitably rated protective device, fitting a temporary one if needed","Measure there, provided the leads and probes are CAT IV","Measure there, provided the instrument uses a no-trip (low current) test"],"a":1,"x":"GN3 4.1 quotes Appendix 14: measure on the output terminals of a suitably rated protective device, or fit a temporary one. Never measure where there's no overcurrent protection back to the transformer. Fused test leads alone don't meet this requirement.","r":"GN3 4.1","n":"","k":6094,"f":"Section 4.1, quotation from Appendix 14 of BS 7671 ('Fused test leads alone').","w":{"0":"GN3 states that fused test leads alone do not meet this requirement.","2":"CAT IV covers overvoltage withstand, not the need for an upstream protective device.","3":"A no-trip test lowers the test current but doesn't provide the missing overcurrent protection."}},{"id":"g5.n1.24","t":"1","c":0,"q":"EAWR Regulation 14, quoted in GN3, allows work on or near a live conductor only if which conditions are all met?","o":["The person holds a level 3 qualification, wears insulated gloves and uses GS38 test leads","The voltage is below 400 V, the work takes under 30 minutes and a second person is present","It's unreasonable for it to be dead, reasonable to work on or near it live, and suitable precautions are taken to prevent injury","The client gives written permission, the area is barriered off and a permit to work is issued"],"a":2,"x":"GN3 4.9 quotes Regulation 14: (a) unreasonable in all the circumstances for it to be dead, (b) reasonable for the person to be at work on or near it live, and (c) suitable precautions, including protective equipment where necessary, are taken to prevent injury.","r":"GN3 4.9","n":"","k":6493,"f":"Section 4.9 Thermographic equipment, quotation of EAWR Regulation 14. Index: Electricity at Work Regulations 1989.","w":{"0":"Qualifications, gloves and GS38 leads don't satisfy Regulation 14 on their own. All three of its conditions must be met.","1":"Regulation 14 sets no voltage, time or accompaniment limits. It depends on its three conditions.","3":"Client permission and paperwork don't justify live work. Regulation 14's conditions still apply."}},{"id":"g1.n1.25","t":"1","c":0,"q":"Which regulation of the EAWR, cited in GN3, requires persons to be competent to prevent danger or injury?","o":["Regulation 12","Regulation 13","Regulation 16","Regulation 14"],"a":2,"x":"GN3 4.9 says live work may only be done by suitably competent persons, as required by Regulation 16 of the EAWR (Persons to be competent to prevent danger or injury).","r":"GN3 4.9","n":"","k":6529,"f":"Section 4.9, paragraph after the Regulation 14 quotation ('Regulation 16'). Index: Competence.","w":{"0":"Regulation 12 covers the means of cutting off the supply and isolation, not competence.","1":"Regulation 13 covers precautions for work on equipment made dead, not competence.","3":"Regulation 14 covers work on or near live conductors, not competence."}},{"id":"g2.n1.26","t":"1","c":0,"q":"An inspector has switched off and locked off a dwelling's main switch. Could hazardous touch voltages from diverted neutral currents still appear on its earthing and bonding?","o":["No. Opening the main switch removes all diverted neutral currents","Yes. Diverted neutral currents may come from another installation, so they can be present even when this one is isolated","Only if the installation has a TT earthing arrangement","No, as long as the meter tails have also been disconnected"],"a":1,"x":"GN3 Appendix D1 note: diverted neutral currents may originate from another installation, so they may be present even if the installation is isolated.","r":"GN3 App D","n":"","k":8304,"f":"Appendix D, D1, the note at the end. Index: Diverted neutral currents.","w":{"0":"Isolating this installation doesn't stop current from other properties flowing through shared parts.","2":"Appendix D lists PME (TN-C-S) installations first. It isn't limited to TT.","3":"Disconnecting the tails doesn't remove current imported through shared extraneous-conductive-parts."}},{"id":"g3.n1.27","t":"1","c":0,"q":"After the Table D1 checks, an inspector suspects an open-circuit PEN conductor. What does GN3 say they should do?","o":["Call 999 and ask for the fire service","Inform the DNO in writing within 28 days","Record it on the EICR and recommend action at the next inspection","Inform the DNO immediately using the emergency number 105"],"a":3,"x":"GN3 Appendix D2: if an open-circuit PEN conductor or diverted neutral currents are suspected after the safety checks, the DNO should be informed immediately using the emergency number 105.","r":"GN3 App D","n":"","k":8312,"f":"Appendix D, D2 How to check for diverted neutral currents.","w":{"0":"999 isn't the DNO contact GN3 gives. The power-cut and emergency number is 105.","1":"GN3 says inform the DNO immediately, not in writing within 28 days.","2":"A suspected broken PEN is an immediate danger and can't wait for the next inspection."}},{"id":"g4.n1.28","t":"1","c":0,"q":"According to the GN3 Appendix D notes, what can the line-to-neutral voltage rise to if there is an open-circuit PEN conductor?","o":["400 V nominal","253 V","230 V","115 V"],"a":0,"x":"GN3 Appendix D2, Note 1: with an open-circuit PEN conductor, the line-to-neutral voltage may rise to 400 V nominal.","r":"GN3 App D","n":"","k":8315,"f":"Appendix D, D2, Note 1.","w":{"1":"253 V is 230 V + 10% (the normal upper supply limit), not the broken-PEN value.","2":"230 V is the normal nominal voltage. A broken PEN can push it far higher.","3":"115 V would be a voltage drop. GN3 warns it can rise to 400 V."}},{"id":"g5.n1.29","t":"1","c":0,"q":"A dwelling has a broken PEN conductor in its supply cable. Its neutral current returns to the transformer through metal pipes shared with neighbouring properties. What does GN3 Appendix D call this?","o":["Imported neutral current","Earth leakage current","Protective conductor current","Exported neutral current"],"a":3,"x":"GN3 Appendix D: exported neutral current occurs where the installation's own supply PEN is broken, so its neutral current returns through extraneous-conductive-parts shared with installations that have an intact PEN.","r":"GN3 App D","n":"","k":8323,"f":"Appendix D, D2, the paragraph before Table D1 ('import or export').","w":{"0":"Imported current is the reverse: another installation's neutral current flowing back through this installation's PEN.","1":"Earth leakage is current leaking from insulation or equipment, not neutral current diverted by a broken PEN.","2":"Protective conductor current comes from equipment in normal use, not from a broken supply PEN."}},{"id":"g1.n1.30","t":"1","c":1,"q":"Table D1, step 1: before isolation, a clamp meter on the main earthing conductor of a dwelling with 80 A maximum demand reads 2.6 A. What does this indicate?","o":["Normal. Up to 10% of the load current is expected in the earthing conductor","A possible diverted neutral current or broken PEN. GN3 expects only a few milliamps here","Normal. It's well under the 30 mA RCD rating","A faulty clamp meter. Earthing conductors never carry current"],"a":1,"x":"Table D1 step 1: dwellings with maximum demand up to 100 A typically show a few milliamps.<br>Measured 2.6 A = 2600 mA<br>That's hundreds of times more than a few mA, so it's a possible diverted neutral current or broken PEN.","r":"GN3 App D","n":"","k":8342,"f":"Appendix D, Table D1, step 1 ('few milliamps').","w":{"0":"GN3 gives no 10% allowance. A few milliamps is expected in a dwelling.","2":"You compared amps with milliamps. 2.6 A is 2600 mA, far above 30 mA.","3":"A small current is expected, so the meter isn't faulty. 2.6 A is the warning sign."}},{"id":"g2.n1.31","t":"1","c":0,"q":"Table D1, step 2: after switching off and locking off the installation, what does GN3 say should be used to prove it is dead?","o":["An approved 2-pole contact voltage tester","A non-contact voltage detector (volt-stick)","A multimeter set to its resistance range","A plug-in socket tester"],"a":0,"x":"Table D1 step 2: switch off, lock off or otherwise secure the point(s) of isolation, and prove the installation is dead using an approved 2-pole contact voltage tester.","r":"GN3 App D","n":"","k":8349,"f":"Appendix D, Table D1, step 2.","w":{"1":"Non-contact detectors are used in steps 4 and 6 for screening. They don't prove dead.","2":"A resistance range doesn't prove dead and could be damaged if the circuit is live.","3":"A socket tester only checks sockets and isn't an approved voltage indicator for proving dead."}},{"id":"g3.n1.32","t":"1","c":0,"q":"In Table D1, a non-contact voltage detector shows nothing at the main earthing terminal, yet a large current is flowing in the main bonding. What reason does GN3 give?","o":["Voltage indicators don't detect diverted neutral currents while those currents can flow through an alternative path","Non-contact voltage detectors only respond to DC","The green-and-yellow insulation screens the conductor from the detector","The current is above the detector's maximum range, so it reads zero"],"a":0,"x":"Table D1 steps 4 and 6: voltage indicators do not detect diverted neutral currents while they can flow through an alternative path. That's why clamp-meter current checks are part of the procedure.","r":"GN3 App D","n":"","k":8370,"f":"Appendix D, Table D1, steps 4 and 6 ('Possible indication' column).","w":{"1":"Non-contact detectors respond to AC fields, not DC. That isn't GN3's reason.","2":"Insulation colour doesn't screen the field. GN3 points to the alternative current path.","3":"Detectors don't read zero because the current is high. While a path exists, little voltage appears."}},{"id":"g4.n1.33","t":"1","c":1,"q":"During a periodic inspection on a TN-C-S supply, Ze is measured at 0.52 Ω. Using the Table D1 step 8 rule of thumb, what does this suggest?","o":["It is acceptable because it's below the 0.80 Ω rule of thumb","It is acceptable as long as it's below 1.0 Ω","It can't be judged without carrying out the 62% earth electrode test","It is high (rule of thumb for TN-C-S is below 0.35 Ω), so a PEN problem should be suspected"],"a":3,"x":"Table D1 step 8 rule of thumb: TN-C-S Ze < 0.35 Ω.<br>Measured 0.52 Ω > 0.35 Ω<br>High, so it may indicate a broken PEN conductor. Compare with previous readings where available.","r":"GN3 App D","n":"","k":8407,"f":"Appendix D, Table D1, step 8 (external EFLI rule of thumb).","w":{"0":"0.80 Ω is the TN-S rule of thumb. TN-C-S uses 0.35 Ω.","1":"There's no 1.0 Ω rule in Table D1. TN-C-S should be below 0.35 Ω.","2":"The 62% method is for earth electrodes (TT), not for checking a PME Ze."}},{"id":"g5.n1.34","t":"1","c":1,"q":"A TN-S supply to a dwelling has a measured Ze of 0.62 Ω. Using the Table D1 step 8 rule of thumb, how should it be assessed?","o":["High, because it exceeds 0.35 Ω, so suspect a broken PEN","Appears acceptable, because it's below the 0.80 Ω rule of thumb for TN-S","High, because it exceeds 0.20 Ω","It can't be assessed without disconnecting the main bonding"],"a":1,"x":"Table D1 step 8 rule of thumb: TN-S Ze < 0.80 Ω.<br>Measured 0.62 Ω < 0.80 Ω<br>Appears acceptable, though occasionally slightly higher readings occur, and previous readings give a better comparison.","r":"GN3 App D","n":"","k":8410,"f":"Appendix D, Table D1, step 8 (TN-S rule of thumb).","w":{"0":"0.35 Ω is the TN-C-S figure. You applied the PME value to a TN-S supply.","2":"0.20 Ω isn't a GN3 rule of thumb for either system.","3":"Table D1 applies the rule of thumb straight to the measured Ze. No extra disconnection is needed to assess it."}},{"id":"g1.n2.00","t":"2","c":0,"q":"Following the initial verification of a new installation, which documents must be given to the person ordering the work?","o":["An Electrical Installation Certificate together with Schedule(s) of Inspections and Schedule(s) of Test Results","An Electrical Installation Condition Report together with the Condition Report Inspection Schedule","A Minor Electrical Installation Works Certificate for each circuit installed","The Electrical Installation Certificate only; the schedules are kept by the installer"],"a":0,"x":"GN3 1.3.1 (Regulations 644.1 and 653.1): after initial verification of a new installation or changes to an existing one, an EIC together with Schedule(s) of Inspections and Schedule(s) of Test Results is required to be given to the person ordering the work.","r":"GN3 1.3.1","n":"","k":536,"f":"Chapter 1, Section 1.3 The client, sub-section 1.3.1 Certificates and reports. Index: certificates.","w":{"1":"An EICR is for periodic inspection of an existing installation, not initial verification of new work.","2":"A MEIWC is only for minor works that do not include a new circuit, so it cannot cover a new installation.","3":"The certificate is only valid with its schedules attached; they go to the client with it, not kept back."}},{"id":"g1.n2.01","t":"2","c":0,"q":"You are adding a circuit to an existing installation. GN3 lists parts of the existing installation that must be inspected and tested to confirm the safety of the addition. Which of these is NOT one of the listed examples?","o":["Insulation resistance of every other circuit in the installation","The means of earthing","Circuit ratings and circuit conductor sizes","Earth fault loop impedance"],"a":0,"x":"GN3 1.4 lists (a) circuit ratings, (b) circuit conductor sizes, (c) means of earthing, (d) protective conductor continuity and (e) EFLI. There is no obligation to test parts of the existing installation that neither affect nor are affected by the addition (644.1.2).","r":"GN3 1.4","n":"","k":602,"f":"Chapter 1, Section 1.4 Additions and alterations, the list (a) to (e). Index: additions and alterations.","w":{"1":"The means of earthing is item (c) of the list; the addition relies on it.","2":"Circuit ratings and conductor sizes are items (a) and (b) of the list.","3":"EFLI is item (e); it confirms disconnection for the addition."}},{"id":"g1.n2.02","t":"2","c":0,"q":"GN3 Section 1.7 lists installations needing specialist knowledge and further guidance. Which publication does it refer to for fire protection and fire stopping?","o":["BS 5839-1 for fire detection and fire alarm systems","BS 5266-1 for emergency lighting","IET Guidance Note 7 Special Locations","IET Guidance Note 4 Protection Against Fire"],"a":3,"x":"GN3 1.7(h): fire protection and fire stopping, refer to IET Guidance Note 4 Protection Against Fire.","r":"GN3 1.7","n":"","k":686,"f":"Chapter 1, Section 1.7 Installations requiring specialist knowledge, training or experience, item (h). Index: specialist installations.","w":{"0":"BS 5839-1 goes with fire detection and alarm systems, item (j), not fire stopping.","1":"BS 5266-1 goes with emergency lighting, item (i).","2":"Guidance Note 7 is listed for medical locations, item (a)."}},{"id":"g1.n2.03","t":"14","c":0,"q":"Two separate design consultants share responsibility for the design of a new installation. How can this be certified on the multiple-signature EIC?","o":["Only the lead designer may sign; the second designer signs a separate MEIWC","Both sign the design section, as the form allows two design signatories where there is mutual responsibility","The inspector signs for both designers once the tests are complete","A single-signature EIC must be used"],"a":1,"x":"GN3 2.2: the multiple-signature EIC allows different persons to sign for design, construction and inspection and testing, and allows two signatories for design where there is mutual responsibility. (Separate forms suit designers responsible for identifiably separate parts.)","r":"GN3 2.2","n":"","k":786,"f":"Chapter 2, Section 2.2 Certificates, 'Multiple-signature Electrical Installation Certificate'. Index: Electrical Installation Certificate.","w":{"0":"A MEIWC is for minor works on an existing circuit, not for certifying shared design.","2":"The inspector cannot take on the design responsibility of others by signing.","3":"A single-signature EIC is only for one person responsible for design, construction and testing."}},{"id":"g1.n2.04","t":"14","c":0,"q":"A customer's old consumer unit is replaced with a new one on the same circuits. Which certificate is required?","o":["A Minor Electrical Installation Works Certificate, as no new circuits are added","An Electrical Installation Condition Report","No certificate, as it is a like-for-like replacement","An Electrical Installation Certificate"],"a":3,"x":"GN3 5.2: a MEIWC must not be used for replacing a consumer unit. The EIC notes list replacing a consumer unit/distribution board as a use of the EIC, and the EICR notes say the EICR is not for this either.","r":"GN3 5.2","n":"","k":6601,"f":"Chapter 5, Section 5.2 Minor works, and Note 1 to the EIC in Section 5.4. Index: consumer unit replacement.","w":{"0":"Even with no new circuits, GN3 expressly bans the MEIWC for consumer unit replacement.","1":"An EICR is for existing installations and its notes exclude consumer unit replacement.","2":"Replacing a consumer unit is installation work that must be inspected, tested and certified."}},{"id":"g1.n2.05","t":"14","c":1,"q":"At the origin of a single-phase installation you measure a prospective short-circuit current of 1.6 kA and a prospective earth fault current of 0.9 kA. What value of Ipf goes on the EIC?","o":["1.6 kA","0.9 kA","2.5 kA","0.7 kA"],"a":0,"x":"GN3 5.4, EIC Note 6: record the greater of the prospective short-circuit current and the prospective earth fault current.<br>Compare 1.6 kA with 0.9 kA.<br>Greater value = 1.6 kA.","r":"GN3 5.4","n":"","k":6774,"f":"Chapter 5, Section 5.4, notes to the EIC, Note 6 (also EICR Note 5). Index: prospective fault current.","w":{"1":"That's the lower value; the form needs the greater of the two.","2":"You added the two currents; record only the greater one.","3":"You subtracted one from the other; record the greater value as measured."}},{"id":"g1.n2.06","t":"14","c":1,"q":"Column 12 of a Schedule of Circuit Details gives a maximum permitted Zs of 1.37 Ω for a 32 A Type B circuit-breaker (BS 7671 Table 41.3). The measured Zs is 1.18 Ω at an ambient of about 10 °C. Using GN3 Appendix A Table A5, is the result acceptable?","o":["No: the maximum measured value for a B32 in Table A5 is 1.1 Ω, and 1.18 Ω exceeds it","Yes: 1.18 Ω is below the 1.37 Ω in column 12","Yes: 1.18 Ω is below 1.37 × 1.25 = 1.71 Ω","Yes: 1.18 Ω is below the 2.15 Ω allowed for a B-type breaker"],"a":0,"x":"Column 12 holds the Chapter 41 design value (Note 12). Measured readings are checked against Appendix A, where the values are reduced by the 1.25 divisor.<br>1.37 ÷ 1.25 = 1.096, so Table A5 gives 1.1 Ω for a B32.<br>1.18 Ω > 1.1 Ω, so the result is not acceptable.","r":"GN3 5.4","n":"","k":6921,"f":"Chapter 5 'Generic schedule of circuit details – Notes' Note 12, then Appendix A Table A5 (circuit-breakers), B row, 32 A column. Index: earth fault loop impedance, maximum measured.","w":{"1":"1.37 Ω is the design value at operating temperature; a measured reading must meet the lower Table A5 figure.","2":"You multiplied by 1.25 instead of dividing; measured limits are lower than design values.","3":"2.15 Ω is the B16 figure in Table A5, not B32."}},{"id":"g1.n2.07","t":"14","c":0,"q":"On a Schedule of Test Results, when may a cross be entered in the polarity column?","o":["On any schedule where polarity was not checked","On an EIC where polarity was corrected after testing","Only when the schedule goes with an EICR and incorrect polarity is found","On a MEIWC when the circuit is a lighting circuit"],"a":2,"x":"GN3 Schedule of Test Results Note 26 and the form footnote: tick when polarity is confirmed. A cross may be used to show incorrect polarity only where the schedule accompanies an EICR.","r":"GN3 5.4","n":"","k":7214,"f":"Chapter 5, 'Generic schedule of test results – Notes', Note 26, and the # footnote to Figure 5.4. Index: polarity.","w":{"0":"A cross means incorrect polarity found, not 'not checked'.","1":"On an EIC, polarity must be correct before issue, so a tick is entered.","3":"Nothing allows a cross on a MEIWC; polarity must be confirmed satisfactory."}},{"id":"g2.n2.08","t":"2","c":0,"q":"Which legislation does GN3 quote as implying that a landlord in England and Wales \"shall keep in repair and proper working order the installations in the dwelling-house for the supply of water, gas and electricity\"?","o":["Section 11 of the Landlord and Tenant Act 1985","Section 13 of Chapter 4 of the Housing (Scotland) Act 2014","Regulation 4(2) of the Electricity at Work Regulations 1989","Regulation 12 of the Construction (Design and Management) Regulations 2015"],"a":0,"x":"GN3 1.3.2: Sub-Section (1)(b) of Section 11 of the Landlord and Tenant Act 1985 (repairing obligations in short leases) implies the landlord must keep the supply installations in repair and proper working order.","r":"GN3 1.3.2","n":"","k":554,"f":"Chapter 1, Section 1.3.2 Rented domestic and residential accommodation. Index: rented accommodation / landlord.","w":{"1":"That is the Scottish equivalent, requiring a reasonable state of repair; it does not apply in England and Wales.","2":"EAWR 4(2) concerns maintenance of systems at work; GN3 cites it about records, not landlords' repair duties.","3":"CDM Regulation 12 requires the health and safety file, not a landlord's repairing obligation."}},{"id":"g2.n2.09","t":"2","c":0,"q":"While adding a socket-outlet you notice a cracked accessory on an unrelated circuit. It may give rise to danger but does not affect the safety of your addition. What does GN3 say you must do about it?","o":["Note it in the 'Comments on existing installation' section of the EIC or MEIWC","Nothing; you have no obligation to report anything outside your own work","Refuse to issue any certificate until the client has it repaired","Record it as a departure from BS 7671 on the certificate"],"a":0,"x":"GN3 1.4 (Regulation 644.1.2): defects observed in the existing installation that may give rise to danger but do not affect the safety of the addition are required to be noted in the 'Comments on existing installation' section of the EIC or MEIWC (a separate referenced sheet may be used).","r":"GN3 1.4","n":"","k":612,"f":"Chapter 1, Section 1.4 Additions and alterations, the paragraph on Regulation 644.1.2. Index: comments on existing installation.","w":{"1":"You need not test unaffected parts, but defects you observe must still be recorded.","2":"Defects that don't affect the addition don't stop certification; they are just noted for the client.","3":"A departure is a deliberate design decision not to comply fully, not an existing defect."}},{"id":"g2.n2.10","t":"2","c":0,"q":"During initial verification, how does GN3 say the inspector should check that the specified cable sizes have been used?","o":["Redo the designer's cable-sizing calculations for every circuit","Get the design criteria (e.g. a cable schedule) and visually compare installed sizes at the distribution board holding the protective devices","Trace each cable along its whole length to confirm the size is maintained","Measure each conductor's diameter at the furthest point of the circuit"],"a":1,"x":"GN3 2.1 example: the inspector obtains the design criteria and visually inspects installed cable sizes for comparison, most logically at the distribution board. Redoing sizing is the designer's job, and checking the size along the whole length is the installer's.","r":"GN3 2.1","n":"","k":720,"f":"Chapter 2, Section 2.1 Purpose of initial verification, the 'Example' paragraph. Index: initial verification / responsibilities.","w":{"0":"GN3 says this is unreasonable for the inspector; cable sizing is the designer's responsibility.","2":"GN3 says this is unreasonable too; keeping size along the run is the installer's responsibility.","3":"Nothing like this is suggested; the comparison is made at the distribution board."}},{"id":"g2.n2.11","t":"14","c":0,"q":"A job involves adding two socket-outlets to an existing ring and installing a new radial circuit to a cooker. Which certification does GN3 call for?","o":["One MEIWC covering all the work","An EIC, because the work includes a new circuit","Two MEIWCs, one for each circuit worked on","An EICR, as the work is to an existing installation"],"a":1,"x":"GN3 2.2: the MEIWC is only for minor works that do not include a new circuit, e.g. an additional socket-outlet on an existing circuit. A new circuit needs an EIC.","r":"GN3 2.2","n":"","k":795,"f":"Chapter 2, Section 2.2 Certificates, 'Minor Electrical Installation Works Certificate'. Index: Minor Electrical Installation Works Certificate.","w":{"0":"A MEIWC cannot be used where a new circuit is provided.","2":"The new cooker circuit rules out a MEIWC, and GN3 says several items of minor works should go on an EIC anyway.","3":"An EICR reports on an existing installation's condition; it does not certify new work."}},{"id":"g2.n2.12","t":"14","c":0,"q":"When carrying out a periodic inspection of a house with a 100 A supply, which inspection schedule should go with the EICR?","o":["The Schedule of Inspections for initial verification (Form 2)","The Minor Works inspection checklist (Form 4)","No inspection schedule; only Schedules of Circuit Details and Test Results are needed","The Condition Report Inspection Schedule (Form 6)"],"a":3,"x":"GN3 5.3: for periodic inspections, the initial verification Schedule of Inspections (Form 2) should not be used. The dedicated model (Form 6) may be used for domestic installations and those up to 100 A.","r":"GN3 5.3","n":"","k":6608,"f":"Chapter 5, Section 5.3 Periodic inspection and testing. Index: Electrical Installation Condition Report.","w":{"0":"GN3 states Form 2 should not be used for periodic inspections.","1":"Form 4 is the MEIWC itself, not an inspection schedule for an EICR.","2":"An EICR is only valid with its inspection schedule(s) attached."}},{"id":"g2.n2.13","t":"14","c":0,"q":"What does the 'Guidance for recipients' on the EIC tell the user to do with an RCD in the installation?","o":["Test it monthly by pressing the test button","Have it tested every year with an RCD tester by a skilled person","Test it six-monthly by pressing the button marked T or 'Test'","Press the test button only at each periodic inspection"],"a":2,"x":"GN3 5.4, EIC Guidance for recipients: where the installation includes an RCD it should be tested six-monthly by pressing the button marked T or 'Test'; if it doesn't switch off the supply, seek expert advice.","r":"GN3 5.4","n":"","k":6806,"f":"Chapter 5, Section 5.4, 'Guidance for recipients' after the EIC notes. Index: RCD, test button.","w":{"0":"The recipient guidance says six-monthly, not monthly.","1":"The user's check is the test button, not an instrument test by a skilled person.","3":"Waiting until periodic inspection is far too long; the guidance says six-monthly."}},{"id":"g2.n2.14","t":"14","c":1,"q":"A 2.5/1.5 mm² ring final circuit gives end-to-end readings of r1 = 0.60 Ω, rn = 0.60 Ω and r2 = 1.00 Ω. During step 3, what is the approximate highest (R1 + R2) reading you would expect (at the mid-point of the ring), i.e. the value entered in column 21?","o":["0.80 Ω","1.60 Ω","0.30 Ω","0.40 Ω"],"a":3,"x":"Schedule of Test Results Note 21: enter the highest value recorded during step 3 of the ring test (Section 2.6.6). Where the cpc is smaller than the line conductor (twin and earth), step 3 readings rise to a maximum of about (r1 + r2)/4 at the mid-point of the ring.<br>r1 + r2 = 0.60 + 1.00 = 1.60 Ω<br>1.60 ÷ 4 = 0.40 Ω.","r":"GN3 5.4","n":"","k":7195,"f":"Chapter 5, 'Generic schedule of test results – Notes', Note 21, which points to Section 2.6.6 Continuity of ring final circuit conductors, step 3 item (b). Index: ring final circuit.","w":{"0":"You divided by 2 instead of 4.","1":"You didn't divide at all; cross-connecting the ends gives a quarter of r1 + r2.","2":"You used (r1 + rn)/4, the step 2 line-neutral value, not (R1 + R2)."}},{"id":"g2.n2.15","t":"14","c":1,"q":"On a consumer unit schedule, Zdb is 0.29 Ω. A ring final circuit has (R1 + R2) = 0.41 Ω. If Zs is found by calculation for column 27, what value is entered?","o":["0.12 Ω","0.70 Ω","0.35 Ω","0.41 Ω"],"a":1,"x":"GN3 Schedule of Test Results Note 27: enter the circuit EFLI by whatever method you choose (see 2.6.15). By calculation, Zs = Zdb + (R1 + R2).<br>Zs = 0.29 + 0.41<br>Zs = 0.70 Ω (compare the Figure 5.4 example, which shows 0.71 Ω).","r":"GN3 5.4","n":"","k":7217,"f":"Chapter 5, 'Generic schedule of test results – Notes', Note 27, referring to Section 2.6.15. Index: earth fault loop impedance.","w":{"0":"You subtracted Zdb from (R1 + R2); the impedances are in series, so add them.","2":"You averaged the two values; series impedances are added.","3":"You entered (R1 + R2) only and left out the impedance up to the board."}},{"id":"g3.n2.16","t":"2","c":1,"q":"A landlord in England has an EICR for a privately rented flat dated 14 March 2023. The inspector did not recommend a shorter period. Under the Electrical Safety Standards in the Private Rented Sector (England) Regulations 2020, by when must the next EICR be prepared at the latest?","o":["14 March 2026","14 March 2028","14 March 2033","14 March 2024"],"a":1,"x":"GN3 1.3.2: the 2020 Regulations require an EICR at an interval of not more than 5 years (or a shorter period if the inspector considers it necessary).<br>14 March 2023 + 5 years = 14 March 2028.","r":"GN3 1.3.2","n":"","k":570,"f":"Chapter 1, Section 1.3.2 Rented domestic and residential accommodation, the paragraph on the 2020 England Regulations. Index: rented accommodation.","w":{"0":"That is a 3-year interval; the Regulations set a maximum of 5 years unless the inspector recommends shorter.","2":"Ten years is a typical owner-occupied domestic interval, not the private rented sector maximum.","3":"Annual inspection is not required; GN3 only suggests considering an inspection on change of tenancy."}},{"id":"g3.n2.17","t":"2","c":0,"q":"BS 7671 Part 2, quoted in GN3, defines a 'departure'. Which statement matches that definition?","o":["A non-conformity that may give rise to danger","A failure to meet a requirement of a standard","Any part of an older installation that does not meet the current edition of BS 7671","A deliberate decision not to comply fully with a requirement, for which the designer declares the resulting safety is not less than full compliance"],"a":3,"x":"GN3 1.5: \"Departure. Deliberate decision not to comply fully with the requirement of BS 7671, for which the designer must declare that the resultant degree of safety is not less than that achievable by full compliance.\"","r":"GN3 1.5","n":"","k":623,"f":"Chapter 1, Section 1.5 Departures and non-compliance. Index: departures.","w":{"0":"That is the definition of 'non-compliance', not 'departure'.","1":"That is the GN3 note defining a 'non-conformity'.","2":"Older installations not meeting the current edition aren't departures; departures are deliberate design decisions."}},{"id":"g3.n2.18","t":"2","c":0,"q":"The designer has specified maximum circuit impedances that differ from those in BS 7671. What should the inspector do with the test results?","o":["Ignore the design values and always apply the BS 7671 figures","Ask for the design criteria, or forward the results to the designer to verify against the design","Adjust the measured readings by 1.25 so they match the design values","Record the circuits as departures on the EIC"],"a":1,"x":"GN3 2.1 'Relevant criteria': where the designer has specified particular requirements (e.g. different intended impedances), the inspector should ask for the design criteria or forward the results to the designer. Only if no such data exist are the BS 7671 requirements applied.","r":"GN3 2.1","n":"","k":760,"f":"Chapter 2, Section 2.1, under the 'Relevant criteria' heading (Regulation 643.1). Index: relevant criteria.","w":{"0":"BS 7671 values are only the fallback when no design data exist.","2":"You never alter readings to fit; 1.25 relates Appendix A to Chapter 41, not to design values.","3":"A departure is the designer's deliberate decision; differing design impedances don't automatically mean one."}},{"id":"g3.n2.19","t":"14","c":0,"q":"During initial verification the inspector finds a missing main bonding conductor to the gas pipe. Who does GN3 say is responsible for making it good, and when can the EIC be issued?","o":["The inspector must fit the bonding, then issue the EIC","Issue the EIC now and list the missing bonding in 'Comments on existing installation'","The installer must make it good, and it is re-inspected and tested as needed before the EIC is issued","Issue the EIC now with the missing bonding recorded as a departure"],"a":2,"x":"GN3 2.6.2(d) (Regulation 644.1.1): defects or omissions revealed by the inspector must be made good by the installer and, as necessary, inspected and tested again before the EIC is issued. Making good is not the inspector's responsibility.","r":"GN3 2.6.2","n":"","k":2283,"f":"Chapter 2, Section 2.6.2 Electrical Installation Certificate (EIC), item (d). Index: Electrical Installation Certificate.","w":{"0":"GN3 states plainly that making good defects is not the inspector's responsibility.","1":"That section is for defects in an existing installation, not omissions in the new work being certified.","3":"A departure is a deliberate design choice with equal safety; a missing bond is an omission."}},{"id":"g3.n2.20","t":"14","c":0,"q":"Once an EIC has been completed, who receives the 'original' and what happens to the duplicate?","o":["The original goes to building control; the duplicate goes to the client","The original goes to the person ordering the work; the duplicate is kept by the person issuing the certificate","The original is kept by the installer; the client gets a copy","The original goes to the DNO; the duplicate goes to the occupier"],"a":1,"x":"GN3 5.4, EIC Note 1 (Regulation 644.4): the 'original' Certificate is issued to the person ordering the work, and a duplicate should be kept by the person issuing it.","r":"GN3 5.4","n":"","k":6755,"f":"Chapter 5, Section 5.4, notes to the EIC (Note 1) and 'Guidance for recipients'. Index: Electrical Installation Certificate.","w":{"0":"BS 7671 requires the original to go to the person ordering the work, not building control.","2":"The installer keeps the duplicate; the client must get the original.","3":"The DNO doesn't receive the certificate; the person ordering the work does."}},{"id":"g3.n2.21","t":"14","c":0,"q":"A circuit on the Schedule of Circuit Details is wired in thermosetting (XLPE) SWA cable. Which 'Type of wiring' code goes in column 3?","o":["F","G","H","A"],"a":1,"x":"GN3 5.4, Figure 5.3 'Codes for types of wiring': A thermoplastic insulated/sheathed; B–E thermoplastic in metallic/non-metallic conduit and trunking; F thermoplastic SWA; G thermosetting SWA; H mineral insulated; O other.","r":"GN3 5.4","n":"","k":6881,"f":"Chapter 5, Section 5.4, the 'Codes for types of wiring' key at the foot of the Schedule of Circuit Details (Figure 5.3). Index: schedule of circuit details.","w":{"0":"F is thermoplastic (PVC) SWA; XLPE is thermosetting, which is G.","2":"H is mineral insulated cable.","3":"A is thermoplastic insulated and sheathed cable such as twin and earth."}},{"id":"g3.n2.22","t":"14","c":1,"q":"During step 3 of a ring final circuit test, the (R1 + R2) readings at the socket-outlets are 0.48, 0.50, 0.51 and 0.49 Ω. What should go in column 21 of the Schedule of Test Results?","o":["0.48 Ω","0.50 Ω","1.98 Ω","0.51 Ω"],"a":3,"x":"GN3 Schedule of Test Results Note 21: enter the highest value recorded during step 3 of the ring continuity test.<br>Highest of 0.48, 0.50, 0.51, 0.49 = 0.51 Ω.","r":"GN3 5.4","n":"","k":7197,"f":"Chapter 5, 'Generic schedule of test results – Notes', Note 21. Index: schedule of test results.","w":{"0":"You entered the lowest reading; Note 21 asks for the highest.","1":"You averaged the readings (1.98 ÷ 4 ≈ 0.50); the form needs the highest.","2":"You added the readings together; enter the single highest value."}},{"id":"g3.n2.23","t":"14","c":1,"q":"For a MEIWC, you extend an existing radial on a 20 A Type B circuit-breaker with 22 m of 2.5/1.5 mm² copper twin and earth. Zdb is 0.42 Ω, and testing is at about 20 °C. Using Table B1 (19.51 mΩ/m for 2.5/1.5), what is the expected Zs, and does it meet the Table A5 limit of 1.75 Ω?","o":["0.85 Ω, which is within 1.75 Ω","0.58 Ω, which is within 1.75 Ω","0.75 Ω, which is within 1.75 Ω","1.28 Ω, which is within 1.75 Ω"],"a":0,"x":"(R1 + R2) = length × mΩ/m ÷ 1000 (Appendix B).<br>22 × 19.51 = 429.2 mΩ = 0.43 Ω (no temperature correction is needed at 20 °C).<br>Zs = Zdb + (R1 + R2) = 0.42 + 0.43 = 0.85 Ω.<br>0.85 Ω < 1.75 Ω (Table A5, B20), so it complies. Record in MEIWC Part 4.","r":"GN3 5.4","n":"","k":7262,"f":"Appendix B Table B1 (2.5 mm² line with 1.5 mm² cpc row) for R1 + R2, then Appendix A Table A5 for the limit. The MEIWC is Figure 5.7 in Chapter 5. Index: resistance of copper conductors.","w":{"1":"You used 7.41 mΩ/m, the line conductor alone; R1 + R2 needs the 19.51 mΩ/m combination.","2":"You used 14.82 mΩ/m, the 2.5/2.5 figure; this cable has a 1.5 mm² cpc.","3":"You doubled (R1 + R2); the 19.51 mΩ/m figure already includes line and cpc."}},{"id":"g4.n2.24","t":"2","c":1,"q":"A rented house in England was completely rewired and an EIC for the entire installation was issued on 3 May 2022. No EICR has been carried out since. A new tenant moves in on 1 February 2026. What document can the landlord give the new tenant before they occupy?","o":["A copy of the 2022 EIC for the rewire","Nothing yet; a new EICR must be carried out before every new tenancy","A Minor Electrical Installation Works Certificate confirming the rewire","A copy of the EIC, but only if it was issued within the last 12 months"],"a":0,"x":"GN3 1.3.2: the specified persons must receive copies of the EICR, or the EIC if an EICR has not been conducted within 5 years of an EIC for the entire installation being issued.<br>3 May 2022 + 5 years = 3 May 2027, which is after 1 February 2026, so the EIC is still valid for this purpose.","r":"GN3 1.3.2","n":"","k":577,"f":"Chapter 1, Section 1.3.2 Rented domestic and r
