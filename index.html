esidential accommodation, the sentence on who must receive copies. Index: rented accommodation.","w":{"1":"An inspection on change of tenancy is only something landlords 'can consider'; it is not a legal requirement.","2":"A MEIWC cannot certify a rewire; new circuits and a full installation need an EIC.","3":"There is no 12-month limit; the EIC stands in for an EICR for up to 5 years."}},{"id":"g4.n2.25","t":"2","c":0,"q":"For a non-domestic installation, which regulation requires a 'health and safety file' to be prepared and passed to the client when construction work is complete?","o":["The Electromagnetic Compatibility Regulations 2016","Section 11 of the Landlord and Tenant Act 1985","Regulation 12 of the CDM Regulations 2015","The Electricity Supply, Quality and Continuity Regulations"],"a":2,"x":"GN3 1.6: Regulation 12 of the CDM Regulations 2015 requires the health and safety file to be prepared, kept updated and passed to the client on completion; EICs, MEIWCs and EICRs are relevant information for it.","r":"GN3 1.6","n":"","k":639,"f":"Chapter 1, Section 1.6 Record-keeping. Index: health and safety file / CDM Regulations.","w":{"0":"The EMC Regulations require EMC compliance information to be kept, not a health and safety file.","1":"That Act sets a landlord's repairing obligations, not construction records.","3":"ESQCR requires supply characteristics from the DNO, not a health and safety file."}},{"id":"g4.n2.26","t":"2","c":0,"q":"Regulation 641.2, as listed in GN3 2.3, requires certain supply information to be given to the inspector. Which of these is NOT on that list?","o":["The prospective short-circuit current at the origin","The external earth fault loop impedance, Ze","The type and rating of the overcurrent protective device at the origin","The insulation resistance of the distributor's service cable"],"a":3,"x":"GN3 2.3 lists: maximum demand; number and type of live conductors; type of system earthing; nominal voltage and characteristics; nature of current and frequency; prospective short-circuit current at the origin; Ze; and type and rating of the OCPD at the origin.","r":"GN3 2.3","n":"","k":805,"f":"Chapter 2, Section 2.3 Required information, 'Assessment of general characteristics' list (a) to (h). Index: required information.","w":{"0":"PSCC at the origin is item (f) on the list.","1":"Ze is item (g) on the list.","2":"The type and rating of the origin OCPD is item (h) on the list."}},{"id":"g4.n2.27","t":"14","c":0,"q":"Can the model forms in Appendix 6 of BS 7671 be changed to suit a particular installation?","o":["No, only the exact Appendix 6 layout is valid","Yes, but only if a competent person scheme approves the changes","Only for periodic inspection reports, not for EICs","Yes, provided the minimum information required is included"],"a":3,"x":"GN3 2.6.2 note: the model forms in Appendix 6 of BS 7671 can be amended to suit the installation, provided that the minimum information required is included.","r":"GN3 2.6.2","n":"","k":2292,"f":"Chapter 2, Section 2.6.2 Electrical Installation Certificate, the NOTE at the end. Index: model forms.","w":{"0":"GN3 says the forms can be amended, so long as the minimum information is kept.","1":"GN3 doesn't require scheme approval; the only condition is the minimum information.","2":"The note covers the Appendix 6 model forms generally, not just EICRs."}},{"id":"g4.n2.28","t":"14","c":0,"q":"On a multiple-signature EIC, one person carried out both the construction and the inspection and testing. How should they sign?","o":["Sign in each of the appropriate places, construction and inspection and testing","Sign once in the inspection and testing section, which covers construction","Sign construction only; a second person must sign for inspection and testing","Cross out the construction section and sign the design section"],"a":0,"x":"GN3 5.4, EIC Note 3: a signatory authorized to certify more than one category of work should sign in each of the appropriate places.","r":"GN3 5.4","n":"","k":6762,"f":"Chapter 5, Section 5.4, notes to the EIC, Note 3. Index: Electrical Installation Certificate, signatures.","w":{"1":"Each category of responsibility needs its own signature; one signature doesn't cover two sections.","2":"One person may sign more than one category; a second signatory isn't required.","3":"The design section is for the designer; the sections must not be altered like this."}},{"id":"g4.n2.29","t":"14","c":0,"q":"In a three-phase distribution board, single-phase circuits are connected in the fifth compartment. How does GN3 prefer these to be numbered on the schedule?","o":["13, 14 and 15","L1-5, L2-5 and L3-5","5L1, 5L2 and 5L3","5a, 5b and 5c"],"a":2,"x":"GN3 5.4, Schedule of Circuit Details Note 1: for single-phase circuits in three-phase installations the L1, L2, L3 designation is preferred, so the fifth compartment is 5L1, 5L2 and 5L3.","r":"GN3 5.4","n":"","k":6894,"f":"Chapter 5, Section 5.4, 'Generic schedule of circuit details – Notes', Note 1 (also Schedule of Test Results Note 17). Index: circuit number.","w":{"0":"Running numbers lose the compartment and phase; GN3 prefers compartment number plus phase.","1":"GN3 writes the compartment number first, then the phase: 5L1.","3":"Letters a, b, c don't identify the phase; GN3 uses L1, L2, L3."}},{"id":"g4.n2.30","t":"14","c":1,"q":"You check cpc continuity on a radial using the wandering lead method (test method 2). Readings to each point are 0.12, 0.27, 0.35 and 0.31 Ω. What goes in the R2 column (column 22)?","o":["0.12 Ω","1.05 Ω","0.26 Ω","0.35 Ω"],"a":3,"x":"GN3 Schedule of Test Results Note 22: with test method 2 (the wandering lead), enter the maximum of the readings measured on the circuit.<br>Maximum of 0.12, 0.27, 0.35, 0.31 = 0.35 Ω.","r":"GN3 5.4","n":"","k":7202,"f":"Chapter 5, 'Generic schedule of test results – Notes', Note 22. Index: continuity of protective conductors, wandering lead.","w":{"0":"You entered the lowest reading, the point nearest the board; Note 22 asks for the maximum.","1":"You added all the readings; they are separate measurements, so enter the maximum.","2":"You averaged the readings (1.05 ÷ 4); the form needs the maximum."}},{"id":"g4.n2.31","t":"14","c":0,"q":"When adding a socket-outlet you find the existing main bonding conductors are green only (not green-and-yellow) but the designer considers them adequate. How should this go on the MEIWC?","o":["Record it as a departure in Part 1, item 4","Don't certify the work until the bonding is replaced, even though it is adequate","Record it under 'Comments on existing installation', as it doesn't impair the safety of the addition","Leave it off; only defects on the circuit worked on are recorded"],"a":2,"x":"GN3 5.4, MEIWC notes, Part 1 item 5: only deficiencies that do not impair the safety of the addition may be referred to under 'Comments on existing installation'. Green-only bonding considered adequate by the designer is GN3's own example. Anything that would impair safety must be corrected first (132.16).","r":"GN3 5.4","n":"","k":7301,"f":"Chapter 5, Section 5.4, MEIWC 'Notes for the person producing the Certificate', Part 1 item 5. Index: Minor Electrical Installation Works Certificate.","w":{"0":"Departures are deliberate design decisions on the new work; GN3 says these are expected only in very unusual cases.","1":"Only deficiencies that impair the addition's safety must be corrected first; this one is acceptable.","3":"Item 5 is there to record defects seen in the existing installation outside the work done."}},{"id":"g5.n2.32","t":"2","c":0,"q":"You are the only contractor rewiring a house for a private domestic client. Under the CDM Regulations 2015, who takes on the client's duties?","o":["The householder, as the client","The local authority building control body","You, the contractor","The distribution network operator"],"a":2,"x":"GN3 1.3.3: for a private domestic client, the contractor (or, if more than one contractor, the principal contractor) assumes the client's duties under the CDM Regulations.","r":"GN3 1.3.3","n":"","k":593,"f":"Chapter 1, Section 1.3.3 The Construction (Design and Management) Regulations 2015. Index: CDM Regulations.","w":{"0":"Domestic clients do not carry CDM client duties themselves; they pass to the contractor.","1":"Building control enforces the Building Regulations; it does not take on CDM client duties.","3":"The DNO supplies the installation; it has no CDM client role for the rewire."}},{"id":"g5.n2.33","t":"2","c":0,"q":"According to GN3, for how long do the Electromagnetic Compatibility Regulations 2016 require the client to keep the installer's information on EMC compliance?","o":["For the life of the installation","For 5 years, until the first periodic inspection","Until the end of the defects liability period","For 12 months after handover"],"a":0,"x":"GN3 1.6: the EMC Regulations 2016 are statutory and require that the client keep the information provided by the installer on compliance with EMC criteria for the life of the installation.","r":"GN3 1.6","n":"","k":656,"f":"Chapter 1, Section 1.6 Record-keeping, last paragraph. Index: electromagnetic compatibility.","w":{"1":"Five years is the rented sector EICR interval, not the EMC record period.","2":"No contractual defects period is mentioned; the requirement is for the installation's life.","3":"Twelve months is not stated anywhere; the information is kept for the life of the installation."}},{"id":"g5.n2.34","t":"2","c":0,"q":"GN3 says it has never been clarified whether the period to the next periodic inspection should run from the last inspection or from completion of repairs. What does GN3 suggest?","o":["Set it from the date all identified repairs are completed","Set it from the date the original EIC was issued","Set it from the time of the previous inspection, especially if significant repairs are identified","Always set it at a fixed 5 years from the date the report is signed"],"a":2,"x":"GN3 2.4: the inspector must take a view; it would perhaps be best to set it from the time of the previous inspection, especially with significant repairs identified or a poorly maintained installation (repairs may never be done).","r":"GN3 2.4","n":"","k":849,"f":"Chapter 2, Section 2.4 Frequency of subsequent inspections. Index: periodic inspection, frequency.","w":{"0":"GN3 notes repairs 'may never be' done, so counting from repairs could delay the next inspection forever.","1":"The original EIC date sets the first period only, not later ones.","3":"GN3 says each installation differs; there is no fixed 5-year rule for all installations."}},{"id":"g5.n2.35","t":"14","c":0,"q":"You are certifying a new commercial installation with a 400 A three-phase supply. What does GN3 say about using Form 2, the Schedule of Inspections?","o":["Use Form 2 but tick only the items that apply","Use Form 6, the Condition Report Inspection Schedule","It is not suitable above 100 A; draw up your own schedule based on Regulation 642.3 and the Appendix 6 examples","No schedule of inspections is needed for three-phase installations"],"a":2,"x":"GN3 5.1: Form 2 is for domestic and similar premises with up to a 100 A supply. It is not suitable for installations over 100 A or more complex ones; the inspector should draw up their own schedules based on Regulation 642.3 and the Appendix 6 list of examples.","r":"GN3 5.1","n":"","k":6582,"f":"Chapter 5 Forms, Section 5.1 Initial verification (inspection and testing) forms. Index: schedule of inspections.","w":{"0":"GN3 says Form 2 is not suitable above 100 A, so ticking selected items doesn't make it valid.","1":"Form 6 is for periodic inspection (EICR), not initial verification.","3":"Every EIC needs a completed schedule of inspections to be valid."}},{"id":"g5.n2.36","t":"14","c":0,"q":"On a new EIC, the 'Next Inspection' interval to the first periodic inspection is filled in. Whose recommendation is it, and what should it take into account?","o":["The inspector's, based only on the test results obtained","The designer's, agreed with the installer and other relevant parties, allowing for the expected frequency and quality of maintenance","The client's, based on their insurance renewal date","It may be left blank on an EIC; the interval is set at the first EICR"],"a":1,"x":"GN3 5.4, EIC Note 4: the interval to the first periodic inspection must be inserted. It should consider the frequency and quality of maintenance expected and be agreed between the designer, installer and other relevant parties. The page 1 wording is 'I/We, the designer(s), recommend...'.","r":"GN3 5.4","n":"","k":6766,"f":"Chapter 5, Section 5.4, Figure 5.1 'NEXT INSPECTION' and EIC Note 4. Index: next inspection.","w":{"0":"The EIC's next inspection recommendation is made by the designer(s), not set by the inspector from results.","2":"Insurance may require records, but the interval is a design recommendation agreed between the parties.","3":"Note 4 says the interval 'must be inserted'; it cannot be left blank."}},{"id":"g5.n2.37","t":"14","c":1,"q":"A kitchen ring final circuit supplies five twin socket-outlets to BS 1363-2, two single socket-outlets and one switched fused connection unit for a dishwasher. What should go in the 'Number of points served' column?","o":["13","7","12","8"],"a":3,"x":"GN3 5.4, Schedule of Circuit Details Note 5: count every accessory or connection point for equipment, and a double or triple BS 1363-2 socket-outlet usually counts as one point.<br>Twin sockets: 5 × 1 = 5<br>Single sockets: 2<br>Fused connection unit: 1<br>Total = 5 + 2 + 1 = 8.","r":"GN3 5.4","n":"","k":6902,"f":"Chapter 5, Section 5.4, 'Generic schedule of circuit details – Notes', Note 5. Index: points served.","w":{"0":"You counted each twin socket as 2 points (10 + 2 + 1); a twin socket-outlet is one point.","1":"You left out the fused connection unit, which is a connection point for equipment.","2":"You counted twins as 2 points and left out the fused connection unit."}},{"id":"g5.n2.38","t":"14","c":0,"q":"A lighting circuit has LED drivers that cannot be disconnected and could be damaged at 500 V. How should the insulation resistance test be recorded on the Schedule of Test Results?","o":["Enter 500 V, because that is the voltage for all LV circuits","Enter 250 V as the test voltage and explain the reason in the Remarks column","Enter 1000 V, because electronic equipment is present","Leave the insulation resistance columns blank for this circuit"],"a":1,"x":"GN3 Schedule of Test Results Note 23: the test voltage is usually 500 V unless the circuit contains equipment that may be damaged by, or affect, a 500 V test. The Figure 5.4 example records 250 V with the reason (LED drivers) in Remarks.","r":"GN3 5.4","n":"","k":7208,"f":"Chapter 5, 'Generic schedule of test results – Notes', Note 23, and the example in Figure 5.4. Index: insulation resistance, test voltage.","w":{"0":"500 V is the usual voltage, but Note 23 makes an exception for equipment that could be damaged.","2":"1000 V is for circuits above 500 V; it would put the drivers at more risk.","3":"The circuit must still be tested at a suitable voltage and the result recorded."}},{"id":"g5.n2.39","t":"14","c":0,"q":"An EICR has no C1 or C2 observations, but one item is coded FI (further investigation required). How should the overall condition in Section E be reported?","o":["Satisfactory, as there are no C1 or C2 codes","Satisfactory, with the FI item noted as a limitation in Section D","Unsatisfactory","Leave the overall assessment blank until the investigation is done"],"a":2,"x":"GN3 5.4, EICR Notes 7 and 9: any C1 or C2 observation makes the overall condition unsatisfactory. An FI observation (one that could turn out to be C1 or C2) is recorded in Section K, coded FI, and marked as unsatisfactory in Section E.","r":"GN3 5.4","n":"","k":7518,"f":"Chapter 5, Section 5.4, 'Electrical Installation Condition Report – Notes for the person producing the report', Notes 7 and 9. Index: classification codes.","w":{"0":"Note 9 says an FI item must also be marked unsatisfactory, as it may hide a C1 or C2.","1":"FI items go in Section K and make the report unsatisfactory; they aren't just limitations.","3":"The overall assessment must be stated, and with an FI it is unsatisfactory."}},{"id":"g1.n3.00","t":"3","c":0,"q":"Regulation 641.1 requires inspection and testing to be carried out during the erection stage of an installation. According to GN3, the main reason for this is to:","o":["allow the installer to issue a separate EIC for each stage of the work","remove the need for a full inspection on completion","allow review and inspection of work that may later be covered and inaccessible","let the inspector redesign circuits before they are covered"],"a":2,"x":"GN3 2.5.1: Regulation 641.1 requires inspection and testing during erection so work that will later be covered and inaccessible can be reviewed. The inspector needs the design information from the designer before such inspections.","r":"GN3 2.5.1","n":"","k":872,"f":"Chapter 2, section 2.5.1 General procedure. Index: 'Initial inspection – general procedure'.","w":{"0":"Certification is issued on completion of the verification process; staged records support it, they don't replace it.","1":"Inspection during erection adds to, rather than replaces, the inspection on completion.","3":"The inspector needs design information from the designer; redesign is not the inspector's role."}},{"id":"g2.n3.01","t":"3","c":0,"q":"When inspecting a new installation against the items listed in Regulation 642.3, GN3 states that the inspector:","o":["needs to check only the items in the 642.3 list, as the list is exhaustive","compares items with the designer's and installer's data and identifies non-compliances, but does not decide what items are required","decides which installation items are required and specifies the repairs needed","must approve the design before any installation work starts"],"a":1,"x":"GN3 2.5.2 (opening): the 642.3 list is a minimum and not exhaustive. The inspector compares items with designer/installer data and identifies non-compliances or departures, but does not decide what items are required or identify repairs.","r":"GN3 2.5.2","n":"","k":882,"f":"Section 2.5.2 Comments on individual items to be inspected, opening paragraph. Index: 'Initial inspection'.","w":{"0":"The 642.3 list is a minimum and GN3 says it is not exhaustive.","2":"GN3 says it is not for the inspector to decide what items are required or to identify repairs or modifications.","3":"Design approval isn't the inspector's job; they compare what is installed with the designer's data."}},{"id":"g3.n3.02","t":"3","c":0,"q":"BS EN 60228 describes conductor stranding classes. A stranding class 2 (stranded) conductor consists of at least how many strands, where Part 7 does not specify otherwise?","o":["7","6","19","3"],"a":1,"x":"GN3 2.5.2 item a: class 2 stranded conductors consist of at least 6 strands, although some Part 7 applications specify a minimum of 7.","r":"GN3 2.5.2","n":"","k":896,"f":"Section 2.5.2 item a 'Connection of conductors', the list of the four BS EN 60228 stranding classes. Index: 'Conductors – stranding classes'.","w":{"0":"Seven is the minimum some Part 7 applications specify, not the general class 2 minimum.","2":"19 strands is a common construction for larger cables, not the class 2 minimum.","3":"Too few; GN3 gives a minimum of 6 strands for class 2."}},{"id":"g4.n3.03","t":"3","c":0,"q":"Using GN3 Table 2.1, a screwless terminal on an accessory is marked 'sol'. Which conductors is it suitable for?","o":["Stranding class 5 and class 6 conductors","Stranding class 1 and class 2 conductors","Any stranding class of conductor","Stranding class 1 (solid) conductors only"],"a":3,"x":"GN3 Table 2.1: a terminal marked 'sol' is only suitable for stranding class 1 (solid) conductors, and some are not suitable for crimp ferrules.","r":"GN3 2.5.2","n":"","k":930,"f":"Section 2.5.2 item a, Table 2.1 Suitability of terminals for certain conductor classes. Index: 'Terminals – suitability'.","w":{"0":"That's a terminal marked 'f' for flexible conductors.","1":"That's a terminal marked 'r' (rigid conductors only).","2":"That applies to terminals with no marking."}},{"id":"g5.n3.04","t":"3","c":0,"q":"A stranding class 2 conductor needs to be connected to a terminal marked 'f'. According to GN3 Table 2.1, what applies?","o":["It is acceptable if the strands are soldered together","It is acceptable if a crimp ferrule is fitted first","It is acceptable, as 'f' terminals accept any stranding class","It cannot be terminated there, as 'f' terminals only suit class 5 and 6 conductors"],"a":3,"x":"GN3 Table 2.1: a terminal marked 'f' is only suitable for stranding class 5 and 6 conductors; it is not possible to terminate class 1 or 2 conductors in it.","r":"GN3 2.5.2","n":"","k":935,"f":"Section 2.5.2 item a, Table 2.1, row 'f'. Index: 'Terminals – suitability'.","w":{"0":"Soldering is only allowed under Regulation 526.9 and does not make class 2 suitable for 'f'.","1":"Ferrules are recommended for unmarked terminals; a ferrule can't make class 2 suitable for an 'f' terminal.","2":"Only unmarked terminals accept any class; 'f' means flexible conductors only."}},{"id":"g1.n3.05","t":"3","c":0,"q":"Apart from PEN conductors, a conductor identified green-and-yellow throughout its length may be overmarked at its terminations only:","o":["with pink where it is used for functional earthing","to identify which circuit the cpc serves","with blue where it is used as a neutral","with brown or 'L' where it is used as a switch line"],"a":1,"x":"GN3 2.5.2 item b: green-and-yellow conductors (other than PEN) must not be overmarked with another colour or alphanumeric symbols at terminations, except to identify which circuit the cpc serves.","r":"GN3 2.5.2","n":"","k":945,"f":"Section 2.5.2 item b 'Identification of cables and conductors'. Index: 'Identification – conductors'.","w":{"0":"Overmarking with another colour is prohibited; FE is identified by pink conductors, not marked green-and-yellow.","2":"Green-and-yellow is for protective conductors only and must not be overmarked to change its function.","3":"Overmarking green-and-yellow as a line conductor is prohibited; only circuit identification is allowed."}},{"id":"g2.n3.06","t":"3","c":0,"q":"Using GN3 Table 2.2, what colour identifies a functional earthing (FE) conductor?","o":["Pink (PK)","Black (BK)","Green (GN)","Green-and-yellow (GNYE)"],"a":0,"x":"GN3 Table 2.2: functional earthing conductor, alphanumeric FE, colour pink (PK).","r":"GN3 2.5.2","n":"","k":958,"f":"Section 2.5.2 item b, Table 2.2 Identification of conductors. Index: 'Identification – conductors'.","w":{"1":"Black is Line 2 of a three-phase AC circuit.","2":"Single green must not be used for functional earthing or bonding conductors.","3":"Green-and-yellow is for protective (PE) and protective bonding (PB) conductors."}},{"id":"g3.n3.07","t":"3","c":0,"q":"Using GN3 Table 2.2, what colour identifies Line 3 of a three-phase AC power circuit?","o":["Blue (BU)","Brown (BN)","Grey (GY)","Black (BK)"],"a":2,"x":"GN3 Table 2.2: L1 brown, L2 black, L3 grey, N blue.","r":"GN3 2.5.2","n":"","k":964,"f":"Section 2.5.2 item b, Table 2.2 Identification of conductors, 'AC power circuit' rows.","w":{"0":"Blue is the neutral of a single- or three-phase circuit.","1":"Brown is Line 1 (and the line of a single-phase circuit).","3":"Black is Line 2."}},{"id":"g4.n3.08","t":"3","c":0,"q":"Using GN3 Table 2.2, how is the negative conductor of a two-wire unearthed DC power circuit identified?","o":["L–, black (BK)","L–, white (WH)","M, blue (BU)","L+, red (RD)"],"a":1,"x":"GN3 Table 2.2: two-wire unearthed DC power circuit, positive L+ red, negative L– white.","r":"GN3 2.5.2","n":"","k":967,"f":"Section 2.5.2 item b, Table 2.2, 'Two-wire unearthed DC power circuit' rows.","w":{"0":"Right symbol, wrong colour; black is Line 2 of a three-phase AC circuit.","2":"Blue 'M' is the earthed conductor of an earthed DC circuit, not an unearthed one.","3":"Red L+ is the positive conductor."}},{"id":"g5.n3.09","t":"3","c":0,"q":"A 230 V lighting circuit in flat twin-and-cpc cable (no earthed metallic covering, no mechanical protection, not SELV or PELV) is buried 30 mm deep in a masonry wall within a prescribed cable zone. What does GN3 say?","o":["Additional protection by an RCD not exceeding 30 mA is required, even though the cable is in a prescribed zone","An RCD is only needed if the cable is less than 25 mm deep","No RCD is needed because the cable runs within a prescribed zone","A 100 mA RCD at the origin is sufficient"],"a":0,"x":"GN3 2.5.2 item c: cables in a wall less than 50 mm deep without earthed metallic covering, earthed containment, mechanical protection, or SELV/PELV supply need a 30 mA RCD. This applies even within the prescribed zones.","r":"GN3 2.5.2","n":"","k":1003,"f":"Section 2.5.2 item c 'Routing of cables' (Regulation 522.6.201). Index: 'Cables – concealed in walls'.","w":{"1":"The trigger depth is less than 50 mm, not 25 mm.","2":"GN3 says the RCD is required even where cables run within the prescribed zones.","3":"The requirement is an RCD with rated residual operating current not exceeding 30 mA."}},{"id":"g1.n3.10","t":"3","c":0,"q":"Cables are installed in a partition built with metal studs. When is additional protection (30 mA RCD), suitable mechanical protection or another permitted method required?","o":["Irrespective of the depth at which the cables are installed","Only where the cables are less than 50 mm from the surface","Only where the cables run outside the prescribed zones","Only in dwellings"],"a":0,"x":"GN3 2.5.2 item c: cables in a wall or partition containing metallic parts (studs, frames, skins) need 30 mA RCD protection, suitable mechanical protection or another permitted method, irrespective of depth.","r":"GN3 2.5.2","n":"","k":1012,"f":"Section 2.5.2 item c 'Routing of cables', paragraph on partitions with metallic parts (522.6.203). Index: 'Partitions – metallic parts'.","w":{"1":"For metallic-part partitions GN3 says the requirement applies irrespective of depth.","2":"Running in the zones doesn't remove the requirement for partitions with metallic parts.","3":"The requirement depends on how the partition is built, not on the type of premises."}},{"id":"g2.n3.11","t":"3","c":0,"q":"The requirement that surface-run wiring systems must not be liable to premature collapse in the event of fire applies to:","o":["non-domestic premises only","designated and signed escape routes only","all areas of the installation, not just designated escape routes","protected escape routes only"],"a":2,"x":"GN3 2.5.2 item c: the requirement for surface-run wiring systems not to be subject to premature collapse in a fire applies to all areas, not just designated escape routes.","r":"GN3 2.5.2","n":"","k":1047,"f":"Section 2.5.2 item c 'Routing of cables', fire-collapse paragraphs; also item q. Index: 'Premature collapse'.","w":{"0":"No such exemption; the requirement is in Regulation 521.10.202 for all installations.","1":"GN3 says it applies to all areas, as unsigned routes across open-plan offices are also used.","3":"Protected escape routes have extra rules, but the anti-collapse requirement applies everywhere."}},{"id":"g3.n3.12","t":"3","c":1,"q":"Which of these wiring containments, passing through a fire-rated wall, must be internally sealed under Regulation 527.2.3? (Internal dimensions are given.)","o":["38 mm × 16 mm mini-trunking","20 mm internal diameter conduit","25 mm internal diameter conduit","50 mm × 50 mm trunking"],"a":3,"x":"GN3 2.5.2 item c: containment with an internal csa greater than 710 mm² (roughly a 30 mm round hole) must be internally sealed.<br>50 × 50 = 2500 mm² > 710 mm² → seal internally.<br>38 × 16 = 608 mm²; π × 12.5² = 491 mm²; π × 10² = 314 mm² → all below 710 mm².","r":"GN3 2.5.2","n":"","k":1082,"f":"Section 2.5.2 item c, paragraph on Regulation 527.2.3 (710 mm²); see also item g. Index: 'Fire barriers' or 'Sealing'.","w":{"0":"38 × 16 = 608 mm², below 710 mm².","1":"π × 10² ≈ 314 mm², well below 710 mm².","2":"π × 12.5² ≈ 491 mm², below 710 mm², so internal sealing isn't required by 527.2.3."}},{"id":"g4.n3.13","t":"3","c":0,"q":"Wiring systems within a protected escape route should be limited to certain systems. Which of the following is one of them?","o":["Fire detection and alarm","Radial circuits supplying hand dryers","Supply to air-conditioning plant","Ring final circuits supplying office socket-outlets"],"a":0,"x":"GN3 2.5.2 item c: wiring in a protected escape route should be limited to lighting, emergency lighting, fire detection and alarm, and other essential safety systems for high hazard premises.","r":"GN3 2.5.2","n":"","k":1096,"f":"Section 2.5.2 item c, protected escape route paragraphs (Regulation 422.2.1, Appendix 13). Index: 'Protected escape route'.","w":{"1":"General power wiring isn't one of the permitted systems for a fire-sterile route.","2":"Air conditioning isn't among the four permitted wiring systems.","3":"Accessories may be fitted there, but GN3 limits the wiring systems to lighting, emergency lighting, fire alarm and essential safety systems."}},{"id":"g5.n3.14","t":"3","c":0,"q":"Cable tray installed in a protected escape route must be classified as non-flame propagating according to which product standard?","o":["BS EN 61386","BS EN 61534","BS EN 50085","BS EN 61537"],"a":3,"x":"GN3 2.5.2 item c: containment in protected escape routes must be non-flame propagating to its product standard: conduit BS EN 61386, trunking BS EN 50085, cable tray/ladder BS EN 61537, powertrack BS EN 61534.","r":"GN3 2.5.2","n":"","k":1112,"f":"Section 2.5.2 item c, list (a)–(d) after the protected escape route definition. Index: 'Protected escape route'.","w":{"0":"BS EN 61386 is the standard for conduit systems.","1":"BS EN 61534 is the standard for powertrack systems.","2":"BS EN 50085 is the standard for trunking systems."}},{"id":"g1.n3.15","t":"3","c":0,"q":"Cables in protected escape routes must have a minimum light transmittance, when tested to BS EN 61034-2, of:","o":["50 %","60 %","80 %","70 %"],"a":1,"x":"GN3 2.5.2 item d: cables in protected escape routes must have a minimum 60 % light transmittance when tested to BS EN 61034-2.","r":"GN3 2.5.2","n":"","k":1119,"f":"Section 2.5.2 item d 'Selection of conductors' (Regulation 422.2.1). Index: 'Protected escape route – cables'.","w":{"0":"Too low; GN3 gives a 60 % minimum.","2":"Not the GN3 figure; the minimum is 60 %.","3":"Too high; the stated minimum is 60 %."}},{"id":"g2.n3.16","t":"3","c":0,"q":"When inspecting cable couplers, the pins of the connector (exposed when the coupler is disconnected) should be connected to:","o":["either side, as long as the coupler is rated IP2X","the side nearest the distribution board","the load (downstream) side of the connection","the supply (upstream) side of the connection"],"a":2,"x":"GN3 2.5.2 item f: cable coupler pins, accessible when disconnected, are connected to the load or downstream side.","r":"GN3 2.5.2","n":"","k":1144,"f":"Section 2.5.2 item f 'Accessories and equipment' (Regulation 553.2.2). Index: 'Cable couplers'.","w":{"0":"IP2X both sides is for couplers where current can flow either way, such as in PEIs, not a free choice.","1":"That is the supply side, which would leave live pins accessible.","3":"That would leave live pins exposed when disconnected, which is the common mistake GN3 warns about."}},{"id":"g3.n3.17","t":"3","c":0,"q":"In a TN or TT system, an Edison screw lampholder (other than an E14 or E27 to BS EN 60238) must have which conductor connected to its centre contact?","o":["The line conductor","Either line or neutral, since the supply is AC","The neutral conductor","The circuit protective conductor"],"a":0,"x":"GN3 2.5.2 item f: ES lampholders in TN and TT systems have line connected to the centre contact and neutral to the outer contact (except E14 and E27 to BS EN 60238).","r":"GN3 2.5.2","n":"","k":1153,"f":"Section 2.5.2 item f 'Accessories and equipment' (559.5.1.205); also item e polarity. Index: 'Lampholders'.","w":{"1":"Polarity matters; the line must go to the centre contact to keep the screw shell at neutral.","2":"Neutral goes to the outer (screw) contact.","3":"The cpc is never connected to the centre contact of a lampholder."}},{"id":"g4.n3.18","t":"3","c":0,"q":"Lighting circuits incorporating B15, B22, E14, E27 or E40 lampholders are only to be used on a lighting circuit rated up to:","o":["10 A","20 A","16 A","6 A"],"a":2,"x":"GN3 2.5.2 item f: lighting circuits with B15, B22, E14, E27 or E40 lampholders are only to be used in a circuit rated up to 16 A.","r":"GN3 2.5.2","n":"","k":1155,"f":"Section 2.5.2 item f 'Accessories and equipment', lampholder paragraph. Index: 'Lampholders'.","w":{"0":"Not the GN3 limit; the maximum is 16 A.","1":"Too high; GN3 sets the limit at 16 A.","3":"6 A is a common lighting MCB rating, not the GN3 maximum."}},{"id":"g5.n3.19","t":"3","c":0,"q":"PVC trunking is classified as 'non-flame propagating' to BS EN 50085. According to GN3, this means:","o":["it will protect the cables inside it from a fire for a set period","it may ignite under an applied flame but self-extinguishes; it is not a fire-resistance rating","it will not ignite under any applied flame","only metallic trunking can carry this classification"],"a":1,"x":"GN3 2.5.2 item g: the non-flame propagating test is a self-extinguishing test, not a fire-resistance test. The product cannot be assumed to protect the cable inside it.","r":"GN3 2.5.2","n":"","k":1173,"f":"Section 2.5.2 item g 'Selection and erection to minimize the spread of fire'. Index: 'Non-flame propagating'.","w":{"0":"GN3 says the product cannot be assumed to protect the cable inside it; the cable needs its own classification.","2":"Such products can catch fire; they self-extinguish after the flame is removed.","3":"GN3 says both metallic and non-metallic products can be non-flame propagating."}},{"id":"g1.n3.20","t":"3","c":0,"q":"For a readily accessible horizontal top surface of an enclosure, what minimum degree of protection should barriers and enclosures provide?","o":["IP65","IPX4","IPXXD or IP4X","IPXXB or IP2X"],"a":2,"x":"GN3 2.5.2 item h(i): barriers and enclosures must provide at least IPXXB or IP2X, and at least IPXXD or IP4X on a readily accessible horizontal top surface.","r":"GN3 2.5.2","n":"","k":1250,"f":"Section 2.5.2 item h(i) 'basic protection by insulation of live parts and/or barriers or enclosures' (Section 416). Index: 'IP codes' or 'Barriers and enclosures'.","w":{"0":"Higher than required and mostly about dust and water jets; the stated minimum is IPXXD/IP4X.","1":"IPX4 is a water (splashing) rating, not protection against access to live parts.","3":"That's the general minimum for barriers and enclosures, not for accessible top surfaces."}},{"id":"g2.n3.21","t":"3","c":0,"q":"How does GN3 say the type of system earthing arrangement (for example TN-C-S or TN-S) should be confirmed?","o":["Stated by the designer and confirmed by the DNO, not assumed by visual inspection","From the size of the main protective bonding conductors","By measuring Ze: a low reading proves TN-C-S","By visual inspection of the cut-out and earthing terminal"],"a":0,"x":"GN3 2.5.2 item h(ii), ADS: the designer must state the system earthing arrangement and it should be confirmed by the DNO, not assumed by visual inspection.","r":"GN3 2.5.2","n":"","k":1278,"f":"Section 2.5.2 item h(ii) 'Automatic disconnection of supply (ADS)'. Index: 'Earthing arrangement' or 'System types'.","w":{"1":"Bonding size depends on PME conditions, not the other way round; it proves nothing.","2":"A low Ze is a common site assumption but doesn't prove the arrangement; the DNO confirms it.","3":"GN3 says the earthing arrangement should not be assumed by visual inspection."}},{"id":"g3.n3.22","t":"3","c":0,"q":"Apart from any lower Part 7 limits, the nominal voltage of a SELV or PELV system must not exceed:","o":["50 V AC or 120 V DC","50 V AC or 50 V DC","25 V AC or 60 V DC","120 V AC or 50 V DC"],"a":0,"x":"GN3 2.5.2 item h(ii), SELV/PELV (414.1.1): nominal voltage must not exceed 50 V AC or 120 V DC, or lower Part 7 limits.","r":"GN3 2.5.2","n":"","k":1316,"f":"Section 2.5.2 item h(ii) 'Extra-low voltage provided by SELV or PELV'. Index: 'SELV'.","w":{"1":"The DC limit is 120 V, not 50 V.","2":"25 V AC / 60 V DC is the threshold below which basic protection may be omitted (414.4.5), not the Section 414 maximum.","3":"The AC and DC figures have been swapped."}},{"id":"g4.n3.23","t":"3","c":1,"q":"Electrical separation supplies more than one item of equipment at 230 V. What is the maximum length of the wiring system using the voltage × length limit GN3 gives?","o":["500 m","250 m","434 m","43 m"],"a":2,"x":"GN3 2.5.2 item h(iv): voltage × length must not exceed 100,000 Vm and length must not exceed 500 m.<br>L = 100,000 ÷ 230<br>L = 434.8 m → 434 m (must not exceed)<br>434 m < 500 m, so 434 m governs.","r":"GN3 2.5.2","n":"","k":1409,"f":"Section 2.5.2 item h(iv), 'Electrical separation for the supply to more than one item of current-using equipment' (Regulation 418.3). Index: 'Electrical separation'.","w":{"0":"500 m is the absolute cap; at 230 V the 100,000 Vm limit is reached first.","1":"You divided 100,000 by 400 V, not the 230 V nominal voltage.","3":"You divided 10,000 rather than 100,000 by 230 V."}},{"id":"g5.n3.24","t":"3","c":0,"q":"In a non-domestic installation, the designer has omitted RCD additional protection for some socket-outlets based on a written risk assessment. What should the inspector do?","o":["Review and approve the content of the risk assessment","See the risk assessment to confirm it exists and attach it to the certificate, without approving it","Ignore it, as the inspector has no interest in design documents","Record a departure because all sockets up to 32 A must have RCDs"],"a":1,"x":"GN3 2.5.2 item h(v): the inspector does not consider or approve the risk assessment, but should see it to prove it exists. It should also be attached to the EIC or MEIWC.","r":"GN3 2.5.2","n":"","k":1420,"f":"Section 2.5.2 item h(v) 'Additional protection by one or more RCDs' (415.1.1). Index: 'Risk assessment' or 'RCD – additional protection'.","w":{"0":"GN3 says it is not for the inspector to consider or approve the risk assessment.","2":"The inspector must see the assessment to prove it exists, so the regulation is met.","3":"BS 7671 allows omission where a written risk assessment exists, so it isn't automatically a departure."}},{"id":"g1.n3.25","t":"3","c":1,"q":"In a Group 1 medical location, supplementary bonding is verified for a circuit protected by a 30 mA RCD. What is the maximum resistance R between simultaneously accessible parts?","o":["0.833 Ω","1667 Ω","4000 Ω","833 Ω"],"a":3,"x":"GN3 2.5.2 item h(v), note: in medical Group 1 and 2 locations the 50 V is reduced to 25 V. For an RCD, Ia = IΔn.<br>R ≤ 25 ÷ 0.03<br>R ≤ 833 Ω","r":"GN3 2.5.2","n":"","k":1438,"f":"Section 2.5.2 item h(v) supplementary bonding, the Note under condition (a). Index: 'Supplementary bonding' or 'Medical locations'.","w":{"0":"You divided by 30 instead of 0.03 A; convert mA to A first.","1":"You used 50 V; in medical Group 1 and 2 locations the voltage is reduced to 25 V.","2":"You used the DC 120 V formula."}},{"id":"g2.n3.26","t":"3","c":1,"q":"Supplementary bonding is being verified in an AC system. The circuit's overcurrent device gives 5 s disconnection at a current of 80 A. What is the maximum permitted resistance R between simultaneously accessible exposed- and extraneous-conductive-parts?","o":["0.3125 Ω","1.6 Ω","0.625 Ω","1.5 Ω"],"a":2,"x":"GN3 2.5.2 item h(v): for AC, R ≤ 50 V ÷ Ia, where for an overcurrent device Ia is the 5 s operating current.<br>R ≤ 50 ÷ 80<br>R ≤ 0.625 Ω","r":"GN3 2.5.2","n":"","k":1447,"f":"Section 2.5.2 item h(v) 'Additional protection by supplementary protective equipotential bonding' (415.2.2). Index: 'Supplementary bonding'.","w":{"0":"You used 25 V, which is only for medical locations and filling stations.","1":"You inverted the formula (80 ÷ 50); R = 50 V ÷ Ia.","3":"You used the DC formula (120 V ÷ 80 A) instead of 50 V ÷ Ia for AC."}},{"id":"g3.n3.27","t":"3","c":0,"q":"According to GN3, a Type AC RCD may only be used for:","o":["circuits in medical locations","socket-outlets incorporating RCD protection (SRCDs) to BS 7288","fixed equipment where the load current is known to contain no DC components","socket-outlet circuits supplying IT equipment"],"a":2,"x":"GN3 2.5.2 item h(v): Type AC RCDs shall only be used for fixed equipment where the load current contains no DC components. This precludes SRCDs with Type AC protection.","r":"GN3 2.5.2","n":"","k":1455,"f":"Section 2.5.2 item h(v), RCD selection (531.3) and Table 2.6, Note 1. Index: 'RCD – types'.","w":{"0":"Type AC RCDs are not permitted in medical locations.","1":"GN3 says the Type AC rule precludes socket-outlets with Type AC RCD protection.","3":"Socket-outlets can supply loads with DC components, so Type AC is unsuitable."}},{"id":"g4.n3.28","t":"3","c":0,"q":"A designer proposes using a BS 7288 SRCD to achieve the Chapter 41 disconnection time for ADS on a circuit. According to GN3 Table 2.6:","o":["it is acceptable on TT systems only","it is acceptable where operated only by skilled or instructed persons","it is acceptable if the SRCD is Type A","it is not acceptable: SRCDs give additional protection only and cannot meet Chapter 41 ADS times"],"a":3,"x":"GN3 Table 2.6, Note 2: SRCDs and FCU RCDs to BS 7288 are additional protection only and cannot be used to meet the disconnection times required by Chapter 41 for ADS.","r":"GN3 2.5.2","n":"","k":1497,"f":"Section 2.5.2 item h(v), Table 2.6 Types of RCD currently recognized by BS 7671, Note 2. Index: 'RCD – types'.","w":{"0":"Table 2.6 Note 2 makes no TT exception.","1":"That's Note 3, which applies to CBRs and MRCDs, not SRCDs.","2":"Note 2 applies whatever the type; SRCDs are additional protection only."}},{"id":"g5.n3.29","t":"3","c":0,"q":"Using GN3 Table 2.7, which utilization category suits a switch that infrequently switches a motor load?","o":["AC-23a","AC-21b","AC-23b","AC-22b"],"a":2,"x":"GN3 Table 2.7: AC-23 is for switching motor loads or other highly inductive loads. Suffix 'a' means frequent operation and 'b' means infrequent.","r":"GN3 2.5.2","n":"","k":1534,"f":"Section 2.5.2 item j 'Isolating and switching devices', Table 2.7 utilization categories. Index: 'Utilization categories'.","w":{"0":"Right load type, but the 'a' suffix is for frequent operation.","1":"AC-21 is for resistive loads.","3":"AC-22 is for mixed resistive and inductive loads, not motors."}},{"id":"g1.n3.30","t":"3","c":0,"q":"Apart from the special conditions in Regulation 543.3.3.101, which device may be inserted in a protective conductor?","o":["A pole of a circuit-breaker","A fuse","A single-pole switch","A plug and socket-outlet"],"a":3,"x":"GN3 2.5.2 item j: BS 7671 doesn't allow a switching or isolating device in the earth or protective conductor, other than a plug and socket-outlet, except under Regulation 543.3.3.101.","r":"GN3 2.5.2","n":"","k":1560,"f":"Section 2.5.2 item j 'Isolating and switching devices', last paragraph. Index: 'Isolation and switching'.","w":{"0":"A switching or isolating device in the protective conductor isn't permitted.","1":"No protective device may be placed in the protective conductor; it could open the earth path.","2":"BS 7671 doesn't allow a switching device in the protective conductor."}},{"id":"g2.n3.31","t":"3","c":0,"q":"Where an AFDD has a manual test button, GN3 says it should be pressed at commissioning and the user advised to press it:","o":["every six months","every year","every three months","every month"],"a":0,"x":"GN3 2.5.2 item l: AFDDs with a manual test button should be tested at commissioning, and the user advised to press it at six-monthly intervals.","r":"GN3 2.5.2","n":"","k":1595,"f":"Section 2.5.2 item l 'Protective and monitoring devices', AFDD paragraph; also item p(v). Index: 'AFDDs'.","w":{"1":"Too long; the stated interval is six months.","2":"Quarterly is a common misremembering of the old RCD notice; the interval is six months.","3":"Too frequent; GN3 gives six-monthly intervals."}},{"id":"g3.n3.32","t":"3","c":0,"q":"In domestic premises where the information is recorded in the certification with the Guidance for Recipients, which of these notices is still required?","o":["Periodic inspection and testing notice","RCD six-monthly test notice","Presence of SPDs notice","Earthing and bonding connection warning ('Safety Electrical Connection – Do Not Remove')"],"a":3,"x":"GN3 2.5.2 item p: notices (iii) periodic inspection, (iv) RCD testing, (v) AFDD testing and (viii) SPDs need not be applied in domestic premises when recorded in the certification. The earthing and bonding notice (vi) is not exempt.","r":"GN3 2.5.2","n":"","k":1634,"f":"Section 2.5.2 item p 'Warning and instruction notices', list (i)–(x) and the paragraph after it. Index: 'Warning notices'.","w":{"0":"Item (iii) is one of the notices that can be omitted in domestic premises.","1":"Item (iv) can be omitted in domestic premises when recorded in the certification.","2":"Item (viii) can be omitted in domestic premises when recorded in the certification."}},{"id":"g4.n3.33","t":"3","c":0,"q":"In a normal 230/400 V three-phase installation, is a voltage warning notice to Regulation 514.10.1 normally required on the distribution boards?","o":["Yes, because 400 V exists between line conductors","No: the voltage to Earth is 230 V, so it is not normally necessary","Only where the board is in domestic premises","Yes, on every three-phase distribution board"],"a":1,"x":"GN3 2.5.2 item p(i): voltage warnings are needed where a nominal voltage exceeding 230 V to earth exists and wouldn't normally be expected. In most 230/400 V systems the voltage to Earth is 230 V, so none is normally needed.","r":"GN3 2.5.2","n":"","k":1653,"f":"Section 2.5.2 item p 'Warning and instruction notices', (i) Voltage and its Note. Index: 'Warning notices – voltage'.","w":{"0":"The trigger is a voltage exceeding 230 V to earth that wouldn't normally be expected.","2":"The type of premises isn't the test; the voltage to earth is.","3":"GN3 notes it isn't normally needed in 230/400 V systems."}},{"id":"g5.n3.34","t":"3","c":0,"q":"Why does GN3 say it is important to label distribution boards that contain, or supply circuits with, SPDs?","o":["SPDs may be damaged by insulation resistance tests, or affect the results","To warn of high protective conductor current","To show that the SPD must be user-tested every six months","To indicate that the circuits need Type B RCDs"],"a":0,"x":"GN3 2.5.2 item p(viii): Regulation 514.16.1 requires a label because SPDs may be damaged by insulation resistance tests or affect the results.","r":"GN3 2.5.2","n":"","k":1775,"f":"Section 2.5.2 item p(viii) 'Presence of SPDs'. Index: 'SPDs – labelling'.","w":{"1":"That is a separate notice under Regulations 514.17 and 543.7.1.205.","2":"Six-monthly user testing applies to RCDs and AFDDs with test buttons, not SPDs.","3":"SPD presence has nothing to do with RCD type selection."}},{"id":"g1.n3.35","t":"3","c":1,"q":"A distribution board to BS EN 61439 has a rated diversity factor (RDF) of 0.8 for the assembly. What load may a 40 A outgoing circuit carry, provided the assembly's total rated current is not exceeded?","o":["32 A","50 A","40 A","8 A"],"a":0,"x":"GN3 2.5.3 General (w): with an RDF of 0.8, outgoing circuits can be loaded to 80 % of their rated current, within the assembly rating.<br>40 × 0.8<br>= 32 A","r":"GN3 2.5.3","n":"","k":1893,"f":"Section 2.5.3 Inspection checklist, 'General' item (w) on distribution boards. Index: 'Rated diversity factor'.","w":{"1":"You divided by 0.8 instead of multiplying.","2":"You ignored the RDF; outgoing circuits may only be loaded to 80 % of their rating.","3":"You multiplied by 0.2, the reduction, not 0.8."}},{"id":"g2.n3.36","t":"3","c":0,"q":"When inspecting lighting points wired with two-core cable for the switch wire, GN3 expects:","o":["the blue conductor to be overmarked 'N' at the terminations","the brown conductor to be overmarked blue at the terminations","the blue conductor to be left unmarked, as switch wires are obvious","the blue conductor to be overmarked brown or 'L' at the terminations"],"a":3,"x":"GN3 2.5.3 Lighting points (k): switch-lines are identified; for two-core switch wires the blue conductor is overmarked brown or L at terminations.","r":"GN3 2.5.3","n":"","k":2004,"f":"Section 2.5.3 Inspection checklist, 'Lighting points' item (k). Index: 'Switch-lines' or 'Identification'.","w":{"0":"The switch wire is a line conductor, so it's marked brown or L, not N.","1":"Wrong way round; the blue core is used as a line and needs marking brown.","2":"Switch-lines must be identified under 514.3.2."}},{"id":"g3.n3.37","t":"3","c":0,"q":"In a location containing a bath or shower, socket-outlets (other than shaver supply units or SELV) must be installed at least what horizontal distance from the bath or shower?","o":["1.5 m","3 m","2.25 m","0.6 m"],"a":1,"x":"GN3 2.5.3 Socket-outlets (e): in a location containing a bath or shower, socket-outlets are at least 3 m horizontally from the bath or shower, except shaver supply units and SELV (701.512.3).","r":"GN3 2.5.3","n":"","k":2029,"f":"Section 2.5.3 Inspection checklist, 'Socket-outlets' item (e). Index: 'Socket-outlets' or 'Bath or shower locations'.","w":{"0":"Not the regulation figure; it's 3 m horizontally.","2":"2.25 m is a zone height, not a horizontal distance for sockets.","3":"0.6 m is the zone 2 width, not the socket-outlet distance."}},{"id":"g4.n3.38","t":"3","c":0,"q":"GN3 recommends a minimum horizontal distance between a socket-outlet and the edge of a sink (excluding the drainer) of:","o":["100 mm","500 mm","150 mm","300 mm"],"a":3,"x":"GN3 2.5.3 Socket-outlets (f): socket-outlets should be at least 300 mm horizontally from the edge of a sink or washbasin (excluding drainer) and 100 mm from a hob or cooker.","r":"GN3 2.5.3","n":"","k":2033,"f":"Section 2.5.3 Inspection checklist, 'Socket-outlets' item (f). Index: 'Socket-outlets'.","w":{"0":"100 mm is the recommended distance from the edge of a hob or freestanding cooker.","1":"Further than the GN3 recommendation of 300 mm.","2":"150 mm is the width of the prescribed cable zones, not this distance."}},{"id":"g5.n3.39","t":"3","c":0,"q":"A separate cpc is not part of a cable, not formed by containment and not protected against mechanical damage. What is its minimum csa?","o":["2.5 mm²","4 mm²","10 mm²","6 mm²"],"a":1,"x":"GN3 2.5.3 Protective conductors (j): separate cpcs not protected against mechanical damage, not part of a cable and not formed by or within containment must be at least 4 mm² (543.1.1).","r":"GN3 2.5.3","n":"","k":2244,"f":"Section 2.5.3 Inspection checklist, 'Protective conductors' item (j). Index: 'Protective conductors – csa'.","w":{"0":"2.5 mm² is the minimum where the separate cpc is mechanically protected.","2":"10 mm² is a typical main bonding size, not the unprotected cpc minimum.","3":"6 mm² is the threshold for sleeving bare protective conductors, not this minimum."}},{"id":"g1.n4.00","t":"4","c":0,"q":"You are measuring Ze at the meter tails, between the electricity meter and the consumer unit. According to GN3 Table 1.1, which minimum overvoltage category should the test instrument, leads and probes be marked with?","o":["CAT IV","CAT II","CAT III","CAT I"],"a":0,"x":"GN3 Table 1.1: CAT IV covers equipment installed at or near the origin of the supply, between the building entrance and the primary distribution board, such as electricity meters and primary overcurrent devices. The whole test set-up is only rated as high as its lowest-rated part.","r":"GN3 1.1","n":"","k":468,"f":"Chapter 1, Section 1.1 Safety, Table 1.1 (installation overvoltage category markings). Index: overvoltage category, or GS38.","w":{"1":"CAT II is for equipment supplied from the building wiring, such as plug-in appliances, not the supply origin.","2":"CAT III covers distribution boards and socket-outlets; the origin, meters and main fuse need CAT IV.","3":"CAT I is not a category in GN3 Table 1.1 and gives the least protection; the origin needs CAT IV."}},{"id":"g1.n4.01","t":"4","c":0,"q":"You will measure a TT earth electrode with an EFLI tester (test method E3). What does GN3 say must happen before the earthing conductor is disconnected?","o":["The main protective bonding conductors must be disconnected as well","The RCD must be put in test mode so it cannot trip","The installation must be isolated from the supply","Fused test leads must be fitted, and then the supply can stay on"],"a":2,"x":"GN3 2.6.13, test method E3: for safety, the installation must be isolated from the supply before the earthing conductor is disconnected. The earthing conductor must be reconnected before the supply is energised or re-energised.","r":"GN3 2.6.13","n":"","k":3531,"f":"Section 2.6.13 Earth electrode resistance, 'Test method E3' (warning in capitals). Index: earth electrode, test method E3.","w":{"0":"GN3's safety warning for E3 is about isolating the installation, not removing the bonding.","1":"There is no such mode. Disconnecting the earth with the supply on leaves exposed metalwork unprotected.","3":"Fused leads do not make it safe to disconnect the only earth on a live installation."}},{"id":"g1.n4.02","t":"4","c":1,"q":"An older analogue continuity tester has a 0 to 2 Ω scale with a basic accuracy of 2 % of full-scale deflection. It reads 0.40 Ω. What range could the true value be in, from the basic accuracy alone?","o":["0.392 Ω to 0.408 Ω","0.36 Ω to 0.44 Ω","0.38 Ω to 0.42 Ω","0.28 Ω to 0.52 Ω"],"a":1,"x":"GN3 4.2: analogue basic accuracy is 2 % of full-scale deflection.<br>2 % × 2 Ω = ±0.04 Ω<br>0.40 − 0.04 = 0.36 Ω; 0.40 + 0.04 = 0.44 Ω<br>Because the error is a fixed amount, it is a bigger share of a small reading.","r":"GN3 4.2","n":"","k":6113,"f":"Chapter 4, Section 4.2 Instrument accuracy, second paragraph. Index: accuracy, analogue instruments.","w":{"0":"You took 2 % of the reading. Analogue accuracy is 2 % of full-scale deflection: 2 Ω × 0.02 = 0.04 Ω.","2":"You applied 5 % of the reading, the digital figure. Use 2 % of the 2 Ω full scale.","3":"That's the ±30 % BS EN 61557 operating error, not the 2 % FSD basic accuracy."}},{"id":"g1.n4.03","t":"4","c":1,"q":"Testing a main protective bonding conductor, you read 0.47 Ω. With the probes shorted together, the leads read 0.12 Ω, and the instrument has not been nulled. What is the bonding conductor's resistance?","o":["0.59 Ω","0.47 Ω","0.23 Ω","0.35 Ω"],"a":3,"x":"GN3 4.3: lead resistance can be removed by measuring it first and subtracting it, or by nulling.<br>0.47 − 0.12 = 0.35 Ω","r":"GN3 4.3","n":"","k":6184,"f":"Chapter 4, Section 4.3 Low-resistance ohmmeters, paragraph on lead resistance and nulling. Index: nulling, test leads.","w":{"0":"You added the lead resistance. It is already in the reading, so subtract it.","1":"That is the raw reading, including the 0.12 Ω of the leads. Subtract the leads.","2":"You subtracted 0.12 Ω twice. The 0.12 Ω shorted reading already covers both leads."}},{"id":"g1.n4.04","t":"4","c":1,"q":"In a farm building with livestock, the touch-voltage threshold is 25 V. A two-wire high-current loop test draws 10 A, and the circuit's cpc resistance R2 is 2.8 Ω. What voltage rise appears on the cpc, and what should the instrument do?","o":["28 V. It is below 50 V, so the test can run for the full 3 to 4 s","28 V. It exceeds 25 V, so the instrument must cut off the test current within the safe time, such as 40 ms","3.6 V. It is well below 25 V, so no cut-off is needed","280 V. The test must not be attempted"],"a":1,"x":"GN3 4.5 'Safety': if the protective conductor voltage rise exceeds the threshold (50 V, or 25 V where livestock are present), the instrument should cut off the test current after 40 ms or a time based on BS IEC 60479-1.<br>U = I × R2 = 10 × 2.8 = 28 V<br>28 V > 25 V, so the cut-off must operate.","r":"GN3 4.5","n":"","k":6263,"f":"Chapter 4, Section 4.5 EFLI testers, 'Safety' paragraph. Index: EFLI testers, touch voltage.","w":{"0":"With livestock present, the threshold may be 25 V, not 50 V, and 28 V exceeds it.","2":"You divided 10 by 2.8. Voltage rise is I × R: 10 × 2.8 = 28 V.","3":"You multiplied by 10 twice. 10 A × 2.8 Ω = 28 V."}},{"id":"g1.n4.05","t":"4","c":0,"q":"Why can a stakeless (clamp-type) earth electrode tester (test method E2) NOT measure a single, isolated earth electrode?","o":["Its test current is too high and would trip the RCD","It only works in TN-C-S systems, never TT","It must be used with the supply switched on","It needs at least one other earth electrode connected to complete the test loop"],"a":3,"x":"GN3 4.6: a stakeless tester cannot measure a single earth electrode unless at least one other electrode is connected. This may be formed by extraneous-conductive-parts or, in TN systems, the supply's means of earthing. Method E1 (fall of potential) is the most accurate.","r":"GN3 4.6","n":"","k":6344,"f":"Chapter 4, Section 4.6 Earth electrode resistance testers. Index: earth electrode, stakeless tester.","w":{"0":"The limitation is the need for a return path through another electrode, not RCD tripping.","1":"E2 can be used in TT. It needs another electrode connected, such as extraneous-conductive-parts.","2":"That's not the reason. A single electrode gives no return path for the clamp's test current."}},{"id":"g1.n4.06","t":"4","c":1,"q":"On a 50 Hz system, over what frequency range must a BS EN 61557-7 phase rotation instrument give an unambiguous indication?","o":["47.5 Hz to 52.5 Hz","42.5 Hz to 55 Hz","49.5 Hz to 50.5 Hz","45 Hz to 55 Hz"],"a":0,"x":"GN3 4.8(a): 95 % to 105 % of nominal frequency.<br>0.95 × 50 = 47.5 Hz<br>1.05 × 50 = 52.5 Hz","r":"GN3 4.8","n":"","k":6381,"f":"Chapter 4, Section 4.8 Phase rotation instruments, item (a). Index: phase rotation, BS EN 61557-7.","w":{"1":"You used the 85 % to 110 % voltage band. Frequency is 95 % to 105 %.","2":"You used ±1 %. GN3 gives 95 % to 105 % of nominal frequency.","3":"You used ±10 %. The band is ±5 %: 0.95 × 50 = 47.5 Hz."}},{"id":"g2.n4.07","t":"4","c":0,"q":"In which order does GN3 2.6.4 list these initial verification tests for a new domestic installation?","o":["Insulation resistance, continuity of protective conductors, ring final continuity, polarity, EFLI, RCD operation","Continuity of protective conductors, polarity, ring final continuity, EFLI, insulation resistance, RCD operation","Continuity of protective conductors, ring final continuity, insulation resistance, polarity, EFLI, RCD operation","EFLI, RCD operation, continuity of protective conductors, ring final continuity, insulation resistance, polarity"],"a":2,"x":"GN3 2.6.4 lists the tests in this order: (a) protective conductor continuity, (b) ring final continuity, (c) insulation resistance, (f) polarity, then the live tests, (i) EFLI and (k) RCD operation for additional protection.","r":"GN3 2.6.4","n":"","k":2299,"f":"Section 2.6.4 The sequence of tests, list (a) to (n), and Figure 2.12. Index: sequence of tests.","w":{"0":"Continuity of protective conductors comes first. An open cpc would make the insulation test to earth meaningless.","1":"Insulation resistance is a dead test and must come before polarity and any live test, such as EFLI.","3":"Live tests come last. You would be energising before proving the cpcs and insulation are sound."}},{"id":"g2.n4.08","t":"4","c":0,"q":"Before testing the operating times of the RCDs in a new installation, which test does GN3 say is essential, for safety, to have done and passed first?","o":["Phase sequence","Voltage drop","Earth fault loop impedance","Prospective fault current"],"a":2,"x":"GN3 2.6.18: before the RCD tests, it is essential for safety that the EFLI is tested to confirm it meets the requirements. A high Zs could put a dangerous voltage on exposed-conductive-parts while the test current flows.","r":"GN3 2.6.18","n":"","k":4060,"f":"Section 2.6.18 Operation and functional testing of RCDs, warning paragraph before 'Instrument: use an RCD tester'. Index: residual current devices, testing.","w":{"0":"Phase sequence does not affect the touch voltage during an RCD test. EFLI does.","1":"Voltage drop is the last check in the sequence and has no bearing on shock risk during an RCD test.","3":"PFC is about breaking capacity. The EFLI result shows whether the RCD test could raise a dangerous voltage on the cpc."}},{"id":"g2.n4.09","t":"4","c":0,"q":"Between formal calibrations, what does GN3 4.2 suggest for intermediate checks that an instrument has no major measurement errors?","o":["Compare readings with another instrument, or use a proprietary 'check box' with clearly defined characteristics","Short the leads together and confirm the display reads zero on every range","Send it to the manufacturer for a full calibration every month","Check that the battery indicator shows full charge"],"a":0,"x":"GN3 4.2(b): intermediate checks for major errors can be made by comparing readings with those from other instruments, or by using a proprietary 'check box' with clearly defined characteristics.","r":"GN3 4.2","n":"","k":6128,"f":"Chapter 4, Section 4.2(b) 'loss of calibration'. Index: calibration, check box.","w":{"1":"A lead null only checks lead resistance. GN3 suggests comparing instruments or using a check box.","2":"That is formal recalibration, not an intermediate check. The interval follows the manufacturer's advice.","3":"A good battery doesn't prove accuracy. GN3 suggests a comparison or a check box."}},{"id":"g2.n4.10","t":"4","c":0,"q":"GN3 4.3 lists field effects that cause errors in low-resistance readings. Which one does it say cannot be eliminated?","o":["Test lead resistance","Thermocouple effects in mixed-metal systems","Low battery voltage","Interference from an external AC source"],"a":3,"x":"GN3 4.3: interference from an external AC source cannot be eliminated. It may show as a vibrating analogue pointer or an unstable digital reading. Contact resistance also cannot be removed with two-terminal testers.","r":"GN3 4.3","n":"","k":6186,"f":"Chapter 4, Section 4.3 Low-resistance ohmmeters, paragraph on field effects. Index: continuity, interference.","w":{"0":"Lead resistance can be removed by subtracting it or by nulling the instrument.","1":"Thermocouple effects can be removed by reversing the probes and averaging.","2":"GN3 4.3 lists contact, lead, AC interference and thermocouple effects. A flat battery can be replaced."}},{"id":"g2.n4.11","t":"4","c":1,"q":"A three-wire non-trip loop test reads 0.86 Ω at the load terminals of an RCD and 0.36 Ω at its supply terminals. The same method gives 1.32 Ω at the far end of the circuit. You suspect RCD uplift. What is the corrected Zs?","o":["1.82 Ω","0.82 Ω","0.96 Ω","0.46 Ω"],"a":1,"x":"GN3 4.5 'RCD uplift': measuring on the supply and load sides of the RCD shows any extra impedance within it, which can then be deducted.<br>Uplift = 0.86 − 0.36 = 0.50 Ω<br>Zs = 1.32 − 0.50 = 0.82 Ω","r":"GN3 4.5","n":"","k":6288,"f":"Chapter 4, Section 4.5 EFLI testers, 'RCD uplift'. Index: RCD uplift.","w":{"0":"You added the uplift. The extra impedance measured in the RCD should be deducted.","2":"You subtracted the supply-side reading of 0.36 Ω instead of the uplift (0.86 − 0.36 = 0.50 Ω).","3":"You subtracted the whole 0.86 Ω load-side reading, which includes the supply impedance, not just the uplift."}},{"id":"g2.n4.12","t":"4","c":1,"q":"Using an RCD tester on a 100 mA RCD, what test current checks that the RCD does NOT trip, following GN3 4.7?","o":["100 mA","110 mA","500 mA","50 mA"],"a":3,"x":"GN3 4.7(a): RCDs are tested to make sure they do not trip at fault currents below 50 % of their rating.<br>50 % × 100 mA = 50 mA","r":"GN3 4.7","n":"","k":6368,"f":"Chapter 4, Section 4.7 RCD testers, list (a) to (c). Index: RCD testers.","w":{"0":"100 % of rating is the test that it DOES trip in the required time.","1":"110 % is the top of the ramp test, not the no-trip test.","2":"That's 5 × IΔn, a fast-trip test, not the 50 % no-trip check."}},{"id":"g2.n4.13","t":"4","c":0,"q":"A phase rotation indicator has one or two leads connected to earth and the rest on their line conductors. Under BS EN 61557-7, as summarised in GN3, what is the maximum total current to earth allowed?","o":["15 mA rms","3.5 mA rms","30 mA rms","200 mA rms"],"a":1,"x":"GN3 4.8(c): with one or two leads connected to earth and the rest on their line conductors, the total current to earth must not exceed 3.5 mA rms.","r":"GN3 4.8","n":"","k":6387,"f":"Chapter 4, Section 4.8 Phase rotation instruments, item (c). Index: phase rotation.","w":{"0":"About 15 mA is the non-trip loop test current, not the phase rotation limit.","2":"30 mA is a common RCD rating, not the BS EN 61557-7 earth-current limit.","3":"200 mA is the minimum short-circuit current for continuity testers."}},{"id":"g3.n4.14","t":"4","c":0,"q":"Figure 2.12 in GN3 groups the tests of Regulations 643.2 to 643.6 together. What does it say about when those tests must be done?","o":["In any order, as long as all are done before the certificate is issued","After energising, so that the RCDs can be proved first","In the order shown, before the installation is energised","Only on circuits with RCD protection"],"a":2,"x":"GN3 Figure 2.12, safety column: Regulation 643.1 requires the tests in Regulations 643.2 to 643.6 inclusive (continuity, insulation resistance, SELV/PELV/separation, floors and walls, polarity) to be done in the order shown, before the installation is energised.","r":"GN3 2.6.4","n":"","k":2337,"f":"Section 2.6.4, Figure 2.12 Sequence of tests for initial verification, 'Safety considerations' column. Index: sequence of tests.","w":{"0":"Regulation 643.1 requires them in the order shown, not in any order.","1":"These are dead tests. Energising before continuity and insulation are proved could be dangerous.","3":"The dead tests apply to every circuit, where relevant, whatever protection it has."}},{"id":"g3.n4.15","t":"4","c":0,"q":"Which standard does GN3 Chapter 4 name as the basic safety standard for electrical test instruments?","o":["BS EN 61010","BS EN 61557","BS EN 61008","BS 7430"],"a":0,"x":"GN3 4.1: BS EN 61010 (safety requirements for electrical equipment for measurement, control and laboratory use) is the basic safety standard for electrical test instruments. BS EN 61557 covers performance.","r":"GN3 4.1","n":"","k":6073,"f":"Chapter 4, Section 4.1 Instrument standard. Index: test instruments, BS EN 61010.","w":{"1":"BS EN 61557 sets performance requirements for protective-measure testers. It requires compliance with BS EN 61010.","2":"BS EN 61008 is the RCCB product standard, not a test-instrument safety standard.","3":"BS 7430 is the code of practice for earthing, not an instrument safety standard."}},{"id":"g3.n4.16","t":"4","c":0,"q":"Your tester lives in the back of your van all year and gets knocked about on site. According to GN3 4.2, how should this affect how often its accuracy is confirmed?","o":["More frequent confirmation of accuracy is appropriate","The calibration interval can be extended, because it is used every day","It makes no difference; follow a fixed 12-month interval whatever the use","Confirm accuracy only if the instrument displays an error message"],"a":0,"x":"GN3 4.2: rough handling, regular transport and storage in vehicles expose an instrument to changes in temperature and humidity, so more frequent confirmation of accuracy is appropriate. Dry storage at a steady temperature with little use may allow a longer interval.","r":"GN3 4.2","n":"","k":6136,"f":"Chapter 4, Section 4.2 Instrument accuracy, recalibration paragraph after (b). Index: calibration, recalibration interval.","w":{"1":"GN3 allows extending only for instruments stored dry at a steady temperature and used rarely.","2":"GN3 says users should take account of environment and use, not just a fixed interval.","3":"Damage or drift may give no error message. GN3 asks for more frequent checks under rough use."}},{"id":"g3.n4.17","t":"4","c":1,"q":"Testing a supplementary bond between a copper pipe and a steel radiator, you read 0.32 Ω, then 0.28 Ω with the probes reversed. Following GN3 4.3, which value should you take?","o":["0.32 Ω","0.28 Ω","0.60 Ω","0.30 Ω"],"a":3,"x":"GN3 4.3: thermocouple effects in mixed-metal systems can be removed by reversing the probes and averaging the readings.<br>(0.32 + 0.28) ÷ 2 = 0.60 ÷ 2 = 0.30 Ω","r":"GN3 4.3","n":"","k":6188,"f":"Chapter 4, Section 4.3 Low-resistance ohmmeters, last paragraph. Index: thermocouple effect.","w":{"0":"Taking the higher reading ignores the thermocouple effect. Average the two directions.","1":"Taking the lower reading is not the GN3 method. Average both directions.","2":"You added the readings but didn't divide by 2."}},{"id":"g3.n4.18","t":"4","c":1,"q":"A Zs test with 500 mA fused leads, not nulled, reads 2.95 Ω. GN3 says such fuses can add as much as 1.8 Ω to a lead pair. If the fuses add that full 1.8 Ω and the rest of the lead resistance is negligible, what is the true Zs?","o":["2.05 Ω","1.15 Ω","4.75 Ω","2.45 Ω"],"a":1,"x":"GN3 4.5 'Test lead errors': a 500 mA fuse can add as much as 1.8 Ω in a test lead pair, so loop testing needs higher-rated fuses (typically 7 A or 10 A). Lead resistance not nulled must be deducted.<br>2.95 − 1.8 = 1.15 Ω","r":"GN3 4.5","n":"","k":6307,"f":"Chapter 4, Section 4.5 EFLI testers, 'Test lead errors'. Index: fused test leads.","w":{"0":"You subtracted only half of 1.8 Ω. GN3's 1.8 Ω is for the lead pair, not one lead.","2":"You added the fuse resistance. It is already in the reading and must be subtracted.","3":"You subtracted 0.5 Ω, treating the 500 mA fuse rating as a resistance."}},{"id":"g3.n4.19","t":"4","c":1,"q":"You run a ramp test on a 30 mA RCD to check its tripping threshold. Following GN3 4.7, what current range does the ramp cover?","o":["From 15 mA up to exactly 30 mA","From 30 mA up to 150 mA","From below 15 mA up to 33 mA","From below 15 mA up to 45 mA"],"a":2,"x":"GN3 4.7(c): the ramp test applies current from below 50 % up to 110 % of the RCD rating, and displays the current at which it trips.<br>50 % × 30 = 15 mA<br>110 % × 30 = 33 mA","r":"GN3 4.7","n":"","k":6372,"f":"Chapter 4, Section 4.7 RCD testers, item (c). Index: RCD testers, ramp test.","w":{"0":"The ramp goes up to 110 % of rating, which is 33 mA, not 100 %.","1":"That's 1 × to 5 × IΔn, a trip-time range. The ramp starts below 50 %.","3":"You used 150 %. GN3 says the ramp goes to 110 %: 1.1 × 30 = 33 mA."}},{"id":"g3.n4.20","t":"4","c":1,"q":"A phase rotation instrument is rated for a 400 V system. Under BS EN 61557-7, up to what voltage must it be able to be connected without damage to it or danger to the user?","o":["440 V","460 V","480 V","500 V"],"a":2,"x":"GN3 4.8(d): the instrument must not be damaged, nor the user put in danger, when connected to 120 % of the rated system voltage.<br>1.20 × 400 = 480 V","r":"GN3 4.8","n":"","k":6390,"f":"Chapter 4, Section 4.8 Phase rotation instruments, item (d). Index: phase rotation.","w":{"0":"That's 110 %, the top of the indication range. The no-damage requirement is 120 %.","1":"That's 115 %. GN3 gives 120 % of rated system voltage: 1.2 × 400 = 480 V.","3":"That's 125 %. The figure is 120 %: 1.2 × 400 = 480 V."}},{"id":"g4.n4.21","t":"4","c":0,"q":"During the dead tests, one circuit gives an unsatisfactory insulation resistance result. What does GN3 Figure 2.12 strongly recommend?","o":["Carry on with all the remaining tests and list the fault on the schedule at the end","Put right the unsatisfactory condition before going on to any later test","Energise that circuit and use the RCD test to confirm it is safe","Repeat the test at 250 V and record the higher value"],"a":1,"x":"GN3 Figure 2.12, safety column: it is strongly recommended that any unsatisfactory condition found during a test is put right before going on to any later test.","r":"GN3 2.6.4","n":"","k":2340,"f":"Section 2.6.4, Figure 2.12, 'Safety considerations' column. Index: sequence of tests.","w":{"0":"GN3 strongly recommends fixing faults before the next test. Later results may be invalid or unsafe.","2":"Energising a circuit with an insulation fault is dangerous. An RCD test does not prove the insulation.","3":"Dropping the test voltage to get a pass hides the fault. Table 64 sets the test voltage."}},{"id":"g4.n4.22","t":"4","c":0,"q":"Appendix 14 of BS 7671, quoted in GN3 4.1, sets a safety requirement for measuring prospective fault current. Which statement agrees with it?","o":["Fused test leads give enough protection on their own, even at the meter tails","Measure directly on the supply side of the cut-out so the reading includes all the impedance","Non-fused leads must never be used for any test","Measure on the output terminals of a suitably rated protective device; fused leads alone do not meet it"],"a":3,"x":"GN3 4.1, quoting BS 7671 Appendix 14: measure on the output terminals of a suitably rated protective device, fitting a temporary one if none is present. Never measure where there is no overcurrent protection back to the supply transformer. Fused test leads alone do not meet this requirement.","r":"GN3 4.1","n":"","k":6093,"f":"Chapter 4, Section 4.1 Instrument standard, the quotation from Appendix 14. Index: fused test leads, test instruments.","w":{"0":"The quote states that fused test leads alone do not meet this requirement.","1":"Never measure where there is no overcurrent protection between the test point and the transformer.","2":"GN3 accepts non-fused leads where the instrument has built-in protection. The point is the upstream protective device."}},{"id":"g4.n4.23","t":"4","c":1,"q":"BS EN 61557 allows a maximum operating error of ±30 % of reading under worst-case conditions. A compliant tester reads 0.80 Ω. What range could the true value be in?","o":["0.56 Ω to 1.04 Ω","0.76 Ω to 0.84 Ω","0.50 Ω to 1.10 Ω","0.72 Ω to 0.88 Ω"],"a":0,"x":"GN3 4.2(c): BS EN 61557 allows a maximum operating error of ±30 % of reading.<br>0.30 × 0.80 = 0.24 Ω<br>0.80 − 0.24 = 0.56 Ω<br>0.80 + 0.24 = 1.04 Ω","r":"GN3 4.2","n":"","k":6157,"f":"Chapter 4, Section 4.2(c) 'field errors', paragraph on BS EN 61557 operating error. Index: accuracy, operating error.","w":{"1":"That's ±5 %, the basic accuracy. The operating error allowed by BS EN 61557 is ±30 %.","2":"You applied ±0.30 Ω as a fixed amount. It is 30 % of the reading: 0.30 × 0.80 = 0.24 Ω.","3":"That's ±10 %. BS EN 61557 allows up to ±30 % of the reading."}},{"id":"g4.n4.24","t":"4","c":0,"q":"You have just finished a 500 V insulation resistance test on a long SWA run. What does GN3 4.4 say to do before disconnecting the instrument?","o":["Disconnect straight away, so the test voltage is not left on the cable","Leave it connected until the capacitance in the installation has fully discharged","Short the cores to earth with a screwdriver to discharge them","Repeat the test at 1000 V to clear any charge"],"a":1,"x":"GN3 4.4: the instrument should have an automatic discharge facility, and after an insulation resistance test it should be left connected until the capacitance in the installation has fully discharged. Section 1.1 warns that cables charged during an insulation test can give a shock.","r":"GN3 4.4","n":"","k":6215,"f":"Chapter 4, Section 4.4 Insulation resistance testers, last paragraph. Index: insulation resistance, capacitance.","w":{"0":"The cable stays charged after the test. Removing the leads early can leave you exposed to a shock.","2":"GN3 relies on the instrument's automatic discharge, with the leads left connected, not a screwdriver short.","3":"A higher voltage puts more charge on the cable. It does not discharge it."}},{"id":"g4.n4.25","t":"4","c":1,"q":"A loop tester declares an accuracy of ±5 % ±3 digits, with a resolution of 0.01 Ω. It reads 0.50 Ω. What range could the true value be in and still be within the declared accuracy?","o":["0.445 Ω to 0.555 Ω","0.475 Ω to 0.525 Ω","0.47 Ω to 0.53 Ω","0.35 Ω to 0.65 Ω"],"a":0,"x":"GN3 4.5 'Instrument accuracy and resolution' gives the example: ±5 % ±3 digits on 0.03 Ω gives zero to 0.06 Ω.<br>5 % × 0.50 = 0.025 Ω<br>3 digits × 0.01 = 0.03 Ω<br>Total = ±0.055 Ω, so 0.445 Ω to 0.555 Ω","r":"GN3 4.5","n":"","k":6323,"f":"Chapter 4, Section 4.5 EFLI testers, 'Instrument accuracy and resolution'. Index: resolution, accuracy.","w":{"1":"You applied only the ±5 % and left out the ±3 digits (3 × 0.01 = 0.03 Ω).","2":"You applied only the ±3 digits and left out ±5 % of the reading.","3":"That's the ±30 % BS EN 61557 operating limit, not this instrument's declared accuracy."}},{"id":"g4.n4.26","t":"4","c":0,"q":"A customer complains that an RCD keeps tripping for no obvious reason. According to GN3 4.7, which RCD tester function would show whether the RCD is overly sensitive?","o":["The 100 % trip-time test","A three-wire non-trip loop test","The ramp test, which displays the current at which the RCD trips","An insulation resistance test across the RCD at 500 V"],"a":2,"x":"GN3 4.7(c): the ramp test displays the current at which the RCD trips. This shows whether the RCD is overly sensitive and may cause nuisance tripping.","r":"GN3 4.7","n":"","k":6373,"f":"Chapter 4, Section 4.7 RCD testers, item (c). Index: RCD testers, nuisance tripping.","w":{"0":"That proves the RCD trips fast enough, not the current at which it starts to trip.","1":"That measures Zs without tripping the RCD. It does not show the RCD's sensitivity.","3":"Electronic RCDs must be disconnected for IR tests, and this does not measure the tripping current."}},{"id":"g4.n4.27","t":"4","c":0,"q":"Which statement about thermographic (thermal imaging) equipment is correct, according to GN3 4.9?","o":["It is a BS 7671 test instrument and can replace the continuity test of connections","Surveys must be done with the installation isolated to avoid live working","It can see hot spots through any enclosure, so covers never need removing","BS 7671 does not recognise it as a test instrument, and the equipment must be operating for a survey to show temperature changes"],"a":3,"x":"GN3 4.9: BS 7671 does not recognise thermographic equipment as a test instrument, but it is invaluable for finding possible overheating. The equipment must be operating and 'thermally transparent' for a survey to see temperature changes.","r":"GN3 4.9","n":"","k":6396,"f":"Chapter 4, Section 4.9 Thermographic equipment, first paragraph. Index: thermography.","w":{"0":"GN3 says BS 7671 does not recognise it as a test instrument. It helps, but replaces no test.","1":"A survey only shows heating when the equipment is operating and carrying load.","2":"The target must be 'thermally transparent'. Covers often have to come off, which brings in EAWR Regulation 14."}},{"id":"g5.n4.28","t":"4","c":0,"q":"A TT installation has its own earth electrode. Where does GN3 Figure 2.12 place the earth electrode resistance measurement for initial verification?","o":["After the RCD tests, using the RCD trip time to confirm it","Only at the first periodic inspection, once the ground has settled","Last of all, after functional testing and voltage drop","Regulation 643.1 requires it to be measured before the installation is energised"],"a":3,"x":"GN3 Figure 2.12, footnote: where an earth electrode is present, Regulation 643.1 requires its resistance to
